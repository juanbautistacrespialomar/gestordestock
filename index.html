<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b2430">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestor">
<title>Gestor de Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var _t=localStorage.getItem("gstock_theme");if(_t==="dark"||(!_t&&window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)){document.documentElement.setAttribute("data-theme","dark");}else if(_t==="light"){document.documentElement.setAttribute("data-theme","light");}}catch(e){}</script>
<style>
  :root{
    --ink:#111317;
    --ink-soft:#2b2f36;
    --paper:#ffffff;
    --surface:#ffffff;
    --surface-2:#fafbfc;
    --line:#eaecef;
    --line-strong:#dde0e5;
    --accent:#1d4ed8;
    --accent-ink:#1d4ed8;
    --up:#1d4ed8;
    --up-bg:#eef2fb;
    --down:#dc2626;
    --down-bg:#fbeaea;
    --alert:#dc2626;
    --alert-bg:#fbeaea;
    --muted:#8a909b;
    --text:#111317;
    --radius:4px;
    --mono:"Spline Sans Mono",ui-monospace,"SF Mono","Menlo","Consolas",monospace;
    --sans:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --shadow:0 1px 2px rgba(17,19,23,.04);
    --side-bg:#f6f7f9;
    --side-hover:#eceef2;
    --nav-ink:#4b5563;
    --topbar-bg:#ffffff;
    --login-bg:#f4f5f7;
  }
  :root[data-theme="dark"]{
    --ink:#0b0e13;
    --paper:#0f141b;
    --surface:#161c25;
    --surface-2:#1d2530;
    --line:#28303c;
    --line-strong:#38424f;
    --accent:#4d82e8;
    --accent-ink:#7aa5f0;
    --up:#4d82e8;
    --up-bg:#17243b;
    --down:#f16a68;
    --down-bg:#3a1e1e;
    --alert:#f16a68;
    --alert-bg:#3a1e1e;
    --muted:#8b93a1;
    --text:#e6e9ee;
    --shadow:0 1px 2px rgba(0,0,0,.45);
    --side-bg:#12171f;
    --side-hover:#1d2530;
    --nav-ink:#c2c9d4;
    --topbar-bg:#12171f;
    --login-bg:#0b0f15;
  }
  :root[data-theme="dark"] .banner.warn{color:#f3b3b3;border-color:#5a2b2b}
  :root[data-theme="dark"] .banner.ok{color:var(--accent-ink);border-color:#264a6e}
  :root[data-theme="dark"] .login-card .inp{background:var(--surface-2)}
  :root[data-theme="dark"] .login-build{color:#5b6472}
  :root[data-theme="dark"] .modal{box-shadow:0 20px 60px rgba(0,0,0,.6)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--text);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
  :root[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.7)}
  input:focus-visible,select:focus-visible,button:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  /* ---------- Layout ---------- */
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  .side{
    background:var(--side-bg);color:var(--muted);padding:22px 16px;
    display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line-strong);
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .brand-logo{border-radius:7px;flex-shrink:0;box-shadow:0 2px 8px rgba(17,19,23,.14)}
  .brand h1{font-size:15px;font-weight:800;color:var(--text);margin:0;letter-spacing:-.4px}
  .side-actions{display:flex;flex-direction:column;gap:6px;margin-top:14px;align-items:flex-start}
  .side-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;padding:0;border-radius:8px;
    background:none;border:1px solid transparent;color:var(--muted);
    transition:color .12s,background .12s,border-color .12s;
  }
  .side-btn:hover{color:var(--text);background:var(--side-hover);border-color:var(--line)}
  .side-btn.is-logout:hover{color:var(--down);border-color:var(--line-strong)}
  .side-btn svg{width:17px;height:17px;display:block}
  @keyframes side-spin{to{transform:rotate(360deg)}}
  .side-btn.spin svg{animation:side-spin .8s linear infinite;transform-origin:center}

  /* ---------- Switch de tema (deslizable, arriba a la derecha) ---------- */
  .theme-switch{position:fixed;top:14px;right:20px;z-index:45;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .theme-switch .ts-track{position:relative;display:block;width:60px;height:28px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line-strong);box-shadow:var(--shadow);transition:background .2s,border-color .2s}
  .theme-switch .ts-hint{position:absolute;top:0;height:100%;width:28px;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.5}
  .theme-switch .ts-hint svg{width:13px;height:13px}
  .theme-switch .ts-hint-sun{left:2px}
  .theme-switch .ts-hint-moon{right:2px}
  .theme-switch .ts-thumb{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:#e0a11a;transition:transform .22s ease,background .2s,color .2s}
  .theme-switch .ts-thumb svg{width:13px;height:13px}
  :root[data-theme="dark"] .theme-switch .ts-thumb{transform:translateX(32px);background:#e6e9ee;color:#3b4b66}
  @media (max-width:860px){.theme-switch{top:auto;bottom:18px;right:16px}}
  .brand-m-logo{border-radius:6px;align-self:center;margin-right:6px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:none;border:0;color:var(--nav-ink);padding:10px 12px;border-radius:6px;
    font-size:14px;font-weight:500;transition:background .12s,color .12s;
  }
  .nav button .ico{width:18px;text-align:center;font-family:var(--mono);font-size:14px;opacity:.7}
  .nav button:hover{background:var(--side-hover);color:var(--text)}
  .nav button.on{background:var(--accent);color:#fff}
  .nav button.on .ico{opacity:1}
  .side .foot{margin-top:auto;padding:0 8px;font-size:11.5px;color:var(--muted);line-height:1.6}

  .main{padding:32px 44px 80px;max-width:1560px;width:100%}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
  .head .title h2{font-size:26px;margin:0 0 3px;letter-spacing:-.4px;font-weight:650}
  .head .title p{margin:0;color:var(--muted);font-size:14px}
  .head .actions{display:flex;gap:9px;flex-wrap:wrap}

  /* ---------- Buttons ---------- */
  .btn{
    border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
    padding:9px 15px;border-radius:8px;font-size:14px;font-weight:550;
    display:inline-flex;align-items:center;gap:7px;transition:border-color .12s,background .12s;
  }
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
  .btn.up{background:var(--up);border-color:var(--up);color:#fff}
  .btn.up:hover{filter:brightness(.94)}
  .btn.down{background:var(--down);border-color:var(--down);color:#fff}
  .btn.down:hover{filter:brightness(.94)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:8px 10px}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.danger{color:var(--alert);border-color:var(--line-strong)}
  .btn.danger:hover{border-color:var(--alert);background:var(--alert-bg)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* ---------- Cards / KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:8px}
  .kpi .val{font-family:var(--sans);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.1}
  .kpi .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
  .kpi.warn .val{color:var(--alert)}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel + .panel{margin-top:20px}
  .panel .phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .panel .phead h3{margin:0;font-size:15px;font-weight:620}
  .panel .phead .hint{font-size:12.5px;color:var(--muted)}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);
    position:sticky;top:0;
  }
  td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  td.r,th.r{text-align:right}
  td.c,th.c{text-align:center}
  .sku{font-family:var(--mono);font-size:13px;color:var(--accent-ink);background:var(--surface-2);padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
  .pill.in{background:var(--up-bg);color:var(--up)}
  .pill.out{background:var(--down-bg);color:var(--down)}
  .pill.low{background:var(--alert-bg);color:var(--alert)}
  .pill.adj{background:rgba(186,117,23,.14);color:#b26b0f}
  :root[data-theme="dark"] .pill.adj{background:rgba(239,159,39,.16);color:#efb35a}
  .delta.flat{color:var(--muted)}
  .delta{font-family:var(--mono);font-weight:600}
  .delta.up{color:var(--up)}
  .delta.down{color:var(--down)}
  .stock-cell{font-family:var(--mono);font-weight:600}
  .stock-cell.low{color:var(--alert)}
  .stock-cell.neg{color:var(--alert)}

  .empty{padding:48px 24px;text-align:center;color:var(--muted)}
  .empty .big{font-family:var(--mono);font-size:34px;color:var(--line-strong);margin-bottom:10px}
  .empty p{margin:4px 0}
  .empty .hint{font-size:13px;max-width:440px;margin:10px auto 0}

  /* ---------- Forms / rows ---------- */
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .inp{border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;background:var(--surface);color:var(--text);width:100%}
  .inp:focus{border-color:var(--accent)}
  .inp.num{text-align:right}
  .grid-form{display:grid;gap:14px;padding:18px}

  /* line editor table inputs */
  table .inp{padding:6px 8px;font-size:13.5px;border-radius:6px}
  .line-tbl td{padding:7px 10px}
  .line-tbl select.inp{min-width:150px}

  /* ---------- Modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,26,34,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.28);width:100%;max-width:760px;overflow:hidden}
  .modal.wide{max-width:940px}
  .modal .mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal .mhead h3{margin:0;font-size:18px;font-weight:640}
  .modal .mbody{padding:20px 22px;max-height:66vh;overflow:auto}
  .modal .mfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-top:1px solid var(--line);background:var(--surface-2)}
  .x{background:none;border:0;font-size:22px;color:var(--muted);line-height:1;padding:4px 8px;border-radius:6px}
  .x:hover{background:var(--surface-2);color:var(--text)}

  .drop{
    border:2px dashed var(--line-strong);border-radius:12px;padding:30px 20px;text-align:center;
    background:var(--surface-2);transition:border-color .15s,background .15s;cursor:pointer;
  }
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--up-bg)}
  .drop .di{font-family:var(--mono);font-size:30px;color:var(--accent);margin-bottom:8px}
  .drop p{margin:4px 0;color:var(--muted);font-size:13.5px}
  .drop .fn{color:var(--accent-ink);font-weight:600}

  .rawbox{font-family:var(--mono);font-size:11.5px;line-height:1.55;background:var(--ink);color:#cbd5e1;border-radius:8px;padding:12px;max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  details{margin-top:14px}
  summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}

  .totrow{display:flex;justify-content:flex-end;gap:26px;padding:12px 4px;font-size:15px}
  .totrow .num{font-weight:650;font-size:17px}

  .banner{padding:11px 14px;border-radius:8px;font-size:13.5px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
  .banner.warn{background:var(--alert-bg);color:#8a2b2b;border:1px solid #e6c4c4}
  .banner.ok{background:var(--up-bg);color:var(--accent-ink);border:1px solid #bcd8ca}

  /* ---------- Toast ---------- */
  #toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:9px;z-index:80}
  .toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:9px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:9px;align-items:center;animation:slide .25s ease}
  .toast .b{width:3px;height:100%;border-radius:2px;align-self:stretch}
  .toast.up{border-left:3px solid var(--up)}
  .toast.down{border-left:3px solid var(--down)}
  .toast.warn{border-left:3px solid var(--alert)}
  @keyframes slide{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

  /* importes y fechas en una sola línea */
  td.num,th.num{white-space:nowrap}
  .pill{white-space:nowrap}
  .filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .filtros .inp{padding:7px 9px;font-size:13px}
  .selbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600}

  /* ---------- Análisis / gráficos ---------- */
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:860px){.chart-grid{grid-template-columns:1fr}}
  .chart{padding:16px 18px}
  .chart .ctitle{font-size:13px;font-weight:650;margin:0 0 3px}
  .chart .csub{font-size:12px;color:var(--muted);margin:0 0 14px}
  .crow{display:flex;align-items:center;gap:10px;padding:5px 0}
  .crow .cl{width:44%;font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow .cl .sku{font-size:11px;padding:1px 5px}
  .crow .ct{flex:1;background:var(--surface-2);border-radius:5px;height:18px;overflow:hidden;border:1px solid var(--line)}
  .crow .cf{height:100%;border-radius:5px 0 0 5px;min-width:2px;transition:width .4s ease}
  .crow .cv{width:104px;text-align:right;font-family:var(--mono);font-size:12.5px;font-weight:600;white-space:nowrap}
  .cempty{padding:26px 8px;text-align:center;color:var(--muted);font-size:13px}
  .clegend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:4px}
  .clegend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

  .mobtop{display:none}

  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .side{display:none}
    .mobtop{display:flex;position:sticky;top:0;z-index:40;background:var(--topbar-bg);color:var(--text);padding:10px 14px;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
    .mobtop .brand-m{font-family:var(--mono);font-weight:700;margin-right:8px;white-space:nowrap;align-self:center}
    .mobtop button{background:none;border:0;color:var(--nav-ink);padding:8px 12px;border-radius:6px;font-size:13.5px;font-weight:600;white-space:nowrap}
    .mobtop button.on{background:var(--accent);color:#fff}
    .main{padding:20px 16px 90px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .head{flex-direction:column;align-items:flex-start}
    .table-scroll{overflow-x:auto}
    table{min-width:560px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- Login ---------- */
  #login[hidden]{display:none}
  .login-scrim{
    position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
    background:var(--login-bg);
  }
  .login-card{
    width:100%;max-width:360px;background:var(--surface);
    border:1px solid var(--line);border-radius:6px;padding:38px 30px 30px;text-align:center;
    box-shadow:0 1px 2px rgba(17,19,23,.04),0 20px 50px rgba(17,19,23,.08);
  }
  .login-logo{border-radius:16px;box-shadow:0 8px 24px rgba(17,19,23,.18);margin-bottom:18px}
  .login-card h1{color:var(--text);font-size:24px;margin:0 0 6px;letter-spacing:-.6px;font-weight:900}
  .login-sub{color:var(--muted);font-size:13.5px;margin:0 0 24px;line-height:1.5}
  .login-card .field{text-align:left;margin-bottom:14px}
  .login-card .field label{color:var(--muted)}
  .login-card .inp{background:var(--surface);border-color:var(--line-strong);color:var(--text)}
  .login-card .inp:focus{border-color:var(--accent)}
  .login-btn{width:100%;justify-content:center;padding:11px;font-size:15px;margin-top:6px}
  .login-err{color:var(--down);font-size:13px;min-height:18px;margin:2px 0 6px;text-align:left}
  .login-build{color:#b3b8c2;font-size:11px;margin:16px 0 0;letter-spacing:.4px}
</style>
</head>
</head>
<body>
<div id="login" class="login-scrim" hidden>
  <div class="login-card">
    <img src="icon-512.png" alt="" class="login-logo" width="88" height="88">
    <h1>Gestor de Stock</h1>
    <p class="login-sub">Entrá con tu usuario y vas a ver tu inventario desde cualquier dispositivo.</p>
    <div class="field"><label>Usuario</label>
      <input class="inp" id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label>Contraseña</label>
      <input class="inp" id="loginPass" type="password" autocomplete="current-password"></div>
    <div id="loginErr" class="login-err"></div>
    <button class="btn primary login-btn" id="loginBtn">Entrar</button>
    <p class="login-build">build v9</p>
  </div>
</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="icon-192.png" alt="" class="brand-logo" width="34" height="34">
      <h1>Gestor de Stock</h1>
    </div>
    <nav class="nav" id="nav">
      <button data-view="dash" class="on"><span class="ico">▤</span>Panel</button>
      <button data-view="analisis"><span class="ico">◔</span>Análisis</button>
      <button data-view="prod"><span class="ico">▦</span>Productos</button>
      <button data-view="compras"><span class="ico">+</span>Compras</button>
      <button data-view="ventas"><span class="ico">−</span>Ventas</button>

<script>
/* ============================================================
   Gestor de Stock — vanilla, último costo, sincronizado
   ============================================================ */
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const KEY = "gstock_v1";
const SKEY = "gstock_sync";       // { syncedRev, dirty }
const SESKEY = "gstock_session";  // { user, token, space }

/* URL del servidor (Cloudflare Worker). Si algún día lo redeploya en otra
   cuenta/nombre, cambiar solo esta línea. */
const API_URL = "https://mayor-stock-api.juanbautistacrespialomar.workers.dev";

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- Estado local ---------- */
let db = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn("load fail", e); }
  return { config:{ moneda:"$" }, productos:[], compras:[], ventas:[], movimientos:[] };
}
function persistLocal(){ localStorage.setItem(KEY, JSON.stringify(db)); }

/* ---------- Sesión ---------- */
let session = loadSession();
function loadSession(){ try{ const r=localStorage.getItem(SESKEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function saveSession(){ if(session) localStorage.setItem(SESKEY, JSON.stringify(session)); else localStorage.removeItem(SESKEY); }

/* ---------- Sincronización con el servidor ---------- */
let syncMeta = loadSyncMeta();       // { syncedRev, dirty }
let syncState = session ? "idle" : "off";
let pushTimer = null;
let conflictPayload = null;

function loadSyncMeta(){ try{ const r=localStorage.getItem(SKEY); if(r) return JSON.parse(r); }catch(e){} return { syncedRev:0, dirty:false }; }
function saveSyncMeta(){ localStorage.setItem(SKEY, JSON.stringify(syncMeta)); }

function save(){
  persistLocal();
  if(session){ syncMeta.dirty=true; saveSyncMeta(); schedulePush(); }
}

function setSyncState(s){ syncState=s; paintSync(); }
function apiBase(){ return API_URL.replace(/\/+$/,""); }
function authHeaders(){ return { "Authorization":"Bearer "+(session?session.token:""), "Content-Type":"application/json" }; }
function stateUrl(){ return apiBase()+"/state?space="+encodeURIComponent(session?session.space:"main"); }

function schedulePush(){ if(!session) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>pushNow(), 800); }

async function pushNow(force=false){
  if(!session) return;
  setSyncState("saving");
  try{
    const res=await fetch(stateUrl(),{ method:"PUT", headers:authHeaders(), body:JSON.stringify({ data:db, baseRev:syncMeta.syncedRev, force }) });
    if(res.status===401){ setSyncState("offline"); toast("Sesión vencida, volvé a entrar","warn"); logout(); return; }
    if(res.status===409){ conflictPayload=await res.json(); setSyncState("conflict"); toast("Hay una versión más nueva en el servidor","warn"); if(view==="datos") render(); return; }
    if(!res.ok) throw new Error("HTTP "+res.status);
    const j=await res.json();
    syncMeta.syncedRev=j.rev; syncMeta.dirty=false; saveSyncMeta();
    setSyncState("idle");
  }catch(e){ console.warn("push fail", e); setSyncState("offline"); }
}

async function pullNow(){
  if(!session) return;
  setSyncState("saving");
  try{
    const res=await fetch(stateUrl(),{ method:"GET", headers:authHeaders() });
    if(res.status===401){ setSyncState("offline"); toast("Sesión vencida, volvé a entrar","warn"); logout(); return; }
    if(!res.ok) throw new Error("HTTP "+res.status);
    const j=await res.json();
    const serverRev=j.rev||0;
    if(!j.data){ if(hasData(db)) await pushNow(true); else { syncMeta.syncedRev=0; saveSyncMeta(); setSyncState("idle"); } return; }
    if(serverRev===syncMeta.syncedRev && !syncMeta.dirty){ setSyncState("idle"); return; }
    if(serverRev>syncMeta.syncedRev && !syncMeta.dirty){
      db=j.data; syncMeta.syncedRev=serverRev; syncMeta.dirty=false; saveSyncMeta(); persistLocal();
      setSyncState("idle"); render(); toast("Datos actualizados desde el servidor"); return;
    }
    if(syncMeta.dirty && serverRev!==syncMeta.syncedRev){ conflictPayload=j; setSyncState("conflict"); if(view==="datos") render(); return; }
    if(syncMeta.dirty){ await pushNow(); return; }
    setSyncState("idle");
  }catch(e){ console.warn("pull fail", e); setSyncState("offline"); }
}

function hasData(d){ return (d.productos&&d.productos.length)||(d.compras&&d.compras.length)||(d.ventas&&d.ventas.length); }

function resolveConflict(keepLocal){
  if(!conflictPayload) return;
  if(keepLocal){ syncMeta.syncedRev=conflictPayload.rev; saveSyncMeta(); pushNow(true); }
  else{
    db=conflictPayload.data; syncMeta.syncedRev=conflictPayload.rev; syncMeta.dirty=false; saveSyncMeta(); persistLocal();
    render(); toast("Se tomó la versión del servidor");
  }
  conflictPayload=null; setSyncState("idle");
}

function paintSync(){
  const map={
    off:["●","Desconectado","var(--muted)"],
    idle:["●","Sincronizado","var(--up)"],
    saving:["◐","Guardando…","var(--accent)"],
    offline:["●","Sin conexión","var(--down)"],
    conflict:["▲","Conflicto","var(--alert)"]
  };
  const [dot,txt,col]=map[syncState]||map.off;
  document.querySelectorAll("[data-syncchip]").forEach(el=>{ el.style.color=col; el.textContent=dot+" "+txt; });
  document.querySelectorAll("[data-syncicon]").forEach(el=>{
    el.style.color = (syncState==="idle"||syncState==="off") ? "" : col;
    el.classList.toggle("spin", syncState==="saving");
    el.title = "Sincronizar · "+txt.toLowerCase();
  });
}

/* ---------- Login / Logout ---------- */
async function doLogin(){
  const user=(document.getElementById("loginUser").value||"").trim();
  const pass=document.getElementById("loginPass").value||"";
  const errEl=document.getElementById("loginErr");
  const btn=document.getElementById("loginBtn");
  errEl.textContent="";
  if(!user||!pass){ errEl.textContent="Completá usuario y contraseña"; return; }
  btn.disabled=true; btn.textContent="Entrando…";
  try{
    console.log("[login] POST", apiBase()+"/login", "user:", user);
    const res=await fetch(apiBase()+"/login",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({user,pass}) });
    console.log("[login] status", res.status);
    if(res.status===401){ errEl.textContent="Usuario o contraseña incorrectos"; return; }
    if(!res.ok){
      let msg="Error "+res.status;
      try{ const ej=await res.json(); if(ej.error) msg=ej.error; if(ej.detalle) msg+=" — "+ej.detalle; }catch(_){}
      errEl.textContent=msg;
      return;
    }
    const j=await res.json();
    console.log("[login] ok, entrando como", j.user);
    const switching = !session || session.user!==j.user;
    session={ user:j.user, token:j.token, space:j.space||"main" }; saveSession();
    if(switching){
      db={ config:{ moneda:(db.config&&db.config.moneda)||"$" }, productos:[], compras:[], ventas:[], movimientos:[] };
      persistLocal(); syncMeta={ syncedRev:0, dirty:false }; saveSyncMeta();
    }
    setSyncState("idle");
    hideLogin(); render(); paintSync();
    await pullNow();
  }catch(e){ console.error("[login] fallo:", e); errEl.textContent="No se pudo conectar con el servidor ("+(e&&e.message||e)+")"; }
  finally{ btn.disabled=false; btn.textContent="Entrar"; }
}
function logout(){
  if(!confirm("Cerrar sesión en este dispositivo. Tus datos siguen en el servidor. ¿Seguir?")) return;
  session=null; saveSession(); setSyncState("off");
  showLogin();
}
function showLogin(){
  const l=document.getElementById("login"); if(l) l.hidden=false;
  const a=document.querySelector(".app"); if(a) a.style.display="none";
  const u=document.getElementById("loginUser"); if(u){ u.value=""; setTimeout(()=>u.focus(),50); }
  const p=document.getElementById("loginPass"); if(p) p.value="";
}
function hideLogin(){
  const l=document.getElementById("login"); if(l) l.hidden=true;
  const a=document.querySelector(".app"); if(a) a.style.display="";
}

/* ---------- Formato ---------- */
const nf0 = new Intl.NumberFormat("es-AR",{maximumFractionDigits:2});
const nf2 = new Intl.NumberFormat("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const money = n => db.config.moneda + "\u00A0" + nf2.format(n||0);
const qty = n => nf0.format(n||0);

/* Parseo tolerante de números en formato AR (1.234,56) o US (1,234.56) */
function parseNum(s){
  if(typeof s === "number") return s;
  if(!s) return 0;
  let t = String(s).trim().replace(/[^\d.,\-]/g,"");
  if(t==="") return 0;
  const lastComma = t.lastIndexOf(","), lastDot = t.lastIndexOf(".");
  if(lastComma > lastDot){            // coma decimal (AR)
    t = t.replace(/\./g,"").replace(",",".");
  } else {                            // punto decimal (US)
    t = t.replace(/,/g,"");
  }
  const v = parseFloat(t);
  return isNaN(v) ? 0 : v;
}

/* ---------- Toast ---------- */
function toast(msg, kind="up"){
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateY(8px)"; }, 2600);
  setTimeout(()=> el.remove(), 3000);
}

/* ---------- Helpers de stock ---------- */
function prodById(id){ return db.productos.find(p=>p.id===id); }
function findProdBySku(sku){
  if(!sku) return null;
  const s = sku.trim().toLowerCase();
  return db.productos.find(p => (p.sku||"").trim().toLowerCase() === s) || null;
}
function valorizacion(){
  return db.productos.reduce((a,p)=> a + (p.stock||0)*(p.ultimoCosto||0), 0);
}
function unidadesTotales(){ return db.productos.reduce((a,p)=> a + (p.stock||0), 0); }
function bajoStock(p){ return p.puntoRepedido>0 && p.stock <= p.puntoRepedido; }

/* Registrar movimiento. opts (opcional): { tipo, obs, fecha } */
function moverStock(prod, delta, valorUnit, refTipo, refId, ref, opts){
  opts = opts || {};
  prod.stock = +( (prod.stock||0) + delta ).toFixed(4);
  db.movimientos.push({
    id: uid(), fecha: opts.fecha || new Date().toISOString(),
    tipo: opts.tipo || (delta>=0 ? "entrada" : "salida"),
    productoId: prod.id, sku:prod.sku, nombre:prod.nombre,
    cantidad: Math.abs(delta), delta: delta, valorUnit, refTipo, refId, ref,
    obs: opts.obs || ""
  });
}

let selProd = new Set();                 // productos tildados en el maestro
let selMode = false;                     // modo selección activado (muestra los tildes)
let prodFiltros = { q:"", saga:"", estado:"", cmin:"", cmax:"" };
let dashFiltros = { q:"", saga:"", estado:"", cmin:"", cmax:"" };
let docFiltros = { compra:{q:"",desde:"",hasta:"",orden:"fecha_desc"}, venta:{q:"",desde:"",hasta:"",orden:"fecha_desc"} };
let movFiltros = { q:"", desde:"", hasta:"", tipo:"", saga:"", vmin:"", vmax:"" };
/* "Saga" = línea/juego, derivada del nombre (texto antes de ":" o primeras palabras) */
function sagaDe(p){
  const n = (p.nombre||"").trim();
  if(!n) return "—";
  if(n.includes(":")) return n.split(":")[0].trim();
  const w = n.split(/\s+/);
  return w.slice(0, Math.min(3,w.length)).join(" ");
}
function sagasUnicas(){
  return [...new Set(db.productos.map(sagaDe))].filter(s=>s&&s!=="—").sort((a,b)=>a.localeCompare(b,"es"));
}
/* Filtrado genérico de productos por un objeto de filtros {q,saga,estado,cmin,cmax} */
function filtrarProds(f){
  const q=(f.q||"").trim().toLowerCase();
  const cmin=f.cmin!==""&&f.cmin!=null?parseNum(f.cmin):null;
  const cmax=f.cmax!==""&&f.cmax!=null?parseNum(f.cmax):null;
  return db.productos.filter(p=>{
    if(q){ const hay=((p.nombre||"")+" "+(p.sku||"")).toLowerCase(); if(!hay.includes(q)) return false; }
    if(f.saga && sagaDe(p)!==f.saga) return false;
    if(f.estado==="con" && !(p.stock>0)) return false;
    if(f.estado==="sin" && p.stock!==0) return false;
    if(f.estado==="bajo" && !bajoStock(p)) return false;
    if(f.estado==="neg" && !(p.stock<0)) return false;
    const c=p.ultimoCosto||0;
    if(cmin!==null && c<cmin) return false;
    if(cmax!==null && c>cmax) return false;
    return true;
  }).sort((a,b)=> (b.stock*b.ultimoCosto) - (a.stock*a.ultimoCosto));
}
/* Barra de filtros de productos, reutilizable (prefix = prefijo de ids) */
function filterBarHTML(prefix, f){
  const sagas=sagasUnicas();
  return `<div class="filtros">
    <input class="inp" id="${prefix}q" placeholder="Buscar por nombre o SKU…" value="${esc(f.q)}" style="flex:2;min-width:180px">
    <select class="inp" id="${prefix}saga" style="flex:1;min-width:130px">
      <option value="">Todas las sagas</option>
      ${sagas.map(s=>`<option value="${esc(s)}" ${f.saga===s?"selected":""}>${esc(s)}</option>`).join("")}
    </select>
    <select class="inp" id="${prefix}estado" style="flex:1;min-width:130px">
      <option value="" ${f.estado===""?"selected":""}>Todo el stock</option>
      <option value="con" ${f.estado==="con"?"selected":""}>Con stock</option>
      <option value="sin" ${f.estado==="sin"?"selected":""}>Sin stock</option>
      <option value="bajo" ${f.estado==="bajo"?"selected":""}>Bajo mínimo</option>
      <option value="neg" ${f.estado==="neg"?"selected":""}>Negativos</option>
    </select>
    <input class="inp num" id="${prefix}cmin" placeholder="Costo mín." value="${esc(f.cmin)}" style="width:100px">
    <input class="inp num" id="${prefix}cmax" placeholder="Costo máx." value="${esc(f.cmax)}" style="width:100px">
    <button class="btn ghost sm" id="${prefix}clear" title="Limpiar filtros">Limpiar</button>
  </div>`;
}
function wireFilterBar(prefix, f, onChange){
  const q=document.getElementById(prefix+"q"); if(!q) return;
  const upd=(k,el)=>{ f[k]=el.value; onChange(); };
  q.oninput=()=>upd("q",q);
  document.getElementById(prefix+"saga").onchange=e=>upd("saga",e.target);
  document.getElementById(prefix+"estado").onchange=e=>upd("estado",e.target);
  document.getElementById(prefix+"cmin").oninput=e=>upd("cmin",e.target);
  document.getElementById(prefix+"cmax").oninput=e=>upd("cmax",e.target);
  document.getElementById(prefix+"clear").onclick=()=>{
    f.q="";f.saga="";f.estado="";f.cmin="";f.cmax="";
    [prefix+"q",prefix+"cmin",prefix+"cmax",prefix+"saga",prefix+"estado"].forEach(id=>{const el=document.getElementById(id); if(el)el.value="";});
    onChange();
  };
}
function viewDash(){
  const bajos = db.productos.filter(bajoStock);
  const negs  = db.productos.filter(p=>p.stock<0);
  const sagas = sagasUnicas();

  return `
  <div class="head">
    <div class="title"><h2>Panel</h2><p>Valorización de stock a último costo de compra.</p></div>
    <div class="actions">
      <button class="btn up" data-open="compra">+ Cargar compra</button>
      <button class="btn down" data-open="venta">− Nueva venta</button>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="lbl">Productos</div><div class="val">${db.productos.length}</div><div class="sub">SKUs en el maestro</div></div>
    <div class="kpi"><div class="lbl">Unidades en stock</div><div class="val">${qty(unidadesTotales())}</div><div class="sub">suma de existencias</div></div>
    <div class="kpi"><div class="lbl">Valorización</div><div class="val">${money(valorizacion())}</div><div class="sub">stock × último costo</div></div>
    <div class="kpi ${(bajos.length||negs.length)?'warn':''}"><div class="lbl">Alertas</div><div class="val">${bajos.length+negs.length}</div><div class="sub">${negs.length} negativos · ${bajos.length} a reponer</div></div>
  </div>

  <div class="panel">
    <div class="phead"><h3>Existencias</h3><span class="hint" id="dashCount">tocá un producto para ver su historial</span></div>
    ${db.productos.length ? `
    ${filterBarHTML("f", dashFiltros)}
    <div class="table-scroll"><table>
      <thead><tr><th>SKU</th><th>Producto</th><th class="r">Stock</th><th class="r">Últ. costo</th><th class="r">Valorizado</th></tr></thead>
      <tbody id="dashBody"></tbody>
    </table></div>` : emptyState("Sin productos todavía","Cargá una compra (podés importar el PDF) o dá de alta un producto a mano y el stock empieza a moverse.")}
  </div>`;
}

/* Filtrado + render de la tabla de existencias (sin re-render de toda la vista) */
function filteredDashProds(){ return filtrarProds(dashFiltros); }
function renderDashRows(){
  const body=document.getElementById("dashBody"); if(!body) return;
  const list=filteredDashProds();
  body.innerHTML = list.map(p=>{
    const val=(p.stock||0)*(p.ultimoCosto||0);

    const flag = p.stock<0 ? '<span class="pill low">negativo</span>'
               : bajoStock(p) ? '<span class="pill low">reponer</span>' : "";
    return `<tr data-ficha="${p.id}" style="cursor:pointer">
      <td><span class="sku">${esc(p.sku||"—")}</span></td>
      <td>${esc(p.nombre)} ${flag}</td>
      <td class="r ${cls}">${qty(p.stock)}</td>
      <td class="r num">${money(p.ultimoCosto)}</td>
      <td class="r num">${money(val)}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:22px">Ningún producto coincide con los filtros.</td></tr>`;
  const cnt=document.getElementById("dashCount");
  if(cnt) cnt.textContent = list.length===db.productos.length ? "tocá un producto para ver su historial" : `mostrando ${list.length} de ${db.productos.length}`;
  body.querySelectorAll("[data-ficha]").forEach(tr=> tr.onclick=()=> openFicha(tr.dataset.ficha));
}
function wireDashFiltros(){
  wireFilterBar("f", dashFiltros, renderDashRows);

/* Barras horizontales: items=[{label, sku, value}], fmt=formateador, color=CSS var */
function hbars(items, fmt, color){
  const vals = items.filter(i=> i.value>0);
  if(!vals.length) return `<div class="cempty">Sin datos para graficar.</div>`;
  const max = Math.max(...vals.map(i=>i.value)) || 1;
  return vals.map(i=>{
    const pct = Math.max(2, (i.value/max)*100);
    const c = i.color || color;
    const chip = i.sku ? `<span class="sku">${esc(i.sku)}</span> ` : "";
    const full = (i.sku?("["+i.sku+"] "):"") + i.label;
    return `<div class="crow">
      <div class="cl" title="${esc(full)}">${chip}${esc(i.label)}</div>
      <div class="ct"><div class="cf" style="width:${pct.toFixed(1)}%;background:${c}"></div></div>
      <div class="cv">${fmt(i.value)}</div>
    </div>`;
  }).join("");
}

function viewAnalisis(){
  const prods = db.productos;
  const val   = valorizacion();
  const unidades = unidadesTotales();
  const costoProm = unidades>0 ? val/unidades : 0;

  // margen potencial (solo productos con precio de venta cargado)
  const conPrecio = prods.filter(p=> (p.precioVenta||0)>0);
  const margenPot = conPrecio.reduce((a,p)=> a + (p.stock||0)*((p.precioVenta||0)-(p.ultimoCosto||0)), 0);

  // top valorización
  const topVal = [...prods]
    .map(p=>({label:p.nombre, sku:p.sku, value:(p.stock||0)*(p.ultimoCosto||0)}))
    .sort((a,b)=>b.value-a.value).slice(0,8);

  // top unidades
  const topUn = [...prods]
    .map(p=>({label:p.nombre, sku:p.sku, value:(p.stock||0)}))
    .sort((a,b)=>b.value-a.value).slice(0,8);

  // Flujo por origen: compras / ventas / ajustes (monto = cantidad × valor unit.)
  let compMonto=0, ventMonto=0, ajMonto=0, compU=0, ventU=0, ajU=0;
  db.movimientos.forEach(m=>{
    const monto=(m.cantidad||0)*(m.valorUnit||0);
    if(m.tipo==="ajuste"){ ajMonto+=monto; ajU+=(m.cantidad||0); }
    else if(m.refTipo==="compra"){ compMonto+=monto; compU+=(m.cantidad||0); }
    else if(m.refTipo==="venta"){ ventMonto+=monto; ventU+=(m.cantidad||0); }
  });
  const flujo = [
    {label:"Compras", value:compMonto, color:"var(--up)"},
    {label:"Ventas",  value:ventMonto, color:"var(--down)"},
    {label:"Ajustes", value:ajMonto,   color:"#d99a2b"}
  ];

  const kpis = `
  <div class="kpis">
    <div class="kpi"><div class="lbl">Valorización</div><div class="val">${money(val)}</div><div class="sub">stock × último costo</div></div>
    <div class="kpi"><div class="lbl">Costo prom. ponderado</div><div class="val">${money(costoProm)}</div><div class="sub">por unidad en stock</div></div>
    <div class="kpi"><div class="lbl">Unidades</div><div class="val">${qty(unidades)}</div><div class="sub">${prods.length} SKUs</div></div>
    <div class="kpi"><div class="lbl">Margen potencial</div><div class="val">${conPrecio.length?money(margenPot):"—"}</div><div class="sub">${conPrecio.length?`si vendés el stock (${conPrecio.length} c/precio)`:"sin precios de venta cargados"}</div></div>
  </div>`;

  const graficos = `
  <div class="chart-grid">
    <div class="panel chart">
      <p class="ctitle">Valorización por producto</p>
      <p class="csub">Dónde está la plata invertida (top 8, stock × último costo).</p>
      ${prods.length ? hbars(topVal, money, "var(--accent)") : `<div class="cempty">Cargá productos para ver el análisis.</div>`}
    </div>
    <div class="panel chart">
      <p class="ctitle">Stock en unidades</p>
      <p class="csub">Cantidad física por producto (top 8).</p>
      ${prods.length ? hbars(topUn, qty, "var(--muted)") : `<div class="cempty">Cargá productos para ver el análisis.</div>`}
    </div>
    <div class="panel chart">
      <p class="ctitle">Flujo: compras · ventas · ajustes</p>
      <p class="csub">Monto acumulado por origen (cantidad × valor unitario).</p>
      ${db.movimientos.length ? hbars(flujo, money, "var(--up)") : `<div class="cempty">Todavía no hay movimientos.</div>`}
      <div class="clegend"><span><b style="background:var(--up)"></b>Compras ${qty(compU)} u.</span><span><b style="background:var(--down)"></b>Ventas ${qty(ventU)} u.</span><span><b style="background:#d99a2b"></b>Ajustes ${qty(ajU)} u.</span></div>
    </div>
    <div class="panel chart">
      <p class="ctitle">Concentración de inventario</p>
      <p class="csub">Cuánto pesa cada producto sobre la valorización total.</p>
      ${prods.length && val>0 ? hbars(topVal.map(t=>({label:t.label,sku:t.sku,value: val>0? (t.value/val*100):0})), v=>v.toFixed(1)+"%", "var(--accent-ink)") : `<div class="cempty">Sin datos suficientes.</div>`}
    </div>
  </div>`;

  return `
  <div class="head"><div class="title"><h2>Análisis</h2><p>Lectura rápida de tu inventario: plata invertida, unidades y flujo de movimientos.</p></div></div>
  ${kpis}
  ${graficos}`;
}

/* Selección múltiple + filtros del maestro */
function wireProd(){
  const btn=document.getElementById("btnSel");
  if(btn) btn.onclick=()=>{ selMode=!selMode; if(!selMode) selProd.clear(); render(); };
  if(!document.getElementById("prodBody")) return;   // no estamos en Productos
  [...selProd].forEach(id=>{ if(!prodById(id)) selProd.delete(id); });
  wireFilterBar("p", prodFiltros, renderProdRows);
  const all=document.getElementById("selall");
  if(all) all.onchange=()=>{
    const vis=filtrarProds(prodFiltros);
    if(all.checked) vis.forEach(p=>selProd.add(p.id)); else vis.forEach(p=>selProd.delete(p.id));
    renderProdRows();
  };
  const none=document.getElementById("selnone"); if(none) none.onclick=()=>{ selProd.clear(); renderProdRows(); };
  const del=document.getElementById("seldel"); if(del) del.onclick=deleteSelProd;
  renderProdRows();
}
function deleteSelProd(){
  const ids=[...selProd]; if(!ids.length) return;
  const prods=ids.map(prodById).filter(Boolean);
  const conStock=prods.filter(p=>p.stock!==0).length;
  const conMovs=prods.filter(p=>db.movimientos.some(m=>m.productoId===p.id)).length;
  let msg=`¿Borrar ${prods.length} producto(s) del maestro?`;
  if(conStock) msg+=`\n\n⚠ ${conStock} tiene(n) stock distinto de 0: al borrarlos, esas unidades dejan de contar en la valorización.`;
  if(conMovs) msg+=`\n\n⚠ ${conMovs} tiene(n) movimientos en el kardex. El historial queda (guarda nombre y SKU), pero ya no vas a poder abrir su ficha.`;
  msg+="\n\nEsta acción no se puede deshacer.";
  if(!confirm(msg)) return;
  db.productos = db.productos.filter(p=>!selProd.has(p.id));
  selProd.clear(); selMode=false;
  save(); toast(`${prods.length} producto(s) borrado(s)`, "warn"); render();
}

function filtrarDocs(tipo){
  const list = tipo==="compra" ? db.compras : db.ventas;
  const f = docFiltros[tipo];
  const q=(f.q||"").trim().toLowerCase();
  let out = list.filter(d=>{
    if(q){ const hay=((d.contraparte||"")+" "+(d.numero||"")).toLowerCase(); if(!hay.includes(q)) return false; }
    if(f.desde && (d.fecha||"") < f.desde) return false;
    if(f.hasta && (d.fecha||"") > f.hasta) return false;
    return true;
  });
  const dir = f.orden.endsWith("asc") ? 1 : -1;
  if(f.orden.startsWith("total")) out.sort((a,b)=> dir*((a.total||0)-(b.total||0)));
  else out.sort((a,b)=> dir*(String(a.fecha||"").localeCompare(String(b.fecha||""))) || dir*0);
  return out;
}

function filtrarMovs(){
  const f=movFiltros;
  const q=(f.q||"").trim().toLowerCase();
  const vmin=f.vmin!==""?parseNum(f.vmin):null, vmax=f.vmax!==""?parseNum(f.vmax):null;
  return db.movimientos.filter(m=>{
    if(f.tipo && m.tipo!==f.tipo) return false;
    if(q){ const hay=((m.nombre||"")+" "+(m.sku||"")+" "+(m.ref||"")).toLowerCase(); if(!hay.includes(q)) return false; }
    if(f.saga && sagaDe({nombre:m.nombre})!==f.saga) return false;
    const fch=(m.fecha||"").slice(0,10);
    if(f.desde && fch < f.desde) return false;
    if(f.hasta && fch > f.hasta) return false;
    const v=m.valorUnit||0;
    if(vmin!==null && v<vmin) return false;
    if(vmax!==null && v>vmax) return false;
    return true;
  });
}

  if(cnt) cnt.textContent = (all.length===db.movimientos.length?`${db.movimientos.length} asientos`:`${all.length} de ${db.movimientos.length}`)+(list.length<all.length?` · mostrando 400`:"");
  body.querySelectorAll("[data-delaj]").forEach(b=> b.onclick=()=> deleteAjuste(b.dataset.delaj));

function wireMovFiltros(){
  if(!document.getElementById("movBody")) return;
  const upd=(k,el)=>{ movFiltros[k]=el.value; renderMovRows(); };
  document.getElementById("mq").oninput=e=>upd("q",e.target);
  document.getElementById("mtipo").onchange=e=>upd("tipo",e.target);
  document.getElementById("msaga").onchange=e=>upd("saga",e.target);
  document.getElementById("mdesde").onchange=e=>upd("desde",e.target);
  document.getElementById("mhasta").onchange=e=>upd("hasta",e.target);
  document.getElementById("mvmin").oninput=e=>upd("vmin",e.target);
  document.getElementById("mvmax").oninput=e=>upd("vmax",e.target);
  document.getElementById("mclear").onclick=()=>{
    movFiltros={ q:"", desde:"", hasta:"", tipo:"", saga:"", vmin:"", vmax:"" };
    ["mq","mdesde","mhasta","mvmin","mvmax"].forEach(id=>{const el=document.getElementById(id); if(el)el.value="";});
    ["mtipo","msaga"].forEach(id=>{const el=document.getElementById(id); if(el)el.value="";});
    renderMovRows();
  };
  renderMovRows();
}
/* Borrar un ajuste manual: revierte su efecto en el stock y saca el asiento */
function deleteAjuste(id){
  const m=db.movimientos.find(x=>x.id===id && x.tipo==="ajuste"); if(!m) return;
  const p=prodById(m.productoId);
  const d=(m.delta!=null)?m.delta:0;
  const msg = p
    ? `¿Borrar este ajuste?\n\n${p.nombre}\nRevierte ${d>=0?'+':'−'}${qty(Math.abs(d))} u → stock ${qty(p.stock)} pasa a ${qty(+((p.stock||0)-d).toFixed(4))}.`
    : `¿Borrar este ajuste? (el producto ya no existe en el maestro)`;
  if(!confirm(msg)) return;
  if(p) p.stock = +((p.stock||0) - d).toFixed(4);
  db.movimientos = db.movimientos.filter(x=>x.id!==id);
  save(); toast("Ajuste borrado","warn"); render();
}

/* ---------- utilidades UI ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function emptyState(t,h){ return `<div class="empty"><div class="big">∅</div><p style="font-weight:600;color:var(--text)">${t}</p><p class="hint">${h}</p></div>`; }

/* ============================================================
   Eventos de la vista
   ============================================================ */
function wire(){
  const m = document.getElementById("main");
  m.querySelectorAll("[data-open]").forEach(b=> b.onclick=()=> openDoc(b.dataset.open));
  m.querySelectorAll("[data-newp]").forEach(b=> b.onclick=()=> openProd());
  m.querySelectorAll("[data-ficha]").forEach(tr=> tr.onclick=()=> openFicha(tr.dataset.ficha));
  wireDashFiltros();
  wireProd();
  wireDocFiltros();
  wireMovFiltros();
  m.querySelectorAll("[data-editp]").forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); openProd(b.dataset.editp); });
  m.querySelectorAll("[data-import]").forEach(b=> b.onclick=()=> openImport());
  const adj=m.querySelector("[data-adjust]"); if(adj) adj.onclick=()=> openAjuste();
  m.querySelectorAll("[data-delaj]").forEach(b=> b.onclick=()=> deleteAjuste(b.dataset.delaj));
  m.querySelectorAll("[data-vdoc]").forEach(b=> b.onclick=()=>{
    const [t,id]=b.dataset.vdoc.split(":"); verDoc(t,id);
  });
  m.querySelectorAll("[data-editdoc]").forEach(b=> b.onclick=()=>{
    const [t,id]=b.dataset.editdoc.split(":"); editDoc(t,id);
  });
  m.querySelectorAll("[data-deldoc]").forEach(b=> b.onclick=()=>{
    const [t,id]=b.dataset.deldoc.split(":"); deleteDoc(t,id);
  });
  const exp=m.querySelector("[data-export]"); if(exp) exp.onclick=exportJSON;
  const imp=m.querySelector("[data-import-json]"); if(imp) imp.onclick=importJSON;
  const rst=m.querySelector("[data-reset]"); if(rst) rst.onclick=resetAll;
  const cfg=m.querySelector("[data-savecfg]"); if(cfg) cfg.onclick=()=>{
    db.config.moneda = (document.getElementById("cfgMon").value||"$").trim()||"$";
    save(); toast("Configuración guardada"); render();
  };

  // --- cuenta / sincronización ---
  const sNow=m.querySelector("[data-syncnow]"); if(sNow) sNow.onclick=()=> pullNow();
  const lo=m.querySelector("[data-logout]"); if(lo) lo.onclick=()=> logout();
  const cl=m.querySelector("[data-conflocal]"); if(cl) cl.onclick=()=>resolveConflict(true);
  const cs=m.querySelector("[data-confserver]"); if(cs) cs.onclick=()=>resolveConflict(false);

  paintSync();
}

function openProd(id){
  const p = id ? prodById(id) : null;
  const modal = buildModal(p?"Editar producto":"Nuevo producto", `
    <div class="grid-form" style="grid-template-columns:1fr 1fr;padding:0">
      <div class="field"><label>SKU / código</label><input class="inp" id="p_sku" value="${p?esc(p.sku):""}"></div>
      <div class="field"><label>Unidad</label><input class="inp" id="p_uni" value="${p?esc(p.unidad):"u"}" placeholder="u, kg, caja..."></div>
      <div class="field" style="grid-column:1/3"><label>Nombre</label><input class="inp" id="p_nom" value="${p?esc(p.nombre):""}"></div>
      <div class="field"><label>Stock inicial</label><input class="inp num" id="p_stk" value="${p?p.stock:0}" ${p?'disabled':''}></div>
      <div class="field"><label>Último costo</label><input class="inp num" id="p_cos" value="${p?p.ultimoCosto:0}"></div>
      <div class="field"><label>Precio de venta</label><input class="inp num" id="p_pv" value="${p?p.precioVenta:0}"></div>
      <div class="field"><label>Punto de repedido</label><input class="inp num" id="p_rep" value="${p?p.puntoRepedido:0}"></div>
    </div>
    ${p?'<p style="font-size:12.5px;color:var(--muted);margin:14px 0 0">El stock se ajusta desde compras y ventas, no acá.</p>':''}
  `, [
    p ? {label:"Eliminar",cls:"btn danger",act:()=>{ delProd(p.id); }} : null,
    {label:"Cancelar",cls:"btn",act:closeModal},
    {label:"Guardar",cls:"btn primary",act:()=>saveProd(id)}
  ].filter(Boolean));
  document.getElementById("p_sku").focus();
}
function saveProd(id){
  const g=x=>document.getElementById(x).value;
  const nom=g("p_nom").trim();
  if(!nom){ toast("Poné un nombre","warn"); return; }
  if(id){
    const p=prodById(id);
    p.sku=g("p_sku").trim(); p.unidad=g("p_uni").trim()||"u"; p.nombre=nom;
    p.ultimoCosto=parseNum(g("p_cos")); p.precioVenta=parseNum(g("p_pv")); p.puntoRepedido=parseNum(g("p_rep"));
  } else {
    const stk=parseNum(g("p_stk"));
    const p={ id:uid(), sku:g("p_sku").trim(), unidad:g("p_uni").trim()||"u", nombre:nom,
      stock:0, ultimoCosto:parseNum(g("p_cos")), precioVenta:parseNum(g("p_pv")), puntoRepedido:parseNum(g("p_rep")) };
    db.productos.push(p);
    if(stk) moverStock(p, stk, p.ultimoCosto, "ajuste", null, "Stock inicial");
  }
  save(); closeModal(); toast("Producto guardado"); render();
}
function delProd(id){
  const p=prodById(id);
  if(!confirm(`¿Eliminar "${p.nombre}"? No se borran sus movimientos históricos.`)) return;
  db.productos = db.productos.filter(x=>x.id!==id);
  save(); closeModal(); toast("Producto eliminado","warn"); render();
}

/* ============================================================
   AJUSTE DE INVENTARIO (movimiento tipo "ajuste")
   ============================================================ */
let adjDraft = null;
function openAjuste(prodId){
  adjDraft = { productoId: prodId||"", modo:"delta", cantidad:"", fecha:new Date().toISOString().slice(0,10), obs:"" };
  renderAjuste();
}
function renderAjuste(){
  const p = prodById(adjDraft.productoId);
  const opts = `<option value="">— elegir —</option>` +
    db.productos.map(x=>`<option value="${x.id}" ${x.id===adjDraft.productoId?"selected":""}>${esc(x.sku?("["+x.sku+"] "):"")}${esc(x.nombre)}</option>`).join("");
  const stockActual = p ? qty(p.stock) : "—";
  // preview del resultado
  let previewTxt = "";
  if(p && adjDraft.cantidad!=="" && !isNaN(+adjDraft.cantidad)){
    const nuevo = adjDraft.modo==="recuento" ? +adjDraft.cantidad : (p.stock||0)+(+adjDraft.cantidad);
    const delta = nuevo-(p.stock||0);
    const col = delta===0?"var(--muted)":(delta>0?"var(--up)":"var(--down)");
    previewTxt = `<div class="banner ${delta>=0?'ok':'warn'}" style="margin:2px 0 0">Stock: <b>${qty(p.stock)}</b> → <b>${qty(nuevo)}</b> <span style="color:${col}">(${delta>=0?'+':'−'}${qty(Math.abs(delta))})</span></div>`;
  }
  const body = `
    <div class="grid-form" style="grid-template-columns:1fr 1fr;padding:0;margin-bottom:8px">
      <div class="field" style="grid-column:1/3"><label>Producto</label>
        <select class="inp" id="aj_prod">${opts}</select>
        ${p?`<div style="font-size:11.5px;color:var(--muted);margin-top:4px">Stock actual: <b class="num">${stockActual}</b> · último costo ${money(p.ultimoCosto)}</div>`:""}
      </div>
      <div class="field"><label>Tipo de ajuste</label>
        <select class="inp" id="aj_modo">
          <option value="delta" ${adjDraft.modo==="delta"?"selected":""}>Diferencia (+/−)</option>
          <option value="recuento" ${adjDraft.modo==="recuento"?"selected":""}>Recuento (stock final)</option>
        </select>
      </div>
      <div class="field"><label>${adjDraft.modo==="recuento"?"Stock contado":"Cantidad (+ suma / − resta)"}</label>
        <input class="inp num" id="aj_cant" type="number" step="any" value="${esc(adjDraft.cantidad)}" placeholder="0"></div>
      <div class="field"><label>Fecha</label><input class="inp" type="date" id="aj_fe" value="${esc(adjDraft.fecha)}"></div>
      <div class="field"><label>Observación (obligatoria)</label><input class="inp" id="aj_obs" value="${esc(adjDraft.obs)}" placeholder="Ej: rotura, recuento físico, faltante proveedor…"></div>
    </div>
    <div id="aj_prev">${previewTxt}</div>
  `;
  buildModal("Ajuste de inventario", body, [
    {label:"Cancelar", cls:"btn", act:()=>{ adjDraft=null; closeModal(); }},
    {label:"Registrar ajuste", cls:"btn", act:confirmAjuste}
  ]);
  const sync=()=>{
    adjDraft.productoId=document.getElementById("aj_prod").value;
    adjDraft.modo=document.getElementById("aj_modo").value;
    adjDraft.cantidad=document.getElementById("aj_cant").value;
    adjDraft.fecha=document.getElementById("aj_fe").value;
    adjDraft.obs=document.getElementById("aj_obs").value;
  };
  document.getElementById("aj_prod").onchange=()=>{ sync(); renderAjuste(); };
  document.getElementById("aj_modo").onchange=()=>{ sync(); renderAjuste(); };
  document.getElementById("aj_cant").oninput=()=>{ sync(); const prev=document.getElementById("aj_prev"); const pp=prodById(adjDraft.productoId);
    if(pp && adjDraft.cantidad!=="" && !isNaN(+adjDraft.cantidad)){
      const nuevo=adjDraft.modo==="recuento"?+adjDraft.cantidad:(pp.stock||0)+(+adjDraft.cantidad);
      const delta=nuevo-(pp.stock||0); const col=delta===0?"var(--muted)":(delta>0?"var(--up)":"var(--down)");
      prev.innerHTML=`<div class="banner ${delta>=0?'ok':'warn'}" style="margin:2px 0 0">Stock: <b>${qty(pp.stock)}</b> → <b>${qty(nuevo)}</b> <span style="color:${col}">(${delta>=0?'+':'−'}${qty(Math.abs(delta))})</span></div>`;
    } else prev.innerHTML="";
  };
  document.getElementById("aj_obs").oninput=e=>adjDraft.obs=e.target.value;
  document.getElementById("aj_fe").oninput=e=>adjDraft.fecha=e.target.value;
}
function confirmAjuste(){
  const p = prodById(adjDraft.productoId);
  if(!p){ toast("Elegí un producto","warn"); return; }
  if(adjDraft.cantidad==="" || isNaN(+adjDraft.cantidad)){ toast("Ingresá una cantidad válida","warn"); return; }
  if(!adjDraft.obs.trim()){ toast("La observación es obligatoria","warn"); return; }
  const nuevo = adjDraft.modo==="recuento" ? +adjDraft.cantidad : (p.stock||0)+(+adjDraft.cantidad);
  const delta = +(nuevo-(p.stock||0)).toFixed(4);
  if(delta===0){ toast("El ajuste no cambia el stock","warn"); return; }
  if(nuevo < 0){ toast("El stock no puede quedar negativo","warn"); alert(`El ajuste dejaría el stock en ${qty(nuevo)}.\nEl stock no puede ser negativo.`); return; }
  if(!confirm(`Confirmás el ajuste?\n\n${p.nombre}\nStock ${qty(p.stock)} → ${qty(nuevo)} (${delta>=0?'+':'−'}${qty(Math.abs(delta))})\nMotivo: ${adjDraft.obs.trim()}`)) return;
  const ref = "Ajuste · " + adjDraft.obs.trim();
  const fechaISO = new Date(adjDraft.fecha+"T12:00:00").toISOString();
  moverStock(p, delta, p.ultimoCosto||0, "ajuste", null, ref, { tipo:"ajuste", obs:adjDraft.obs.trim(), fecha:fechaISO });
  adjDraft=null; save(); closeModal();
  toast(`Ajuste registrado · ${delta>=0?'+':'−'}${qty(Math.abs(delta))} u`, delta>=0?"up":"down");
  render();
}

function prodOptions(sel, soloConStock){
  const lista = soloConStock ? db.productos.filter(p=> (p.stock||0) > 0) : db.productos;
  const opts = lista.map(p=>{
    const disp = soloConStock ? ` (disp: ${qty(p.stock)})` : "";
    return `<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.sku?("["+p.sku+"] "):"")}${esc(p.nombre)}${disp}</option>`;
  }).join("");
  const nuevo = soloConStock ? "" : `<option value="__new">＋ Crear producto nuevo…</option>`;
  const vacio = soloConStock && !lista.length
    ? `<option value="">— no hay productos con stock —</option>`
    : `<option value="">— elegir —</option>`;
  return vacio + opts + nuevo;
}
function renderLines(){
  const isC = draft.tipo==="compra";
  const host = document.getElementById("lineHost");
  const rows = draft.lineas.map((l,i)=>{
    const p = prodById(l.productoId);
    if(isC){
      const newFields = l.crear ? `
        <div style="display:flex;gap:6px;margin-top:6px">
          <input class="inp" placeholder="SKU" value="${esc(l.sku)}" data-k="sku" data-i="${i}" style="max-width:110px">
          <input class="inp" placeholder="Nombre del producto nuevo" value="${esc(l.nombre)}" data-k="nombre" data-i="${i}">
        </div>` : "";
      return `<tr>
        <td style="min-width:180px">
          <select class="inp" data-k="prod" data-i="${i}">${prodOptions(l.productoId)}</select>
          ${newFields}
        </td>
        <td style="width:90px"><input class="inp num" data-k="cantidad" data-i="${i}" value="${l.cantidad}"></td>
        <td style="width:120px"><input class="inp num" data-k="precio" data-i="${i}" value="${l.precio}"></td>
        <td class="r num sub-cell" style="width:120px">${money(l.cantidad*l.precio)}</td>
        <td style="width:34px"><button class="btn ghost sm" data-del="${i}" title="Quitar">✕</button></td>
      </tr>`;
    }
    // ---- VENTA ----
    const disp = p ? p.stock : 0;
    const dispInfo = p ? `<div style="font-size:11px;color:${l.cantidad>disp?'var(--alert)':'var(--muted)'};margin-top:3px">disp: ${qty(disp)}</div>` : "";
    return `<tr>
      <td style="min-width:180px">
        <select class="inp" data-k="prod" data-i="${i}">${prodOptions(l.productoId, true)}</select>
        ${dispInfo}
      </td>
      <td style="width:80px"><input class="inp num" data-k="cantidad" data-i="${i}" value="${l.cantidad}"></td>
      <td class="r num" style="width:96px;color:var(--muted)">${p?money(l.costoRef):"—"}</td>
      <td style="width:78px"><input class="inp num" data-k="margen" data-i="${i}" value="${l.margen||0}" placeholder="%"></td>
      <td style="width:110px"><input class="inp num" data-k="precio" data-i="${i}" value="${l.precio}"></td>
      <td class="r num sub-cell" style="width:110px">${money(l.cantidad*l.precio)}</td>
      <td style="width:34px"><button class="btn ghost sm" data-del="${i}" title="Quitar">✕</button></td>
    </tr>`;
  }).join("");

  const thead = isC
    ? `<tr><th>Producto</th><th class="r">Cant.</th><th class="r">Costo unit.</th><th class="r">Subtotal</th><th></th></tr>`
    : `<tr><th>Producto</th><th class="r">Cant.</th><th class="r">Costo</th><th class="r">Margen&nbsp;%</th><th class="r">Precio unit.</th><th class="r">Subtotal</th><th></th></tr>`;
  host.innerHTML = `<div class="table-scroll"><table class="line-tbl">
    <thead>${thead}</thead>
    <tbody>${rows}</tbody></table></div>`;

  const round2 = n=> Math.round((n||0)*100)/100;
  host.querySelectorAll("[data-k]").forEach(inp=>{
    const i=+inp.dataset.i, k=inp.dataset.k;
    inp.oninput = ()=>{
      const l=draft.lineas[i];
      if(k==="prod"){
        if(inp.value==="__new"){ l.crear=true; l.productoId=""; renderLines(); return; }
        l.crear=false; l.productoId=inp.value;
        const p=prodById(inp.value);
        if(p && isC && !l.precio){ l.precio=p.ultimoCosto; }
        if(p && !isC){
          l.costoRef = p.ultimoCosto||0;
          l.margen = l.margen||0;
          l.precio = round2(l.costoRef*(1+(l.margen||0)/100)) || (p.precioVenta||0);
        }
        renderLines(); refreshTotal(); return;
      }
      if(k==="cantidad"){
        let v=parseNum(inp.value);
        if(!isC){ const p=prodById(l.productoId); if(p && v>p.stock){ v=p.stock; inp.value=v; toast(`Máximo disponible: ${qty(p.stock)}`,"warn"); } }
        l.cantidad=v;
      }
      else if(k==="precio"){
        l.precio=parseNum(inp.value);
        if(!isC && l.costoRef>0){ l.margen = round2((l.precio/l.costoRef - 1)*100);
          const mi=host.querySelector(`[data-k="margen"][data-i="${i}"]`); if(mi) mi.value=l.margen; }
      }
      else if(k==="margen"){
        l.margen=parseNum(inp.value);
        l.precio = round2((l.costoRef||0)*(1+(l.margen||0)/100));
        const pi=host.querySelector(`[data-k="precio"][data-i="${i}"]`); if(pi) pi.value=l.precio;
      }
      else l[k]=inp.value;
      if(k==="cantidad"||k==="precio"||k==="margen"){ updateSubtotals(); refreshTotal(); }
    };
  });
  host.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=>{
    draft.lineas.splice(+b.dataset.del,1);
    if(!draft.lineas.length) draft.lineas.push(blankLine());
    renderLines(); refreshTotal();
  });
}
function updateSubtotals(){
  const host=document.getElementById("lineHost");
  host.querySelectorAll("tbody tr").forEach((tr,i)=>{
    const l=draft.lineas[i]; if(!l) return;
    const cell=tr.querySelector(".sub-cell");
    if(cell) cell.textContent = money(l.cantidad*l.precio);
  });
}
function refreshTotal(){
  const total = draft.lineas.reduce((a,l)=> a + l.cantidad*l.precio, 0);
  const foot=document.querySelector(".modal .mextra .num");
  if(foot) foot.textContent = money(total);
}

function confirmDoc(){
  const isC = draft.tipo==="compra";
  // Resolver líneas
  const resolved = [];
  for(const l of draft.lineas){
    if(!l.cantidad || l.cantidad<=0) continue;
    let p=null;
    if(l.crear){
      if(!l.nombre.trim()){ toast("Falta el nombre de un producto nuevo","warn"); return; }
      p = { id:uid(), sku:(l.sku||"").trim(), unidad:"u", nombre:l.nombre.trim(),
            stock:0, ultimoCosto:0, precioVenta: isC?(l.precioVentaSugerido||0):l.precio, puntoRepedido:0 };
      db.productos.push(p);
    } else {
      p = prodById(l.productoId);
      if(!p){ toast("Hay una línea sin producto asignado","warn"); return; }
    }
    resolved.push({ prod:p, cantidad:l.cantidad, precio:l.precio });
  }
  if(!resolved.length){ toast("Cargá al menos una línea válida","warn"); return; }

  // Si estamos editando, calculamos (sin mutar) el efecto de revertir el documento original
  const editing = !!draft.editingId;
  let oldDoc=null; const revertMap={};
  if(editing){
    const list0 = isC?db.compras:db.ventas;
    oldDoc = list0.find(x=>x.id===draft.editingId) || null;
    if(oldDoc){
      oldDoc.lineas.forEach(l=>{
        const d = isC ? -l.cantidad : +l.cantidad;   // deshacer el efecto original
        revertMap[l.productoId] = (revertMap[l.productoId]||0) + d;
      });
    }
  }

  // Validación de stock en ventas: NUNCA se permite dejar stock negativo (bloqueo duro).
  if(!isC){
    const pedido={};   // total pedido por producto (por si hay líneas repetidas del mismo SKU)
    resolved.forEach(r=>{ pedido[r.prod.id]=(pedido[r.prod.id]||0)+r.cantidad; });
    const faltantes=[];
    Object.keys(pedido).forEach(id=>{
      const p=prodById(id);
      const eff=(p.stock||0)+(revertMap[id]||0);   // stock disponible (ya considerando la reversión si se edita)
      if(pedido[id]>eff) faltantes.push(`• ${p.nombre}: disponible ${qty(eff)}, pedís ${qty(pedido[id])}`);
    });
    if(faltantes.length){
      toast("No hay stock suficiente","warn");
      alert("No se puede vender más de lo que hay en stock:\n\n"+faltantes.join("\n")+"\n\nAjustá las cantidades. El stock no puede quedar en negativo.");
      return;
    }
  }

  const doc = {
    id: editing ? draft.editingId : uid(), tipo:draft.tipo, contraparte:draft.contraparte.trim(),
    fecha:draft.fecha, numero:draft.numero.trim(),
    lineas: resolved.map(r=>({ productoId:r.prod.id, sku:r.prod.sku, nombre:r.prod.nombre, cantidad:r.cantidad, precio:r.precio })),
    total: resolved.reduce((a,r)=>a+r.cantidad*r.precio,0)
  };
  const refTxt = (isC?"Compra":"Venta") + (doc.numero?(" "+doc.numero):"") + (doc.contraparte?(" · "+doc.contraparte):"");

  // Recién ahora mutamos: primero revertimos el documento original (si estábamos editando)
  if(oldDoc) revertDoc(oldDoc);

  resolved.forEach(r=>{
    if(isC){
      moverStock(r.prod, +r.cantidad, r.precio, "compra", doc.id, refTxt);
      r.prod.ultimoCosto = r.precio;      // <-- último costo
    } else {
      moverStock(r.prod, -r.cantidad, r.precio, "venta", doc.id, refTxt);
      r.prod.precioVenta = r.precio;      // <-- último precio de venta
    }
  });

  (isC?db.compras:db.ventas).push(doc);
  draft.editingId=null;
  save(); closeModal();
  const uds=qty(doc.lineas.reduce((a,l)=>a+l.cantidad,0));
  toast(editing ? `Documento actualizado`
       : (isC?`Compra cargada · +${uds} u` : `Venta registrada · −${uds} u`), isC?"up":"down");
  render();
}

/* ---- Revertir / borrar / editar documentos ---- */
function recomputeUltimoCosto(prod){
  // último costo = precio de la compra más reciente que todavía contenga este producto
  for(let i=db.compras.length-1;i>=0;i--){
    const l = db.compras[i].lineas.find(x=>x.productoId===prod.id);
    if(l){ prod.ultimoCosto = l.precio; return; }
  }
  // si no queda ninguna compra con ese producto, dejamos el último costo como está
}
function revertDoc(doc){
  const isC = doc.tipo==="compra";
  doc.lineas.forEach(l=>{
    const p = prodById(l.productoId);
    if(p) p.stock = +((p.stock||0) + (isC ? -l.cantidad : +l.cantidad)).toFixed(4);
  });
  db.movimientos = db.movimientos.filter(m=> m.refId!==doc.id);
  const list = isC?db.compras:db.ventas;
  const i = list.findIndex(x=>x.id===doc.id); if(i>=0) list.splice(i,1);
  if(isC){
    [...new Set(doc.lineas.map(l=>l.productoId))].forEach(id=>{ const p=prodById(id); if(p) recomputeUltimoCosto(p); });
  }
}
function deleteDoc(tipo,id){
  const list = tipo==="compra"?db.compras:db.ventas;
  const d=list.find(x=>x.id===id); if(!d) return;
  const items=d.lineas.reduce((a,l)=>a+l.cantidad,0);
  const msg = tipo==="compra"
    ? `¿Borrar esta compra?\n\nSe RESTAN ${qty(items)} u del stock y se elimina su asiento del kardex.\nEl último costo se recalcula con la compra anterior (si existe).`
    : `¿Borrar esta venta?\n\nSe DEVUELVEN ${qty(items)} u al stock y se elimina su asiento del kardex.`;
  if(!confirm(msg)) return;
  revertDoc(d); save();
  if(document.getElementById("scrim")) closeModal();
  toast("Documento borrado","warn"); render();
}
function editDoc(tipo,id){
  const list = tipo==="compra"?db.compras:db.ventas;
  const d=list.find(x=>x.id===id); if(!d) return;
  draft = {
    tipo, editingId:id, contraparte:d.contraparte||"", fecha:d.fecha, numero:d.numero||"",
    lineas: d.lineas.map(l=>({ key:uid(), productoId:l.productoId, sku:l.sku, nombre:l.nombre, cantidad:l.cantidad, precio:l.precio, precioVentaSugerido:0, crear:false }))
  };
  renderDocModal();
}
