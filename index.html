function nuevoProductoBase(sku, nombre, precioVenta){
  const p = { id:uid(), sku:(sku||"").trim(), unidad:"u", nombre:(nombre||"").trim(),
        stock:0, costoNeto:0, costoHandling:0, costoFlete:0, ultimoCosto:0,
        precioVenta: precioVenta||0, puntoRepedido:0,
        categoria:"Otros", nivel:"unidad", packsPorBox:PACKS_POR_BOX_DEF, boxesPorCase:boxesCaseDefault("Otros"),
        estado:PRODUCT_STATES.SALE, idioma:"",
        stockPorTienda:{}, lotes:{}, precioVentaPorTienda:{} };
  STORE_IDS.forEach(s=>{ p.stockPorTienda[s]=0; p.lotes[s]=[]; p.precioVentaPorTienda[s]=precioVenta||0; });
  return p;
}
function confirmDoc(){
  const isC = draft.tipo==="compra";
  const store = draft.store || STORE_IDS[0];
  // Sale: require a customer before generating the invoice
  if(!isC && !clienteById(draft.clienteId)){
    toast("Pick (or create) a customer before generating the sale","warn"); return;
  }
  // Resolve lines
  const resolved = [];
  for(const l of draft.lineas){
    if(!l.cantidad || l.cantidad<=0) continue;
    let p=null;
    if(l.crear){
      if(!l.nombre.trim()){ toast("A new product is missing its name","warn"); return; }
      const dup = skuEnUso(l.sku, null);
      if(dup){ toast(`SKU "${(l.sku||"").trim()}" already belongs to "${dup.nombre}". Pick it in the line instead of creating a new one.`,"warn"); return; }
      p = nuevoProductoBase(l.sku, l.nombre, isC?(l.precioVentaSugerido||0):l.precio);
      db.productos.push(p);
    } else {
      p = prodById(l.productoId);
      if(!p){ toast("A line has no product assigned","warn"); return; }
    }
    // --- SPECIAL STATE GUARDS on sale (point 5) ---
    if(!isC){
      if(esInversion(p)){ toast(`"${p.nombre}" is in the investment vault and can't be sold`,"warn"); return; }
      if(esBloqueado(p)){ toast(`"${p.nombre}" is blocked (best-offer). It needs admin approval before selling`,"warn"); return; }
    }
    const costoSnap = isC ? l.precio : fifoCostoPeek(p, store, l.cantidad).unit;   // FIFO unit cost for the sold qty
    resolved.push({ prod:p, cantidad:l.cantidad, precio:l.precio, costo:costoSnap });
  }
  if(!resolved.length){ toast("Add at least one valid line","warn"); return; }

  // PUNTO 1 — prorrateo de costos adicionales (compra), POR UNIDAD:
  // cada unidad del documento carga (handling+flete)/unidades_totales.
  let handPU=0, fletePU=0;
  if(isC){
    const uds = resolved.reduce((a,r)=>a+r.cantidad,0);
    handPU  = uds>0 ? (draft.handling||0)/uds : 0;
    fletePU = uds>0 ? (draft.flete||0)/uds : 0;
  }

  // Si estamos editando, calculamos (sin mutar) el efecto de revertir el documento original
  const editing = !!draft.editingId;
  let oldDoc=null; const revertMap={};
  if(editing){
    const list0 = isC?db.compras:db.ventas;
    oldDoc = list0.find(x=>x.id===draft.editingId) || null;
    if(oldDoc){
      oldDoc.lineas.forEach(l=>{
        const d = isC ? -l.cantidad : +l.cantidad;   // deshacer el efecto original
        revertMap[l.productoId] = (revertMap[l.productoId]||0) + d;
      });
    }
  }

  // Stock validation on sales, PER STORE: never allow negative stock (hard block).
  if(!isC){
    const pedido={};
    resolved.forEach(r=>{ pedido[r.prod.id]=(pedido[r.prod.id]||0)+r.cantidad; });
    const faltantes=[];
    Object.keys(pedido).forEach(id=>{
      const p=prodById(id);
      const eff = stockDe(p, store) + (revertMap[id]||0);   // store stock (+ revert if editing same store)
      if(pedido[id]>eff) faltantes.push(`• ${p.nombre}: available ${qty(eff)} in ${storeName(store)}, you asked ${qty(pedido[id])}`);
    });
    if(faltantes.length){
      toast("Not enough stock","warn");
      alert("Can't sell more than what's in stock at "+storeName(store)+":\n\n"+faltantes.join("\n")+"\n\nAdjust the quantities. Stock can't go negative.");
      return;
    }
  }

  const subtotalLineas = totalLineas(resolved);
  const cli = isC ? null : clienteById(draft.clienteId);
  const envioMonto = (!isC && draft.envio && draft.envio.tipo==="monto") ? (draft.envio.monto||0) : 0;
  const totalDoc = isC ? round2(subtotalLineas + (draft.handling||0) + (draft.flete||0))
                       : round2(subtotalLineas + envioMonto);
  const doc = {
    id: editing ? draft.editingId : uid(), tipo:draft.tipo, store, contraparte:draft.contraparte.trim(),
    fecha:draft.fecha, numero:draft.numero.trim(),
    lineas: resolved.map(r=>{
      const base = { productoId:r.prod.id, sku:r.prod.sku, nombre:r.prod.nombre, cantidad:r.cantidad, precio:r.precio, costo:r.costo };
      if(isC){
        base.neto = r.precio; base.handling = round2(handPU); base.flete = round2(fletePU);
        base.costoTotal = round2(r.precio + handPU + fletePU);   // landed unit cost
      }
      return base;
    }),
    subtotal: subtotalLineas,
    total: totalDoc
  };
  if(isC){ doc.handling = draft.handling||0; doc.flete = draft.flete||0; }
  else {
    doc.clienteId = draft.clienteId;
    doc.cliente = cli ? { nombre:cli.nombre, contacto:cli.contacto, empresa:cli.empresa, telefono:cli.telefono, email:cli.email, direccion:cli.direccion, ciudad:cli.ciudad, estado:cli.estado, zip:cli.zip, pais:cli.pais||"" } : null;  // snapshot for the invoice + country slicer
    doc.envio = { tipo:draft.envio.tipo, monto:envioMonto };
    doc.contraparte = cli ? clienteLinea(cli) : draft.contraparte.trim();
  }
  const refTxt = (isC?"Compra":"Venta") + (doc.numero?(" "+doc.numero):"") + (doc.contraparte?(" · "+doc.contraparte):"");

  // Recién ahora mutamos: primero revertimos el documento original (si estábamos editando)
  if(oldDoc) revertDoc(oldDoc);

  resolved.forEach((r, idx)=>{
    if(isC){
      const landed = round2(r.precio + handPU + fletePU);
      fifoEntrada(r.prod, store, r.cantidad, landed, refTxt, doc.id);  // FIFO purchase layer
      moverStock(r.prod, +r.cantidad, landed, "compra", doc.id, refTxt, { store });
      r.prod.costoNeto = r.precio; r.prod.costoHandling = round2(handPU); r.prod.costoFlete = round2(fletePU);
      r.prod.ultimoCosto = landed;        // last landed cost (reference only; COGS is FIFO)
    } else {
      const res = fifoConsumir(r.prod, store, r.cantidad);            // consume FIFO layers -> real COGS
      doc.lineas[idx].costo = res.unit;                              // store the FIFO unit cost on the line
      doc.lineas[idx].cogs = res.cogs;                               // and the total COGS
      doc.lineas[idx].consumed = res.consumed;                       // to allow an exact revert later
      moverStock(r.prod, -r.cantidad, res.unit, "venta", doc.id, refTxt, { store });
      if(!r.prod.precioVentaPorTienda) r.prod.precioVentaPorTienda={};
      r.prod.precioVentaPorTienda[store] = r.precio;                 // per-store last sale price (point 4)
      r.prod.precioVenta = r.precio;                                 // legacy mirror
    }
  });

  (isC?db.compras:db.ventas).push(doc);
  draft.editingId=null;
  save(); closeModal();
  const uds=qty(doc.lineas.reduce((a,l)=>a+l.cantidad,0));
  toast(editing ? `Documento actualizado`
       : (isC?`Compra cargada · +${uds} u` : `Venta registrada · −${uds} u`), isC?"up":"down");
  render();
}

/* ---- Revertir / borrar / editar documentos ---- */
function recomputeUltimoCosto(prod){
  // último costo (landed) = de la compra más reciente que todavía contenga este producto.
  // Usamos el desglose guardado (neto+handling+flete). Compras viejas sin desglose caen a l.precio.
  for(let i=db.compras.length-1;i>=0;i--){
    const l = db.compras[i].lineas.find(x=>x.productoId===prod.id);
    if(l){
      prod.costoNeto = (l.neto!=null) ? l.neto : l.precio;
      prod.costoHandling = l.handling||0;
      prod.costoFlete = l.flete||0;
      prod.ultimoCosto = (l.costoTotal!=null) ? l.costoTotal : l.precio;
      return;
    }
  }
  // si no queda ninguna compra con ese producto, dejamos el último costo como está
}
function revertDoc(doc){
  const isC = doc.tipo==="compra";
  const store = doc.store || STORE_IDS[0];
  doc.lineas.forEach(l=>{
    const p = prodById(l.productoId); if(!p) return;
    if(isC){
      fifoQuitarCompra(p, store, doc.id);                 // drop the FIFO layer this purchase created
      p.stockPorTienda[store] = round4((stockDe(p,store)) - l.cantidad);
    } else {
      fifoDevolver(p, store, l.consumed);                 // put the exact consumed units back
      p.stockPorTienda[store] = round4((stockDe(p,store)) + l.cantidad);
    }
    recalcStockMirror(p);
  });
  db.movimientos = db.movimientos.filter(m=> m.refId!==doc.id);
  const list = isC?db.compras:db.ventas;
  const i = list.findIndex(x=>x.id===doc.id); if(i>=0) list.splice(i,1);
  if(isC){
    [...new Set(doc.lineas.map(l=>l.productoId))].forEach(id=>{ const p=prodById(id); if(p) recomputeUltimoCosto(p); });
  }
}
function deleteDoc(tipo,id){
  const list = tipo==="compra"?db.compras:db.ventas;
  const d=list.find(x=>x.id===id); if(!d) return;
  const items=d.lineas.reduce((a,l)=>a+l.cantidad,0);
  const msg = tipo==="compra"
    ? `Delete this purchase?\n\n${qty(items)} u are REMOVED from ${storeName(d.store)} stock and its FIFO layer is dropped.`
    : `Delete this sale?\n\n${qty(items)} u are RETURNED to ${storeName(d.store)} stock (back into their FIFO layers).`;
  if(!confirm(msg)) return;
  revertDoc(d); save();
  if(document.getElementById("scrim")) closeModal();
  toast("Document deleted","warn"); render();
}
function editDoc(tipo,id){
  const list = tipo==="compra"?db.compras:db.ventas;
  const d=list.find(x=>x.id===id); if(!d) return;
  draft = {
    tipo, editingId:id, store:d.store||STORE_IDS[0], contraparte:d.contraparte||"", fecha:d.fecha, numero:d.numero||"",
    clienteId:d.clienteId||"", envio: d.envio ? {tipo:d.envio.tipo, monto:d.envio.monto||0} : {tipo:"free",monto:0},
    handling:d.handling||0, flete:d.flete||0,
    lineas: d.lineas.map(l=>({ key:uid(), productoId:l.productoId, sku:l.sku, nombre:l.nombre, cantidad:l.cantidad, precio:l.precio,
      costoRef: prodById(l.productoId) ? (prodById(l.productoId).ultimoCosto||0) : (l.costo||0),
      margen: (l.costo>0)? round2((l.precio/l.costo-1)*100) : 0, precioVentaSugerido:0, crear:false }))
  };
  renderDocModal();
}
/* Copy a sale as a NEW document. Re-validates current stock IN THE SAME STORE. */
function copyDoc(tipo,id){
  const list = tipo==="compra"?db.compras:db.ventas;
  const d=list.find(x=>x.id===id); if(!d) return;
  if(document.getElementById("scrim")) closeModal();
  const store = d.store||STORE_IDS[0];
  draft = {
    tipo, editingId:null, store,
    contraparte: tipo==="compra"?(d.contraparte||""):"",
    fecha:new Date().toISOString().slice(0,10),
    numero: tipo==="venta" ? nextFacturaVenta() : "",
    clienteId: tipo==="venta"?(d.clienteId||""):"",
    envio: (tipo==="venta" && d.envio) ? {tipo:d.envio.tipo, monto:d.envio.monto||0} : {tipo:"free",monto:0},
    handling:0, flete:0,
    lineas: d.lineas.map(l=>{
      const p=prodById(l.productoId);
      return { key:uid(), productoId:l.productoId, sku:l.sku, nombre:l.nombre, cantidad:l.cantidad, precio:l.precio,
        costoRef: p?(p.ultimoCosto||0):(l.costo||0), margen:(l.costo>0)?round2((l.precio/l.costo-1)*100):0, precioVentaSugerido:0, crear:false };
    })
  };
  const recortes=[];
  if(tipo==="venta"){
    const usado={};
    draft.lineas.forEach(l=>{
      const p=prodById(l.productoId); if(!p) return;
      const disp=Math.max(0, stockDe(p,store)-(usado[l.productoId]||0));
      if(l.cantidad>disp){ recortes.push(`• ${p.nombre}: asked ${qty(l.cantidad)}, ${qty(disp)} in ${storeName(store)}`); l.cantidad=disp; }
      usado[l.productoId]=(usado[l.productoId]||0)+l.cantidad;
    });
  }
  renderDocModal();
  if(recortes.length) alert("Copied the sale but trimmed quantities for lack of stock:\n\n"+recortes.join("\n")+"\n\nReview before confirming.");
}

/* ============================================================
   PUNTO 8 y 10 — Generación de PDF (invoice de venta + lista de precios)
   Usa jsPDF (UMD por CDN, cacheado por el SW para uso offline).

function pdfReady(){ return !!(window.jspdf && window.jspdf.jsPDF); }
function pdfMoney(n){ return db.config.moneda + " " + nf2.format(n||0); }

function generarInvoicePDF(id){
  if(!pdfReady()){ toast("Couldn't load the PDF generator (try once with internet)","warn"); return; }
  const d = db.ventas.find(v=>v.id===id); if(!d){ toast("Venta no encontrada","warn"); return; }
  const cli = d.cliente || (d.clienteId?clienteById(d.clienteId):null);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"letter" });   // formato US (Letter)
  const M=48, W=doc.internal.pageSize.getWidth();
  let y=54;
  const em=db.config.emisor||{};

  // Encabezado
  doc.setFont("helvetica","bold"); doc.setFontSize(20);
  doc.text(em.nombre || "INVOICE", M, y);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(90);
  let yr=54;
  const right=(t,yy)=>{ doc.text(t, W-M, yy, {align:"right"}); };
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(20);
  right("INVOICE", yr); yr+=16;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(90);
  right(`#${d.numero||"—"}`, yr); yr+=13;
  right(`Date: ${d.fecha||""}`, yr);
  if(em.direccion||em.email||em.tel){
    y+=16; doc.setFontSize(9); doc.setTextColor(110);
    [em.direccion, em.email, em.tel].filter(Boolean).forEach(t=>{ doc.text(String(t), M, y); y+=12; });
  }
  y=Math.max(y, 108);

  // Bill To
  doc.setDrawColor(220); doc.line(M, y, W-M, y); y+=20;
  doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(20);
  doc.text("BILL TO", M, y); y+=15;
  doc.setFont("helvetica","normal"); doc.setTextColor(60);
  if(cli){
    doc.setFont("helvetica","bold"); doc.text(cli.nombre||"", M, y); doc.setFont("helvetica","normal"); y+=13;
    const linea2=[cli.empresa, cli.contacto].filter(Boolean).join(" · ");
    if(linea2){ doc.text(linea2, M, y); y+=13; }
    if(cli.direccion){ doc.text(cli.direccion, M, y); y+=13; }
    const cz=[cli.ciudad, cli.estado, cli.zip].filter(Boolean).join(", ");
    if(cz){ doc.text(cz, M, y); y+=13; }
    const ce=[cli.email, cli.telefono].filter(Boolean).join(" · ");
    if(ce){ doc.text(ce, M, y); y+=13; }
  } else { doc.text("—", M, y); y+=13; }
  y+=10;

  // Tabla
  const cols=[ {x:M, w:W-M-M-210, t:"Item", a:"left"},
               {x:W-M-210, w:50, t:"Qty", a:"right"},
               {x:W-M-150, w:70, t:"Unit price", a:"right"},
               {x:W-M-70,  w:70, t:"Amount", a:"right"} ];
  doc.setFillColor(245); doc.rect(M, y-12, W-2*M, 22, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(40);
  cols.forEach(c=> doc.text(c.t, c.a==="right"?(c.x+c.w):c.x, y+3, {align:c.a}));
  y+=22;
  doc.setFont("helvetica","normal"); doc.setTextColor(55);
  d.lineas.forEach(l=>{
    if(y>720){ doc.addPage(); y=60; }
    const nom=(l.sku?`[${l.sku}] `:"")+(l.nombre||"");
    const wrapped=doc.splitTextToSize(nom, cols[0].w);
    doc.text(wrapped, cols[0].x, y);
    doc.text(qty(l.cantidad), cols[1].x+cols[1].w, y, {align:"right"});
    doc.text(pdfMoney(l.precio), cols[2].x+cols[2].w, y, {align:"right"});
    doc.text(pdfMoney(l.cantidad*l.precio), cols[3].x+cols[3].w, y, {align:"right"});
    y += Math.max(16, wrapped.length*12);
    doc.setDrawColor(238); doc.line(M, y-6, W-M, y-6);
  });

  // Totales
  y+=6; const sub=(d.subtotal!=null)?d.subtotal:totalLineas(d.lineas);
  const envio = d.envio && d.envio.tipo==="monto" ? (d.envio.monto||0) : 0;
  const tot=(row,val,bold)=>{ doc.setFont("helvetica",bold?"bold":"normal"); doc.setTextColor(bold?20:90);
    doc.text(row, W-M-160, y, {align:"left"}); doc.text(val, W-M, y, {align:"right"}); y+=16; };
  tot("Subtotal", pdfMoney(sub));
  tot("Shipping", d.envio && d.envio.tipo==="free" ? "Free" : pdfMoney(envio));
  doc.setDrawColor(200); doc.line(W-M-160, y-8, W-M, y-8);
  doc.setFontSize(11); tot("TOTAL", pdfMoney(d.total), true);

  doc.setFontSize(8.5); doc.setTextColor(150);
  doc.text("Thank you for your business.", M, 760);
  doc.save(`invoice-${(d.numero||"venta")}.pdf`);
  toast("Invoice descargado");
}

/* Lista de precios para clientes (punto 10). Recibe la lista ya filtrada. */
function exportListaPrecios(prods){
  if(!pdfReady()){ toast("Couldn't load the PDF generator (try once with internet)","warn"); return; }
  // Point 9: a customer price list must never leak blocked or investment items.
  const clean = prods.filter(p=> !esInversion(p) && !esBloqueado(p) && (p.precioVenta||0)>0);
  const dropped = prods.length - clean.length;
  if(!clean.length){ toast("No sellable products with a price to export","warn"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"letter" });
  const M=48, W=doc.internal.pageSize.getWidth(); let y=56;
  const em=db.config.emisor||{};

  doc.text(em.nombre?`${em.nombre} — Price list`:"Price list", M, y); y+=18;
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(120);
  doc.text(new Date().toLocaleDateString("en-US"), M, y); y+=20;

  const cSKU=M, cName=M+90, cPrice=W-M;
  doc.setFillColor(245); doc.rect(M, y-12, W-2*M, 22, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(40);
  doc.text("SKU", cSKU, y+3); doc.text("Product", cName, y+3); doc.text("Price", cPrice, y+3, {align:"right"});
  y+=22; doc.setFont("helvetica","normal"); doc.setTextColor(55);
  clean.slice().sort((a,b)=>String(a.nombre||"").localeCompare(String(b.nombre||""),"en")).forEach(p=>{
    if(y>740){ doc.addPage(); y=60; }
    doc.setTextColor(120); doc.setFontSize(8.5); doc.text(p.sku||"—", cSKU, y);

  });
  doc.save(`price-list-${new Date().toISOString().slice(0,10)}.pdf`);
  toast(`Price list exported · ${clean.length} products${dropped>0?` (${dropped} blocked/investment excluded)`:""}`);
}

/* ============================================================
   P&L EXPORT (point 8) — preliminary, Excel with per-store sheets
   + a consolidated sheet, so it plugs into the structure-cost model.
   Built from sales in the selected period: Revenue, COGS (FIFO),
   Gross margin, per product and totals.
   ============================================================ */
function exportPnL(desde, hasta){
  if(!window.XLSX){ toast("Couldn't load the Excel engine (try once with internet)","warn"); return; }
  const d0 = desde ? new Date(desde+"T00:00:00") : null;
  const d1 = hasta ? new Date(hasta+"T23:59:59") : null;
  const inRange = v=>{ const f=new Date(v.fecha+"T12:00:00"); if(d0&&f<d0) return false; if(d1&&f>d1) return false; return true; };

  // aggregate sales by store + product
  const agg = {};  // store -> prodKey -> {sku,nombre,units,revenue,cogs}
  STORE_IDS.forEach(s=> agg[s]={});
  db.ventas.filter(inRange).forEach(v=>{
    const st = v.store || STORE_IDS[0];
    v.lineas.forEach(l=>{
      const k=l.productoId||l.sku||l.nombre;
      const e = agg[st][k] = agg[st][k] || { sku:l.sku||"", nombre:l.nombre||"", units:0, revenue:0, cogs:0 };
      e.units += l.cantidad;
      e.revenue += round2((l.precio||0)*l.cantidad);
      e.cogs += round2(l.cogs!=null ? l.cogs : (l.costo||0)*l.cantidad);
    });
  });

  const wb = XLSX.utils.book_new();
  const header = ["SKU","Product","Units","Revenue","COGS (FIFO)","Gross margin","Margin %"];
  const consol = {};   // prodKey -> merged across stores
  const mkRows = (obj)=>{
    const rows=[]; let tU=0,tR=0,tC=0;
    Object.values(obj).sort((a,b)=>b.revenue-a.revenue).forEach(e=>{
      const gm=round2(e.revenue-e.cogs), pct = e.revenue>0? round2(gm/e.revenue*100):0;
      rows.push([e.sku, e.nombre, e.units, e.revenue, e.cogs, gm, pct]);
      tU+=e.units; tR+=e.revenue; tC+=e.cogs;
    });
    const tGM=round2(tR-tC), tPct=tR>0?round2(tGM/tR*100):0;
    rows.push([]); rows.push(["","TOTAL",tU,round2(tR),round2(tC),tGM,tPct]);
    return { rows, totals:{units:tU,revenue:round2(tR),cogs:round2(tC),gm:tGM} };
  };

  // per-store sheets
  const storeTotals=[];
  STORE_IDS.forEach(s=>{
    const { rows, totals } = mkRows(agg[s]);
    const ws = XLSX.utils.aoa_to_sheet([[storeName(s)+" — Preliminary P&L"],[`Period: ${desde||"start"} → ${hasta||"today"}`],[],header,...rows]);
    ws["!cols"]=[{wch:14},{wch:40},{wch:8},{wch:12},{wch:13},{wch:13},{wch:9}];
    XLSX.utils.book_append_sheet(wb, ws, storeName(s).slice(0,28));
    storeTotals.push({ store:storeName(s), ...totals });
    // merge into consolidated
    Object.entries(agg[s]).forEach(([k,e])=>{ const c=consol[k]=consol[k]||{sku:e.sku,nombre:e.nombre,units:0,revenue:0,cogs:0}; c.units+=e.units; c.revenue+=e.revenue; c.cogs+=e.cogs; });
  });

  // consolidated sheet (put first)
  const { rows:crows } = mkRows(consol);
  const cws = XLSX.utils.aoa_to_sheet([
    ["Consolidated — Preliminary P&L"],
    [`Period: ${desde||"start"} → ${hasta||"today"}`],
    [],
    ["Store","Units","Revenue","COGS (FIFO)","Gross margin"],
    ...storeTotals.map(t=>[t.store,t.units,t.revenue,t.cogs,t.gm]),
    [],
    header, ...crows
  ]);
  cws["!cols"]=[{wch:16},{wch:40},{wch:8},{wch:12},{wch:13},{wch:13},{wch:9}];
  XLSX.utils.book_append_sheet(wb, cws, "Consolidated");
  // move Consolidated to the front
  wb.SheetNames = ["Consolidated", ...wb.SheetNames.filter(n=>n!=="Consolidated")];

  XLSX.writeFile(wb, `PnL-preliminary-${new Date().toISOString().slice(0,10)}.xlsx`);
  toast("Preliminary P&L exported (Excel)");
}

  const drop=document.getElementById("drop"), input=document.getElementById("iaInput");
  drop.onclick=()=>input.click();
  input.onchange=()=>{ if(input.files[0]) handlePdfIA(input.files[0]); };
  ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
  drop.addEventListener("drop",e=>{ const f=e.dataTransfer.files[0]; if(f) handlePdfIA(f); });
}

/* Leer factura con Gemini (vía el Worker). Reusa el mismo editor de revisión que la detección local. */
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(",")[1]||"");
    r.onerror=()=>rej(new Error("no se pudo leer el archivo"));
    r.readAsDataURL(file);
  });
}
async function handlePdfIA(file){
  const out=document.getElementById("importOut");
  if(!session){ out.innerHTML=`<div class="banner warn">Necesitás estar logueado para usar la lectura con IA.</div>`; return; }
  out.innerHTML=`<p style="color:var(--muted);padding:14px 0">✨ Leyendo <b>${esc(file.name)}</b> con IA… (puede tardar unos segundos)</p>`;
  try{
    const b64=await fileToBase64(file);
    const res=await fetch(apiBase()+"/parse-invoice",{
      method:"POST", headers:authHeaders(),
      body:JSON.stringify({ pdf:b64, mime:file.type||"application/pdf" })
    });
    const j=await res.json();
    if(!res.ok || !j.ok){
      const det = j && (j.detalle||j.error||j.raw) ? esc(j.detalle||j.error||j.raw) : ("HTTP "+res.status);
      out.innerHTML=`<div class="banner warn">No se pudo leer con IA: ${det}.<br>Probá con la detección local o cargá a mano.</div>`;
      return;
    }
    const d=j.data||{};
    const lineas=Array.isArray(d.lineas)?d.lineas:[];
    if(!lineas.length){
      out.innerHTML=`<div class="banner warn">La IA no encontró renglones de productos en ese PDF. Revisá el archivo o cargá a mano.</div>`;
      return;
    }
    // adaptar a la estructura que consume showImportEditor
    const parsed={
      meta:{ numero:d.numero||"", fecha:normFechaIA(d.fecha), proveedor:d.proveedor||"", flete:parseNum(d.flete)||0, moneda:d.moneda||"" },
      items:lineas.map(l=>({
        sku:(l.sku||"").toString().trim(),
        desc:(l.nombre||"").toString().trim(),
        cantidad:parseNum(l.cantidad),
        costo:parseNum(l.precio),
        msrp:parseNum(l.msrp)||0,
        ext:parseNum(l.cantidad)*parseNum(l.precio),
        raw:"leído con IA"+(j.model?(" · "+j.model):"")
      })).filter(it=>it.desc),
      mode:"ia"
    };
    pdfLines=["(documento leído con IA — sin volcado de texto crudo)"];
    showImportEditor(file.name, parsed);
  }catch(e){
    console.error(e);
    out.innerHTML=`<div class="banner warn">Falló la lectura con IA (${esc(e.message||"error")}). Probá con la detección local o cargá a mano.</div>`;
  }
}
/* Normaliza fecha devuelta por la IA a YYYY-MM-DD si viene en otro formato reconocible */
function normFechaIA(f){
  if(!f) return "";
  f=String(f).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(f)) return f;
  const m=f.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){ let[,d,mo,y]=m; if(y.length===2)y="20"+y; return `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`; }
  return f;
}

async function handlePdf(file){
  const out=document.getElementById("importOut");
  if(!window.pdfjsLib){ out.innerHTML=`<div class="banner warn">No se pudo cargar el lector de PDF (pdf.js). Revisá tu conexión y reintentá, o cargá la compra a mano.</div>`; return; }
  out.innerHTML=`<p style="color:var(--muted);padding:14px 0">Leyendo ${esc(file.name)}…</p>`;
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let lines=[];
    for(let pn=1; pn<=pdf.numPages; pn++){
      const page=await pdf.getPage(pn);
      const tc=await page.getTextContent();
      lines = lines.concat(reconstructLines(tc.items));
    }
    pdfLines = lines.filter(l=>l.trim().length);
    const parsed = parseInvoice(pdfLines);
    showImportEditor(file.name, parsed);
  }catch(e){
    console.error(e);
    out.innerHTML=`<div class="banner warn">No pude leer ese PDF (${esc(e.message||"error")}). Puede estar escaneado como imagen. Cargá la compra a mano.</div>`;
  }
}

/* Reconstruir líneas por coordenada Y */
function reconstructLines(items){
  const rows=new Map();
  for(const it of items){
    if(!it.str || !it.str.trim()) continue;
    const y=Math.round(it.transform[5]);
    let bucket=null;
    for(const k of rows.keys()){ if(Math.abs(k-y)<=3){ bucket=k; break; } }
    const key = bucket===null ? y : bucket;
    if(!rows.has(key)) rows.set(key,[]);
    rows.get(key).push({x:it.transform[4], s:it.str});
  }
  return [...rows.entries()]
    .sort((a,b)=> b[0]-a[0])
    .map(([,arr])=> arr.sort((a,b)=>a.x-b.x).map(o=>o.s).join(" ").replace(/\s+/g," ").trim());
}

/* ---------- Parser de factura ----------
   1) Intento estructurado: renglones "SKU: descripción ... QTY UOM MSRP NET EXT"
      (formato tipo Coqui Hobby). Costo = NET PRICE, precio venta sugerido = MSRP.
   2) Si no encuentra nada, cae a la heurística genérica línea por línea.        */
function parseInvoice(lines){
  const blob = lines.join("\n");
  const meta = extractMeta(lines, blob);
  let items = parseStructured(blob);
  let mode = "estructurado";
  if(!items.length){
    items = lines.map(parseCandidate).filter(Boolean).map(c=>({
      sku:"", desc:c.desc, cantidad:c.cantidad, costo:c.costo, msrp:0, ext:c.cantidad*c.costo, raw:c.raw
    }));
    mode = "heuristico";
  }
  // detectar flete/handling para avisar (no se agrega como stock)
  const fre = blob.match(/(freight[^\n]*?|flete[^\n]*?)\s([\d.,]+)\s*$/im) || blob.match(/freight[^\d]*([\d.,]+)/i);
  meta.flete = fre ? parseNum(fre[fre.length-1]) : 0;
  return { meta, items, mode };
}

/* SKU: desc ... QTY UOM MSRP NET EXT  (UOM = EACH/EA/CASE/BOX/PACK/UNIT/PCS) */
function parseStructured(blob){
  const re = /(?=[A-Z0-9\-]*\d)([A-Z0-9][A-Z0-9\-]{3,}):\s*([\s\S]+?)\s+(\d+(?:[.,]\d+)?)\s+(EACH|EA|CASE|BOX|PACK|UNIT|PCS?|UN)\s+([\d.,]+)\s+([\d.,]+)\s+([\d.,]+)(?=\s|$)/gi;
  const out=[]; let m;
  while((m=re.exec(blob))){
    const sku = m[1].trim();
    const desc = m[2].replace(/\s+/g," ").trim();
    const cantidad = parseNum(m[3]);
    const msrp = parseNum(m[5]);   // precio sugerido
    const net  = parseNum(m[6]);   // costo real (lo que pagás)
    const ext  = parseNum(m[7]);   // total línea
    if(cantidad<=0) continue;
    out.push({ sku, desc, cantidad, costo:net, msrp, ext, raw:(sku+": "+desc+" | "+m[3]+" "+m[4]+" "+m[5]+" "+m[6]+" "+m[7]) });
  }
  return out;
}

/* Metadata: N° de comprobante, fecha, proveedor */
function extractMeta(lines, blob){
  const meta = { numero:"", fecha:"", proveedor:"", flete:0 };
  const ref = blob.match(/Reference\s*No\.?:?\s*([A-Z0-9\-]+)/i)
           || blob.match(/(?:Invoice|Factura|Comprobante)\s*(?:No\.?|#|N[°º])?:?\s*([A-Z0-9\-]{3,})/i);
  if(ref) meta.numero = ref[1].trim();
  const date = blob.match(/\bDate:?\s*([0-3]?\d[-\/][A-Za-z]{3,}[-\/]\d{2,4})/i)
            || blob.match(/\bFecha:?\s*([0-3]?\d[-\/][0-1]?\d[-\/]\d{2,4})/i);
  if(date) meta.fecha = normDate(date[1]);
  const skip = /^(invoice|factura|reference|date|fecha|customer|currency|salesperson|bill to|ship to|terms|contact|due date|no\.|item)\b/i;
  for(const l of lines){
    const t=l.trim();
    if(t.length>2 && /[A-Za-z]/.test(t) && !skip.test(t)){ meta.proveedor=t.replace(/\s+/g," "); break; }
  }
  return meta;
}
function normDate(s){
  let m=s.match(/(\d{1,2})[-\/]([A-Za-z]{3,})[-\/](\d{2,4})/);
  const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,
                ene:1,abr:4,ago:8,dic:12};
  if(m){
    const mo=months[m[2].slice(0,3).toLowerCase()]; if(!mo) return "";
    const yr=m[3].length===2?"20"+m[3]:m[3];
    return `${yr}-${String(mo).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`;
  }
  m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
  if(m){ const yr=m[3].length===2?"20"+m[3]:m[3]; return `${yr}-${String(+m[2]).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`; }
  return "";
}

/* Heurística: intentar detectar cantidad / costo en una línea */
function parseCandidate(line){
  const nums=[...line.matchAll(/-?\d{1,3}(?:[.,]\d{3})*(?:[.,]\d+)?|-?\d+(?:[.,]\d+)?/g)].map(m=>m[0]);
  if(nums.length<2) return null;                 // necesita al menos cantidad y un importe
  if(line.length<4) return null;
  // descartar líneas que son claramente totales/cabeceras
  if(/^(total|subtotal|iva|neto|importe total|cuit|factura|fecha|p[aá]gina)\b/i.test(line.trim())) return null;
  const desc = line.replace(/-?\d[\d.,]*/g,"").replace(/\s+/g," ").trim();
  if(desc.length<2) return null;
  const parsed = nums.map(parseNum);
  // heurística: cantidad = primer número "chico" entero; costo unit = número intermedio; total = último
  let cantidad = parsed.find(n=> n>0 && n<10000 && Number.isInteger(n)) ?? parsed[0];
  let costo = parsed.length>=2 ? parsed[parsed.length-2] : parsed[0];
  if(cantidad>0 && costo===0 && parsed.length){ costo=parsed[parsed.length-1]; }
  return { desc, cantidad: cantidad||1, costo: costo||0, raw:line };
}

  out.innerHTML=`
    <div class="banner ok">
      Detecté <b>${items.length}</b> renglón(es) en <b>${esc(fname)}</b> ${mode==="estructurado"?"(formato reconocido)":mode==="ia"?"(leído con IA — revisá igual)":"(detección genérica — revisá bien)"}.
      ${metaBits?`<br><span style="font-weight:400">${metaBits}</span>`:""}
    </div>
    ${meta.flete? `<div class="banner">Detected a <b>freight/handling</b> charge of ${money(meta.flete)}. It's loaded in the purchase and will be <b>spread across all units</b> when you confirm (not added as stock).</div>`:""}
    <p style="font-size:12px;color:var(--muted);margin:0 0 8px">
      <b>Costo</b> = lo que pagás (NET) e impacta el último costo. <b>P. venta</b> = sugerido (MSRP) para productos nuevos.
    </p>
    <div class="table-scroll"><table class="line-tbl">
      <thead><tr><th class="c">✓</th><th class="c">SKU</th><th>Descripción</th><th class="r">Cant.</th><th class="r">Costo</th><th class="r">P. venta</th><th>Producto destino</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <details><summary>Ver texto crudo del PDF</summary><div class="rawbox">${esc(pdfLines.join("\n"))}</div></details>
    <div style="display:flex;justify-content:flex-end;margin-top:16px">

  };
}

/* ============================================================
   FICHA DE PRODUCTO: kardex individual + evolución
   ============================================================ */
function openFicha(id){
  const p = prodById(id); if(!p) return;
  const movs = db.movimientos.filter(m=>m.productoId===id)
                 .sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));

  let bal=0; const serie=[0];
  const rows = movs.map(m=>{
    const isAdj = m.tipo==="ajuste";
    const signed = (m.delta!=null) ? m.delta : (m.tipo==="entrada"? m.cantidad : -m.cantidad);
    const up = signed>=0;
    bal += signed;
    serie.push(bal);
    const d=new Date(m.fecha);
    const fecha = d.toLocaleDateString("es-AR") + " " + d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",hour12:false});
    const origen = (m.refTipo==="compra"||m.refTipo==="venta") && m.refId
      ? `<button class="btn ghost sm" data-fdoc="${m.refTipo}:${m.refId}">${esc(m.ref||"ver factura")}</button>`
      : `<span style="color:var(--muted)">${esc(m.ref||"—")}</span>`;
    const pill = isAdj ? `<span class="pill adj">⇄ adjust</span>` : `<span class="pill ${up?'in':'out'}">${up?'↑ in':'↓ out'}</span>`;
    return `<tr>
      <td class="num">${fecha}</td>
      <td>${pill}${m.store?` <span class="pill" style="opacity:.7">${esc(storeName(m.store))}</span>`:""}</td>
      <td class="r delta ${isAdj?'flat':(up?'up':'down')}">${up?'+':'−'}${qty(Math.abs(signed))}</td>
      <td class="r num">${money(m.valorUnit)}</td>
      <td class="r num" style="font-weight:600">${qty(bal)}</td>
      <td>${origen}</td>
    </tr>`;
  }).reverse().join("");

  const totComp = movs.filter(m=>m.refTipo==="compra").reduce((a,m)=>a+m.cantidad,0);
  const totVend = movs.filter(m=>m.refTipo==="venta").reduce((a,m)=>a+m.cantidad,0);
  const margen = (p.precioVenta||0)-(p.ultimoCosto||0);
  const margenPct = p.precioVenta>0 ? (margen/p.precioVenta*100) : 0;
  const totalStock = stockTotalP(p);
  const perStore = STORE_IDS.map(s=>`${storeName(s)}: <b>${qty(stockDe(p,s))}</b>`).join(" · ");
  const badge = esInversion(p)?' <span class="pill inv">investment</span>':(esBloqueado(p)?' <span class="pill blocked">blocked</span>':'');

  const body = `
    <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">
      <div class="kpi"><div class="lbl">Total stock</div><div class="val" style="color:${totalStock<0?'var(--alert)':'inherit'}">${qty(totalStock)}</div><div class="sub">${esc(perStore)}</div></div>
      <div class="kpi"><div class="lbl">Last cost</div><div class="val">${money(p.ultimoCosto)}</div><div class="sub">FIFO valued ${money(valorFifoTotal(p))}</div></div>
      <div class="kpi"><div class="lbl">Sale price</div><div class="val">${moneyOpt(p.precioVenta)}</div><div class="sub">${p.precioVenta>0?`margin ${nf0.format(margenPct)}%`:'no price'}${badge}</div></div>
      <div class="kpi"><div class="lbl">Bought / Sold</div><div class="val" style="font-size:20px"><span class="delta up">${qty(totComp)}</span> / <span class="delta down">${qty(totVend)}</span></div><div class="sub">lifetime</div></div>
    </div>

    ${serie.length>2 ? `<div class="panel" style="box-shadow:none;margin-bottom:16px">
      <div class="phead"><h3>Stock evolution</h3><span class="hint">${movs.length} movements</span></div>
      <div style="padding:12px 14px 6px">${sparkline(serie)}</div>
    </div>` : ""}

    <div class="panel" style="box-shadow:none">
      <div class="phead"><h3>Product kardex</h3><span class="hint">every in and out with its invoice</span></div>
      ${movs.length ? `<div class="table-scroll"><table>
        <thead><tr><th>Date</th><th>Movement</th><th class="r">Qty</th><th class="r">Unit value</th><th class="r">Balance</th><th>Source</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`
        : `<div class="empty"><p>This product has no movements yet.</p></div>`}
    </div>`;

  buildModal(`${p.sku?("["+esc(p.sku)+"] "):""}${esc(p.nombre)}`, body, [
    {label:"⇄ Adjust stock",cls:"btn",act:()=>{ closeModal(); openAjuste(id); }},
    {label:"Edit product",cls:"btn",act:()=>{ closeModal(); openProd(id); }},
    {label:"Close",cls:"btn primary",act:closeModal}
  ], true);

  document.querySelectorAll("[data-fdoc]").forEach(b=> b.onclick=()=>{
    const [t,i]=b.dataset.fdoc.split(":"); verDoc(t,i);
  });
}
function valorFifoTotal(p){ return STORE_IDS.reduce((a,s)=> a + fifoLayers(p,s).reduce((x,L)=>x+L.cantidad*L.costoUnit,0), 0); }

/* Mini-gráfico de evolución (SVG, sin librerías) */
function sparkline(vals){
  if(vals.length<2) return "";
  const w=620,h=76,pad=8;
  const max=Math.max(...vals), min=Math.min(...vals,0);
  const range=(max-min)||1;
  const step=(w-2*pad)/(vals.length-1);
  const pts = vals.map((v,i)=>{
    const x=pad+i*step;
    const y=h-pad-((v-min)/range)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const area = `${pad},${h-pad} ${pts.join(" ")} ${(pad+(vals.length-1)*step).toFixed(1)},${h-pad}`;
  const zeroY = h-pad-((0-min)/range)*(h-2*pad);
  const last = vals[vals.length-1];
  const lastX = pad+(vals.length-1)*step;
  const lastY = h-pad-((last-min)/range)*(h-2*pad);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
    <polygon points="${area}" fill="var(--up-bg)"/>
    <line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${w-pad}" y2="${zeroY.toFixed(1)}" stroke="var(--line-strong)" stroke-dasharray="3 3"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" fill="var(--accent)"/>
  </svg>`;
}

/* ============================================================
   Datos: export / import / reset
   ============================================================ */
function exportJSON(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`mayor-stock-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Backup exportado");
}
function importJSON(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json";
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        if(!data.productos) throw new Error("estructura inválida");
        if(!confirm("Esto reemplaza todos los datos actuales. ¿Seguir?")) return;
        db=migrate(Object.assign({config:{moneda:"$"},productos:[],compras:[],ventas:[],movimientos:[],clientes:[]}, data));
        save(); toast("Datos importados"); render();
      }catch(e){ toast("Invalid JSON","warn"); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function resetAll(){
  if(!confirm("Se borra TODO (productos, compras, ventas y movimientos). ¿Seguro?")) return;
  db=migrate({ config:db.config, productos:[], compras:[], ventas:[], movimientos:[], clientes:[] });
  save(); toast("Todo borrado","warn"); render();
}

/* ============================================================
   Modal genérico
   ============================================================ */
function buildModal(title, bodyHTML, buttons=[], wide=false, extraFoot=""){
  const root=document.getElementById("modalRoot");
  root.innerHTML=`
    <div class="scrim" id="scrim">
      <div class="modal ${wide?'wide':''}">
        <div class="mhead"><h3>${esc(title)}</h3><button class="x" id="xClose">×</button></div>
        <div class="mbody">${bodyHTML}</div>
        ${extraFoot?`<div class="mextra" style="padding:0 22px">${extraFoot}</div>`:""}
        <div class="mfoot" id="mfoot"></div>
      </div>
    </div>`;
  const foot=document.getElementById("mfoot");
  // separar botón de eliminar (izquierda) del resto (derecha)
  const left=buttons.filter(b=>b.cls.includes("danger"));
  const right=buttons.filter(b=>!b.cls.includes("danger"));
  const wrapL=document.createElement("div"); wrapL.style.display="flex"; wrapL.style.gap="8px";
  const wrapR=document.createElement("div"); wrapR.style.display="flex"; wrapR.style.gap="8px"; wrapR.style.marginLeft="auto";
  left.forEach(b=> wrapL.appendChild(mkBtn(b)));
  right.forEach(b=> wrapR.appendChild(mkBtn(b)));
  foot.appendChild(wrapL); foot.appendChild(wrapR);
  document.getElementById("xClose").onclick=closeModal;
  document.getElementById("scrim").addEventListener("mousedown",e=>{ if(e.target.id==="scrim") closeModal(); });
  document.addEventListener("keydown", escClose);
  return root;
}
function mkBtn(b){
  const el=document.createElement("button"); el.className=b.cls; el.textContent=b.label; el.onclick=b.act; return el;
}
function escClose(e){ if(e.key==="Escape") closeModal(); }
function closeModal(){
  if(typeof closeProductPicker==="function") closeProductPicker();
  document.getElementById("modalRoot").innerHTML="";
  document.removeEventListener("keydown", escClose);
}

/* ---------- Arranque ---------- */
// Cableado del login (elementos estáticos)
document.getElementById("loginBtn").onclick = doLogin;
document.getElementById("loginUser").addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("loginPass").focus(); });
document.getElementById("loginPass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
// Ojito: mostrar / ocultar contraseña
const _pt=document.getElementById("loginPassToggle");
if(_pt) _pt.onclick=()=>{
  const p=document.getElementById("loginPass"); if(!p) return;
  const mostrar = p.type==="password";
  p.type = mostrar ? "text" : "password";
  _pt.classList.toggle("show", mostrar);
  const lbl = mostrar ? "Ocultar contraseña" : "Mostrar contraseña";
  _pt.setAttribute("aria-label", lbl); _pt.title=lbl;
  p.focus();
};
// Botones estáticos del sidebar (tema / cerrar sesión / sincronizar)
const _slo=document.querySelector("[data-logout-side]"); if(_slo) _slo.onclick=logout;
const _ssy=document.querySelector("[data-syncside]"); if(_ssy) _ssy.onclick=()=> pullNow();
document.querySelectorAll("[data-theme-toggle]").forEach(b=> b.onclick=toggleTheme);
// Topbar glass: al scrollear aparece el fondo tenue + hairline inferior
const _tb=document.getElementById("topbar");
if(_tb){ const onScroll=()=>_tb.classList.toggle("scrolled", (window.scrollY||document.documentElement.scrollTop)>4);
  window.addEventListener("scroll", onScroll, {passive:true}); onScroll(); }

/* ---------- Tema claro / oscuro ---------- */
const MOON_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const SUN_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function currentTheme(){ return document.documentElement.getAttribute("data-theme")==="dark" ? "dark" : "light"; }
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem("gstock_theme", t); }catch(e){}
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", t==="dark" ? "#0f141b" : "#1b2430");
  paintThemeBtn();
}
function toggleTheme(){ applyTheme(currentTheme()==="dark" ? "light" : "dark"); }
function paintThemeBtn(){
  const dark = currentTheme()==="dark";
  document.querySelectorAll("[data-themeicon]").forEach(el=>{
    el.innerHTML = dark ? MOON_SVG : SUN_SVG;         // ícono = modo actual; la posición indica el estado
  });
  document.querySelectorAll("[data-theme-toggle]").forEach(b=>{
    const t = dark ? "Cambiar a tema claro" : "Cambiar a tema oscuro";
    b.title = t; b.setAttribute("aria-label", t);
  });
}
paintThemeBtn();

if(session){
  // seller is locked to their store; admin defaults to consolidated
  activeStore = (session.role==="seller" && isStore(session.store)) ? session.store : "all";
  if(view==="inv" && !isAdmin()) view="dash";
  hideLogin();
  render();
  paintSync();
  pullNow();
} else {
  render();          // deja el DOM de la app armado por debajo
  showLogin();
}

/* Re-sincronizar al volver la conexión o el foco */
window.addEventListener("online", ()=>{ if(session){ syncMeta.dirty ? pushNow() : pullNow(); } });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && session) pullNow(); });

/* ---------- Service worker (PWA offline) ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW no registrado:", err));
  });
}

</script>
