function nuevoProductoBase(sku, nombre, precioVenta){
  const p = { id:uid(), sku:(sku||"").trim(), unidad:"u", nombre:(nombre||"").trim(),
        stock:0, costoNeto:0, costoHandling:0, costoFlete:0, ultimoCosto:0,
        precioVenta: precioVenta||0, puntoRepedido:0,
        categoria:"Otros", nivel:"unidad", packsPorBox:PACKS_POR_BOX_DEF, boxesPorCase:boxesCaseDefault("Otros"),
        estado:PRODUCT_STATES.SALE, idioma:"",
        stockPorTienda:{}, lotes:{}, precioVentaPorTienda:{} };
  STORE_IDS.forEach(s=>{ p.stockPorTienda[s]=0; p.lotes[s]=[]; p.precioVentaPorTienda[s]=precioVenta||0; });
  return p;
}
function confirmDoc(){
  const isC = draft.tipo==="compra";
  // Punto 3: sólo el admin carga compras.
  if(isC && !puedeComprar()){ toast("Only admins can load purchases","warn"); return; }
  const store = draft.store || STORE_IDS[0];   // sólo relevante para COMPRA (sociedad que compra)
  // Sale: require a customer before generating the invoice
  if(!isC && !clienteById(draft.clienteId)){
    toast("Pick (or create) a customer before generating the sale","warn"); return;
  }
  // Resolve lines
  const resolved = [];
  for(const l of draft.lineas){
    if(!l.cantidad || l.cantidad<=0) continue;
    let p=null;
    if(l.crear){
      // Punto 5: si el SKU YA existe, lo adoptamos automáticamente en vez de crear
      // un duplicado (esto evitaba el error "already belongs" y los productos
      // fantasma en cero del punto 7).
      const dup = skuEnUso(l.sku, null);
      if(dup){
        p = dup;
      } else {
        if(!l.nombre.trim()){ toast("A new product is missing its name","warn"); return; }
        p = nuevoProductoBase(l.sku, l.nombre, isC?(l.precioVentaSugerido||0):l.precio);
        db.productos.push(p);
      }
    } else {
      p = prodById(l.productoId);
      if(!p){ toast("A line has no product assigned","warn"); return; }
    }
    // --- SPECIAL STATE GUARDS on sale (point 5) ---
    if(!isC){
      if(soloEnVault(p)){ toast(`"${p.nombre}" is in the investment vault and can't be sold`,"warn"); return; }
      if(esBloqueado(p)){ toast(`"${p.nombre}" is blocked (best-offer). It needs admin approval before selling`,"warn"); return; }
    }
    const costoSnap = isC ? l.precio : fifoCostoPeekGlobal(p, l.cantidad).unit;   // FIFO unit cost across the unified pool
    resolved.push({ prod:p, cantidad:l.cantidad, precio:l.precio, costo:costoSnap });
  }
  if(!resolved.length){ toast("Add at least one valid line","warn"); return; }

  // PUNTO 1 — prorrateo de costos adicionales (compra), POR UNIDAD:
  // cada unidad del documento carga (handling+flete)/unidades_totales.
  let handPU=0, fletePU=0;
  if(isC){
    const uds = resolved.reduce((a,r)=>a+r.cantidad,0);
    handPU  = uds>0 ? (draft.handling||0)/uds : 0;
    fletePU = uds>0 ? (draft.flete||0)/uds : 0;
  }

  // Si estamos editando, calculamos (sin mutar) el efecto de revertir el documento original
  const editing = !!draft.editingId;
  let oldDoc=null; const revertMap={};
  if(editing){
    const list0 = isC?db.compras:db.ventas;
    oldDoc = list0.find(x=>x.id===draft.editingId) || null;
    if(oldDoc){
      oldDoc.lineas.forEach(l=>{
        const d = isC ? -l.cantidad : +l.cantidad;   // deshacer el efecto original
        revertMap[l.productoId] = (revertMap[l.productoId]||0) + d;
      });
    }
  }

  // Validación de venta contra el POOL UNIFICADO (suma de todas las sociedades).
  // Nunca stock negativo. Si estoy editando, el stock del doc original "vuelve" al
  // pool (revertMap) y se puede revalidar contra ese total.
  if(!isC){
    const pedido={};
    resolved.forEach(r=>{ pedido[r.prod.id]=(pedido[r.prod.id]||0)+r.cantidad; });
    const faltantes=[];
    Object.keys(pedido).forEach(id=>{
      const p=prodById(id);
      const eff = stockVendibleTotal(p) + (editing ? (revertMap[id]||0) : 0);
      if(pedido[id]>eff) faltantes.push(`• ${p.nombre}: available ${qty(eff)}, you asked ${qty(pedido[id])}`);
    });
    if(faltantes.length){
      toast("Not enough stock","warn");
      alert("Can't sell more than the total stock on hand:\n\n"+faltantes.join("\n")+"\n\nAdjust the quantities. Stock can't go negative.");
      return;
    }
  }

  const subtotalLineas = totalLineas(resolved);
  const cli = isC ? null : clienteById(draft.clienteId);
  const envioMonto = (!isC && draft.envio && draft.envio.tipo==="monto") ? (draft.envio.monto||0) : 0;
  const totalDoc = isC ? round2(subtotalLineas + (draft.handling||0) + (draft.flete||0))
                       : round2(subtotalLineas + envioMonto);
  const doc = {
    id: editing ? draft.editingId : uid(), tipo:draft.tipo, contraparte:draft.contraparte.trim(),
    fecha:normISO(draft.fecha) || new Date().toISOString().slice(0,10), numero:draft.numero.trim(),
    lineas: resolved.map(r=>{
      const base = { productoId:r.prod.id, sku:r.prod.sku, nombre:r.prod.nombre, cantidad:r.cantidad, precio:r.precio, costo:r.costo };
      if(isC){
        base.neto = r.precio; base.handling = round2(handPU); base.flete = round2(fletePU);
        base.costoTotal = round2(r.precio + handPU + fletePU);   // landed unit cost
      }
      return base;
    }),
    subtotal: subtotalLineas,
    total: totalDoc
  };
  if(isC){
    doc.store = store;   // sociedad que compra (procedencia del lote)
    doc.handling = draft.handling||0; doc.flete = draft.flete||0;
    // preservar el estado de envío al editar; una compra nueva arranca "in transit"
    doc.status = (editing && oldDoc && oldDoc.status) ? oldDoc.status : INVOICE_STATUS.IN_TRANSIT;
  }
  else {
    doc.clienteId = draft.clienteId;
    doc.cliente = cli ? { nombre:cli.nombre, contacto:cli.contacto, empresa:cli.empresa, telefono:cli.telefono, email:cli.email, direccion:cli.direccion, ciudad:cli.ciudad, estado:cli.estado, zip:cli.zip, pais:cli.pais||"" } : null;  // snapshot for the invoice + country slicer
    doc.envio = { tipo:draft.envio.tipo, monto:envioMonto };
    doc.contraparte = cli ? clienteLinea(cli) : draft.contraparte.trim();
    // congelar la tasa de comisión vigente (o mantener la de la venta si se edita)
    doc.commissionRate = (editing && oldDoc && oldDoc.commissionRate!=null) ? oldDoc.commissionRate : (db.config.commissionRate||0);
    // Vendedor: un seller queda fijado a sí mismo; el admin usa el que eligió (o ninguno).
    // El nombre se snapshotea para que sobreviva aunque después se renombre/borre el vendedor.
    let vid = isSeller() ? (currentVendedorId()||"") : (draft.vendedorId||"");
    doc.vendedorId = vid || null;
    doc.vendedor   = vid ? vendedorNombre(vid) : (isSeller() ? ((session&&session.name)||null) : null);
    if(!doc.vendedorId && isSeller() && session && session.name) doc.vendedor = session.name;
  }
  const refTxt = (isC?"Purchase":"Sale") + (doc.numero?(" "+doc.numero):"") + (doc.contraparte?(" · "+doc.contraparte):"");

  // Recién ahora mutamos: primero revertimos el documento original (si estábamos editando)
  if(oldDoc) revertDoc(oldDoc);

  resolved.forEach((r, idx)=>{
    if(isC){
      // La compra sólo impacta stock/FIFO si queda RECEIVED. Si nace/queda
      // "in transit", el documento se guarda pero el inventario no se mueve:
      // la mercadería recién entra cuando se marca recibida.
      if(doc.status===INVOICE_STATUS.RECEIVED){
        const landed = round2(r.precio + handPU + fletePU);
        fifoEntrada(r.prod, store, r.cantidad, landed, refTxt, doc.id);  // FIFO purchase layer
        moverStock(r.prod, +r.cantidad, landed, "compra", doc.id, refTxt, { store });
        r.prod.costoNeto = r.precio; r.prod.costoHandling = round2(handPU); r.prod.costoFlete = round2(fletePU);
        r.prod.ultimoCosto = landed;        // last landed cost (reference only; COGS is FIFO)
      }
    } else {
      // Venta desde el POOL UNIFICADO: consumo FIFO global por fecha, cruzando sociedades.
      const res = fifoConsumirGlobal(r.prod, r.cantidad);
      doc.lineas[idx].costo = res.unit;                              // costo FIFO unitario (mezcla real)
      doc.lineas[idx].cogs = res.cogs;                               // COGS total
      doc.lineas[idx].consumed = res.consumed;                       // desglose por sociedad -> revert exacto
      // Kardex: una línea por sociedad tocada, con su costo, para que el saldo por
      // sociedad (procedencia) quede coherente. moverStock es quien decrementa el stock.
      Object.keys(res.porSociedad).forEach(soc=>{
        const t = res.porSociedad[soc];
        const unit = t.cantidad>0 ? round2(t.cogs/t.cantidad) : res.unit;
        moverStock(r.prod, -t.cantidad, unit, "venta", doc.id, refTxt, { store:soc });
      });
      r.prod.precioVenta = r.precio;                                 // último precio de venta (mirror)
    }
  });

  (isC?db.compras:db.ventas).push(doc);
  draft.editingId=null;
  save(); closeModal();
  const uds=qty(doc.lineas.reduce((a,l)=>a+l.cantidad,0));
  const compraMsg = doc.status===INVOICE_STATUS.IN_TRANSIT ? `Purchase saved · ${uds} u in transit` : `Purchase saved · +${uds} u`;
  toast(editing ? `Document updated`
       : (isC?compraMsg : `Sale recorded · −${uds} u`), isC?"up":"down");
  render();
}

/* ---- Revertir / borrar / editar documentos ---- */
function recomputeUltimoCosto(prod){
  // último costo (landed) = de la compra más reciente que todavía contenga este producto.
  // Usamos el desglose guardado (neto+handling+flete). Compras viejas sin desglose caen a l.precio.
  for(let i=db.compras.length-1;i>=0;i--){
    const l = db.compras[i].lineas.find(x=>x.productoId===prod.id);
    if(l){
      prod.costoNeto = (l.neto!=null) ? l.neto : l.precio;
      prod.costoHandling = l.handling||0;
      prod.costoFlete = l.flete||0;
      prod.ultimoCosto = (l.costoTotal!=null) ? l.costoTotal : l.precio;
      return;
    }
  }
  // si no queda ninguna compra con ese producto, dejamos el último costo como está
}
/* Aplica el efecto de una compra sobre el inventario (capas FIFO + stock del
   local + último costo). Se llama al recibir la mercadería. Idempotencia: sólo
   debe invocarse cuando la compra pasa a "received", nunca dos veces. */
function receiveInvoice(doc){
  const store = doc.store || STORE_IDS[0];
  const refTxt = "Purchase" + (doc.numero?(" "+doc.numero):"") + (doc.contraparte?(" · "+doc.contraparte):"");
  doc.lineas.forEach(l=>{
    const p = prodById(l.productoId); if(!p) return;
    const landed = (l.costoTotal!=null) ? l.costoTotal : round2((l.neto!=null?l.neto:l.precio||0) + (l.handling||0) + (l.flete||0));
    fifoEntrada(p, store, l.cantidad, landed, refTxt, doc.id);
    moverStock(p, +l.cantidad, landed, "compra", doc.id, refTxt, { store });
    if(l.neto!=null){ p.costoNeto=l.neto; p.costoHandling=l.handling||0; p.costoFlete=l.flete||0; }
    p.ultimoCosto = landed;
  });
}
/* Revierte el efecto de stock de una compra recibida SIN borrar el documento
   (des-recibir). Misma mecánica que revertDoc, pero deja la compra viva para
   volver a marcarla "in transit". */
function unreceiveInvoice(doc){
  const store = doc.store || STORE_IDS[0];
  doc.lineas.forEach(l=>{
    const p = prodById(l.productoId); if(!p) return;
    fifoQuitarCompra(p, store, doc.id);
    p.stockPorTienda[store] = round4(stockDe(p,store) - l.cantidad);
    recalcStockMirror(p);
  });
  db.movimientos = db.movimientos.filter(m=> m.refId!==doc.id);
  [...new Set(doc.lineas.map(l=>l.productoId))].forEach(id=>{ const p=prodById(id); if(p) recomputeUltimoCosto(p); });
}
function revertDoc(doc){
  const isC = doc.tipo==="compra";
  const store = doc.store || STORE_IDS[0];
  const fallbackSoc = doc.storeVenta || doc.store || STORE_IDS[0];   // ventas viejas: sociedad única original
  // Una compra en tránsito nunca impactó stock/FIFO: al borrarla sólo se quita el
  // documento, sin revertir inventario (no hay nada que revertir).
  const compraSinImpacto = isC && doc.status===INVOICE_STATUS.IN_TRANSIT;
  if(!compraSinImpacto){
    doc.lineas.forEach(l=>{
      const p = prodById(l.productoId); if(!p) return;
      if(isC){
        fifoQuitarCompra(p, store, doc.id);                 // drop the FIFO layer this purchase created
        p.stockPorTienda[store] = round4((stockDe(p,store)) - l.cantidad);
        recalcStockMirror(p);
      } else {
        // Devolución al POOL: repone cada tramo en la capa de SU sociedad y reajusta
        // el stock por sociedad. Ventas viejas (consumed sin etiqueta) caen a fallbackSoc.
        if(l.consumed && l.consumed.length){
          const repuesto = fifoDevolverGlobal(p, l.consumed, fallbackSoc);
          Object.keys(repuesto).forEach(soc=>{ p.stockPorTienda[soc] = round4((stockDe(p,soc)) + repuesto[soc]); });
        } else {
          // Venta muy vieja sin desglose: reponer todo en la sociedad de fallback al costo de la línea.
          fifoLayers(p, fallbackSoc).unshift({ id:uid(), fecha:new Date().toISOString(), cantidad:l.cantidad, costoUnit:(l.costo||p.ultimoCosto||0), ref:"revert" });
          p.stockPorTienda[fallbackSoc] = round4((stockDe(p,fallbackSoc)) + l.cantidad);
        }
        recalcStockMirror(p);
      }
    });
  }
  db.movimientos = db.movimientos.filter(m=> m.refId!==doc.id);
  const list = isC?db.compras:db.ventas;
  const i = list.findIndex(x=>x.id===doc.id); if(i>=0) list.splice(i,1);
  if(isC && !compraSinImpacto){
    [...new Set(doc.lineas.map(l=>l.productoId))].forEach(id=>{ const p=prodById(id); if(p) recomputeUltimoCosto(p); });
  }
}
function deleteDoc(tipo,id){
  const list = tipo==="compra"?db.compras:db.ventas;
  const d=list.find(x=>x.id===id); if(!d) return;
  const items=d.lineas.reduce((a,l)=>a+l.cantidad,0);
  const msg = tipo==="compra"
    ? `Delete this purchase?\n\n${qty(items)} u are REMOVED from ${storeName(d.store)} stock and its FIFO layer is dropped.`
    : `Delete this sale?\n\n${qty(items)} u are RETURNED to stock (back into their FIFO layers).`;
  if(!confirm(msg)) return;
  revertDoc(d); save();
  if(document.getElementById("scrim")) closeModal();
  toast("Document deleted","warn"); render();
}
function editDoc(tipo,id){
  const list = tipo==="compra"?db.compras:db.ventas;
  const d=list.find(x=>x.id===id); if(!d) return;
  draft = {
    tipo, editingId:id, store:d.store||STORE_IDS[0], storeOrig:d.store||STORE_IDS[0],
    vendedorId: (tipo==="venta") ? (d.vendedorId||"") : "",
    contraparte:d.contraparte||"", fecha:normISO(d.fecha), numero:d.numero||"",
    clienteId:d.clienteId||"", envio: d.envio ? {tipo:d.envio.tipo, monto:d.envio.monto||0} : {tipo:"free",monto:0},
    handling:d.handling||0, flete:d.flete||0,
    lineas: d.lineas.map(l=>({ key:uid(), productoId:l.productoId, sku:l.sku, nombre:l.nombre, cantidad:l.cantidad, precio:l.precio,
      costoRef: prodById(l.productoId) ? (prodById(l.productoId).ultimoCosto||0) : (l.costo||0),
      margen: (l.costo>0)? round2((l.precio/l.costo-1)*100) : 0, precioVentaSugerido:0, crear:false }))
  };
  renderDocModal();
}
/* Copy a sale as a NEW document. Re-validates against the CURRENT unified pool. */
function copyDoc(tipo,id){
  const list = tipo==="compra"?db.compras:db.ventas;
  const d=list.find(x=>x.id===id); if(!d) return;
  if(document.getElementById("scrim")) closeModal();
  const store = d.store||STORE_IDS[0];
  draft = {
    tipo, editingId:null, store,
    vendedorId: (tipo==="venta") ? (isSeller() ? (currentVendedorId()||"") : (d.vendedorId||"")) : "",
    contraparte: tipo==="compra"?(d.contraparte||""):"",
    fecha:new Date().toISOString().slice(0,10),
    numero: tipo==="venta" ? nextFacturaVenta() : "",
    clienteId: tipo==="venta"?(d.clienteId||""):"",
    envio: (tipo==="venta" && d.envio) ? {tipo:d.envio.tipo, monto:d.envio.monto||0} : {tipo:"free",monto:0},
    handling:0, flete:0,
    lineas: d.lineas.map(l=>{
      const p=prodById(l.productoId);
      return { key:uid(), productoId:l.productoId, sku:l.sku, nombre:l.nombre, cantidad:l.cantidad, precio:l.precio,
        costoRef: p?(p.ultimoCosto||0):(l.costo||0), margen:(l.costo>0)?round2((l.precio/l.costo-1)*100):0, precioVentaSugerido:0, crear:false };
    })
  };
  const recortes=[];
  if(tipo==="venta"){
    const usado={};
    draft.lineas.forEach(l=>{
      const p=prodById(l.productoId); if(!p) return;
      const disp=Math.max(0, stockVendibleTotal(p)-(usado[l.productoId]||0));
      if(l.cantidad>disp){ recortes.push(`• ${p.nombre}: asked ${qty(l.cantidad)}, ${qty(disp)} in stock`); l.cantidad=disp; }
      usado[l.productoId]=(usado[l.productoId]||0)+l.cantidad;
    });
  }
  renderDocModal();
  if(recortes.length) alert("Copied the sale but trimmed quantities for lack of stock:\n\n"+recortes.join("\n")+"\n\nReview before confirming.");
}

/* Ver documento existente (solo lectura) */
function verDoc(tipo,id){
  const list = tipo==="compra"?db.compras:db.ventas;
  const d=list.find(x=>x.id===id); if(!d) return;
  const isC=tipo==="compra";
  const rows=d.lineas.map(l=>`<tr>
    <td><span class="sku">${esc(l.sku||"—")}</span> ${esc(l.nombre)}</td>
    <td class="r num">${qty(l.cantidad)}</td>
    <td class="r num">${money(l.precio)}</td>
    <td class="r num">${money(l.cantidad*l.precio)}</td></tr>`).join("");
  const cli = d.cliente || (d.clienteId?clienteById(d.clienteId):null);
  const sub = (d.subtotal!=null) ? d.subtotal : totalLineas(d.lineas);
  const extras = isC
    ? ((d.handling||d.flete) ? `<div class="totrow"><span style="color:var(--muted)">Handling + freight</span><span class="num">${money((d.handling||0)+(d.flete||0))}</span></div>` : "")
    : `<div class="totrow"><span style="color:var(--muted)">Shipping</span><span class="num">${d.envio&&d.envio.tipo==="monto"?money(d.envio.monto):"Free shipping"}</span></div>`;
  const cliBlock = (!isC && cli) ? `<p style="margin:0 0 14px;color:var(--muted);font-size:13px">
      <b>${esc(cli.nombre)}</b>${cli.empresa?` · ${esc(cli.empresa)}`:""}<br>
      ${esc(clienteDireccion(cli)||"")}${cli.email?`<br>${esc(cli.email)}`:""}${cli.telefono?` · ${esc(cli.telefono)}`:""}</p>` : "";
  // Punto 1: bloque de estado de envío (sólo compras)
  const received = d.status===INVOICE_STATUS.RECEIVED;
  const statusBlock = isC ? `<div class="totrow" style="align-items:center">
      <span style="color:var(--muted)">Shipment status</span>
      <span style="display:flex;gap:10px;align-items:center">
        <span class="inv-badge ${received?'received':'transit'}">${received?'✓ Received':'⋯ In transit'}</span>
        <button class="btn ghost sm" data-invstatus-modal="${d.id}">${received?'Mark in transit':'Mark received'}</button>
      </span></div>` : "";
  // Punto 6: quién vendió (sólo ventas, sólo admin)
  const vendBlock = (!isC && isAdmin()) ? `<div class="totrow"><span style="color:var(--muted)">Sold by</span><span class="num">${esc(saleVendedorNombre(d))}</span></div>` : "";
  // Punto 4: comisión (sólo ventas y sólo admin/master)
  const commBlock = (!isC && isAdmin()) ? `
    <div class="totrow"><span style="color:var(--muted)">Margin (FIFO)</span><span class="num">${money(saleMargin(d))}</span></div>
    <div class="totrow"><span style="color:var(--muted)">Commission (${nf0.format(saleCommissionRate(d)*100)}% of margin)</span><span class="num">${money(saleCommission(d))}</span></div>` : "";
  buildModal(`${isC?"Purchase":"Invoice"} ${esc(d.numero||"")}`.trim(), `
    <p style="margin:0 0 6px;color:var(--muted);font-size:14px">${esc(d.contraparte||"—")} · ${esc(fmtDate(d.fecha))}</p>
    ${cliBlock}
    <div class="table-scroll"><table>
      <thead><tr><th>Product</th><th class="r">Qty</th><th class="r">${isC?"Cost":"Price"}</th><th class="r">Subtotal</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="totrow"><span style="color:var(--muted)">Subtotal</span><span class="num">${money(sub)}</span></div>
    ${extras}
    <div class="totrow" style="font-weight:700"><span>Total</span><span class="num">${money(d.total)}</span></div>
    ${statusBlock}
    ${vendBlock}
    ${commBlock}
  `,[
    {label:"Delete",cls:"btn danger",act:()=>deleteDoc(tipo,id)},
    ...(isC?[]:[{label:"⤓ Download PDF",cls:"btn",act:()=>generarInvoicePDF(id)},
              {label:"Copy",cls:"btn",act:()=>copyDoc(tipo,id)}]),
    {label:"Edit",cls:"btn",act:()=>{ closeModal(); editDoc(tipo,id); }},
    {label:"Close",cls:"btn",act:closeModal}
  ]);
  // Punto 1: el botón de estado dentro del detalle re-abre el modal ya actualizado.
  const sb=document.querySelector("[data-invstatus-modal]");
  if(sb) sb.onclick=()=>{ toggleInvoiceStatus(sb.dataset.invstatusModal); closeModal(); verDoc(tipo,id); };
}

/* ============================================================
   PUNTO 8 y 10 — Generación de PDF (invoice de venta + lista de precios)
   Usa jsPDF (UMD por CDN, cacheado por el SW para uso offline).
   ============================================================ */
function pdfReady(){ return !!(window.jspdf && window.jspdf.jsPDF); }
function pdfMoney(n){ return db.config.moneda + " " + nf2.format(n||0); }

function generarInvoicePDF(id){
  if(!pdfReady()){ toast("Couldn't load the PDF generator (try once with internet)","warn"); return; }
  const d = db.ventas.find(v=>v.id===id); if(!d){ toast("Sale not found","warn"); return; }
  const cli = d.cliente || (d.clienteId?clienteById(d.clienteId):null);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"letter" });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const M = 48;
  const em = db.config.emisor||{};
  // Paleta (mismo azul del tema)
  const INK=[26,26,26], MUT=[120,120,120], LINE=[228,225,220], ACC=[37,99,235], ZEBRA=[248,247,245];
  const setInk=(c)=>doc.setTextColor(c[0],c[1],c[2]);

  /* ---------- Header band ---------- */
  doc.setFillColor(ACC[0],ACC[1],ACC[2]); doc.rect(0,0,W,96,"F");
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold"); doc.setFontSize(19);
  doc.text(em.nombre || "INVOICE", M, 42);
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
  let hy=60;
  [em.direccion, [em.email, em.tel].filter(Boolean).join("  ·  ")].filter(Boolean).forEach(t=>{ doc.text(String(t), M, hy); hy+=12; });
  // right side: INVOICE + number + date
  doc.setFont("helvetica","bold"); doc.setFontSize(22);
  doc.text("INVOICE", W-M, 40, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
  doc.text(`No. ${d.numero||"—"}`, W-M, 58, {align:"right"});
  doc.text(fmtDate(d.fecha), W-M, 72, {align:"right"});

  /* ---------- Bill To ---------- */
  let y=132;
  doc.setFont("helvetica","bold"); doc.setFontSize(9); setInk(MUT);
  doc.text("BILL TO", M, y);
  doc.text("STORE", W-M-150, y);
  y+=15; setInk(INK); doc.setFontSize(10);
  const leftLines=[];
  if(cli){
    leftLines.push(["bold", cli.nombre||""]);
    const l2=[cli.empresa, cli.contacto].filter(Boolean).join(" · "); if(l2) leftLines.push(["normal", l2]);
    if(cli.direccion) leftLines.push(["normal", cli.direccion]);
    const cz=[cli.ciudad, cli.estado, cli.zip].filter(Boolean).join(", "); if(cz) leftLines.push(["normal", cz]);
    if(cli.pais) leftLines.push(["normal", cli.pais]);
    const ce=[cli.email, cli.telefono].filter(Boolean).join(" · "); if(ce) leftLines.push(["muted", ce]);
  } else leftLines.push(["normal","—"]);
  let ly=y;
  leftLines.forEach(([style,txt])=>{
    doc.setFont("helvetica", style==="bold"?"bold":"normal"); setInk(style==="muted"?MUT:INK);
    doc.setFontSize(style==="bold"?10.5:9.5);
    doc.splitTextToSize(txt, 260).forEach(t=>{ doc.text(t, M, ly); ly+=13; });
  });
  // store box (right)
  doc.setFont("helvetica","normal"); doc.setFontSize(10); setInk(INK);
  doc.text(storeName(d.store||STORE_IDS[0]), W-M-150, y);

  /* ---------- Table ---------- */
  y = Math.max(ly, y+13) + 18;
  const cItem=M, wItem=W-M-M-200;
  const cQty=W-M-200, wQty=44;
  const cUnit=W-M-150, wUnit=74;
  const cAmt=W-M-70, wAmt=70;
  const drawHead=(yy)=>{
    doc.setFillColor(ACC[0],ACC[1],ACC[2]); doc.rect(M, yy-13, W-2*M, 24, "F");
    doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(9);
    doc.text("ITEM", cItem+6, yy+3);
    doc.text("QTY", cQty+wQty, yy+3, {align:"right"});
    doc.text("UNIT PRICE", cUnit+wUnit, yy+3, {align:"right"});
    doc.text("AMOUNT", cAmt+wAmt, yy+3, {align:"right"});
    return yy+24;
  };
  y = drawHead(y);
  doc.setFont("helvetica","normal");
  let zebra=false;
  d.lineas.forEach(l=>{
    const nom=(l.sku?`[${l.sku}] `:"")+(l.nombre||"");
    const wrapped=doc.splitTextToSize(nom, wItem-8);
    const rowH=Math.max(20, wrapped.length*11.5 + 8);
    if(y+rowH>H-96){ y=drawHead(60); zebra=false; }
    if(zebra){ doc.setFillColor(ZEBRA[0],ZEBRA[1],ZEBRA[2]); doc.rect(M, y-12, W-2*M, rowH, "F"); }
    zebra=!zebra;
    const tTop=y+1;                                  // baseline superior del renglón
    setInk(INK); doc.setFontSize(9.5);
    doc.text(wrapped, cItem+6, tTop);
    setInk(INK);
    doc.text(qty(l.cantidad), cQty+wQty, tTop, {align:"right"});
    doc.text(pdfMoney(l.precio), cUnit+wUnit, tTop, {align:"right"});
    doc.setFont("helvetica","bold"); doc.text(pdfMoney(l.cantidad*l.precio), cAmt+wAmt, tTop, {align:"right"}); doc.setFont("helvetica","normal");
    y += rowH;
    doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.line(M, y-6, W-M, y-6);
  });

  /* ---------- Totals box ---------- */
  y+=14;
  const sub=(d.subtotal!=null)?d.subtotal:totalLineas(d.lineas);
  const envio = d.envio && d.envio.tipo==="monto" ? (d.envio.monto||0) : 0;
  const boxX=W-M-230, boxW=230;
  const line=(label,val,opts={})=>{
    doc.setFont("helvetica",opts.bold?"bold":"normal");
    doc.setFontSize(opts.big?12:10);
    setInk(opts.bold?INK:MUT);
    doc.text(label, boxX, y); setInk(opts.bold?INK:INK);
    doc.text(val, W-M, y, {align:"right"}); y+= opts.big?22:16;
  };
  line("Subtotal", pdfMoney(sub));
  line("Shipping", d.envio && d.envio.tipo==="free" ? "Free" : pdfMoney(envio));
  y+=4;
  doc.setDrawColor(ACC[0],ACC[1],ACC[2]); doc.setLineWidth(1.2); doc.line(boxX, y-8, W-M, y-8); doc.setLineWidth(1);
  y+=4;
  doc.setFillColor(ACC[0],ACC[1],ACC[2]);
  const total=(d.total!=null)?d.total:round2(sub+envio);
  line("TOTAL", pdfMoney(total), {bold:true, big:true});

  /* ---------- Footer ---------- */
  setInk(MUT); doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
  doc.text("Thank you for your business.", M, H-46);
  doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.line(M, H-58, W-M, H-58);

  doc.save(`invoice-${(d.numero||"sale")}.pdf`);
  toast("Invoice downloaded");
}

/* Lista de precios para clientes (punto 10). Recibe la lista ya filtrada. */
function exportListaPrecios(prods){
  if(!pdfReady()){ toast("Couldn't load the PDF generator (try once with internet)","warn"); return; }
  // Point 9: a customer price list must never leak blocked or investment items.
  const clean = prods.filter(p=> !soloEnVault(p) && !esBloqueado(p) && (p.precioVenta||0)>0);
  const dropped = prods.length - clean.length;
  if(!clean.length){ toast("No sellable products with a price to export","warn"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"letter" });
  const M=48, W=doc.internal.pageSize.getWidth(); let y=56;
  const em=db.config.emisor||{};
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(20);
  doc.text(em.nombre?`${em.nombre} — Price list`:"Price list", M, y); y+=18;
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(120);
  doc.text(new Date().toLocaleDateString("en-US"), M, y); y+=20;

  const cSKU=M, cName=M+90, cPrice=W-M;
  doc.setFillColor(245); doc.rect(M, y-12, W-2*M, 22, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(40);
  doc.text("SKU", cSKU, y+3); doc.text("Product", cName, y+3); doc.text("Price", cPrice, y+3, {align:"right"});
  y+=22; doc.setFont("helvetica","normal"); doc.setTextColor(55);
  clean.slice().sort((a,b)=>String(a.nombre||"").localeCompare(String(b.nombre||""),"en")).forEach(p=>{
    if(y>740){ doc.addPage(); y=60; }
    doc.setTextColor(120); doc.setFontSize(8.5); doc.text(p.sku||"—", cSKU, y);
    doc.setTextColor(55); doc.setFontSize(10);
    const wrapped=doc.splitTextToSize(p.nombre||"", cPrice-cName-70);
    doc.text(wrapped, cName, y);
    doc.text(pdfMoney(p.precioVenta), cPrice, y, {align:"right"});
    y += Math.max(15, wrapped.length*12);
    doc.setDrawColor(240); doc.line(M, y-5, W-M, y-5);
  });
  doc.save(`price-list-${new Date().toISOString().slice(0,10)}.pdf`);
  toast(`Price list exported · ${clean.length} products${dropped>0?` (${dropped} blocked/investment excluded)`:""}`);
}

/* ============================================================
   P&L EXPORT (point 8) — preliminary income statement (Excel)
   ------------------------------------------------------------
   El stock es un pool único y la venta ya no está atada a una
   sociedad, así que el estado es CONSOLIDADO. Se agrega una hoja
   de rendimiento POR VENDEDOR (revenue, COGS FIFO, margen, comisión)
   y el detalle por producto. Built from sales in the selected period.
   ============================================================ */
function exportPnL(desde, hasta){
  if(!window.XLSX){ toast("Couldn't load the Excel engine (try once with internet)","warn"); return; }
  const d0 = desde ? new Date(desde+"T00:00:00") : null;
  const d1 = hasta ? new Date(hasta+"T23:59:59") : null;
  const inRange = v=>{ const f=new Date((normISO(v.fecha)||v.fecha)+"T12:00:00"); if(d0&&f<d0) return false; if(d1&&f>d1) return false; return true; };

  // ---- Aggregations (consolidated) ----
  const consol = { sales:0, shipping:0, cogs:0 };
  const detail = {};                 // prodKey -> {sku,nombre,units,revenue,cogs}
  const perVend = {};                // vendedorId|"" -> {nombre, sales, cogs, commission}
  const ventasPeriodo = db.ventas.filter(inRange);

  ventasPeriodo.forEach(v=>{
    const vid = v.vendedorId || "";
    const pv = perVend[vid] = perVend[vid] || { nombre: saleVendedorNombre(v), sales:0, cogs:0, commission:0 };
    (v.lineas||[]).forEach(l=>{
      const rev = round2((l.precio||0)*l.cantidad);
      const cogs = round2(l.cogs!=null ? l.cogs : (l.costo||0)*l.cantidad);
      consol.sales += rev; consol.cogs += cogs;
      pv.sales += rev; pv.cogs += cogs;
      const k = l.productoId||l.sku||l.nombre;
      const e = detail[k] = detail[k] || { sku:l.sku||"", nombre:l.nombre||"", units:0, revenue:0, cogs:0 };
      e.units += l.cantidad; e.revenue += rev; e.cogs += cogs;
    });
    if(v.envio && v.envio.tipo==="monto") consol.shipping += round2(v.envio.monto||0);
    pv.commission += saleCommission(v);
  });
  consol.sales=round2(consol.sales); consol.shipping=round2(consol.shipping); consol.cogs=round2(consol.cogs);

  // ---- Formatos de celda ----
  const MFMT = '"$"#,##0.00;("$"#,##0.00)';
  const PFMT = '0.0%';
  const setFmt = (ws, ref, z)=>{ const c=ws[ref]; if(c && typeof c.v==="number") c.z=z; };

  const period = `Period: ${desde?fmtDate(desde):"start"}  →  ${hasta?fmtDate(hasta):"today"}`;
  const wb = XLSX.utils.book_new();

  /* ---------- HOJA 1: Income Statement (consolidado, multi-step) ---------- */
  const net = round2(consol.sales + consol.shipping);
  const gp  = round2(net - consol.cogs);
  const pct = (n)=> net>0 ? (n/net) : 0;
  const IS = [
    ["Income Statement (Preliminary)"],
    [period],
    [""],
    ["Concept", "Consolidated", "% of revenue"],
    ["Product sales", consol.sales, pct(consol.sales)],
    ["Shipping billed to customers", consol.shipping, pct(consol.shipping)],
    ["Net revenue", net, pct(net)],
    ["Cost of goods sold (FIFO)", -consol.cogs, pct(-consol.cogs)],
    ["Gross profit", gp, pct(gp)],
    ["Gross margin %", (net>0?gp/net:0), ""],
    [""],
    ["Operating expenses", "n/a", ""],
    ["  (rent, payroll, marketing, fees — not tracked in this system)"],
    ["Operating income", gp, pct(gp)],
    [""],
    ["Notes:"],
    ["• Stock is a single pool; COGS uses actual FIFO cost layers across societies (not last cost)."],
    ["• Inbound freight/handling is capitalized into landed cost, so it is already inside COGS."],
    ["• Sales are not split by society (Akira/Silver): those only record who bought each lot."],
    ["• Operating expenses are not captured here — plug them into your structure-cost model."],
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(IS);
  ws1["!cols"]=[{wch:46},{wch:16},{wch:13}];
  ws1["!merges"]=[{s:{r:0,c:0},e:{r:0,c:2}},{s:{r:1,c:0},e:{r:1,c:2}}];
  for(let r=4;r<=13;r++){ setFmt(ws1, "B"+(r+1), MFMT); setFmt(ws1, "C"+(r+1), PFMT); }
  setFmt(ws1, "B10", PFMT);   // Gross margin %
  XLSX.utils.book_append_sheet(wb, ws1, "Income Statement");

  /* ---------- HOJA 2: By seller ---------- */
  const vHeader = ["Seller","Revenue","COGS (FIFO)","Gross margin","Margin %","Commission"];
  let sV=0,sC=0,sK=0;
  const vBody = Object.values(perVend).sort((a,b)=>b.sales-a.sales).map(v=>{
    const gm=round2(v.sales-v.cogs), p=v.sales>0?(gm/v.sales):0;
    sV+=v.sales; sC+=v.cogs; sK+=v.commission;
    return [v.nombre, round2(v.sales), round2(v.cogs), gm, p, round2(v.commission)];
  });
  const tGM=round2(sV-sC), tP=sV>0?(tGM/sV):0;
  const vAoa=[["By seller"],[period],[],vHeader,...vBody,[],["TOTAL",round2(sV),round2(sC),tGM,tP,round2(sK)]];
  const ws2=XLSX.utils.aoa_to_sheet(vAoa);
  ws2["!cols"]=[{wch:22},{wch:14},{wch:14},{wch:14},{wch:10},{wch:14}];
  ws2["!merges"]=[{s:{r:0,c:0},e:{r:0,c:5}},{s:{r:1,c:0},e:{r:1,c:5}}];
  for(let r=5;r<=vAoa.length;r++){ ["B","C","D","F"].forEach(col=> setFmt(ws2, col+r, MFMT)); setFmt(ws2, "E"+r, PFMT); }
  XLSX.utils.book_append_sheet(wb, ws2, "By seller");

  /* ---------- HOJA 3: Detalle por producto (consolidado) ---------- */
  const header = ["SKU","Product","Units","Revenue","COGS (FIFO)","Gross margin","Margin %"];

/* Leer factura con Gemini (vía el Worker). Reusa el mismo editor de revisión que la detección local. */
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(",")[1]||"");
    r.onerror=()=>rej(new Error("no se pudo leer el archivo"));
    r.readAsDataURL(file);
  });
}

/* Normaliza fecha devuelta por la IA a YYYY-MM-DD si viene en otro formato reconocible */
function normFechaIA(f){
  if(!f) return "";
  f=String(f).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(f)) return f;
  const m=f.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){ let[,d,mo,y]=m; if(y.length===2)y="20"+y; return `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`; }
  return f;
}

async function handlePdf(file){
  const out=document.getElementById("importOut");
  if(!window.pdfjsLib){ out.innerHTML=`<div class="banner warn">Couldn\u2019t load the PDF reader (pdf.js). Check your connection and retry, or load the purchase by hand.</div>`; return; }

/* Reconstruir líneas por coordenada Y */
function reconstructLines(items){
  const rows=new Map();
  for(const it of items){
    if(!it.str || !it.str.trim()) continue;
    const y=Math.round(it.transform[5]);
    let bucket=null;
    for(const k of rows.keys()){ if(Math.abs(k-y)<=3){ bucket=k; break; } }
    const key = bucket===null ? y : bucket;
    if(!rows.has(key)) rows.set(key,[]);
    rows.get(key).push({x:it.transform[4], s:it.str});
  }
  return [...rows.entries()]
    .sort((a,b)=> b[0]-a[0])
    .map(([,arr])=> arr.sort((a,b)=>a.x-b.x).map(o=>o.s).join(" ").replace(/\s+/g," ").trim());
}

/* ---------- Parser de factura ----------
   1) Intento estructurado: renglones "SKU: descripción ... QTY UOM MSRP NET EXT"
      (formato tipo Coqui Hobby). Costo = NET PRICE, precio venta sugerido = MSRP.
   2) Si no encuentra nada, cae a la heurística genérica línea por línea.        */
function parseInvoice(lines){
  const blob = lines.join("\n");
  const meta = extractMeta(lines, blob);
  let items = parseStructured(blob);
  let mode = "estructurado";
  if(!items.length){
    items = lines.map(parseCandidate).filter(Boolean).map(c=>({
      sku:"", desc:c.desc, cantidad:c.cantidad, costo:c.costo, msrp:0, ext:c.cantidad*c.costo, raw:c.raw
    }));
    mode = "heuristico";
  }
  // detectar flete/handling para avisar (no se agrega como stock)
  const fre = blob.match(/(freight[^\n]*?|flete[^\n]*?)\s([\d.,]+)\s*$/im) || blob.match(/freight[^\d]*([\d.,]+)/i);
  meta.flete = fre ? parseNum(fre[fre.length-1]) : 0;
  return { meta, items, mode };
}

/* SKU: desc ... QTY UOM MSRP NET EXT  (UOM = EACH/EA/CASE/BOX/PACK/UNIT/PCS) */
function parseStructured(blob){
  const re = /(?=[A-Z0-9\-]*\d)([A-Z0-9][A-Z0-9\-]{3,}):\s*([\s\S]+?)\s+(\d+(?:[.,]\d+)?)\s+(EACH|EA|CASE|BOX|PACK|UNIT|PCS?|UN)\s+([\d.,]+)\s+([\d.,]+)\s+([\d.,]+)(?=\s|$)/gi;
  const out=[]; let m;
  while((m=re.exec(blob))){
    const sku = m[1].trim();
    const desc = m[2].replace(/\s+/g," ").trim();
    const cantidad = parseNum(m[3]);
    const msrp = parseNum(m[5]);   // precio sugerido
    const net  = parseNum(m[6]);   // costo real (lo que pagás)
    const ext  = parseNum(m[7]);   // total línea
    if(cantidad<=0) continue;
    out.push({ sku, desc, cantidad, costo:net, msrp, ext, raw:(sku+": "+desc+" | "+m[3]+" "+m[4]+" "+m[5]+" "+m[6]+" "+m[7]) });
  }
  return out;
}

/* Metadata: N° de comprobante, fecha, proveedor */
function extractMeta(lines, blob){
  const meta = { numero:"", fecha:"", proveedor:"", flete:0 };
  const ref = blob.match(/Reference\s*No\.?:?\s*([A-Z0-9\-]+)/i)
           || blob.match(/(?:Invoice|Factura|Comprobante)\s*(?:No\.?|#|N[°º])?:?\s*([A-Z0-9\-]{3,})/i);
  if(ref) meta.numero = ref[1].trim();
  const date = blob.match(/\bDate:?\s*([0-3]?\d[-\/][A-Za-z]{3,}[-\/]\d{2,4})/i)
            || blob.match(/\bFecha:?\s*([0-3]?\d[-\/][0-1]?\d[-\/]\d{2,4})/i);
  if(date) meta.fecha = normDate(date[1]);
  const skip = /^(invoice|factura|reference|date|fecha|customer|currency|salesperson|bill to|ship to|terms|contact|due date|no\.|item)\b/i;
  for(const l of lines){
    const t=l.trim();
    if(t.length>2 && /[A-Za-z]/.test(t) && !skip.test(t)){ meta.proveedor=t.replace(/\s+/g," "); break; }
  }
  return meta;
}
function normDate(s){
  let m=s.match(/(\d{1,2})[-\/]([A-Za-z]{3,})[-\/](\d{2,4})/);
  const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,
                ene:1,abr:4,ago:8,dic:12};
  if(m){
    const mo=months[m[2].slice(0,3).toLowerCase()]; if(!mo) return "";
    const yr=m[3].length===2?"20"+m[3]:m[3];
    return `${yr}-${String(mo).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`;
  }
  m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
  if(m){ const yr=m[3].length===2?"20"+m[3]:m[3]; return `${yr}-${String(+m[2]).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`; }
  return "";
}

/* Heurística: intentar detectar cantidad / costo en una línea */
function parseCandidate(line){
  const nums=[...line.matchAll(/-?\d{1,3}(?:[.,]\d{3})*(?:[.,]\d+)?|-?\d+(?:[.,]\d+)?/g)].map(m=>m[0]);
  if(nums.length<2) return null;                 // necesita al menos cantidad y un importe
  if(line.length<4) return null;
  // descartar líneas que son claramente totales/cabeceras
  if(/^(total|subtotal|iva|neto|importe total|cuit|factura|fecha|p[aá]gina)\b/i.test(line.trim())) return null;
  const desc = line.replace(/-?\d[\d.,]*/g,"").replace(/\s+/g," ").trim();
  if(desc.length<2) return null;
  const parsed = nums.map(parseNum);
  // heurística: cantidad = primer número "chico" entero; costo unit = número intermedio; total = último
  let cantidad = parsed.find(n=> n>0 && n<10000 && Number.isInteger(n)) ?? parsed[0];
  let costo = parsed.length>=2 ? parsed[parsed.length-2] : parsed[0];
  if(cantidad>0 && costo===0 && parsed.length){ costo=parsed[parsed.length-1]; }
  return { desc, cantidad: cantidad||1, costo: costo||0, raw:line };
}

/* ============================================================

function openFicha(id){

                 .sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));

  let bal=0; const serie=[0];

    const up = signed>=0;

    serie.push(bal);

      <td>${pill}${m.store?` <span class="pill" style="opacity:.7">${esc(storeName(m.store))}</span>`:""}</td>
      <td class="r delta ${isAdj?'flat':(up?'up':'down')}">${up?'+':'−'}${qty(Math.abs(signed))}</td>

  const totComp = movs.filter(m=>m.refTipo==="compra").reduce((a,m)=>a+m.cantidad,0);
  const totVend = movs.filter(m=>m.refTipo==="venta").reduce((a,m)=>a+m.cantidad,0);

  const totalStock = stockTotalP(p);
  const held = invUnits(p);
  const perStore = STORE_IDS.map(s=>`${storeName(s)}: <b>${qty(stockDe(p,s))}</b>`).join(" · ")
    + (held>0 ? ` · <span style="color:var(--accent-ink)">◈ vault: <b>${qty(held)}</b></span>` : "");
  const badge = esInversion(p)?' <span class="pill inv">investment</span>':(esBloqueado(p)?' <span class="pill blocked">blocked</span>':'');

  const body = `
    <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">
      <div class="kpi"><div class="lbl">Total stock</div><div class="val" style="color:${totalStock<0?'var(--alert)':'inherit'}">${qty(totalStock)}</div><div class="sub">${esc(perStore)}</div></div>
      <div class="kpi"><div class="lbl">Last cost</div><div class="val">${money(p.ultimoCosto)}</div><div class="sub">FIFO valued ${money(valorFifoTotal(p))}</div></div>

      <div class="kpi"><div class="lbl">Bought / Sold</div><div class="val" style="font-size:20px"><span class="delta up">${qty(totComp)}</span> / <span class="delta down">${qty(totVend)}</span></div><div class="sub">lifetime</div></div>

  });
}

/* Point 4: pick quantities per store when moving stock to the vault
   (all · part of each store · one store only). */
function openSendToInvestment(id){
  const p = prodById(id); if(!p) return;
  const stores = STORE_IDS.filter(s=> stockDe(p,s) > 0);
  if(!stores.length){ toast("No sellable stock to move","warn"); return; }
  const rows = stores.map(s=>{
    const av = stockDe(p,s);
    return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)">
      <div style="flex:1"><b>${esc(storeName(s))}</b> <span style="color:var(--muted);font-size:12.5px">· ${qty(av)} available</span></div>
      <input class="inp num" id="inv_alloc_${s}" data-max="${av}" value="0" style="width:110px">
      <button class="btn ghost sm" data-allbtn="${s}">All</button>
    </div>`;
  }).join("");
  const body = `
    <p class="hint" style="margin:0 0 12px">Move units out of the sellable stock into the executive-hold vault, at their real FIFO cost. Each store gets an <b>out</b> movement in its kardex.</p>
    ${rows}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
      <button class="btn ghost sm" id="inv_all_stores">Take every store's stock</button>
      <div style="font-size:13px">Total to move: <b id="inv_total">0</b></div>
    </div>
    <div class="field" style="margin-top:14px"><label>Note (optional)</label><input class="inp" id="inv_obs" placeholder="e.g. hold for grading / long-term"></div>`;
  buildModal("◈ Send to Investment vault", body, [
    {label:"Cancel",cls:"btn",act:closeModal},
    {label:"Send to vault",cls:"btn primary",act:()=>{
       const alloc={}; stores.forEach(s=> alloc[s]=parseNum(document.getElementById("inv_alloc_"+s).value));
       const moved = sendToInvestment(p, alloc, (document.getElementById("inv_obs").value||"").trim());
       if(moved>0){ closeModal(); toast(`Moved ${qty(moved)} u to the vault`); render(); }
       else toast("Nothing to move — set a quantity","warn");
    }}
  ], false);
  const recalc=()=>{ let t=0; stores.forEach(s=>{ const el=document.getElementById("inv_alloc_"+s); let v=parseNum(el.value); const mx=+el.dataset.max; if(v>mx){ v=mx; el.value=mx; } if(v<0){ v=0; el.value=0; } t+=v; }); document.getElementById("inv_total").textContent=qty(t); };
  stores.forEach(s=>{
    document.getElementById("inv_alloc_"+s).oninput=recalc;
    document.querySelector('[data-allbtn="'+s+'"]').onclick=()=>{ const el=document.getElementById("inv_alloc_"+s); el.value=el.dataset.max; recalc(); };
  });
  document.getElementById("inv_all_stores").onclick=()=>{ stores.forEach(s=>{ document.getElementById("inv_alloc_"+s).value=stockDe(p,s); }); recalc(); };
  recalc();
}
/* Reverse: return held units from the vault to a chosen store's sellable stock. */
function openReturnFromInvestment(id){
  const p = prodById(id); if(!p) return;
  const held = invUnits(p);
  if(held<=0){ toast("Nothing held in the vault","warn"); return; }
  const opts = STORE_IDS.map(s=>`<option value="${s}">${esc(storeName(s))}</option>`).join("");
  const body = `
    <p class="hint" style="margin:0 0 12px">Held in vault: <b>${qty(held)}</b> u · valued ${money(invValor(p))}. Returning puts the units back as sellable stock (at their original cost) and logs an <b>in</b> movement.</p>
    <div class="grid-form" style="grid-template-columns:1fr 1fr;padding:0">
      <div class="field"><label>Destination store</label><select class="inp" id="inv_ret_store">${opts}</select></div>
      <div class="field"><label>Quantity</label><input class="inp num" id="inv_ret_q" value="${held}"></div>
    </div>`;
  buildModal("◈ Return from Investment vault", body, [
    {label:"Cancel",cls:"btn",act:closeModal},
    {label:"Return to stock",cls:"btn primary",act:()=>{
       const st=document.getElementById("inv_ret_store").value;
       const q=parseNum(document.getElementById("inv_ret_q").value);
       const done=returnFromInvestment(p, st, q, "");
       if(done>0){ closeModal(); toast(`Returned ${qty(done)} u to ${storeName(st)}`); render(); }
       else toast("Set a valid quantity","warn");
    }}
  ], false);
}

/* Mini-gráfico de evolución (SVG, sin librerías) */
function sparkline(vals){
  if(vals.length<2) return "";
  const w=620,h=76,pad=8;
  const max=Math.max(...vals), min=Math.min(...vals,0);
  const range=(max-min)||1;
  const step=(w-2*pad)/(vals.length-1);
  const pts = vals.map((v,i)=>{
    const x=pad+i*step;
    const y=h-pad-((v-min)/range)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const area = `${pad},${h-pad} ${pts.join(" ")} ${(pad+(vals.length-1)*step).toFixed(1)},${h-pad}`;
  const zeroY = h-pad-((0-min)/range)*(h-2*pad);
  const last = vals[vals.length-1];
  const lastX = pad+(vals.length-1)*step;
  const lastY = h-pad-((last-min)/range)*(h-2*pad);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
    <polygon points="${area}" fill="var(--up-bg)"/>
    <line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${w-pad}" y2="${zeroY.toFixed(1)}" stroke="var(--line-strong)" stroke-dasharray="3 3"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" fill="var(--accent)"/>
  </svg>`;
}

function exportJSON(){

  a.href=URL.createObjectURL(blob);
  a.download=`mayor-stock-${new Date().toISOString().slice(0,10)}.json`;

function importJSON(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json";
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        if(!data.productos) throw new Error("estructura inválida");
        if(!confirm("Esto reemplaza todos los datos actuales. ¿Seguir?")) return;
        db=migrate(Object.assign({config:{moneda:"$"},productos:[],compras:[],ventas:[],movimientos:[],clientes:[]}, data));
        save(); toast("Datos importados"); render();
      }catch(e){ toast("Invalid JSON","warn"); }
    };
    r.readAsText(f);
  };
  inp.click();
}

  if(!confirm("Se borra TODO (productos, compras, ventas y movimientos). ¿Seguro?")) return;
  db=migrate({ config:db.config, productos:[], compras:[], ventas:[], movimientos:[], clientes:[] });

function buildModal(title, bodyHTML, buttons=[], wide=false, extraFoot=""){
  const root=document.getElementById("modalRoot");

      <div class="modal ${wide?'wide':''}">
        <div class="mhead"><h3>${esc(title)}</h3><button class="x" id="xClose">×</button></div>

        ${extraFoot?`<div class="mextra" style="padding:0 22px">${extraFoot}</div>`:""}

    </div>`;

  const right=buttons.filter(b=>!b.cls.includes("danger"));

/* ============================================================
   FIELD ENHANCERS: dropdowns y calendario custom
   ------------------------------------------------------------
   Reemplazan visualmente los popups NATIVOS (que el SO dibuja
   en blanco, ajenos al tema) por popups propios pintados con
   nuestros tokens. Regla de oro: nunca tocamos el <select> ni
   el <input type=date> reales — sólo interceptamos su apertura.
   Así value, id, listeners y onchange siguen intactos y toda la
   lógica de wireXXX() sigue andando sin enterarse.
   ============================================================ */
(function(){
  const MESES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW   = ["Su","Mo","Tu","We","Th","Fr","Sa"];   // week starts Sunday (US)
  const CAL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';

  let openPop = null;   // popup abierto actualmente (select o calendario)
  function closeOpen(){ if(openPop){ openPop.remove(); openPop=null; document.removeEventListener('scroll', onDocScroll, true); } }
  function onDocScroll(){ closeOpen(); }

  /* Posiciona un popup respecto de su "ancla" (el control), eligiendo abrir
     hacia abajo o hacia arriba según el espacio disponible en el viewport. */
  function place(pop, anchor){
    const r = anchor.getBoundingClientRect();
    document.body.appendChild(pop);
    const ph = pop.offsetHeight;
    const below = window.innerHeight - r.bottom;
    const openUp = below < ph + 8 && r.top > below;
    pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8)) + "px";
    if(openUp) pop.style.top = Math.max(8, r.top - pop.offsetHeight - 6) + "px";
    else       pop.style.top = (r.bottom + 6) + "px";
  }

  /* ---------------- SELECT ---------------- */
  function openSelect(sel){
    closeOpen();
    const pop = document.createElement('div');
    pop.className = 'csel-pop';
    pop.style.minWidth = sel.getBoundingClientRect().width + 'px';
    Array.from(sel.options).forEach((opt)=>{
      // <hr> dentro del select no existe como option; separadores manuales:
      const div = document.createElement('div');
      div.className = 'csel-opt' + (opt.selected ? ' sel' : '');
      if(opt.disabled) div.dataset.disabled = '1';
      div.textContent = opt.textContent;
      div.title = opt.textContent;
      div.onclick = ()=>{
        if(opt.disabled) return;
        if(sel.value !== opt.value){
          sel.value = opt.value;
          // dispara los handlers de la app (soporta .onchange y addEventListener)
          sel.dispatchEvent(new Event('change', { bubbles:true }));
        }
        closeOpen();
      };
      pop.appendChild(div);
    });
    pop.__forSel = sel;
    openPop = pop;
    place(pop, sel);
    // scroll a la opción seleccionada
    const selEl = pop.querySelector('.csel-opt.sel');
    if(selEl) selEl.scrollIntoView({ block:'nearest' });
    document.addEventListener('scroll', onDocScroll, true);
  }

  function enhanceSelects(root){
    (root||document).querySelectorAll('select:not([data-csel])').forEach(sel=>{
      sel.dataset.csel = '1';
      // en mobile el picker nativo del select es cómodo (rueda a pantalla
      // completa); sólo reemplazamos en punteros finos (mouse/trackpad).
      const fino = window.matchMedia && window.matchMedia('(pointer:fine)').matches;
      if(!fino) return;
      sel.addEventListener('mousedown', (e)=>{ e.preventDefault(); (openPop && openPop.__forSel===sel) ? closeOpen() : openSelect(sel); });
      sel.addEventListener('keydown', (e)=>{
        if(e.key==='Enter' || e.key===' ' || e.key==='ArrowDown' || e.key==='ArrowUp'){ e.preventDefault(); openSelect(sel); }
      });
    });
  }

  /* ---------------- DATE ---------------- */
  const pad = n => String(n).padStart(2,'0');
  const toISO = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  const parseISO = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };

  function openCalendar(inp){
    closeOpen();
    const today = new Date(); today.setHours(0,0,0,0);
    const sel = parseISO(inp.value);
    let viewY = (sel||today).getFullYear();
    let viewM = (sel||today).getMonth();
    let mode = 'days';   // 'days' | 'months' | 'years'

    const pop = document.createElement('div');
    pop.className = 'cal-pop';
    pop.__forDate = inp;
    openPop = pop;

    function commit(d){
      inp.value = d ? toISO(d) : '';
      inp.dispatchEvent(new Event('change', { bubbles:true }));
      closeOpen();
    }
    function drawDays(){
      const first = new Date(viewY, viewM, 1);
      const startDow = first.getDay();                 // 0=domingo
      const daysInMonth = new Date(viewY, viewM+1, 0).getDate();
      const prevDays = new Date(viewY, viewM, 0).getDate();
      let cells = '';
      // días del mes anterior (relleno)
      for(let i=startDow-1;i>=0;i--) cells += `<div class="cal-cell out">${prevDays-i}</div>`;
      for(let d=1; d<=daysInMonth; d++){
        const cur = new Date(viewY, viewM, d);
        const isToday = cur.getTime()===today.getTime();
        const isSel = sel && cur.getTime()===sel.getTime();
        cells += `<div class="cal-cell${isToday?' today':''}${isSel?' sel':''}" data-d="${d}">${d}</div>`;
      }
      const totalShown = startDow + daysInMonth;
      const trailing = (7 - (totalShown % 7)) % 7;
      for(let i=1;i<=trailing;i++) cells += `<div class="cal-cell out">${i}</div>`;
      pop.innerHTML = `
        <div class="cal-head">
          <div class="cal-title" data-act="mode">${MESES[viewM]} ${viewY}</div>
          <div class="cal-nav" data-act="prev">‹</div>
          <div class="cal-nav" data-act="next">›</div>
        </div>
        <div class="cal-grid">${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
        <div class="cal-foot"><button data-act="clear">Clear</button><button data-act="today">Today</button></div>`;
      pop.querySelectorAll('.cal-cell[data-d]').forEach(c=> c.onclick=()=> commit(new Date(viewY, viewM, +c.dataset.d)));
      pop.querySelector('[data-act="prev"]').onclick = ()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} drawDays(); };
      pop.querySelector('[data-act="next"]').onclick = ()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} drawDays(); };
      pop.querySelector('[data-act="mode"]').onclick = ()=> drawMonths();
      pop.querySelector('[data-act="clear"]').onclick = ()=> commit(null);
      pop.querySelector('[data-act="today"]').onclick = ()=> commit(new Date(today));
    }
    function drawMonths(){
      pop.innerHTML = `
        <div class="cal-head">
          <div class="cal-title" data-act="years">${viewY}</div>
          <div class="cal-nav" data-act="prevy">‹</div>
          <div class="cal-nav" data-act="nexty">›</div>
        </div>
        <div class="cal-mgrid">${MESES.map((m,i)=>`<div class="cal-mcell${i===viewM?' sel':''}" data-m="${i}">${m.slice(0,3)}</div>`).join('')}</div>`;
      pop.querySelectorAll('.cal-mcell').forEach(c=> c.onclick=()=>{ viewM=+c.dataset.m; drawDays(); });
      pop.querySelector('[data-act="prevy"]').onclick = ()=>{ viewY--; drawMonths(); };
      pop.querySelector('[data-act="nexty"]').onclick = ()=>{ viewY++; drawMonths(); };
      pop.querySelector('[data-act="years"]').onclick = ()=> drawYears();
    }
    function drawYears(){
      const base = viewY - (viewY % 12);
      let cells = '';
      for(let y=base; y<base+12; y++) cells += `<div class="cal-mcell${y===viewY?' sel':''}" data-y="${y}">${y}</div>`;
      pop.innerHTML = `
        <div class="cal-head">
          <div class="cal-title">${base}–${base+11}</div>
          <div class="cal-nav" data-act="prevr">‹</div>
          <div class="cal-nav" data-act="nextr">›</div>
        </div>
        <div class="cal-mgrid">${cells}</div>`;
      pop.querySelectorAll('.cal-mcell').forEach(c=> c.onclick=()=>{ viewY=+c.dataset.y; drawMonths(); });
      pop.querySelector('[data-act="prevr"]').onclick = ()=>{ viewY-=12; drawYears(); };
      pop.querySelector('[data-act="nextr"]').onclick = ()=>{ viewY+=12; drawYears(); };
    }
    drawDays();
    place(pop, inp);
    document.addEventListener('scroll', onDocScroll, true);
  }

  function enhanceDates(root){
    (root||document).querySelectorAll('input[type="date"]:not([data-cdate])').forEach(inp=>{
      inp.dataset.cdate = '1';
      // ícono de calendario propio (el nativo lo ocultamos por CSS). Medimos el
      // ancho REAL ya renderizado y se lo fijamos al wrapper, así el input pasa
      // a 100% sin que se desacomode ninguna columna del filtro/modal.
      if(!inp.parentElement.classList.contains('cdate-wrap')){
        const w = inp.getBoundingClientRect().width;
        const wrap = document.createElement('span');
        wrap.className = 'cdate-wrap';
        if(w) wrap.style.width = w + 'px';
        inp.parentNode.insertBefore(wrap, inp);
        wrap.appendChild(inp);
        const ico = document.createElement('span');
        ico.className = 'cdate-ico'; ico.innerHTML = CAL_ICON;
        wrap.appendChild(ico);
        inp.style.width = '100%';
        inp.style.paddingRight = '28px';
      }
      inp.addEventListener('mousedown', (e)=>{ e.preventDefault(); (openPop && openPop.__forDate===inp) ? closeOpen() : openCalendar(inp); });
      inp.addEventListener('keydown', (e)=>{ e.preventDefault(); if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown') openCalendar(inp); });
      // por las dudas: si algún navegador expone showPicker, lo neutralizamos
      if(inp.showPicker){ const _sp = inp.showPicker.bind(inp); inp.showPicker = ()=>{ openCalendar(inp); }; }
    });
  }

  /* Corre ambos enhancers sobre un contenedor (o todo el doc). */
  function runFieldEnhancers(root){ enhanceSelects(root); enhanceDates(root); }
  window.runFieldEnhancers = runFieldEnhancers;

  // Cerrar popups al tocar afuera, con Escape o al cambiar el tamaño. Si el
  // mousedown cae sobre el MISMO control que abrió el popup, no cerramos acá:
  // dejamos que su propio handler (bubble) haga el toggle a cerrado.
  document.addEventListener('mousedown', (e)=>{
    if(!openPop) return;
    if(openPop.contains(e.target)) return;                                   // dentro del popup
    if(openPop.__forSel && openPop.__forSel===e.target) return;              // el mismo <select>
    if(openPop.__forDate){
      const wrap = openPop.__forDate.closest('.cdate-wrap');
      if(e.target===openPop.__forDate || (wrap && wrap.contains(e.target))) return; // el mismo input date o su ícono
    }
    closeOpen();
  }, true);
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeOpen(); });
  window.addEventListener('resize', closeOpen);

  /* ---- Cuándo enhancear: un MutationObserver ----
     La app repinta con innerHTML muy seguido (vistas, modales, sub-render del
     editor de líneas, filas de tablas, etc.). En vez de engancharnos a cada
     función de render por nombre, observamos el DOM: cualquier <select> o
     <input type=date> nuevo se enhancea solo. Los ya marcados (data-csel /
     data-cdate) se saltean, así no hay retrabajo ni recursión (nuestros popups
     no contienen controles nativos). Debounce por frame para no recalcular de
     más en repintados grandes. */
  let pending = false;
  const observer = new MutationObserver(()=>{
    if(pending) return;
    pending = true;
    requestAnimationFrame(()=>{ pending = false; runFieldEnhancers(); });
  });
  function startObserver(){
    if(document.body) observer.observe(document.body, { childList:true, subtree:true });
  }

  // Al cerrar un modal, cerramos cualquier popup que hubiera quedado abierto.
  if(typeof window.closeModal === 'function'){
    const _close = window.closeModal;
    window.closeModal = function(){ closeOpen(); return _close.apply(this, arguments); };
  }

  // Arranque: primera pasada + observer.
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', ()=>{ runFieldEnhancers(); startObserver(); });
  } else { runFieldEnhancers(); startObserver(); }
})();

/* ---------- Service worker (PWA offline) ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW no registrado:", err));
  });
}

</script>
</body>
