<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b2430">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestor">
<title>Stock Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var _t=localStorage.getItem("gstock_theme");if(_t==="dark"||(!_t&&window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)){document.documentElement.setAttribute("data-theme","dark");}else if(_t==="light"){document.documentElement.setAttribute("data-theme","light");}}catch(e){}</script>
<style>
  :root{
    --ink:#111317;
    --ink-soft:#2b2f36;
    --paper:#ffffff;
    --surface:#ffffff;
    --surface-2:#fafbfc;
    --line:#eaecef;
    --line-strong:#dde0e5;
    --accent:#1d4ed8;
    --accent-ink:#1d4ed8;
    --up:#1d4ed8;
    --up-bg:#eef2fb;
    --down:#dc2626;
    --down-bg:#fbeaea;
    --alert:#dc2626;
    --alert-bg:#fbeaea;
    --muted:#8a909b;
    --text:#111317;
    --radius:14px;
    --mono:"Spline Sans Mono",ui-monospace,"SF Mono","Menlo","Consolas",monospace;
    --sans:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --shadow:0 1px 2px rgba(17,19,23,.04);
    --side-bg:#f6f7f9;
    --side-hover:#eceef2;
    --nav-ink:#4b5563;
    --topbar-bg:#ffffff;
    --login-bg:#f4f5f7;
  }
  :root[data-theme="dark"]{
    --ink:#0b0e13;
    --paper:#0f141b;
    --surface:#161c25;
    --surface-2:#1d2530;
    --line:#28303c;
    --line-strong:#38424f;
    --accent:#4d82e8;
    --accent-ink:#7aa5f0;
    --up:#4d82e8;
    --up-bg:#17243b;
    --down:#f16a68;
    --down-bg:#3a1e1e;
    --alert:#f16a68;
    --alert-bg:#3a1e1e;
    --muted:#8b93a1;
    --text:#e6e9ee;
    --shadow:0 1px 2px rgba(0,0,0,.45);
    --side-bg:#12171f;
    --side-hover:#1d2530;
    --nav-ink:#c2c9d4;
    --topbar-bg:#12171f;
    --login-bg:#0b0f15;
  }
  :root[data-theme="dark"] .banner.warn{color:#f3b3b3;border-color:#5a2b2b}
  :root[data-theme="dark"] .banner.ok{color:var(--accent-ink);border-color:#264a6e}
  :root[data-theme="dark"] .login-card .inp{background:var(--surface-2)}
  :root[data-theme="dark"] .login-build{color:#5b6472}
  :root[data-theme="dark"] .modal{box-shadow:0 20px 60px rgba(0,0,0,.6)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--text);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
  :root[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.7)}
  input:focus-visible,select:focus-visible,button:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  /* ---------- Layout ---------- */
  :root{ --topbar-h:54px; }
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;padding-top:var(--topbar-h)}
  .side{
    background:var(--side-bg);color:var(--muted);padding:22px 16px;
    display:flex;flex-direction:column;gap:4px;position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));border-right:1px solid var(--line-strong);
  }

  /* ---------- Barra superior transparente (glass), scrollea por detrás ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:44;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 22px 0 18px;
    background:transparent;border-bottom:1px solid transparent;
    -webkit-backdrop-filter:blur(12px) saturate(1.15);backdrop-filter:blur(12px) saturate(1.15);
    transition:background .2s,border-color .2s;
  }
  .topbar.scrolled{ background:color-mix(in srgb, var(--paper) 72%, transparent); border-bottom-color:var(--line) }
  @supports not (background:color-mix(in srgb, red, blue)){ .topbar.scrolled{ background:var(--topbar-bg) } }
  .topbar .tb-brand{display:flex;align-items:center;gap:9px;min-width:0}
  .topbar .tb-mark{width:27px;height:27px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(29,78,216,.28)}
  .topbar .tb-mark svg{width:15px;height:15px}
  .topbar .tb-name{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.4px;white-space:nowrap}
  .topbar .tb-right{display:flex;align-items:center;gap:14px}
  .topbar .tb-sync{font-size:11.5px;font-weight:700;white-space:nowrap}
  @media (max-width:860px){ .topbar{display:none} }
  .brand{display:none}
  .brand-logo{border-radius:7px;flex-shrink:0;box-shadow:0 2px 8px rgba(17,19,23,.14)}
  .brand h1{font-size:15px;font-weight:800;color:var(--text);margin:0;letter-spacing:-.4px}
  .side-actions{display:flex;flex-direction:column;gap:6px;margin-top:14px;align-items:flex-start}
  .side-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;padding:0;border-radius:8px;
    background:none;border:1px solid transparent;color:var(--muted);
    transition:color .12s,background .12s,border-color .12s;
  }
  .side-btn:hover{color:var(--text);background:var(--side-hover);border-color:var(--line)}
  .side-btn.is-logout:hover{color:var(--down);border-color:var(--line-strong)}
  .side-btn svg{width:17px;height:17px;display:block}
  @keyframes side-spin{to{transform:rotate(360deg)}}
  .side-btn.spin svg{animation:side-spin .8s linear infinite;transform-origin:center}

  /* ---------- Switch de tema (deslizable, arriba a la derecha) ---------- */
  .theme-switch{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0}
  .theme-switch .ts-track{position:relative;display:block;width:60px;height:28px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line-strong);box-shadow:var(--shadow);transition:background .2s,border-color .2s}
  .theme-switch .ts-hint{position:absolute;top:0;height:100%;width:28px;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.5}
  .theme-switch .ts-hint svg{width:13px;height:13px}
  .theme-switch .ts-hint-sun{left:2px}
  .theme-switch .ts-hint-moon{right:2px}
  .theme-switch .ts-thumb{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:#e0a11a;transition:transform .22s ease,background .2s,color .2s}
  .theme-switch .ts-thumb svg{width:13px;height:13px}
  :root[data-theme="dark"] .theme-switch .ts-thumb{transform:translateX(32px);background:#e6e9ee;color:#3b4b66}
  .brand-m-logo{border-radius:6px;align-self:center;margin-right:6px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{
    position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:none;border:0;color:var(--nav-ink);padding:10px 12px;border-radius:8px;
    font-size:14px;font-weight:500;
    transition:background .18s ease,color .18s ease,transform .16s cubic-bezier(.34,1.56,.64,1);
    animation:navIn .34s ease both;
  }
  /* barrita de acento a la izquierda: crece al pasar el mouse sobre un ítem inactivo */
  .nav button::before{
    content:"";position:absolute;left:2px;top:50%;height:0;width:3px;border-radius:3px;
    background:var(--accent);transform:translateY(-50%);transition:height .2s cubic-bezier(.34,1.56,.64,1);
  }
  .nav button .ico{width:18px;text-align:center;font-family:var(--mono);font-size:14px;opacity:.7;transition:transform .18s ease,opacity .18s ease}
  .nav button:hover{background:var(--side-hover);color:var(--text)}
  .nav button:hover .ico{transform:scale(1.14)}
  .nav button:not(.on):hover{transform:translateX(3px)}
  .nav button:not(.on):hover::before{height:16px}
  .nav button.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(29,78,216,.24)}
  .nav button.on .ico{opacity:1;animation:navPop .32s cubic-bezier(.34,1.56,.64,1)}
  /* stagger de entrada: cada botón entra un toque después que el anterior */
  .nav button:nth-child(1){animation-delay:.02s}
  .nav button:nth-child(2){animation-delay:.06s}
  .nav button:nth-child(3){animation-delay:.10s}
  .nav button:nth-child(4){animation-delay:.14s}
  .nav button:nth-child(5){animation-delay:.18s}
  .nav button:nth-child(6){animation-delay:.22s}
  .nav button:nth-child(7){animation-delay:.26s}
  @keyframes navIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
  @keyframes navPop{0%{transform:scale(.82)}55%{transform:scale(1.18)}100%{transform:scale(1.05)}}
  /* fundido de entrada del contenido al cambiar de pestaña */
  #main.view-anim{animation:viewIn .26s ease}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .side .foot{margin-top:auto;padding:0 8px;font-size:11.5px;color:var(--muted);line-height:1.6}

  .main{padding:32px 44px 80px;max-width:1560px;width:100%;margin-inline:auto}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
  .head .title h2{font-size:26px;margin:0 0 3px;letter-spacing:-.4px;font-weight:650}
  .head .title p{margin:0;color:var(--muted);font-size:14px}
  .head .actions{display:flex;gap:9px;flex-wrap:wrap}

  /* ---------- Buttons ---------- */
  .btn{
    border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
    padding:9px 15px;border-radius:8px;font-size:14px;font-weight:550;
    display:inline-flex;align-items:center;gap:7px;transition:border-color .12s,background .12s;
  }
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
  .btn.up{background:var(--up);border-color:var(--up);color:#fff}
  .btn.up:hover{filter:brightness(.94)}
  .btn.down{background:var(--down);border-color:var(--down);color:#fff}
  .btn.down:hover{filter:brightness(.94)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:8px 10px}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.danger{color:var(--alert);border-color:var(--line-strong)}
  .btn.danger:hover{border-color:var(--alert);background:var(--alert-bg)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* ---------- Cards / KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:8px}
  .kpi .val{font-family:var(--sans);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.1}
  .kpi .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
  .kpi.warn .val{color:var(--alert)}
  /* Tarjeta de alerta clickeable: se levanta un toque al pasar el mouse */
  .kpi-click{transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
  .kpi-click:hover{transform:translateY(-2px);border-color:var(--alert);box-shadow:0 6px 18px rgba(220,38,38,.16)}
  .kpi-click:active{transform:translateY(0)}
  /* Banner de reposición: pulso suave para que "salte" al entrar al panel */
  .banner.alerta-pedido{cursor:pointer;align-items:center;transition:transform .14s ease,box-shadow .14s ease;animation:alertaPulse 1.8s ease-in-out 2}
  .banner.alerta-pedido:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(220,38,38,.18)}
  .banner.alerta-pedido u{text-underline-offset:2px}
  @keyframes alertaPulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}50%{box-shadow:0 0 0 4px rgba(220,38,38,.14)}}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel + .panel{margin-top:20px}
  .panel .phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .panel .phead h3{margin:0;font-size:15px;font-weight:620}
  .panel .phead .hint{font-size:12.5px;color:var(--muted)}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);
    position:sticky;top:0;
  }
  td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  td.r,th.r{text-align:right}
  td.c,th.c{text-align:center}
  .sku{font-family:var(--mono);font-size:13px;color:var(--accent-ink);background:var(--surface-2);padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
  .pill.in{background:var(--up-bg);color:var(--up)}
  .pill.out{background:var(--down-bg);color:var(--down)}
  .pill.low{background:var(--alert-bg);color:var(--alert)}
  .pill.adj{background:rgba(186,117,23,.14);color:#b26b0f}
  :root[data-theme="dark"] .pill.adj{background:rgba(239,159,39,.16);color:#efb35a}
  .delta.flat{color:var(--muted)}
  .delta{font-family:var(--mono);font-weight:600}
  .delta.up{color:var(--up)}
  .delta.down{color:var(--down)}
  .stock-cell{font-family:var(--mono);font-weight:600}
  .stock-cell.low{color:var(--alert)}
  .stock-cell.neg{color:var(--alert);font-weight:800}
  .stock-cell.zero{color:var(--alert);font-weight:800}

  /* ---------- Headers ordenables (clic en el título ordena) ---------- */
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{color:var(--text)}
  th .sarr{display:inline-block;margin-left:5px;font-size:10px;opacity:.32;transition:opacity .12s,color .12s;vertical-align:middle}
  th.sortable:hover .sarr{opacity:.65}
  th.sort-asc .sarr,th.sort-desc .sarr{opacity:1;color:var(--accent-ink)}

  /* ---------- Combobox de producto (buscador en línea de venta/compra) ---------- */
  .ppick{position:relative}
  .ppick-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;font-size:13.5px;color:var(--text);min-height:34px}
  .ppick-btn:hover{border-color:var(--muted)}
  .ppick-btn.open{border-color:var(--accent)}
  .ppick-btn .ppick-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .ppick-btn.placeholder .ppick-label{color:var(--muted)}
  .ppick-btn .ppick-caret{color:var(--muted);font-size:10px;flex-shrink:0}
  .ppick-pop{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line-strong);
    border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.28);width:360px;max-width:94vw;
    display:flex;flex-direction:column;overflow:hidden}
  .ppick-pop .ppick-search{margin:9px 9px 6px;width:calc(100% - 18px)}
  .ppick-list{max-height:280px;overflow:auto;padding:0 6px 8px}
  .ppick-item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:0;
    border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--text);line-height:1.35}
  .ppick-item:hover,.ppick-item.active{background:var(--surface-2)}
  .ppick-item .pi-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ppick-item .pi-disp{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex-shrink:0}
  .ppick-item.new{color:var(--accent);font-weight:600;border-top:1px solid var(--line);border-radius:0;margin-top:2px}
  .ppick-empty{padding:16px 12px;color:var(--muted);font-size:13px;text-align:center}

  .empty{padding:48px 24px;text-align:center;color:var(--muted)}
  .empty .big{font-family:var(--mono);font-size:34px;color:var(--line-strong);margin-bottom:10px}
  .empty p{margin:4px 0}
  .empty .hint{font-size:13px;max-width:440px;margin:10px auto 0}

  /* ---------- Forms / rows ---------- */
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .inp{border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;background:var(--surface);color:var(--text);width:100%}
  .inp:focus{border-color:var(--accent)}
  .inp.num{text-align:right}
  .grid-form{display:grid;gap:14px;padding:18px}

  /* line editor table inputs */
  table .inp{padding:6px 8px;font-size:13.5px;border-radius:6px}
  .line-tbl td{padding:7px 10px}
  .line-tbl select.inp{min-width:150px}

  /* ---------- Modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,26,34,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.28);width:100%;max-width:760px;overflow:hidden}
  .modal.wide{max-width:940px}
  .modal .mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal .mhead h3{margin:0;font-size:18px;font-weight:640}
  .modal .mbody{padding:20px 22px;max-height:66vh;overflow:auto}
  .modal .mfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-top:1px solid var(--line);background:var(--surface-2)}
  .x{background:none;border:0;font-size:22px;color:var(--muted);line-height:1;padding:4px 8px;border-radius:6px}
  .x:hover{background:var(--surface-2);color:var(--text)}

  .drop{
    border:2px dashed var(--line-strong);border-radius:12px;padding:30px 20px;text-align:center;
    background:var(--surface-2);transition:border-color .15s,background .15s;cursor:pointer;
  }
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--up-bg)}
  .drop .di{font-family:var(--mono);font-size:30px;color:var(--accent);margin-bottom:8px}
  .drop p{margin:4px 0;color:var(--muted);font-size:13.5px}
  .drop .fn{color:var(--accent-ink);font-weight:600}

  .rawbox{font-family:var(--mono);font-size:11.5px;line-height:1.55;background:var(--ink);color:#cbd5e1;border-radius:8px;padding:12px;max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  details{margin-top:14px}
  summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}

  .totrow{display:flex;justify-content:flex-end;gap:26px;padding:12px 4px;font-size:15px}
  .totrow .num{font-weight:650;font-size:17px}

  /* store switcher + power-bi style slicers */
  .storebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
  .storebar .sb-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
  .chip-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.12s;white-space:nowrap}
  .chip-btn:hover{border-color:var(--accent)}

  /* ---------- Toast ---------- */

<script>
/* ============================================================
   Gestor de Stock — vanilla, último costo, sincronizado
   ============================================================ */
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const KEY = "gstock_v1";
const SKEY = "gstock_sync";       // { syncedRev, dirty }
const SESKEY = "gstock_session";  // { user, token, space, role, store }

/* ============================================================
   MULTI-STORE / ROLES / LANGUAGE / SPECIAL STATES  (Phase 1)
   ------------------------------------------------------------
   STORES: separate selling entities. Stock, FIFO cost layers and
   sale price live PER STORE, but the product master is SHARED so we
   can compare the same SKU across stores (margin analysis, point 4).
   ROLES: 'admin' (a.k.a. master: sees everything incl. investment
   vault) and 'seller' (only their own store).
   PRODUCT STATE: 'sale' (normal) | 'blocked' (best-offer, visible to
   sellers with a flag, not sellable without approval) | 'investment'
   (executive hold, leaves the sellable inventory, admin-only vault).
   LANGUAGE: per-product tag JP | ESP.
   ============================================================ */
const STORES = [
  { id:"akira",  name:"Akira"  },
  { id:"silver", name:"Silver" }
];
const STORE_IDS = STORES.map(s=>s.id);
function storeName(id){ const s=STORES.find(x=>x.id===id); return s?s.name:(id||"—"); }
function isStore(id){ return STORE_IDS.includes(id); }

const ROLES = { ADMIN:"admin", SELLER:"seller" };
function currentRole(){ return (session && session.role) || ROLES.ADMIN; }  // Local mode (no session) = full access
function isAdmin(){ return currentRole()===ROLES.ADMIN; }
/* Stores this session is allowed to see. Admin => all; seller => just their own. */
function allowedStores(){
  if(isAdmin()) return STORE_IDS.slice();
  const s = session && session.store;
  return isStore(s) ? [s] : [];
}
/* The store currently in focus. 'all' = consolidated (admin only). */
let activeStore = "all";
function effectiveStores(){
  const allow = allowedStores();
  if(activeStore==="all") return allow;
  return allow.includes(activeStore) ? [activeStore] : allow;
}

const PRODUCT_STATES = { SALE:"sale", BLOCKED:"blocked", INVESTMENT:"investment" };
const LANGS = [["JP","JP"],["ESP","SP/ESP"]];
function langLabel(v){ const l=LANGS.find(x=>x[0]===v); return l?l[1]:(v||"—"); }

/* URL del servidor (Cloudflare Worker). Si algún día lo redeploya en otra
   cuenta/nombre, cambiar solo esta línea. */
const API_URL = "https://mayor-stock-api.juanbautistacrespialomar.workers.dev";

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- Estado local ---------- */
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){ console.warn("load fail", e); }
  return migrate({ config:{ moneda:"$" }, productos:[], compras:[], ventas:[], movimientos:[] });
}
/* Migración idempotente: completa campos nuevos sin romper datos viejos.
   - Costos desglosados: el costo total histórico (ultimoCosto) pasa a ser Neto
     (handling/flete arrancan en 0). El total sigue siendo ultimoCosto.
   - Jerarquía TCG (metadata, sin conversión de stock): categoría/nivel/factores.
   - Clientes y numeración US (arranca en 101). */
const PACKS_POR_BOX_DEF = 24;
const BOXES_POR_CASE = { "Pokémon TCG":6, "Magic":6, "One Piece TCG":12, "Yu-Gi-Oh!":12, "Disney Lorcana":4, "Digimon":12, "Dragon Ball":12, "Flesh and Blood":4 };
function boxesCaseDefault(cat){ return BOXES_POR_CASE[cat] || 6; }
function migrate(d){
  d.config = d.config || {};
  if(d.config.moneda==null) d.config.moneda = "$";
  if(d.config.facturaInicio==null) d.config.facturaInicio = 101;   // numeración US
  if(d.config.emisor==null) d.config.emisor = { nombre:"", direccion:"", email:"", tel:"" };
  d.productos = d.productos || [];
  d.compras = d.compras || [];
  d.ventas = d.ventas || [];
  d.movimientos = d.movimientos || [];
  d.clientes = d.clientes || [];
  d.solicitudes = d.solicitudes || [];   // approval requests for blocked items (point 5, MVP2)
  const r2 = n => Math.round((n||0)*100)/100;
  const DEF_STORE = STORE_IDS[0];   // "akira": target for legacy (store-less) stock
  d.productos.forEach(p=>{
    if(p.costoNeto==null){ p.costoNeto = p.ultimoCosto||0; p.costoHandling = 0; p.costoFlete = 0; }
    // total = neto+handling+flete; ultimoCosto stays as the canonical landed TOTAL (last purchase ref)
    if(p.ultimoCosto==null) p.ultimoCosto = r2((p.costoNeto||0)+(p.costoHandling||0)+(p.costoFlete||0));
    if(p.categoria==null) p.categoria = "";
    if(p.nivel==null) p.nivel = "unidad";
    if(p.packsPorBox==null) p.packsPorBox = PACKS_POR_BOX_DEF;
    if(p.boxesPorCase==null) p.boxesPorCase = boxesCaseDefault(p.categoria);

    // --- NEW: special state + language (points 5 & 10) ---
    if(p.estado==null) p.estado = PRODUCT_STATES.SALE;   // sale | blocked | investment
    if(p.idioma==null) p.idioma = "";                    // JP | ESP

    // --- NEW: per-store stock + FIFO cost layers (points 1 & 3) ---
    if(p.stockPorTienda==null){
      p.stockPorTienda = {};
      STORE_IDS.forEach(s=> p.stockPorTienda[s] = 0);
      // legacy single stock -> assign to the default store
      p.stockPorTienda[DEF_STORE] = p.stock||0;
    } else {
      STORE_IDS.forEach(s=>{ if(p.stockPorTienda[s]==null) p.stockPorTienda[s]=0; });
    }
    if(p.lotes==null){
      p.lotes = {};
      STORE_IDS.forEach(s=> p.lotes[s] = []);
      // seed one FIFO layer for pre-existing positive stock, at the known landed cost
      const seed = p.stockPorTienda[DEF_STORE];
      if(seed>0) p.lotes[DEF_STORE].push({ id:uid(), fecha:new Date().toISOString(), cantidad:seed, costoUnit:(p.ultimoCosto||0), ref:"opening balance" });
    } else {
      STORE_IDS.forEach(s=>{ if(!Array.isArray(p.lotes[s])) p.lotes[s]=[]; });
    }
    // per-store sale price (point 4: detect who marks the same product up)
    if(p.precioVentaPorTienda==null){
      p.precioVentaPorTienda = {};
      STORE_IDS.forEach(s=> p.precioVentaPorTienda[s] = p.precioVenta||0);
    } else {
      STORE_IDS.forEach(s=>{ if(p.precioVentaPorTienda[s]==null) p.precioVentaPorTienda[s]=(p.precioVenta||0); });
    }
    // keep p.stock as a DERIVED mirror (sum across stores) for backward-compat views
    p.stock = STORE_IDS.reduce((a,s)=> a + (p.stockPorTienda[s]||0), 0);
  });
  d.clientes.forEach(c=>{ if(c.pais==null) c.pais = ""; });   // country of buyer (point 7 slicer)
  return d;
}
/* ---- per-store helpers ---- */
function stockDe(p, store){ return (p.stockPorTienda && p.stockPorTienda[store]) || 0; }
function stockEnFoco(p){ return effectiveStores().reduce((a,s)=> a + stockDe(p,s), 0); }
function stockTotalP(p){ return STORE_IDS.reduce((a,s)=> a + stockDe(p,s), 0); }
function recalcStockMirror(p){ p.stock = stockTotalP(p); }
function esInversion(p){ return p.estado===PRODUCT_STATES.INVESTMENT; }
function esBloqueado(p){ return p.estado===PRODUCT_STATES.BLOCKED; }
/* products visible for normal SELLING views: excludes the investment vault always,
   and (for sellers) is later intersected with their store's stock. */
function productosVendibles(){ return db.productos.filter(p=> !esInversion(p)); }
let db = load();
function persistLocal(){ localStorage.setItem(KEY, JSON.stringify(db)); }

/* ---------- Sesión ---------- */
let session = loadSession();
function loadSession(){ try{ const r=localStorage.getItem(SESKEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function saveSession(){ if(session) localStorage.setItem(SESKEY, JSON.stringify(session)); else localStorage.removeItem(SESKEY); }

/* ---------- Sincronización con el servidor ---------- */
let syncMeta = loadSyncMeta();       // { syncedRev, dirty }
let syncState = session ? "idle" : "off";
let pushTimer = null;
let conflictPayload = null;

function loadSyncMeta(){ try{ const r=localStorage.getItem(SKEY); if(r) return JSON.parse(r); }catch(e){} return { syncedRev:0, dirty:false }; }
function saveSyncMeta(){ localStorage.setItem(SKEY, JSON.stringify(syncMeta)); }

function save(){
  persistLocal();
  if(session){ syncMeta.dirty=true; saveSyncMeta(); schedulePush(); }
}

function setSyncState(s){ syncState=s; paintSync(); }
function apiBase(){ return API_URL.replace(/\/+$/,""); }
function authHeaders(){ return { "Authorization":"Bearer "+(session?session.token:""), "Content-Type":"application/json" }; }
function stateUrl(){ return apiBase()+"/state?space="+encodeURIComponent(session?session.space:"main"); }

function schedulePush(){ if(!session) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>pushNow(), 800); }

async function pushNow(force=false){
  if(!session) return;
  setSyncState("saving");
  try{
    const res=await fetch(stateUrl(),{ method:"PUT", headers:authHeaders(), body:JSON.stringify({ data:db, baseRev:syncMeta.syncedRev, force }) });
    if(res.status===401){ toast("Session expired, sign in again","warn"); forceLogout(); return; }
    if(res.status===409){ conflictPayload=await res.json(); setSyncState("conflict"); toast("There is a newer version on the server","warn"); if(view==="datos") render(); return; }
    if(!res.ok) throw new Error("HTTP "+res.status);
    const j=await res.json();
    syncMeta.syncedRev=j.rev; syncMeta.dirty=false; saveSyncMeta();
    setSyncState("idle");
  }catch(e){ console.warn("push fail", e); setSyncState("offline"); }
}

async function pullNow(){
  if(!session) return;
  setSyncState("saving");
  try{
    const res=await fetch(stateUrl(),{ method:"GET", headers:authHeaders() });
    if(res.status===401){ toast("Session expired, sign in again","warn"); forceLogout(); return; }
    if(!res.ok) throw new Error("HTTP "+res.status);
    const j=await res.json();
    const serverRev=j.rev||0;
    if(!j.data){ if(hasData(db)) await pushNow(true); else { syncMeta.syncedRev=0; saveSyncMeta(); setSyncState("idle"); } return; }
    if(serverRev===syncMeta.syncedRev && !syncMeta.dirty){ setSyncState("idle"); return; }
    if(serverRev>syncMeta.syncedRev && !syncMeta.dirty){
      db=j.data; syncMeta.syncedRev=serverRev; syncMeta.dirty=false; saveSyncMeta(); persistLocal();
      setSyncState("idle"); render(); toast("Datos actualizados desde el servidor"); return;
    }
    if(syncMeta.dirty && serverRev!==syncMeta.syncedRev){ conflictPayload=j; setSyncState("conflict"); if(view==="datos") render(); return; }
    if(syncMeta.dirty){ await pushNow(); return; }
    setSyncState("idle");
  }catch(e){ console.warn("pull fail", e); setSyncState("offline"); }
}

function hasData(d){ return (d.productos&&d.productos.length)||(d.compras&&d.compras.length)||(d.ventas&&d.ventas.length); }

function resolveConflict(keepLocal){
  if(!conflictPayload) return;
  if(keepLocal){ syncMeta.syncedRev=conflictPayload.rev; saveSyncMeta(); pushNow(true); }
  else{
    db=conflictPayload.data; syncMeta.syncedRev=conflictPayload.rev; syncMeta.dirty=false; saveSyncMeta(); persistLocal();
    render(); toast("Took the server version");
  }
  conflictPayload=null; setSyncState("idle");
}

function paintSync(){
  const map={
    off:["●","Desconectado","var(--muted)"],
    idle:["●","Sincronizado","var(--up)"],
    saving:["◐","Guardando…","var(--accent)"],
    offline:["●","Sin conexión","var(--down)"],
    conflict:["▲","Conflicto","var(--alert)"]
  };
  const [dot,txt,col]=map[syncState]||map.off;
  document.querySelectorAll("[data-syncchip]").forEach(el=>{ el.style.color=col; el.textContent=dot+" "+txt; });
  document.querySelectorAll("[data-syncicon]").forEach(el=>{
    el.style.color = (syncState==="idle"||syncState==="off") ? "" : col;
    el.classList.toggle("spin", syncState==="saving");
    el.title = "Sincronizar · "+txt.toLowerCase();
  });
}

/* ---------- Login / Logout ---------- */
async function doLogin(){
  const user=(document.getElementById("loginUser").value||"").trim();
  const pass=document.getElementById("loginPass").value||"";
  const errEl=document.getElementById("loginErr");
  const btn=document.getElementById("loginBtn");
  errEl.textContent="";
  if(!user||!pass){ errEl.textContent="Completá usuario y contraseña"; return; }
  btn.disabled=true; btn.textContent="Entrando…";
  try{
    console.log("[login] POST", apiBase()+"/login", "user:", user);
    const res=await fetch(apiBase()+"/login",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({user,pass}) });
    console.log("[login] status", res.status);
    if(res.status===401){ errEl.textContent="Usuario o contraseña incorrectos"; return; }
    if(!res.ok){
      let msg="Error "+res.status;
      try{ const ej=await res.json(); if(ej.error) msg=ej.error; if(ej.detalle) msg+=" — "+ej.detalle; }catch(_){}
      errEl.textContent=msg;
      return;
    }
    const j=await res.json();
    console.log("[login] ok, entrando como", j.user, "role:", j.role);
    const switching = !session || session.user!==j.user;
    session={ user:j.user, token:j.token, space:j.space||"main", role:j.role||"admin", store:j.store||"" }; saveSession();
    // seller starts locked to their store; admin starts consolidated
    activeStore = (session.role==="seller" && isStore(session.store)) ? session.store : "all";
    if(view==="inv" && !isAdmin()) view="dash";
    if(switching){
      db={ config:{ moneda:(db.config&&db.config.moneda)||"$" }, productos:[], compras:[], ventas:[], movimientos:[], clientes:[], solicitudes:[] };
      persistLocal(); syncMeta={ syncedRev:0, dirty:false }; saveSyncMeta();
    }
    setSyncState("idle");
    hideLogin(); render(); paintSync();
    await pullNow();
  }catch(e){ console.error("[login] fallo:", e); errEl.textContent="No se pudo conectar con el servidor ("+(e&&e.message||e)+")"; }
  finally{ btn.disabled=false; btn.textContent="Entrar"; }
}
function logout(){
  if(!confirm("Cerrar sesión en este dispositivo. Tus datos siguen en el servidor. ¿Seguir?")) return;
  forceLogout();
}
/* Cierre forzado (token vencido / 401): sin confirmación, va derecho al login.
   Antes se llamaba a logout() acá y el confirm() aparecía sin que el usuario
   hubiera pedido salir; si cancelaba, quedaba con un token muerto reintentando. */

/* ---------- Formato ---------- */
const nf0 = new Intl.NumberFormat("es-AR",{maximumFractionDigits:2});
const nf2 = new Intl.NumberFormat("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const money = n => db.config.moneda + "\u00A0" + nf2.format(n||0);
const qty = n => nf0.format(n||0);
/* money() pero con guión cuando el valor es 0 / nulo. Lo usamos en precios de
   venta opcionales: si no hay precio cargado mostramos "—" en vez de "USD 0,00".
   El \u00A0 (espacio duro) ya deja el símbolo separado del número: "USD 92,10". */
const moneyOpt = (n, dash="—") => ((n||0) > 0 ? money(n) : dash);

/* Parseo tolerante de números en formato AR (1.234,56) o US (1,234.56) */
function parseNum(s){
  if(typeof s === "number") return s;
  if(!s) return 0;
  let t = String(s).trim().replace(/[^\d.,\-]/g,"");
  if(t==="") return 0;
  const lastComma = t.lastIndexOf(","), lastDot = t.lastIndexOf(".");
  if(lastComma > lastDot){            // coma decimal (AR)
    t = t.replace(/\./g,"").replace(",",".");
  } else {                            // punto decimal (US)
    t = t.replace(/,/g,"");
  }
  const v = parseFloat(t);
  return isNaN(v) ? 0 : v;
}

function prodById(id){ return db.productos.find(p=>p.id===id); }
function clienteById(id){ return db.clientes.find(c=>c.id===id); }
function clienteLinea(c){ return c ? (c.empresa ? `${c.nombre} · ${c.empresa}` : c.nombre) : ""; }
function clienteDireccion(c){
  if(!c) return "";
  return [c.direccion, [c.ciudad, c.estado, c.zip].filter(Boolean).join(", ")].filter(Boolean).join(" · ");
}
function findProdBySku(sku){
  if(!sku) return null;
  const s = sku.trim().toLowerCase();
  return db.productos.find(p => (p.sku||"").trim().toLowerCase() === s) || null;
}
/* ¿Ese SKU ya lo usa OTRO producto? Devuelve el producto en conflicto o null.
   - SKU vacío nunca colisiona (muchos productos pueden no tener código).
   - exceptId permite editar un producto sin chocar consigo mismo.
   Evita SKUs repetidos, que romperían findProdBySku al importar facturas
   (engancharía la compra al producto equivocado). */
function skuEnUso(sku, exceptId){
  const s = (sku||"").trim().toLowerCase();
  if(!s) return null;
  return db.productos.find(p => p.id!==exceptId && (p.sku||"").trim().toLowerCase()===s) || null;
}
/* FIFO valuation of the sellable stock in the stores currently in focus.
   Sums the actual cost layers, not stock×lastcost. Excludes the vault. */
function valorFifoEnFoco(p){
  return effectiveStores().reduce((a,s)=> a + fifoLayers(p,s).reduce((x,L)=>x+L.cantidad*L.costoUnit,0), 0);
}
function valorizacion(){
  return productosVendibles().reduce((a,p)=> a + valorFifoEnFoco(p), 0);
}
function unidadesTotales(){ return productosVendibles().reduce((a,p)=> a + stockEnFoco(p), 0); }
function bajoStock(p){ const s=stockEnFoco(p); return p.puntoRepedido>0 && s>0 && s <= p.puntoRepedido; }
function sinStock(p){ return stockEnFoco(p) <= 0; }
function necesitaPedido(p){ return !esInversion(p) && (sinStock(p) || bajoStock(p)); }

/* ============================================================
   Numeración CORRELATIVA de facturas de VENTA
   Formato: "FC 0001-0000001". Tomamos el mayor secuencial ya usado
   en db.ventas (parseando el patrón) y devolvemos el siguiente, sin
   huecos. Las compras siguen con N° libre (traen el del proveedor).
   ------------------------------------------------------------
   OJO: si borrás una venta que NO es la última, queda un hueco en la
   serie (comportamiento correcto: en la práctica se anula con nota de
   crédito, no se borra). Si borrás la última, ese número se reutiliza.
   ============================================================ */
/* Formato estadounidense: entero simple, sin punto de venta. Arranca en
   config.facturaInicio (101 por defecto) y toma el mayor ya usado + 1.
   Es SUGERIDO: el campo es editable en el modal de venta. */
function nextFacturaVenta(){
  const inicio = parseInt(db.config.facturaInicio,10) || 101;
  let max = inicio - 1;
  (db.ventas||[]).forEach(v=>{
    const n = parseInt(String(v.numero||"").replace(/[^\d]/g,""),10);
    if(!isNaN(n) && n>max) max=n;
  });
  return String(max+1);
}

/* ============================================================
   Banner de reposición: memoria de descarte por CONJUNTO
   El banner se muestra una sola vez y se queda hasta que lo tocás.
   Guardamos la "firma" (los IDs de todo lo que hay que reponer, ordenados).
   Si el conjunto cambia —entra o sale CUALQUIER producto, aunque la

/* Registrar movimiento. opts (opcional): { tipo, obs, fecha } */
/* moverStock: registers a kardex movement AND updates per-store stock.
   `store` is required now; movements carry the store dimension. */
function moverStock(prod, delta, valorUnit, refTipo, refId, ref, opts){
  opts = opts || {};
  const store = opts.store || STORE_IDS[0];
  if(!prod.stockPorTienda) prod.stockPorTienda = {};
  prod.stockPorTienda[store] = +(( (prod.stockPorTienda[store]||0) + delta )).toFixed(4);
  recalcStockMirror(prod);
  db.movimientos.push({
    id: uid(), fecha: opts.fecha || new Date().toISOString(),
    tipo: opts.tipo || (delta>=0 ? "entrada" : "salida"),
    productoId: prod.id, sku:prod.sku, nombre:prod.nombre, store,
    cantidad: Math.abs(delta), delta: delta, valorUnit, refTipo, refId, ref,
    obs: opts.obs || ""
  });
}

/* ============================================================
   FIFO ENGINE (point 3) — per store cost layers
   ------------------------------------------------------------
   A purchase PUSHES a layer {cantidad, costoUnit}. A sale CONSUMES
   layers oldest-first and returns the exact COGS. Avoids the average
   distortion when the same SKU was bought at different prices/stores.
   ============================================================ */
function fifoLayers(prod, store){
  if(!prod.lotes) prod.lotes = {};
  if(!Array.isArray(prod.lotes[store])) prod.lotes[store] = [];
  return prod.lotes[store];
}
/* Add a purchase layer (landed unit cost already includes prorated handling+freight). */
function fifoEntrada(prod, store, cantidad, costoUnit, ref, refId){
  fifoLayers(prod, store).push({ id:uid(), fecha:new Date().toISOString(), cantidad:+cantidad, costoUnit:round2(costoUnit), ref:ref||"", refId:refId||null });
}
/* Remove (or shrink) the layer(s) a given purchase created, when reverting it. */
function fifoQuitarCompra(prod, store, refId){
  if(!refId) return;
  prod.lotes[store] = fifoLayers(prod, store).filter(L=> L.refId!==refId);
}
/* Peek the FIFO cost of consuming `cantidad` WITHOUT mutating (for previews/margin). */
function fifoCostoPeek(prod, store, cantidad){
  let need = cantidad, cogs = 0;
  for(const L of fifoLayers(prod, store)){
    if(need<=0) break;
    const take = Math.min(L.cantidad, need);
    cogs += take * L.costoUnit; need -= take;
  }
  // if layers run short (legacy negative stock), value the remainder at last known cost
  if(need>0) cogs += need * (prod.ultimoCosto||0);
  return { cogs:round2(cogs), unit: cantidad>0 ? round2(cogs/cantidad) : 0, short: need>0 };
}
/* Consume layers FIFO, MUTATING them. Returns {cogs, unit, consumed:[{costoUnit,cantidad}]}
   so a later revert can put the exact units back into the right layers. */
function fifoConsumir(prod, store, cantidad){
  const layers = fifoLayers(prod, store);
  let need = cantidad, cogs = 0; const consumed = [];
  while(need>0 && layers.length){
    const L = layers[0];
    const take = Math.min(L.cantidad, need);
    cogs += take * L.costoUnit;
    consumed.push({ costoUnit:L.costoUnit, cantidad:take });
    L.cantidad = round4(L.cantidad - take);
    need -= take;
    if(L.cantidad<=0.00001) layers.shift();
  }
  if(need>0){ // shortfall: value at last cost, record synthetic layer to allow revert
    const c = prod.ultimoCosto||0;
    cogs += need*c; consumed.push({ costoUnit:c, cantidad:need, synthetic:true });
    need=0;
  }
  return { cogs:round2(cogs), unit: cantidad>0 ? round2(cogs/cantidad) : 0, consumed };
}
/* Undo a sale: push the consumed units back as layers at their original cost,
   oldest first (prepended) so FIFO order stays coherent. */
function fifoDevolver(prod, store, consumed){
  if(!consumed || !consumed.length) return;
  const layers = fifoLayers(prod, store);
  // rebuild in original order at the front
  for(let i=consumed.length-1;i>=0;i--){
    const c = consumed[i];
    if(c.synthetic) continue; // synthetic shortfall wasn't real stock
    layers.unshift({ id:uid(), fecha:new Date().toISOString(), cantidad:c.cantidad, costoUnit:c.costoUnit, ref:"revert" });
  }
}
const round4 = n => Math.round((n||0)*10000)/10000;

/* "Saga" = línea/juego, derivada del nombre del producto.
   Se normaliza fuerte para que NO se dupliquen por basura de formato:
   - se saca un SKU al principio ("PKM-JP-151 · Pokémon Card Game" -> "Pokémon Card Game")
   - se corta en el primer separador real ( :  ·  —  |  " - " )
   - se limpian rayas/guiones/puntos sueltos al final (lo que hacía
     "Disney Lorcana", "Disney Lorcana -" y "Disney Lorcana —" tres sagas distintas)
   - y al final se mapea a un nombre canónico para los juegos conocidos
     (One Piece Card Game == One Piece TCG, Magic == MTG, etc.).            */

/* Alias -> nombre canónico. El primer patrón que matchea, gana. */
const SAGA_CANON = [
  { canon:"Pokémon TCG",       re:/pok[eé]?mon/i },
  { canon:"Magic",             re:/\bmagic\b|\bmtg\b|the\s+gathering/i },
  { canon:"One Piece TCG",     re:/one\s*piece|\bop-?op\d/i },
  { canon:"Disney Lorcana",    re:/lorcana/i },
  { canon:"Flesh and Blood",   re:/flesh\s*(and|&|\+)?\s*blood|\bfab\b/i },
  { canon:"Digimon",           re:/digimon/i },
  { canon:"Dragon Ball",       re:/dragon\s*ball|\bdbs\b/i },
  { canon:"Yu-Gi-Oh!",         re:/yu-?gi-?oh|\bygo\b/i },
];

function sagaDe(p){
  let n = (p.nombre||"").trim();
  if(!n) return "—";

  // 1) sacar SKU al inicio: TOKEN en mayúsculas/dígitos/guiones seguido de un separador
  //    ej "FAB-HVY-BST · Flesh and Blood" / "ACC-9P-SLEEVE · 9-pocket"
  n = n.replace(/^[A-Z0-9]{2,}(?:-[A-Z0-9]+)+\s*[·:\-—|]\s*/,"").trim();

  // 2) cortar en el primer separador "fuerte" para quedarnos con la familia
  const cut = n.split(/\s*[:·|]\s*|\s+[-—]\s+/)[0];
  let base = (cut || n).trim();

  // 3) limpiar puntuación/rayas/espacios sobrantes en las puntas
  base = base.replace(/^[\s\-—·:|]+|[\s\-—·:|]+$/g,"").replace(/\s{2,}/g," ").trim();

  // 4) si es un juego conocido, devolver el nombre canónico unificado
  for(const s of SAGA_CANON){ if(s.re.test(base) || s.re.test(n)) return s.canon; }

  // 5) fallback: si quedó muy largo, primeras 3 palabras (comportamiento previo, ya limpio)
  if(!base) return "—";
  const w = base.split(/\s+/);
  return w.length>3 ? w.slice(0,3).join(" ") : base;
}
function sagasUnicas(){
  return [...new Set(db.productos.map(sagaDe))].filter(s=>s&&s!=="—").sort((a,b)=>a.localeCompare(b,"es"));
}
/* Filtrado genérico de productos por {q,saga,estado,cmin,cmax,sortKey,sortDir} */
function filtrarProds(f){
  const q=(f.q||"").trim().toLowerCase();
  const cmin=f.cmin!==""&&f.cmin!=null?parseNum(f.cmin):null;
  const cmax=f.cmax!==""&&f.cmax!=null?parseNum(f.cmax):null;
  const out = db.productos.filter(p=>{
    if(esInversion(p)) return false;             // vault lives in its own panel
    const sf = stockEnFoco(p);                   // stock under the active store focus
    if(q){ const hay=((p.nombre||"")+" "+(p.sku||"")).toLowerCase(); if(!hay.includes(q)) return false; }
    if(f.saga && sagaDe(p)!==f.saga) return false;
    if(f.idioma && (p.idioma||"")!==f.idioma) return false;
    if(f.estado==="pedir" && !(p.puntoRepedido>0 && sf<=p.puntoRepedido)) return false;
    if(f.estado==="con" && !(sf>0)) return false;
    if(f.estado==="sin" && sf!==0) return false;
    if(f.estado==="bajo" && !(sf>0 && p.puntoRepedido>0 && sf<=p.puntoRepedido)) return false;
    if(f.estado==="neg" && !(sf<0)) return false;
    if(f.estado==="blocked" && !esBloqueado(p)) return false;
    const c=p.ultimoCosto||0;
    if(cmin!==null && c<cmin) return false;
    if(cmax!==null && c>cmax) return false;
    return true;
  });
  // Sort by column; default = valued ↓
  const key=f.sortKey||"valor";
  const dir=f.sortKey ? (f.sortDir==="asc"?1:-1) : -1;
  const valOf = p => {
    const sf = stockEnFoco(p);
    switch(key){
      case "sku":    return String(p.sku||"");
      case "nombre": return String(p.nombre||"");
      case "unidad": return String(p.unidad||"u");
      case "stock":  return sf;
      case "costo":  return p.ultimoCosto||0;
      case "pventa": return p.precioVenta||0;
      case "rep":    return p.puntoRepedido||0;
      case "valor":
      default:       return sf*(p.ultimoCosto||0);
    }
  };
  out.sort((a,b)=>{
    const va=valOf(a), vb=valOf(b);
    if(typeof va==="number") return dir*(va-vb);
    return dir*va.localeCompare(vb,"es",{numeric:true});
  });
  return out;
}
/* cicla orden en una columna: desc -> asc -> sin flecha, y re-renderiza la vista */
function cycleSort(f, k){
  if(f.sortKey!==k){ f.sortKey=k; f.sortDir="desc"; }
  else if(f.sortDir==="desc"){ f.sortDir="asc"; }
  else { f.sortKey=""; f.sortDir=""; }
  render();
}
function wireSortHeaders(f){
  document.querySelectorAll("#main th[data-sortk]").forEach(th=> th.onclick=()=>cycleSort(f, th.dataset.sortk));
}

/* Barras horizontales: items=[{label, sku, value}], fmt=formateador, color=CSS var */
function hbars(items, fmt, color){
  const vals = items.filter(i=> i.value>0);
  if(!vals.length) return `<div class="cempty">Sin datos para graficar.</div>`;
  const max = Math.max(...vals.map(i=>i.value)) || 1;
  return vals.map(i=>{
    const pct = Math.max(2, (i.value/max)*100);
    const c = i.color || color;
    const chip = i.sku ? `<span class="sku">${esc(i.sku)}</span> ` : "";
    const full = (i.sku?("["+i.sku+"] "):"") + i.label;
    return `<div class="crow">
      <div class="cl" title="${esc(full)}">${chip}${esc(i.label)}</div>
      <div class="ct"><div class="cf" style="width:${pct.toFixed(1)}%;background:${c}"></div></div>
      <div class="cv">${fmt(i.value)}</div>
    </div>`;
  }).join("");
}

function paisesVentas(){
  const set=new Set();
  db.ventas.forEach(v=>{ const c=(v.cliente&&v.cliente.pais)||""; if(c) set.add(c); });
  return [...set].sort();
}
/* Sales filtered by the active store focus + analysis slicers. Returns rows
   flattened to the line level with product, store, price, COGS and margin. */
function ventasFiltradas(){
  const stores = effectiveStores();
  const desde = anFiltros.desde ? new Date(anFiltros.desde+"T00:00:00") : null;
  const hasta = anFiltros.hasta ? new Date(anFiltros.hasta+"T23:59:59") : null;
  const rows=[];
  db.ventas.forEach(v=>{
    if(!stores.includes(v.store)) return;
    if(anFiltros.pais && ((v.cliente&&v.cliente.pais)||"")!==anFiltros.pais) return;
    const f=new Date(v.fecha+"T12:00:00");
    if(desde && f<desde) return;
    if(hasta && f>hasta) return;
    v.lineas.forEach(l=>{
      const p=prodById(l.productoId);
      if(anFiltros.saga && (p? sagaDe(p): "")!==anFiltros.saga) return;
      if(anFiltros.idioma && (p? (p.idioma||""):"" )!==anFiltros.idioma) return;
      const cogs = l.cogs!=null ? l.cogs : (l.costo||0)*l.cantidad;
      rows.push({ store:v.store, productoId:l.productoId, nombre:l.nombre, sku:l.sku,
        cantidad:l.cantidad, revenue:round2((l.precio||0)*l.cantidad), cogs:round2(cogs),
        pais:(v.cliente&&v.cliente.pais)||"", saga:p?sagaDe(p):"", idioma:p?(p.idioma||""):"" });
    });
  });
  return rows;
}

    <div class="slicer"><span>From</span><input type="date" id="an_desde" value="${esc(anFiltros.desde)}"></div>

  const charts = `

/* Encabezado ordenable: muestra ↑ (asc), ↓ (desc) o ↕ (inactivo, "sin flecha") */
function sortTh(f, key, label, align){
  const active = f.sortKey===key && f.sortDir;
  let cls = "sortable";
  if(active) cls += f.sortDir==="asc" ? " sort-asc" : " sort-desc";
  if(align) cls += " "+align;
  const arr = active ? (f.sortDir==="asc" ? "↑" : "↓") : "↕";
  return `<th class="${cls}" data-sortk="${key}">${esc(label)}<span class="sarr">${arr}</span></th>`;
}

/* Panel de KPIs de la vista (se recalcula sobre lo FILTRADO, así respeta las fechas).
   Margen = precio de venta − costo. El costo lo tomamos del snapshot de la línea
   (l.costo, se guarda desde ahora) y si el documento es viejo y no lo tiene,
   caemos al último costo actual del producto (aproximación honesta). */
function docKpisHTML(tipo, list){
  const isC = tipo==="compra";
  let total=0, uds=0, cogs=0;
  list.forEach(d=>{
    (d.lineas||[]).forEach(l=>{
      total += (l.cantidad||0)*(l.precio||0);
      uds   += (l.cantidad||0);
      if(!isC){
        const c = (l.cogs!=null) ? l.cogs : (l.cantidad||0)*((l.costo!=null)?l.costo:((prodById(l.productoId)||{}).ultimoCosto||0));
        cogs += (l.cogs!=null) ? l.cogs : c;
      }
    });
  });
  const n = list.length;
  if(isC){
    return `
    <div class="kpi"><div class="lbl">Purchases</div><div class="val">${n}</div><div class="sub">documents in range</div></div>
    <div class="kpi"><div class="lbl">Units bought</div><div class="val">${qty(uds)}</div><div class="sub">items in</div></div>
    <div class="kpi"><div class="lbl">Total bought</div><div class="val">${money(total)}</div><div class="sub">sum of invoices</div></div>
    <div class="kpi"><div class="lbl">Avg ticket</div><div class="val">${n?money(total/n):"—"}</div><div class="sub">per purchase</div></div>`;
  }
  const margen = total - cogs;
  const margenPct = total>0 ? (margen/total*100) : 0;
  return `
    <div class="kpi"><div class="lbl">Sales</div><div class="val">${n}</div><div class="sub">documents in range</div></div>
    <div class="kpi"><div class="lbl">Units sold</div><div class="val">${qty(uds)}</div><div class="sub">items out</div></div>
    <div class="kpi"><div class="lbl">Total sold</div><div class="val">${money(total)}</div><div class="sub">${n?`avg ticket ${money(total/n)}`:"—"}</div></div>
    <div class="kpi"><div class="lbl">Gross margin (FIFO)</div><div class="val">${money(margen)}</div><div class="sub">${total>0?`${nf0.format(margenPct)}% on revenue`:"load sales to see margin"}</div></div>`;
}

function filtrarDocs(tipo){
  const list = tipo==="compra" ? db.compras : db.ventas;
  const f = docFiltros[tipo];
  const q=(f.q||"").trim().toLowerCase();
  let out = list.filter(d=>{
    if(q){ const hay=((d.contraparte||"")+" "+(d.numero||"")).toLowerCase(); if(!hay.includes(q)) return false; }
    if(f.desde && (d.fecha||"") < f.desde) return false;
    if(f.hasta && (d.fecha||"") > f.hasta) return false;
    return true;
  });
  // Orden: si no hay columna activa, default = fecha ↓ (más reciente primero)
  const key = f.sortKey || "fecha";
  const dir = f.sortKey ? (f.sortDir==="asc" ? 1 : -1) : -1;
  const valOf = d => {
    switch(key){
      case "numero":      return String(d.numero||"");
      case "contraparte": return String(d.contraparte||"");
      case "items":       return (d.lineas||[]).reduce((a,l)=>a+(l.cantidad||0),0);
      case "total":       return d.total||0;
      case "fecha":
      default:            return String(d.fecha||"");
    }
  };
  out.sort((a,b)=>{
    const va=valOf(a), vb=valOf(b);
    if(typeof va==="number") return dir*(va-vb);
    return dir*va.localeCompare(vb,"es",{numeric:true});
  });
  return out;
}

function filtrarMovs(){
  const f=movFiltros;
  const stores=effectiveStores();
  const q=(f.q||"").trim().toLowerCase();
  const vmin=f.vmin!==""?parseNum(f.vmin):null, vmax=f.vmax!==""?parseNum(f.vmax):null;
  const out = db.movimientos.filter(m=>{
    if(m.store && !stores.includes(m.store)) return false;
    if(f.tipo && m.tipo!==f.tipo) return false;
    if(q){ const hay=((m.nombre||"")+" "+(m.sku||"")+" "+(m.ref||"")).toLowerCase(); if(!hay.includes(q)) return false; }
    if(f.saga && sagaDe({nombre:m.nombre})!==f.saga) return false;
    const fch=(m.fecha||"").slice(0,10);
    if(f.desde && fch < f.desde) return false;
    if(f.hasta && fch > f.hasta) return false;
    const v=m.valorUnit||0;
    if(vmin!==null && v<vmin) return false;
    if(vmax!==null && v>vmax) return false;
    return true;
  });
  const signed = m => (m.delta!=null)?m.delta:(m.tipo==="entrada"?(m.cantidad||0):-(m.cantidad||0));
  const key=f.sortKey||"fecha";
  const dir=f.sortKey ? (f.sortDir==="asc"?1:-1) : -1;
  const valOf = m => {
    switch(key){
      case "tipo":   return String(m.tipo||"");
      case "nombre": return String(m.nombre||"");
      case "cant":   return signed(m);
      case "valor":  return m.valorUnit||0;
      case "ref":    return String(m.ref||"");
      case "fecha":
      default:       return String(m.fecha||"");
    }
  };
  out.sort((a,b)=>{
    const va=valOf(a), vb=valOf(b);
    if(typeof va==="number") return dir*(va-vb);
    return dir*va.localeCompare(vb,"en",{numeric:true});
  });
  return out;
}
function renderMovRows(){
  const body=document.getElementById("movBody"); if(!body) return;
  const all=filtrarMovs();
  const list=all.slice(0,400);
  const showStore = allowedStores().length>1;
  const cols = showStore?8:7;
  body.innerHTML = list.map(m=>{
    const isAdj=m.tipo==="ajuste";
    const signed=(m.delta!=null)?m.delta:(m.tipo==="entrada"?m.cantidad:-m.cantidad);
    const up=signed>=0;
    const d=new Date(m.fecha);
    const fecha=d.toLocaleDateString("en-US")+" "+d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false});
    const pill=isAdj?`<span class="pill adj">⇄ adjust</span>`:`<span class="pill ${up?'in':'out'}">${up?'↑ in':'↓ out'}</span>`;
    const deltaCls=isAdj?"flat":(up?'up':'down');
    const accion=isAdj?`<button class="btn ghost sm" data-delaj="${m.id}" style="color:var(--alert)" title="Delete adjustment">${ICO.trash}</button>`:"";
    return `<tr>
      <td class="num">${fecha}</td>
      <td>${pill}</td>
      ${showStore?`<td>${esc(storeName(m.store))}</td>`:""}
      <td><span class="sku">${esc(m.sku||"—")}</span> ${esc(m.nombre)}</td>
      <td class="r delta ${deltaCls}">${up?'+':'−'}${qty(Math.abs(signed))}</td>
      <td class="r num">${money(m.valorUnit)}</td>
      <td class="num">${esc(m.ref||"—")}</td>
      <td class="r">${accion}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="${cols}" style="text-align:center;color:var(--muted);padding:22px">No movement matches the filters.</td></tr>`;
  const cnt=document.getElementById("movCount");
  const totalF=db.movimientos.filter(m=>!m.store||effectiveStores().includes(m.store)).length;
  if(cnt) cnt.textContent = (all.length===totalF?`${totalF} entries`:`${all.length} of ${totalF}`)+(list.length<all.length?` · showing 400`:"");
  body.querySelectorAll("[data-delaj]").forEach(b=> b.onclick=()=> deleteAjuste(b.dataset.delaj));
}
function wireMovFiltros(){
  if(!document.getElementById("movBody")) return;
  const upd=(k,el)=>{ movFiltros[k]=el.value; renderMovRows(); };
  document.getElementById("mq").oninput=e=>upd("q",e.target);
  document.getElementById("mtipo").onchange=e=>upd("tipo",e.target);
  document.getElementById("msaga").onchange=e=>upd("saga",e.target);
  document.getElementById("mdesde").onchange=e=>upd("desde",e.target);
  document.getElementById("mhasta").onchange=e=>upd("hasta",e.target);
  document.getElementById("mvmin").oninput=e=>upd("vmin",e.target);
  document.getElementById("mvmax").oninput=e=>upd("vmax",e.target);
  document.getElementById("mclear").onclick=()=>{
    movFiltros={ q:"", desde:"", hasta:"", tipo:"", saga:"", vmin:"", vmax:"", sortKey:"", sortDir:"" };
    render();   // resetea inputs + flechas
  };
  // Orden por columna: desc -> asc -> sin flecha
  document.querySelectorAll("#main th[data-sortk]").forEach(th=>{
    th.onclick=()=>{
      const k=th.dataset.sortk;
      if(movFiltros.sortKey!==k){ movFiltros.sortKey=k; movFiltros.sortDir="desc"; }
      else if(movFiltros.sortDir==="desc"){ movFiltros.sortDir="asc"; }
      else { movFiltros.sortKey=""; movFiltros.sortDir=""; }
      render();
    };
  });
  renderMovRows();
}
/* Borrar un ajuste manual: revierte su efecto en el stock y saca el asiento */
function deleteAjuste(id){
  const m=db.movimientos.find(x=>x.id===id && x.tipo==="ajuste"); if(!m) return;
  const p=prodById(m.productoId);
  const d=(m.delta!=null)?m.delta:0;
  const msg = p
    ? `¿Borrar este ajuste?\n\n${p.nombre}\nRevierte ${d>=0?'+':'−'}${qty(Math.abs(d))} u → stock ${qty(p.stock)} pasa a ${qty(+((p.stock||0)-d).toFixed(4))}.`
    : `¿Borrar este ajuste? (el producto ya no existe en el maestro)`;
  if(!confirm(msg)) return;
  if(p) p.stock = +((p.stock||0) - d).toFixed(4);
  db.movimientos = db.movimientos.filter(x=>x.id!==id);
  save(); toast("Ajuste borrado","warn"); render();
}

  const lo=m.querySelector("[data-logout]"); if(lo) lo.onclick=()=> logout();

  const cs=m.querySelector("[data-confserver]"); if(cs) cs.onclick=()=>resolveConflict(false);

  paintSync();
}

    ["p_wrapHand","p_wrapFlete"].forEach(w=> $(w).style.display = on?"":"none");
    $("p_wrapNeto").querySelector("label").textContent = on?"Net cost":"Net cost (= total)";
    $("p_cos").disabled = on;                 // si desglosás, el total es calculado
    if(on) recalcTotal(); else { $("p_neto").value = $("p_cos").value; }
  }
  function recalcTotal(){
    if(!$("p_desglosa").checked) return;
    const t = round2(parseNum($("p_neto").value)+parseNum($("p_hand").value)+parseNum($("p_flete").value));
    $("p_cos").value = t; syncMarkup("cos");
  }
  function totalCosto(){ return parseNum($("p_cos").value); }
  function pintarMargen(){
    const pv=parseNum($("p_pv").value), c=totalCosto();
    const mg = pv>0 ? (pv-c)/pv*100 : 0;
    $("p_mgReal").textContent = pv>0 ? `Real margin: ${nf0.format(mg)}% on revenue · ${money(pv-c)} per unit` : "Enter a price to see the real margin.";
  }
  function syncMarkup(from){
    const c=totalCosto();
    if(from==="mk" || from==="cos"){ const mk=parseNum($("p_mk").value); $("p_pv").value = round2(c*(1+mk/100)); }
    else if(from==="pv"){ $("p_mk").value = c>0 ? round2((parseNum($("p_pv").value)/c-1)*100) : 0; }
    pintarMargen();
  }
  $("p_desglosa").onchange=syncDesglose;
  ["p_neto","p_hand","p_flete"].forEach(k=> $(k).oninput=()=>{ recalcTotal(); });
  $("p_cos").oninput=()=>{ if(!$("p_desglosa").checked) $("p_neto").value=$("p_cos").value; syncMarkup("cos"); };
  $("p_mk").oninput=()=>syncMarkup("mk");
  $("p_pv").oninput=()=>syncMarkup("pv");
  $("p_cat").onchange=()=>{ $("p_bpc").value = boxesCaseDefault($("p_cat").value); };
  syncDesglose(); pintarMargen();
  $("p_sku").focus();
}
function saveProd(id){
  const g=x=>document.getElementById(x).value;
  const nom=g("p_nom").trim();
  if(!nom){ toast("Enter a name","warn"); return; }
  const sku=g("p_sku").trim();
  const dup=skuEnUso(sku, id);
  if(dup){ toast(`El SKU "${sku}" ya lo usa "${dup.nombre}"`,"warn"); return; }
  const desglosa = document.getElementById("p_desglosa").checked;
  const neto = parseNum(g("p_neto"));
  const hand = desglosa ? parseNum(g("p_hand")) : 0;
  const flete = desglosa ? parseNum(g("p_flete")) : 0;
  const total = round2(neto + hand + flete);           // = p_cos cuando desglosa; = neto si no
  const estado = document.getElementById("p_estado") ? g("p_estado") : PRODUCT_STATES.SALE;
  const idioma = document.getElementById("p_idioma") ? g("p_idioma") : "";
  const campos = {
    sku, unidad:g("p_uni").trim()||"u", nombre:nom,
    costoNeto:neto, costoHandling:hand, costoFlete:flete, ultimoCosto:total,
    precioVenta:parseNum(g("p_pv")), puntoRepedido:parseNum(g("p_rep")),
    categoria:g("p_cat"), nivel:g("p_niv"), estado, idioma,
    packsPorBox:parseNum(g("p_ppb"))||PACKS_POR_BOX_DEF, boxesPorCase:parseNum(g("p_bpc"))||boxesCaseDefault(g("p_cat"))
  };
  if(id){
    const p = prodById(id);
    Object.assign(p, campos);
    // keep per-store price in sync when admin edits the base price and there's a single store in focus
    if(!p.precioVentaPorTienda) p.precioVentaPorTienda={};
  } else {
    const stk=parseNum(g("p_stk"));
    const initStore = document.getElementById("p_store") ? g("p_store") : (effectiveStores()[0]||STORE_IDS[0]);
    const p=Object.assign(nuevoProductoBase(sku, nom, parseNum(g("p_pv"))), campos);
    STORE_IDS.forEach(s=> p.precioVentaPorTienda[s]=parseNum(g("p_pv")));
    db.productos.push(p);
    if(stk){
      fifoEntrada(p, initStore, stk, p.ultimoCosto, "Opening balance", null);
      moverStock(p, stk, p.ultimoCosto, "ajuste", null, "Opening balance", { store:initStore });
    }
  }
  save(); closeModal(); toast("Product saved"); render();
}
function delProd(id){
  const p=prodById(id);
  if(!confirm(`¿Eliminar "${p.nombre}"? No se borran sus movimientos históricos.`)) return;
  db.productos = db.productos.filter(x=>x.id!==id);
  save(); closeModal(); toast("Producto eliminado","warn"); render();
}

let draft = null;  // { tipo, contraparte, fecha, numero, lineas:[{key,productoId,sku,nombre,cantidad,precio}] }

function openDoc(tipo, pre){
  draft = pre || {
    tipo, contraparte:"", fecha:new Date().toISOString().slice(0,10),
    numero: tipo==="venta" ? nextFacturaVenta() : "",
    clienteId:"", envio:{ tipo:"free", monto:0 },
    handling:0, flete:0,

  if(draft.handling==null) draft.handling = 0;
  if(draft.flete==null) draft.flete = 0;

function blankLine(){ return { key:uid(), productoId:"", sku:"", nombre:"", cantidad:1, precio:0, precioVentaSugerido:0, crear:false, margen:0, costoRef:0 }; }

/* Unidades totales del documento (para prorratear costos adicionales). */
function unidadesDoc(){ return draft.lineas.reduce((a,l)=> a + (parseNum(l.cantidad)||0), 0); }
/* Total del documento: líneas + envío (venta). En compra el handling/flete NO
   suma al total facturado por el proveedor si vino aparte, pero acá lo sumamos
   para reflejar el desembolso total. */
function docTotal(){
  const base = totalLineas(draft.lineas);
  if(draft.tipo==="compra") return round2(base + (draft.handling||0) + (draft.flete||0));
  return round2(base + (draft.envio && draft.envio.tipo==="monto" ? (draft.envio.monto||0) : 0));
}
function pintarProrateo(){
  const h=document.getElementById("d_proHint"); if(!h) return;
  const u=unidadesDoc(), extra=(draft.handling||0)+(draft.flete||0);
  h.textContent = (extra>0 && u>0)
    ? `${money(extra)} split across ${qty(u)} u = ${money(extra/u)} per unit, added to each product cost.`
    : "Enter handling/freight; it prorates per unit on confirm.";
  refreshTotal();
}

/* ============================================================
   AJUSTE DE INVENTARIO (movimiento tipo "ajuste")
   ============================================================ */
let adjDraft = null;
function openAjuste(prodId){
  adjDraft = { productoId: prodId||"", store: effectiveStores()[0]||STORE_IDS[0], modo:"delta", cantidad:"", fecha:new Date().toISOString().slice(0,10), obs:"" };

}
function renderAjuste(){
  const p = prodById(adjDraft.productoId);
  const store = adjDraft.store;
  const opts = `<option value="">— pick —</option>` +
    db.productos.filter(x=>!esInversion(x)||isAdmin()).map(x=>`<option value="${x.id}" ${x.id===adjDraft.productoId?"selected":""}>${esc(x.sku?("["+x.sku+"] "):"")}${esc(x.nombre)}</option>`).join("");

    ? `<select class="inp" id="aj_store">${allowSt.map(s=>`<option value="${s}" ${s===store?"selected":""}>${esc(storeName(s))}</option>`).join("")}</select>`
    : `<input class="inp" value="${esc(storeName(store))}" disabled>`;
  let previewTxt = "";
  if(p && adjDraft.cantidad!=="" && !isNaN(+adjDraft.cantidad)){

    const nuevo = adjDraft.modo==="recuento" ? +adjDraft.cantidad : cur+(+adjDraft.cantidad);
    const delta = nuevo-cur;
    const col = delta===0?"var(--muted)":(delta>0?"var(--up)":"var(--down)");
    previewTxt = `<div class="banner ${delta>=0?'ok':'warn'}" style="margin:2px 0 0">Stock: <b>${qty(cur)}</b> → <b>${qty(nuevo)}</b> <span style="color:${col}">(${delta>=0?'+':'−'}${qty(Math.abs(delta))})</span></div>`;
  }
  const body = `
    <div class="grid-form" style="grid-template-columns:1fr 1fr;padding:0;margin-bottom:8px">
      <div class="field"><label>Product</label>
        <select class="inp" id="aj_prod">${opts}</select>
      </div>
      <div class="field"><label>Store</label>${storeSel}
        ${p?`<div style="font-size:11.5px;color:var(--muted);margin-top:4px">In store: <b class="num">${stockActual}</b> · last cost ${money(p.ultimoCosto)}</div>`:""}
      </div>
      <div class="field"><label>Adjustment type</label>
        <select class="inp" id="aj_modo">
          <option value="delta" ${adjDraft.modo==="delta"?"selected":""}>Difference (+/−)</option>
          <option value="recuento" ${adjDraft.modo==="recuento"?"selected":""}>Count (final stock)</option>
        </select>
      </div>
      <div class="field"><label>${adjDraft.modo==="recuento"?"Counted stock":"Quantity (+ add / − remove)"}</label>
        <input class="inp num" id="aj_cant" type="number" step="any" value="${esc(adjDraft.cantidad)}" placeholder="0"></div>
      <div class="field"><label>Date</label><input class="inp" type="date" id="aj_fe" value="${esc(adjDraft.fecha)}"></div>
      <div class="field"><label>Note (required)</label><input class="inp" id="aj_obs" value="${esc(adjDraft.obs)}" placeholder="e.g. breakage, physical count, supplier shortfall…"></div>
    </div>
    <div id="aj_prev">${previewTxt}</div>
  `;
  buildModal("Inventory adjustment", body, [
    {label:"Cancel", cls:"btn", act:()=>{ adjDraft=null; closeModal(); }},
    {label:"Record adjustment", cls:"btn", act:confirmAjuste}
  ]);
  const sync=()=>{
    adjDraft.productoId=document.getElementById("aj_prod").value;
    const st=document.getElementById("aj_store"); if(st) adjDraft.store=st.value;
    adjDraft.modo=document.getElementById("aj_modo").value;

  };
  document.getElementById("aj_prod").onchange=()=>{ sync(); renderAjuste(); };
  const st=document.getElementById("aj_store"); if(st) st.onchange=()=>{ sync(); renderAjuste(); };
  document.getElementById("aj_modo").onchange=()=>{ sync(); renderAjuste(); };
  document.getElementById("aj_cant").oninput=()=>{ sync(); renderAjuste(); document.getElementById("aj_cant").focus(); };
  document.getElementById("aj_obs").oninput=e=>adjDraft.obs=e.target.value;
  document.getElementById("aj_fe").oninput=e=>adjDraft.fecha=e.target.value;
}
function confirmAjuste(){
  const p = prodById(adjDraft.productoId);
  if(!p){ toast("Pick a product","warn"); return; }
  const store = adjDraft.store || STORE_IDS[0];
  if(adjDraft.cantidad==="" || isNaN(+adjDraft.cantidad)){ toast("Enter a valid quantity","warn"); return; }
  if(!adjDraft.obs.trim()){ toast("The note is required","warn"); return; }
  const cur = stockDe(p, store);
  const nuevo = adjDraft.modo==="recuento" ? +adjDraft.cantidad : cur+(+adjDraft.cantidad);
  const delta = +(nuevo-cur).toFixed(4);
  if(delta===0){ toast("The adjustment doesn't change stock","warn"); return; }
  if(nuevo < 0){ toast("Stock can't go negative","warn"); alert(`The adjustment would leave stock at ${qty(nuevo)}.\nStock can't be negative.`); return; }
  if(!confirm(`Confirm the adjustment?\n\n${p.nombre} · ${storeName(store)}\nStock ${qty(cur)} → ${qty(nuevo)} (${delta>=0?'+':'−'}${qty(Math.abs(delta))})\nReason: ${adjDraft.obs.trim()}`)) return;
  const ref = "Adjustment · " + adjDraft.obs.trim();
  const fechaISO = new Date(adjDraft.fecha+"T12:00:00").toISOString();
  // FIFO: positive adjustment adds a layer at last cost; negative consumes layers
  if(delta>0) fifoEntrada(p, store, delta, p.ultimoCosto||0, ref, null);
  else fifoConsumir(p, store, -delta);
  moverStock(p, delta, p.ultimoCosto||0, "ajuste", null, ref, { tipo:"ajuste", obs:adjDraft.obs.trim(), fecha:fechaISO, store });
  adjDraft=null; save(); closeModal();
  toast(`Adjustment recorded · ${delta>=0?'+':'−'}${qty(Math.abs(delta))} u`, delta>=0?"up":"down");
  render();
}

function prodOptions(sel, soloConStock){
  const lista = soloConStock ? db.productos.filter(p=> (p.stock||0) > 0) : db.productos;
  const opts = lista.map(p=>{
    const disp = soloConStock ? ` (disp: ${qty(p.stock)})` : "";
    return `<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.sku?("["+p.sku+"] "):"")}${esc(p.nombre)}${disp}</option>`;
  }).join("");
  const nuevo = soloConStock ? "" : `<option value="__new">＋ Crear producto nuevo…</option>`;
  const vacio = soloConStock && !lista.length
    ? `<option value="">— no hay productos con stock —</option>`
    : `<option value="">— elegir —</option>`;
  return vacio + opts + nuevo;
}

const round2 = n => Math.round((n||0)*100)/100;
/* Total de un documento = suma de subtotales YA redondeados a 2 decimales.
   Redondear por renglón y después sumar hace que el total guardado coincida
   exactamente con lo que se ve línea por línea (money() muestra 2 decimales),
   y evita el ruido de punto flotante tipo 92.10000000000001 al reconciliar. */
function totalLineas(arr){ return round2((arr||[]).reduce((a,x)=> a + round2((x.cantidad||0)*(x.precio||0)), 0)); }

/* ============================================================
   TASK 1 — Disponible por línea considerando TODO el documento
   Si un producto aparece en varias líneas de la MISMA factura, el
   tope de cada línea es: stock − lo ya comprometido en las otras líneas.
   Así no se puede meter 20 + 20 cuando hay 20.
   ============================================================ */
function stockBaseVenta(prodId){
  const p = prodById(prodId); if(!p) return 0;
  let s = p.stock || 0;
  // si estamos EDITando una venta, el stock "vuelve" antes de re-validar
  if(draft && draft.editingId){
    const old = (draft.tipo==="compra"?db.compras:db.ventas).find(x=>x.id===draft.editingId);
    if(old) old.lineas.forEach(l=>{ if(l.productoId===prodId) s += (draft.tipo==="compra" ? -(l.cantidad||0) : (l.cantidad||0)); });
  }
  return s;
}
function comprometidoOtras(prodId, exceptIdx){
  if(!prodId) return 0;
  return draft.lineas.reduce((a,l,idx)=> a + ((idx!==exceptIdx && l.productoId===prodId) ? (parseNum(l.cantidad)||0) : 0), 0);
}
function dispRestante(prodId, exceptIdx){
  return stockBaseVenta(prodId) - comprometidoOtras(prodId, exceptIdx);
}
/* Refresca los textos "disp / quedan" de todas las líneas de venta sin re-render
   (así no se pierde el foco del input mientras se tipea la cantidad). */
function updateDispInfos(){
  if(!draft || draft.tipo==="compra") return;
  document.querySelectorAll("#lineHost .disp-info").forEach(div=>{
    const i=+div.dataset.di, l=draft.lineas[i]; if(!l) return;
    const p=prodById(l.productoId);
    if(!p){ div.innerHTML=""; return; }
    const rem=dispRestante(l.productoId,i), comprom=comprometidoOtras(l.productoId,i);
    const over=(parseNum(l.cantidad)||0)>rem;
    div.style.color = over?"var(--alert)":"var(--muted)";
    div.innerHTML = `disp: ${qty(p.stock)}${comprom>0?` · quedan ${qty(rem)}`:""}${over?" · <b>excede stock</b>":""}`;
  });
}

/* ============================================================
   TASK 2 — Combobox de producto con buscador (orden alfabético)
   Reemplaza al <select> nativo: input de búsqueda + lista filtrable.
   El popup se posiciona con position:fixed sobre <body> para NO quedar
   recortado por el overflow del modal.
   ============================================================ */
let _pickerAnchor = null;
function pickerLabel(l){
  if(l.crear) return { txt:"＋ Producto nuevo", ph:false };
  if(l.productoId){ const p=prodById(l.productoId); return p ? { txt:(p.sku?("["+p.sku+"] "):"")+p.nombre, ph:false } : { txt:"— pick product —", ph:true }; }
  return { txt:"— pick product —", ph:true };
}
function pickerBtn(l, i){
  const {txt, ph} = pickerLabel(l);
  return `<button type="button" class="ppick-btn${ph?" placeholder":""}" data-ppick="${i}">
    <span class="ppick-label">${esc(txt)}</span><span class="ppick-caret">▾</span></button>`;
}
function pickerItemsHTML(i, q){
  const isC = draft.tipo==="compra";
  const cur = draft.lineas[i].productoId;
  q = (q||"").trim().toLowerCase();
  let lista = isC ? db.productos.slice()
                  : db.productos.filter(p=> (p.stock||0)>0 || p.id===cur);
  // orden alfabético SIEMPRE (task 2), por nombre
  lista.sort((a,b)=> String(a.nombre||"").localeCompare(String(b.nombre||""),"es",{numeric:true}));
  if(q) lista = lista.filter(p=> ((p.nombre||"")+" "+(p.sku||"")).toLowerCase().includes(q));
  let html = lista.map(p=>{
    const sku = p.sku ? `<span class="sku">${esc(p.sku)}</span>` : "";
    let disp = "";
    if(!isC){ disp = `<span class="pi-disp">disp ${qty(dispRestante(p.id,i))}</span>`; }
    const sel = p.id===cur ? " active" : "";
    return `<button type="button" class="ppick-item${sel}" data-pick="${p.id}">${sku}<span class="pi-name">${esc(p.nombre)}</span>${disp}</button>`;
  }).join("");
  if(!lista.length){
    const hayStock = db.productos.some(p=>(p.stock||0)>0);
    html = `<div class="ppick-empty">${isC ? "No hay productos que coincidan." : (hayStock?"No product with stock matches.":"No hay productos con stock disponible.")}</div>`;
  }
  if(isC) html += `<button type="button" class="ppick-item new" data-pick="__new">＋ Crear producto nuevo…</button>`;
  return html;
}
function positionPicker(pop, anchor){
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth||360, h = pop.offsetHeight||300;
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = r.left, top = r.bottom+6;
  if(left+w > vw-8) left = Math.max(8, vw-8-w);
  if(top+h > vh-8){ const above = r.top-6-h; top = above>8 ? above : Math.max(8, vh-8-h); }
  pop.style.left = left+"px"; pop.style.top = top+"px";
}
function repositionPicker(){ const pop=document.querySelector(".ppick-pop"); if(pop && _pickerAnchor) positionPicker(pop,_pickerAnchor); }
function onPickerOutside(e){ const pop=document.querySelector(".ppick-pop"); if(pop && !pop.contains(e.target) && (!_pickerAnchor || !_pickerAnchor.contains(e.target))) closeProductPicker(); }
function onPickerKey(e){ if(e.key==="Escape"){ e.stopPropagation(); e.preventDefault(); closeProductPicker(); } }
function closeProductPicker(){
  document.querySelectorAll(".ppick-pop").forEach(el=>el.remove());
  document.querySelectorAll(".ppick-btn.open").forEach(b=>b.classList.remove("open"));
  window.removeEventListener("scroll", repositionPicker, true);
  window.removeEventListener("resize", closeProductPicker);
  document.removeEventListener("mousedown", onPickerOutside, true);
  document.removeEventListener("keydown", onPickerKey, true);
  _pickerAnchor=null;
}
function openProductPicker(i, anchor){
  closeProductPicker();
  _pickerAnchor = anchor; anchor.classList.add("open");
  const pop = document.createElement("div"); pop.className="ppick-pop";
  pop.innerHTML = `<input class="inp ppick-search" placeholder="Buscar por nombre o SKU…" autocomplete="off" spellcheck="false"><div class="ppick-list"></div>`;
  document.body.appendChild(pop);
  const search = pop.querySelector(".ppick-search");
  const listEl = pop.querySelector(".ppick-list");
  const paint = (q)=>{
    listEl.innerHTML = pickerItemsHTML(i, q);
    listEl.querySelectorAll("[data-pick]").forEach(it=> it.onclick=()=>{ const v=it.dataset.pick; closeProductPicker(); applyProdSelection(i, v); });
  };
  paint("");
  search.oninput = ()=> paint(search.value);
  positionPicker(pop, anchor);
  window.addEventListener("scroll", repositionPicker, true);
  window.addEventListener("resize", closeProductPicker);
  setTimeout(()=>{ document.addEventListener("mousedown", onPickerOutside, true); document.addEventListener("keydown", onPickerKey, true); }, 0);
  search.focus();
}
/* Aplica la selección de producto en una línea (usado por el combobox). */
function applyProdSelection(i, value){
  const l = draft.lineas[i]; if(!l) return;
  const isC = draft.tipo==="compra";
  if(value==="__new"){ l.crear=true; l.productoId=""; l.sku=""; l.nombre=""; renderLines(); return; }
  l.crear=false; l.productoId=value;
  const p = prodById(value);
  if(p && isC && !l.precio){ l.precio = (p.costoNeto!=null?p.costoNeto:p.ultimoCosto); }
  if(p && !isC){
    l.costoRef = p.ultimoCosto||0;
    if(p.precioVenta>0){                          // trae el precio de lista y deriva el markup
      l.precio = p.precioVenta;
      l.margen = l.costoRef>0 ? round2((l.precio/l.costoRef-1)*100) : 0;
    } else {
      l.margen = l.margen||0;
      l.precio = round2(l.costoRef*(1+(l.margen||0)/100));
    }
    const rem = dispRestante(p.id, i);           // respetar stock restante al elegir
    if((parseNum(l.cantidad)||0) > rem) l.cantidad = Math.max(0, rem);
  }
  renderLines(); refreshTotal();
}
