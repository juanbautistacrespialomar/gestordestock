/* Registrar movimiento. opts (opcional): { tipo, obs, fecha } */
/* moverStock: registers a kardex movement AND updates per-store stock.
   `store` is required now; movements carry the store dimension. */
function moverStock(prod, delta, valorUnit, refTipo, refId, ref, opts){
  opts = opts || {};
  const store = opts.store || STORE_IDS[0];
  if(!prod.stockPorTienda) prod.stockPorTienda = {};
  prod.stockPorTienda[store] = +(( (prod.stockPorTienda[store]||0) + delta )).toFixed(4);
  recalcStockMirror(prod);
  db.movimientos.push({
    id: uid(), fecha: opts.fecha || new Date().toISOString(),
    tipo: opts.tipo || (delta>=0 ? "entrada" : "salida"),
    productoId: prod.id, sku:prod.sku, nombre:prod.nombre, store,
    cantidad: Math.abs(delta), delta: delta, valorUnit, refTipo, refId, ref,
    obs: opts.obs || ""
  });
}

/* ============================================================
   FIFO ENGINE (point 3) — per store cost layers
   ------------------------------------------------------------
   A purchase PUSHES a layer {cantidad, costoUnit}. A sale CONSUMES
   layers oldest-first and returns the exact COGS. Avoids the average
   distortion when the same SKU was bought at different prices/stores.
   ============================================================ */
function fifoLayers(prod, store){
  if(!prod.lotes) prod.lotes = {};
  if(!Array.isArray(prod.lotes[store])) prod.lotes[store] = [];
  return prod.lotes[store];
}
/* Add a purchase layer (landed unit cost already includes prorated handling+freight). */
function fifoEntrada(prod, store, cantidad, costoUnit, ref, refId){
  fifoLayers(prod, store).push({ id:uid(), fecha:new Date().toISOString(), cantidad:+cantidad, costoUnit:round2(costoUnit), ref:ref||"", refId:refId||null });
}
/* Remove (or shrink) the layer(s) a given purchase created, when reverting it. */
function fifoQuitarCompra(prod, store, refId){
  if(!refId) return;
  prod.lotes[store] = fifoLayers(prod, store).filter(L=> L.refId!==refId);
}
/* Peek the FIFO cost of consuming `cantidad` WITHOUT mutating (for previews/margin). */
function fifoCostoPeek(prod, store, cantidad){
  let need = cantidad, cogs = 0;
  for(const L of fifoLayers(prod, store)){
    if(need<=0) break;
    const take = Math.min(L.cantidad, need);
    cogs += take * L.costoUnit; need -= take;
  }
  // if layers run short (legacy negative stock), value the remainder at last known cost
  if(need>0) cogs += need * (prod.ultimoCosto||0);
  return { cogs:round2(cogs), unit: cantidad>0 ? round2(cogs/cantidad) : 0, short: need>0 };
}
/* Consume layers FIFO, MUTATING them. Returns {cogs, unit, consumed:[{costoUnit,cantidad}]}
   so a later revert can put the exact units back into the right layers. */
function fifoConsumir(prod, store, cantidad){
  const layers = fifoLayers(prod, store);
  let need = cantidad, cogs = 0; const consumed = [];
  while(need>0 && layers.length){
    const L = layers[0];
    const take = Math.min(L.cantidad, need);
    cogs += take * L.costoUnit;
    consumed.push({ costoUnit:L.costoUnit, cantidad:take });
    L.cantidad = round4(L.cantidad - take);
    need -= take;
    if(L.cantidad<=0.00001) layers.shift();
  }
  if(need>0){ // shortfall: value at last cost, record synthetic layer to allow revert
    const c = prod.ultimoCosto||0;
    cogs += need*c; consumed.push({ costoUnit:c, cantidad:need, synthetic:true });
    need=0;
  }
  return { cogs:round2(cogs), unit: cantidad>0 ? round2(cogs/cantidad) : 0, consumed };
}
/* Undo a sale: push the consumed units back as layers at their original cost,
   oldest first (prepended) so FIFO order stays coherent. */
function fifoDevolver(prod, store, consumed){
  if(!consumed || !consumed.length) return;
  const layers = fifoLayers(prod, store);
  // rebuild in original order at the front
  for(let i=consumed.length-1;i>=0;i--){
    const c = consumed[i];
    if(c.synthetic) continue; // synthetic shortfall wasn't real stock
    layers.unshift({ id:uid(), fecha:new Date().toISOString(), cantidad:c.cantidad, costoUnit:c.costoUnit, ref:"revert" });
  }
}
const round4 = n => Math.round((n||0)*10000)/10000;

/* ============================================================
   FIFO GLOBAL (stock unificado para la VENTA) — punto 1
   ------------------------------------------------------------
   El stock es UNO SOLO para vender. Akira/Silver (y futuras
   sociedades) sólo dicen QUIÉN compró cada lote (procedencia): a
   la hora de vender NO se elige sociedad. El costo se toma FIFO
   por FECHA DE ENTRADA del lote, cruzando todas las sociedades.
   Ej: 10 comprados por Akira (día 1) + 40 por Silver (día 5); vendo
   20 -> consume 10 de Akira y 10 de Silver; Akira queda en 0, Silver 30.
   La bóveda de inversión (__inv) NO participa: está fuera del pool.
   ============================================================ */
/* Stock vendible total de un producto = suma de todas las sociedades (sin bóveda). */
function stockVendibleTotal(p){ return round4(STORE_IDS.reduce((a,s)=> a + stockDe(p,s), 0)); }
/* Todas las capas FIFO vendibles, cada una etiquetada con su sociedad, ordenadas
   por fecha de entrada ascendente (más viejo primero). Referencia a los objetos
   reales para poder mutarlos. `_ord` desempata capas con la misma fecha por su
   orden de inserción, para que el FIFO sea estable. */
function capasVendiblesOrdenadas(prod){
  const out = [];
  STORE_IDS.forEach(s=>{
    fifoLayers(prod, s).forEach((L, i)=> out.push({ sociedad:s, L, _ord:i }));
  });
  out.sort((a,b)=>{
    const fa = a.L.fecha||"", fb = b.L.fecha||"";
    if(fa<fb) return -1; if(fa>fb) return 1;
    return a._ord - b._ord;
  });
  return out;
}
/* Peek del costo FIFO global de consumir `cantidad` SIN mutar (previews/margen). */
function fifoCostoPeekGlobal(prod, cantidad){
  let need = cantidad, cogs = 0;
  for(const c of capasVendiblesOrdenadas(prod)){
    if(need<=0) break;
    const take = Math.min(c.L.cantidad, need);
    cogs += take * c.L.costoUnit; need -= take;
  }
  if(need>0) cogs += need * (prod.ultimoCosto||0);   // faltante -> último costo conocido
  return { cogs:round2(cogs), unit: cantidad>0 ? round2(cogs/cantidad) : 0, short: need>0 };
}
/* Consume capas FIFO GLOBAL (cruza sociedades), MUTANDO los lotes reales. Devuelve
   {cogs, unit, consumed:[{sociedad,costoUnit,cantidad}], porSociedad:{soc:{cantidad,cogs}}}.
   NO toca stockPorTienda: el llamador registra el kardex por sociedad con moverStock,
   que es quien decrementa el stock de cada sociedad (evita doble descuento). */
function fifoConsumirGlobal(prod, cantidad){
  let need = cantidad, cogs = 0; const consumed = []; const porSoc = {};
  // trabajamos sobre una lista ordenada; al vaciar una capa la quitamos de su array real
  let capas = capasVendiblesOrdenadas(prod);
  for(const c of capas){
    if(need<=0) break;
    const take = Math.min(c.L.cantidad, need);
    if(take<=0) continue;
    cogs += take * c.L.costoUnit;
    consumed.push({ sociedad:c.sociedad, costoUnit:c.L.costoUnit, cantidad:take });
    (porSoc[c.sociedad] = porSoc[c.sociedad] || { cantidad:0, cogs:0 });
    porSoc[c.sociedad].cantidad += take;
    porSoc[c.sociedad].cogs = round2(porSoc[c.sociedad].cogs + take*c.L.costoUnit);
    c.L.cantidad = round4(c.L.cantidad - take);
    need -= take;
  }
  // limpiar capas agotadas de sus arrays reales
  STORE_IDS.forEach(s=>{ prod.lotes[s] = fifoLayers(prod, s).filter(L=> L.cantidad>0.00001); });
  if(need>0){ // faltante (no debería pasar por la validación): valuar a último costo
    const cst = prod.ultimoCosto||0;
    cogs += need*cst;
    consumed.push({ sociedad:STORE_IDS[0], costoUnit:cst, cantidad:need, synthetic:true });
    (porSoc[STORE_IDS[0]] = porSoc[STORE_IDS[0]] || { cantidad:0, cogs:0 });
    porSoc[STORE_IDS[0]].cantidad += need;
    porSoc[STORE_IDS[0]].cogs = round2(porSoc[STORE_IDS[0]].cogs + need*cst);
    need = 0;
  }
  return { cogs:round2(cogs), unit: cantidad>0 ? round2(cogs/cantidad) : 0, consumed, porSociedad:porSoc };
}
/* Deshace una venta global: repone cada tramo consumido en la capa FIFO de SU
   sociedad (al frente, para conservar el orden). `fallbackSoc` cubre ventas viejas
   cuyo `consumed` no tiene etiqueta de sociedad (nacieron atadas a v.store).
   Devuelve el mapa {sociedad: unidades} repuesto, para reajustar el stock. */
function fifoDevolverGlobal(prod, consumed, fallbackSoc){
  const repuesto = {};
  if(!consumed || !consumed.length) return repuesto;
  for(let i=consumed.length-1;i>=0;i--){
    const c = consumed[i];
    if(c.synthetic) continue;   // el faltante sintético no era stock real
    const soc = isStore(c.sociedad) ? c.sociedad : (isStore(fallbackSoc)?fallbackSoc:STORE_IDS[0]);
    fifoLayers(prod, soc).unshift({ id:uid(), fecha:new Date().toISOString(), cantidad:c.cantidad, costoUnit:c.costoUnit, ref:"revert" });
    repuesto[soc] = round4((repuesto[soc]||0) + c.cantidad);
  }
  return repuesto;
}

/* ============================================================
   INVESTMENT TRANSFERS (points 2 & 4)
   ------------------------------------------------------------
   Moving stock to/from the vault is a REAL stock movement now, not a
   product flag. Each transfer:
     · consumes/creates FIFO layers so invested value is exact (at cost),
     · leaves a kardex movement in the SOURCE (or destination) store, so
       it shows up in Movements and in the product's kardex (point 2),
     · lets you pick quantities per store: all, part of each, or one only
       (point 4) — the caller passes an allocation map.
   The vault side (store = "__inv") holds units + cost layers but does NOT
   log its own kardex line, so the product's running balance stays equal to
   its sellable stock (no phantom double-counting for an auditor's eye).
   ============================================================ */
function sendToInvestment(prod, alloc, obs){
  let movedTotal = 0;
  STORE_IDS.forEach(s=>{
    const avail = stockDe(prod, s);
    const q = Math.min(Math.max(0, +(alloc[s]||0)), avail);
    if(q<=0) return;
    // exact FIFO cost of the units leaving this store
    const { unit, consumed } = fifoConsumir(prod, s, q);
    // source store: decrement stock + log a "→ vault" OUT movement (visible in Movements)
    moverStock(prod, -q, unit, "inversion", null, "→ Investment vault", { store:s, tipo:"inv-out", obs:obs||"" });
    // vault side: carry the real cost layers in, bump the vault bucket (no extra kardex line)
    consumed.forEach(c=>{ if(!c.synthetic) invLayers(prod).push({ id:uid(), fecha:new Date().toISOString(), cantidad:c.cantidad, costoUnit:c.costoUnit, ref:"from "+storeName(s) }); });
    prod.stockPorTienda[INV_STORE] = round4((prod.stockPorTienda[INV_STORE]||0) + q);
    movedTotal += q;
  });
  if(movedTotal>0) save();
  return movedTotal;
}
function returnFromInvestment(prod, store, q, obs){
  q = Math.min(Math.max(0, +q||0), invUnits(prod));
  if(q<=0) return 0;
  // consume vault layers FIFO to know the cost coming back
  const { unit, consumed } = fifoConsumir(prod, INV_STORE, q);
  prod.stockPorTienda[INV_STORE] = round4((prod.stockPorTienda[INV_STORE]||0) - q);
  // destination store: put the exact cost layers back so it can be sold at its real cost
  consumed.forEach(c=>{ if(!c.synthetic) fifoLayers(prod, store).push({ id:uid(), fecha:new Date().toISOString(), cantidad:c.cantidad, costoUnit:c.costoUnit, ref:"back from vault" }); });
  // log an IN movement in the destination store (visible in Movements)
  moverStock(prod, +q, unit, "inversion", null, "← from Investment vault", { store, tipo:"inv-return", obs:obs||"" });
  save();
  return q;
}

/* "Saga" = línea/juego, derivada del nombre del producto.
   Se normaliza fuerte para que NO se dupliquen por basura de formato:
   - se saca un SKU al principio ("PKM-JP-151 · Pokémon Card Game" -> "Pokémon Card Game")
   - se corta en el primer separador real ( :  ·  —  |  " - " )
   - se limpian rayas/guiones/puntos sueltos al final (lo que hacía
     "Disney Lorcana", "Disney Lorcana -" y "Disney Lorcana —" tres sagas distintas)
   - y al final se mapea a un nombre canónico para los juegos conocidos
     (One Piece Card Game == One Piece TCG, Magic == MTG, etc.).            */

/* Alias -> nombre canónico. El primer patrón que matchea, gana. */
const SAGA_CANON = [
  { canon:"Pokémon TCG",       re:/pok[eé]?mon/i },
  { canon:"Magic",             re:/\bmagic\b|\bmtg\b|the\s+gathering/i },
  { canon:"One Piece TCG",     re:/one\s*piece|\bop-?op\d/i },
  { canon:"Disney Lorcana",    re:/lorcana/i },
  { canon:"Flesh and Blood",   re:/flesh\s*(and|&|\+)?\s*blood|\bfab\b/i },
  { canon:"Digimon",           re:/digimon/i },
  { canon:"Dragon Ball",       re:/dragon\s*ball|\bdbs\b/i },
  { canon:"Yu-Gi-Oh!",         re:/yu-?gi-?oh|\bygo\b/i },
];

function sagaDe(p){
  let n = (p.nombre||"").trim();
  if(!n) return "—";

  // 1) sacar SKU al inicio: TOKEN en mayúsculas/dígitos/guiones seguido de un separador
  //    ej "FAB-HVY-BST · Flesh and Blood" / "ACC-9P-SLEEVE · 9-pocket"
  n = n.replace(/^[A-Z0-9]{2,}(?:-[A-Z0-9]+)+\s*[·:\-—|]\s*/,"").trim();

  // 2) cortar en el primer separador "fuerte" para quedarnos con la familia
  const cut = n.split(/\s*[:·|]\s*|\s+[-—]\s+/)[0];
  let base = (cut || n).trim();

  // 3) limpiar puntuación/rayas/espacios sobrantes en las puntas
  base = base.replace(/^[\s\-—·:|]+|[\s\-—·:|]+$/g,"").replace(/\s{2,}/g," ").trim();

  // 4) si es un juego conocido, devolver el nombre canónico unificado
  for(const s of SAGA_CANON){ if(s.re.test(base) || s.re.test(n)) return s.canon; }

  // 5) fallback: si quedó muy largo, primeras 3 palabras (comportamiento previo, ya limpio)
  if(!base) return "—";
  const w = base.split(/\s+/);
  return w.length>3 ? w.slice(0,3).join(" ") : base;
}
function sagasUnicas(){
  return [...new Set(db.productos.map(sagaDe))].filter(s=>s&&s!=="—").sort((a,b)=>a.localeCompare(b,"es"));
}
/* Filtrado genérico de productos por {q,saga,estado,cmin,cmax,sortKey,sortDir} */
function filtrarProds(f){
  const q=(f.q||"").trim().toLowerCase();
  const cmin=f.cmin!==""&&f.cmin!=null?parseNum(f.cmin):null;
  const cmax=f.cmax!==""&&f.cmax!=null?parseNum(f.cmax):null;
  const xs=f.xstate||"";   // "" (all) | "avail" | "transit"
  const out = db.productos.filter(p=>{
    if(soloEnVault(p)) return false;             // vault lives in its own panel
    // Punto 9: en vista de UN local, sólo productos que pertenecen a ese local
    if(activeStore!=="all" && !perteneceAStore(p, activeStore)) return false;
    const sf = stockEnFoco(p);                   // stock under the active store focus
    if(q){ const hay=((p.nombre||"")+" "+(p.sku||"")).toLowerCase(); if(!hay.includes(q)) return false; }
    if(f.saga && sagaDe(p)!==f.saga) return false;
    if(f.idioma && (p.idioma||"")!==f.idioma) return false;
    // En modo "in transit" listamos sólo productos con mercadería en camino y NO
    // aplicamos los filtros de stock disponible (miran otra cosa).
    if(xs==="transit"){
      if(transitoEnFoco(p)<=0) return false;
    } else {
      if(f.estado==="pedir" && !necesitaPedido(p)) return false;
      if(f.estado==="con" && !(sf>0)) return false;
      if(f.estado==="sin" && sf!==0) return false;
      if(f.estado==="bajo" && !(sf>0 && p.puntoRepedido>0 && sf<=p.puntoRepedido)) return false;
      if(f.estado==="neg" && !(sf<0)) return false;
      if(f.estado==="blocked" && !esBloqueado(p)) return false;
    }
    const c=p.ultimoCosto||0;
    if(cmin!==null && c<cmin) return false;
    if(cmax!==null && c>cmax) return false;
    return true;
  });
  // Sort by column; default = valued ↓
  const key=f.sortKey||"valor";
  const dir=f.sortKey ? (f.sortDir==="asc"?1:-1) : -1;
  const valOf = p => {
    const sf = stockEnFoco(p);
    switch(key){
      case "sku":    return String(p.sku||"");
      case "nombre": return String(p.nombre||"");
      case "unidad": return String(p.unidad||"u");
      case "stock":  return sf;
      case "costo":  return p.ultimoCosto||0;
      case "pventa": return p.precioVenta||0;
      case "rep":    return p.puntoRepedido||0;
      case "valor":
      default:       return sf*(p.ultimoCosto||0);
    }
  };
  out.sort((a,b)=>{
    const va=valOf(a), vb=valOf(b);
    if(typeof va==="number") return dir*(va-vb);
    return dir*va.localeCompare(vb,"es",{numeric:true});
  });
  return out;
}
/* cicla orden en una columna: desc -> asc -> sin flecha, y re-renderiza la vista */
function cycleSort(f, k){
  if(f.sortKey!==k){ f.sortKey=k; f.sortDir="desc"; }
  else if(f.sortDir==="desc"){ f.sortDir="asc"; }
  else { f.sortKey=""; f.sortDir=""; }
  render();
}

function filteredDashProds(){ return filtrarProds(dashFiltros); }
/* Punto 1: expande cada producto a una o dos filas de stock según el filtro:
   - "" (all): fila de disponible + fila de tránsito si hay mercadería en camino.
   - "avail": sólo disponible.  - "transit": sólo tránsito.
   Devuelve [{p, kind:"avail"|"transit"}]. */
function stockRowset(list, f){
  const xs = f.xstate || "";
  const rows = [];
  list.forEach(p=>{
    const trans = transitoEnFoco(p);
    if(xs==="transit"){ if(trans>0) rows.push({p, kind:"transit"}); }
    else if(xs==="avail"){ rows.push({p, kind:"avail"}); }
    else { rows.push({p, kind:"avail"}); if(trans>0) rows.push({p, kind:"transit"}); }
  });
  return rows;
}
function renderDashRows(){
  const body=document.getElementById("dashBody"); if(!body) return;
  const list=filteredDashProds();
  const showCols = showSociedadCols();
  const colspan = 5 + (showCols ? STORE_IDS.length : 0);

    const isT = kind==="transit";
    const units = isT ? transitoEnFoco(p) : stockEnFoco(p);
    const val   = isT ? transitoValorEnFoco(p) : valorFifoEnFoco(p);
    const costo = isT ? (transitoEnFoco(p)>0 ? round2(transitoValorEnFoco(p)/transitoEnFoco(p)) : (p.ultimoCosto||0)) : (p.ultimoCosto||0);
    let cls="stock-cell";
    if(isT) cls+=" transit";
    else { if(units<0) cls+=" neg"; else if(units===0) cls+=" zero"; else if(bajoStock(p)) cls+=" low"; }
    const flag = isT ? '<span class="inv-badge transit">⋯ in transit</span>'
               : esBloqueado(p) ? '<span class="pill blocked">blocked</span>'
               : units<0 ? '<span class="pill low">negative</span>'
               : bajoStock(p) ? '<span class="pill low">reorder</span>' : "";
    const perStore = sociedadColsCells(p, isT);
    return `<tr data-ficha="${p.id}" class="${isT?'row-transit':''}" style="cursor:pointer">
      <td><span class="sku">${esc(p.sku||"—")}</span></td>
      <td>${esc(p.nombre)} ${flag}</td>
      ${perStore}
      <td class="r ${cls}">${stockDisplay(p,units)}</td>
      <td class="r num">${money(costo)}</td>
      <td class="r num">${money(val)}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="${colspan}" style="text-align:center;color:var(--muted);padding:22px">No product matches the filters.</td></tr>`;
  const cnt=document.getElementById("dashCount");
  const total=productosVendibles().length;
  if(cnt) cnt.textContent = list.length===total ? "tap a product to see its history" : `showing ${list.length} of ${total}`;
  body.querySelectorAll("[data-ficha]").forEach(tr=> tr.onclick=()=> openFicha(tr.dataset.ficha));
}

/* Barras horizontales: items=[{label, sku, value}], fmt=formateador, color=CSS var */
function hbars(items, fmt, color){
  const vals = items.filter(i=> i.value>0);
  if(!vals.length) return `<div class="cempty">No data to chart.</div>`;
  const max = Math.max(...vals.map(i=>i.value)) || 1;
  return vals.map(i=>{
    const pct = Math.max(2, (i.value/max)*100);
    const c = i.color || color;
    const chip = i.sku ? `<span class="sku">${esc(i.sku)}</span> ` : "";
    const full = (i.sku?("["+i.sku+"] "):"") + i.label;
    const attr = i.saga ? ` data-saga="${esc(i.saga)}"` : "";
    return `<div class="crow"${attr}>
      <div class="cl" title="${esc(full)}">${chip}${esc(i.label)}</div>
      <div class="ct"><div class="cf" style="width:${pct.toFixed(1)}%;background:${c}"></div></div>
      <div class="cv">${fmt(i.value)}</div>
    </div>`;
  }).join("");
}

/* Donut interactivo (SVG puro, sin librerías). Click en un segmento o en la
   leyenda -> el centro muestra ese importe y su %. `cid` debe ser único por
   gráfico. Usa el truco de r=15.915 (circunferencia ≈ 100) para que el
   stroke-dasharray sea directamente el porcentaje. */
const DONUT_COLORS = ["#2563eb","#2dbd8f","#8a5cf6","#f0a935","#f16a68","#2b8fd9","#e069b6","#7c8b9a"];
function donut(cid, items, fmt){
  const data = items.filter(i=> i.value>0).sort((a,b)=> b.value-a.value);
  if(!data.length) return `<div class="cempty">No data to chart.</div>`;
  const total = data.reduce((a,i)=> a+i.value, 0);
  let cum = 0;
  const segs = data.map((i,idx)=>{
    const pct = total>0 ? (i.value/total*100) : 0;
    const off = 25 - cum;                 // recipe: arranca a las 12 en punto
    cum += pct;
    const col = DONUT_COLORS[idx % DONUT_COLORS.length];
    const seg = `<circle class="donut-seg" cx="21" cy="21" r="15.915" fill="none" stroke="${col}" stroke-width="6"
      stroke-dasharray="${pct.toFixed(3)} ${(100-pct).toFixed(3)}" stroke-dashoffset="${off.toFixed(3)}"
      data-idx="${idx}" data-lbl="${esc(i.label)}" data-vfmt="${esc(fmt(i.value))}" data-pct="${pct.toFixed(1)}"></circle>`;
    return { seg, col, pct, i, idx };
  });
  const svg = `<svg class="donut-svg" viewBox="0 0 42 42" data-donut="${esc(cid)}" data-totfmt="${esc(fmt(total))}">
    <circle cx="21" cy="21" r="15.915" fill="none" stroke="var(--surface-2)" stroke-width="6"></circle>
    ${segs.map(s=>s.seg).join("")}
    <text x="21" y="20.6" text-anchor="middle" font-size="3.6" class="donut-ctr-val" data-ctrval="1">${esc(fmt(total))}</text>
    <text x="21" y="24.4" text-anchor="middle" font-size="2.1" class="donut-ctr-lbl" data-ctrlbl="1">Total</text>
  </svg>`;
  const legend = `<div class="donut-legend">${segs.map(s=>`
    <div class="donut-leg" data-donut="${esc(cid)}" data-idx="${s.idx}">
      <span class="sw" style="background:${s.col}"></span>
      <span class="lg-lbl" title="${esc(s.i.label)}">${esc(s.i.label)}</span>
      <span class="lg-val">${esc(fmt(s.i.value))}</span>
      <span class="lg-pct">${s.pct.toFixed(0)}%</span>
    </div>`).join("")}</div>`;
  return `<div class="donut-wrap">${svg}${legend}</div>`;
}
/* Cada render rearma la lista de "limpiadores": funciones que devuelven un
   donut a su estado neutro (centro = total, sin segmento activo). El listener
   global de más abajo las usa para deseleccionar al tocar fuera del gráfico. */
let DONUT_CLEARERS = [];
function wireDonuts(){
  DONUT_CLEARERS = [];
  document.querySelectorAll('#main svg[data-donut]').forEach(svg=>{
    const ctrVal = svg.querySelector('[data-ctrval]');
    const ctrLbl = svg.querySelector('[data-ctrlbl]');
    const totFmt = svg.dataset.totfmt;
    const legend = svg.parentElement.querySelector('.donut-legend');
    let active = null;
    const paint = ()=>{
      const hasActive = active!=null;
      svg.classList.toggle('has-active', hasActive);
      svg.querySelectorAll('.donut-seg').forEach(s=> s.classList.toggle('on', +s.dataset.idx===active));
      if(legend) legend.querySelectorAll('.donut-leg').forEach(l=> l.classList.toggle('on', +l.dataset.idx===active));
      if(hasActive){
        const seg = svg.querySelector('.donut-seg[data-idx="'+active+'"]');
        ctrVal.textContent = seg.dataset.vfmt;
        ctrLbl.textContent = seg.dataset.pct + '% · ' + seg.dataset.lbl;
      } else {
        ctrVal.textContent = totFmt;
        ctrLbl.textContent = 'Total';
      }
    };
    const apply = (idx)=>{ active = (active===idx) ? null : idx; paint(); };
    const clear = ()=>{ if(active!=null){ active=null; paint(); } };
    // registramos el limpiador de este donut (para el click afuera / Escape)
    DONUT_CLEARERS.push(clear);
    svg.querySelectorAll('.donut-seg').forEach(s=> s.onclick=(e)=>{ e.stopPropagation(); apply(+s.dataset.idx); });
    if(legend) legend.querySelectorAll('.donut-leg').forEach(l=> l.onclick=(e)=>{ e.stopPropagation(); apply(+l.dataset.idx); });
  });
}
/* Limpia TODOS los donuts de la vista de una sola pasada. */
function clearAllDonuts(){ DONUT_CLEARERS.forEach(fn=>{ try{ fn(); }catch(e){} }); }
/* Listener global (se instala una única vez): un click en cualquier lado que NO
   caiga sobre un gráfico (ni su leyenda) devuelve todo a la normalidad. Idem Esc.
   Los clicks dentro de un segmento/leyenda ya frenan la propagación arriba, así
   que acá sólo llegan los clicks "de afuera". */
if(!window.__donutOutsideWired){
  window.__donutOutsideWired = true;
  document.addEventListener('click', (e)=>{
    if(e.target.closest && e.target.closest('.donut-wrap')) return; // click dentro: no tocar
    clearAllDonuts();
  });
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') clearAllDonuts(); });
}

/* Analysis slicers (point 7). Store comes from the global switcher (activeStore). */
let anFiltros = { vend:"", saga:"", idioma:"", pais:"", desde:"", hasta:"" };
let anMetric = "usd";   // "usd" | "units"  (punto 20: toggle de métrica en los gráficos)
/* Distinct customer countries seen in sales (for the country slicer). */
function paisesVentas(){
  const set=new Set();
  db.ventas.forEach(v=>{ const c=(v.cliente&&v.cliente.pais)||""; if(c) set.add(c); });
  return [...set].sort();
}
/* Sales filtered by the active store focus + analysis slicers. Returns rows
   flattened to the line level with product, store, price, COGS and margin. */
function ventasFiltradas(){
  const desde = anFiltros.desde ? new Date(anFiltros.desde+"T00:00:00") : null;
  const hasta = anFiltros.hasta ? new Date(anFiltros.hasta+"T23:59:59") : null;
  const rows=[];
  db.ventas.forEach(v=>{
    // Análisis es admin-only: se ven todas las ventas (el stock es un pool único,
    // la venta ya no está atada a una sociedad).
    if(anFiltros.vend && (v.vendedorId||"")!==anFiltros.vend) return;
    if(anFiltros.pais && ((v.cliente&&v.cliente.pais)||"")!==anFiltros.pais) return;
    const f=new Date(v.fecha+"T12:00:00");
    if(desde && f<desde) return;
    if(hasta && f>hasta) return;
    v.lineas.forEach(l=>{
      const p=prodById(l.productoId);
      if(anFiltros.saga && (p? sagaDe(p): "")!==anFiltros.saga) return;
      if(anFiltros.idioma && (p? (p.idioma||""):"" )!==anFiltros.idioma) return;
      const cogs = l.cogs!=null ? l.cogs : (l.costo||0)*l.cantidad;
      rows.push({ fecha:normISO(v.fecha)||v.fecha, vendedor:saleVendedorNombre(v), vendedorId:v.vendedorId||"", productoId:l.productoId, nombre:l.nombre, sku:l.sku,
        cantidad:l.cantidad, revenue:round2((l.precio||0)*l.cantidad), cogs:round2(cogs),
        pais:(v.cliente&&v.cliente.pais)||"", saga:p?sagaDe(p):"", idioma:p?(p.idioma||""):"" });
    });
  });
  return rows;
}
function viewAnalisis(){
  const rows = ventasFiltradas();
  const revenue = rows.reduce((a,r)=>a+r.revenue,0);
  const cogs = rows.reduce((a,r)=>a+r.cogs,0);
  const margin = round2(revenue-cogs);
  const marginPct = revenue>0 ? (margin/revenue*100) : 0;
  const units = rows.reduce((a,r)=>a+r.cantidad,0);

  // --- aggregations ---
  const by = (keyFn)=>{ const m={}; rows.forEach(r=>{ const k=keyFn(r); if(k==null||k==="") return; (m[k]=m[k]||{revenue:0,cogs:0,units:0}); m[k].revenue+=r.revenue; m[k].cogs+=r.cogs; m[k].units+=r.cantidad; }); return m; };
  const top = (obj, val, n=10)=> Object.entries(obj).map(([k,v])=>({label:k, value:val(v)})).sort((a,b)=>b.value-a.value).slice(0,n);

  const byProd = by(r=>r.nombre);
  const topRev = top(byProd, v=>v.revenue);
  const topMargin = top(byProd, v=>round2(v.revenue-v.cogs));
  const byVend = by(r=>r.vendedor);
  const byPais = by(r=>r.pais);
  const byLang = by(r=>langLabel(r.idioma));

  // Punto 20: métrica activa (USD o unidades) para los gráficos comparativos
  const mval = anMetric==="units" ? (v=>v.units) : (v=>v.revenue);
  const mfmt = anMetric==="units" ? qty : money;

  // Tendencia mensual (dimensión tiempo que faltaba): revenue por mes en la selección
  const byMonth = {};
  rows.forEach(r=>{ const k=(r.fecha||"").slice(0,7); if(!k) return; (byMonth[k]=byMonth[k]||{revenue:0,units:0}); byMonth[k].revenue+=r.revenue; byMonth[k].units+=r.cantidad; });
  const monthsSorted = Object.keys(byMonth).sort();
  const trend = monthsSorted.map(k=>{ const [y,m]=k.split("-"); return { label:`${_MONTHS3[(+m)-1]} ${y.slice(2)}`, value: anMetric==="units"?byMonth[k].units:byMonth[k].revenue }; });

  // --- Punto 2/6: rendimiento por vendedor (unidades, revenue, margen FIFO) ---
  const vendPerf = Object.entries(byVend)
    .map(([k,v])=>({ nombre:k, units:v.units, revenue:round2(v.revenue), margin:round2(v.revenue-v.cogs),
                     marginPct: v.revenue>0 ? ((v.revenue-v.cogs)/v.revenue*100) : 0 }))
    .sort((a,b)=>b.revenue-a.revenue);

  const kpis = `
  <div class="kpis">
    <div class="kpi"><div class="lbl">Revenue</div><div class="val">${money(revenue)}</div><div class="sub">${qty(units)} units sold</div></div>
    <div class="kpi"><div class="lbl">COGS (FIFO)</div><div class="val">${money(cogs)}</div><div class="sub">actual cost layers</div></div>
    <div class="kpi"><div class="lbl">Gross margin</div><div class="val">${money(margin)}</div><div class="sub">revenue − COGS</div></div>
    <div class="kpi"><div class="lbl">Margin %</div><div class="val">${revenue>0?nf0.format(marginPct)+"%":"—"}</div><div class="sub">on revenue</div></div>
  </div>`;

  const sagas=sagasUnicas(), paises=paisesVentas();
  const slicers = `
  <div class="slicers">
    <div class="slicer"><span>Seller</span><select id="an_vend"><option value="">All</option>${vendedores().map(v=>`<option value="${esc(v.id)}" ${anFiltros.vend===v.id?"selected":""}>${esc(v.nombre)}</option>`).join("")}</select></div>
    <div class="slicer"><span>Line</span><select id="an_saga"><option value="">All</option>${sagas.map(s=>`<option value="${esc(s)}" ${anFiltros.saga===s?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
    <div class="slicer"><span>Language</span><select id="an_idioma"><option value="">All</option>${LANGS.map(([v,l])=>`<option value="${v}" ${anFiltros.idioma===v?"selected":""}>${esc(l)}</option>`).join("")}</select></div>
    <div class="slicer"><span>Country</span><select id="an_pais"><option value="">All</option>${paises.map(c=>`<option value="${esc(c)}" ${anFiltros.pais===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
    <div class="slicer"><span>From</span><input type="date" id="an_desde" value="${esc(anFiltros.desde)}"></div>
    <div class="slicer"><span>To</span><input type="date" id="an_hasta" value="${esc(anFiltros.hasta)}"></div>
    <button class="slicer-reset" id="an_clear">Reset</button>
  </div>`;

  const charts = `
  <div class="chart-grid">
    <div class="panel chart" style="grid-column:1/-1">
      <p class="ctitle">Monthly trend</p>

      ${trend.length ? hbars(trend, mfmt, "var(--accent)") : `<div class="cempty">No sales in this selection.</div>`}
    </div>
    <div class="panel chart">
      <p class="ctitle">Top 10 products by ${anMetric==="units"?"units":"revenue"}</p>
      <p class="csub">Where the money comes from. Tap a bar to filter its line.</p>
      ${rows.length ? hbars(top(byProd, mval).map(t=>({label:t.label,value:t.value,saga:sagaOfName(t.label)})), mfmt, "var(--accent)") : `<div class="cempty">No sales in this selection.</div>`}
    </div>
    <div class="panel chart">
      <p class="ctitle">Top 10 products by gross margin</p>

      ${rows.length ? hbars(topMargin, money, "var(--up)") : `<div class="cempty">No sales in this selection.</div>`}
    </div>

        <tbody>${vendPerf.map(r=>`<tr><td>${esc(r.nombre)}</td><td class="r num">${qty(r.units)}</td><td class="r num">${money(r.revenue)}</td><td class="r num">${money(r.margin)}</td><td class="r num">${r.revenue>0?nf0.format(r.marginPct)+"%":"—"}</td></tr>`).join("")}</tbody>

/* saga (línea/juego) a partir del nombre de producto mostrado en un gráfico */

/* ============================================================
   VIEW: Investments vault (point 5) — admin only
   Products held as an executive decision NOT to sell. They leave the
   sellable inventory and are booked as investment at purchase cost.
   Future: will connect to the company-wide portfolio.
   ============================================================ */
function viewInversiones(){
  const items = db.productos.filter(esInversion);
  const totalCosto = items.reduce((a,p)=> a + invValor(p), 0);
  const totalUn = items.reduce((a,p)=> a + invUnits(p), 0);
  const rows = items.map(p=>{
    const un = invUnits(p), cost = invValor(p);
    return `<tr data-ficha="${p.id}" style="cursor:pointer">
      <td><span class="sku">${esc(p.sku||"—")}</span></td>
      <td>${esc(p.nombre)} <span class="pill inv">investment</span></td>
      <td class="c">${esc(langLabel(p.idioma))}</td>
      <td class="r num">${qty(un)}</td>
      <td class="r num">${money(un>0?cost/un:0)}</td>
      <td class="r num">${money(cost)}</td>
      <td class="r"><button class="btn ghost sm" data-invret="${p.id}">◈ Return</button></td>
    </tr>`;
  }).join("");
  return `
  <div class="head">
    <div class="title"><h2>Investments</h2><p>Executive-hold vault. Booked at FIFO purchase cost — outside the sellable inventory. Admin only.</p></div>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="lbl">Items in vault</div><div class="val">${items.length}</div><div class="sub">held SKUs</div></div>
    <div class="kpi"><div class="lbl">Units</div><div class="val">${qty(totalUn)}</div><div class="sub">held units</div></div>
    <div class="kpi"><div class="lbl">Invested (at cost)</div><div class="val">${money(totalCosto)}</div><div class="sub">FIFO purchase cost</div></div>
    <div class="kpi"><div class="lbl">Portfolio link</div><div class="val">—</div><div class="sub">coming soon</div></div>
  </div>
  <div class="panel">
    <div class="phead"><h3>Held products</h3><span class="hint">open a product and use “◈ To investments” to move units here (pick the quantity per society)</span></div>
    ${items.length ? `<div class="table-scroll"><table>
      <thead><tr><th>SKU</th><th>Product</th><th class="c">Lang</th><th class="r">Units</th><th class="r">Avg cost</th><th class="r">Invested</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`
      : emptyState("The vault is empty","Open any product from the Dashboard and use “◈ To investments” to move units here, out of the sellable stock.")}
  </div>`;
}

/* ============================================================
   VISTA: Productos
   ============================================================ */
function viewProd(){
  const total = productosVendibles().length;
  return `
  <div class="head">
    <div class="title"><h2>Products</h2><p>Item master. Cost updates with each purchase (last landed cost); COGS is FIFO.</p></div>
    <div class="actions">
      ${total?`<button class="btn" id="btnExpPrecios">⤓ Price list</button>`:""}
      ${(total&&isAdmin())?`<button class="btn" id="btnSel">${selMode?ICO.x+"Cancel":ICO.select+"Select"}</button>`:""}
      ${puedeEditarProductos()?`<button class="btn primary" data-newp>+ New product</button>`:""}
    </div>
  </div>
  <div class="panel">
    <div class="phead"><h3>Master</h3><span class="hint" id="prodCount">${total} items</span></div>
    <div class="selbar" id="selbar" style="display:none">
      <span id="selcount" class="sel-hint">Tick the products to export or delete…</span>
      <div style="flex:1"></div>
      <div id="selactions" style="display:none">
        <button class="btn ghost sm" id="selexp">${ICO.select}Export selected</button>
        <button class="btn ghost sm" id="selnone">Deselect</button>
        ${isAdmin()?`<button class="btn danger sm" id="seldel">${ICO.trash}Delete selected</button>`:""}
      </div>
    </div>
    ${total ? `
    ${filterBarHTML("p", prodFiltros)}
    <div class="table-scroll"><table>
      <thead><tr>${selMode?`<th class="c"><input type="checkbox" id="selall"></th>`:""}${sortTh(prodFiltros,"sku","SKU","")}${sortTh(prodFiltros,"nombre","Name","")}<th class="c">Lang</th>${sociedadColsHead()}${sortTh(prodFiltros,"stock",stockView==="cases"?"Stock (cases)":"Stock","r")}${sortTh(prodFiltros,"costo","Last cost","r")}${sortTh(prodFiltros,"pventa","List price","r")}<th></th></tr></thead>
      <tbody id="prodBody"></tbody></table></div>`
      : emptyState("The master is empty","Create your first product, or let them appear on their own when you import a purchase with new SKUs.")}

function renderProdRows(){
  const body=document.getElementById("prodBody"); if(!body) return;
  const list=filtrarProds(prodFiltros);
  const showCols = showSociedadCols();
  const cols = (selMode?1:0)+7+(showCols?STORE_IDS.length:0);
  body.innerHTML = stockRowset(list, prodFiltros).map(({p,kind})=>{
    const isT = kind==="transit";
    const units = isT ? transitoEnFoco(p) : stockEnFoco(p);
    let cls="stock-cell";
    if(isT) cls+=" transit";
    else { if(units<0) cls+=" neg"; else if(units===0) cls+=" zero"; else if(bajoStock(p)) cls+=" low"; }
    // en la fila de tránsito no tiene sentido el checkbox de selección
    const chk = selMode ? (isT ? `<td class="c"></td>` : `<td class="c" data-nofic><input type="checkbox" class="selchk" data-selp="${p.id}" ${selProd.has(p.id)?"checked":""}></td>`) : "";
    const flag = isT ? ' <span class="inv-badge transit">⋯ in transit</span>' : (esBloqueado(p) ? ' <span class="pill blocked">blocked</span>' : "");
    const cost = isT ? (transitoEnFoco(p)>0 ? round2(transitoValorEnFoco(p)/transitoEnFoco(p)) : (p.ultimoCosto||0)) : (p.ultimoCosto||0);
    const perStore = sociedadColsCells(p, isT);
    return `<tr data-ficha="${p.id}" class="${isT?'row-transit':''}" style="cursor:pointer">
      ${chk}
      <td><span class="sku">${esc(p.sku||"—")}</span></td>
      <td>${esc(p.nombre)}${flag}</td>
      <td class="c">${esc(langLabel(p.idioma))}</td>
      ${perStore}
      <td class="r ${cls}">${stockDisplay(p,units)}</td>
      <td class="r num">${money(cost)}</td>
      <td class="r num">${isT?"—":moneyOpt(p.precioVenta)}</td>
      <td class="r"><button class="btn ghost sm" data-editp="${p.id}">Edit</button></td>
    </tr>`;
  }).join("") || `<tr><td colspan="${cols}" style="text-align:center;color:var(--muted);padding:22px">No product matches the filters.</td></tr>`;
  const cnt=document.getElementById("prodCount");
  const total=productosVendibles().length;
  if(cnt) cnt.textContent = list.length===total ? `${total} items` : `showing ${list.length} of ${total}`;
  body.querySelectorAll("[data-ficha]").forEach(tr=> tr.onclick=()=> openFicha(tr.dataset.ficha));
  body.querySelectorAll("[data-editp]").forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); openProd(b.dataset.editp); });
  body.querySelectorAll("[data-nofic]").forEach(td=> td.onclick=e=>e.stopPropagation());
  body.querySelectorAll(".selchk").forEach(cb=>{
    cb.onclick=e=>e.stopPropagation();
    cb.onchange=()=>{ cb.checked?selProd.add(cb.dataset.selp):selProd.delete(cb.dataset.selp); refreshSelbar(); };
  });
  refreshSelbar();
}
function refreshSelbar(){
  const bar=document.getElementById("selbar"), count=document.getElementById("selcount"),
        all=document.getElementById("selall"), acts=document.getElementById("selactions");
  const n=selProd.size;
  if(bar) bar.style.display = selMode ? "flex" : "none";
  if(acts) acts.style.display = n===0 ? "none" : "flex";
  if(count) count.textContent = n===0 ? "Tick the products to export or delete…"
                                       : (n===1?"1 selected":`${n} selected`);
  if(count) count.className = n===0 ? "sel-hint" : "";
  if(all){ const vis=filtrarProds(prodFiltros); all.checked = vis.length>0 && vis.every(p=>selProd.has(p.id)); }
}
function wireProd(){
  const exp=document.getElementById("btnExpPrecios");
  if(exp) exp.onclick=()=>{
    const base = (selMode && selProd.size) ? db.productos.filter(p=>selProd.has(p.id)) : filtrarProds(prodFiltros);
    exportListaPrecios(base);
  };
  const btn=document.getElementById("btnSel");
  if(btn) btn.onclick=()=>{ selMode=!selMode; if(!selMode) selProd.clear(); render(); };
  if(!document.getElementById("prodBody")) return;
  [...selProd].forEach(id=>{ if(!prodById(id)) selProd.delete(id); });
  wireFilterBar("p", prodFiltros, renderProdRows);
  const all=document.getElementById("selall");
  if(all) all.onchange=()=>{
    const vis=filtrarProds(prodFiltros);
    if(all.checked) vis.forEach(p=>selProd.add(p.id)); else vis.forEach(p=>selProd.delete(p.id));
    renderProdRows();
  };
  const selexp=document.getElementById("selexp"); if(selexp) selexp.onclick=()=> exportListaPrecios(db.productos.filter(p=>selProd.has(p.id)));
  const none=document.getElementById("selnone"); if(none) none.onclick=()=>{ selProd.clear(); renderProdRows(); };
  const del=document.getElementById("seldel"); if(del) del.onclick=deleteSelProd;
  wireSortHeaders(prodFiltros);
  renderProdRows();
}
function deleteSelProd(){
  const ids=[...selProd]; if(!ids.length) return;
  const prods=ids.map(prodById).filter(Boolean);
  const conStock=prods.filter(p=>stockTotalP(p)!==0).length;
  const conMovs=prods.filter(p=>db.movimientos.some(m=>m.productoId===p.id)).length;
  let msg=`Delete ${prods.length} product(s) from the master?`;
  if(conStock) msg+=`\n\n⚠ ${conStock} have non-zero stock: deleting them removes those units from the valuation.`;
  if(conMovs) msg+=`\n\n⚠ ${conMovs} have kardex movements. History stays (name and SKU), but you won't be able to open their card.`;
  msg+="\n\nThis can't be undone.";
  if(!confirm(msg)) return;
  db.productos = db.productos.filter(p=>!selProd.has(p.id));
  selProd.clear(); selMode=false;
  save(); toast(`${prods.length} product(s) deleted`, "warn"); render();
}

/* Documentos visibles según rol/foco:
   - compras: se filtran por la sociedad en foco (el admin puede mirar una sola).
   - ventas: un vendedor ve SÓLO las suyas; el admin ve todas. */
function docsVisibles(tipo){
  if(tipo==="compra"){
    const stores = effectiveStores();
    return db.compras.filter(d=> stores.includes(d.store||STORE_IDS[0]));
  }
  if(isSeller()){
    const vid = currentVendedorId();
    return db.ventas.filter(v=> (v.vendedorId||"")===vid);
  }
  return db.ventas.slice();
}
/* Encabezado ordenable: muestra ↑ (asc), ↓ (desc) o ↕ (inactivo, "sin flecha") */
function sortTh(f, key, label, align){
  const active = f.sortKey===key && f.sortDir;
  let cls = "sortable";
  if(active) cls += f.sortDir==="asc" ? " sort-asc" : " sort-desc";
  if(align) cls += " "+align;
  const arr = active ? (f.sortDir==="asc" ? "↑" : "↓") : "↕";
  return `<th class="${cls}" data-sortk="${key}">${esc(label)}<span class="sarr">${arr}</span></th>`;
}

/* Panel de KPIs de la vista (se recalcula sobre lo FILTRADO, así respeta las fechas).
   Margen = precio de venta − costo. El costo lo tomamos del snapshot de la línea
   (l.costo, se guarda desde ahora) y si el documento es viejo y no lo tiene,
   caemos al último costo actual del producto (aproximación honesta). */
function docKpisHTML(tipo, list){
  const isC = tipo==="compra";
  let total=0, uds=0, cogs=0;
  list.forEach(d=>{
    // Punto 8: usar el TOTAL guardado del documento (incluye flete/handling y
    // el redondeo por renglón), así el KPI cuadra exacto con la columna Total
    // de la tabla de facturas. Fallback al cálculo por líneas para docs viejos.
    total += (d.total!=null) ? d.total : round2((d.lineas||[]).reduce((a,l)=>a+round2((l.cantidad||0)*(l.precio||0)),0) + (isC?((d.handling||0)+(d.flete||0)):0));
    (d.lineas||[]).forEach(l=>{
      uds   += (l.cantidad||0);
      if(!isC){
        const c = (l.cogs!=null) ? l.cogs : (l.cantidad||0)*((l.costo!=null)?l.costo:((prodById(l.productoId)||{}).ultimoCosto||0));
        cogs += (l.cogs!=null) ? l.cogs : c;
      }
    });
  });
  const n = list.length;
  if(isC){
    return `
    <div class="kpi"><div class="lbl">Purchases</div><div class="val">${n}</div><div class="sub">documents in range</div></div>
    <div class="kpi"><div class="lbl">Units bought</div><div class="val">${qty(uds)}</div><div class="sub">items in</div></div>
    <div class="kpi"><div class="lbl">Total bought</div><div class="val">${money(total)}</div><div class="sub">sum of invoices</div></div>
    <div class="kpi"><div class="lbl">Avg ticket</div><div class="val">${n?money(total/n):"—"}</div><div class="sub">per purchase</div></div>`;
  }
  const margen = total - cogs;
  const margenPct = total>0 ? (margen/total*100) : 0;
  const commKpi = isAdmin() ? `
    <div class="kpi"><div class="lbl">Commission</div><div class="val">${money(list.reduce((a,d)=>a+saleCommission(d),0))}</div><div class="sub">seller earnings on margin</div></div>` : "";
  return `
    <div class="kpi"><div class="lbl">Sales</div><div class="val">${n}</div><div class="sub">documents in range</div></div>
    <div class="kpi"><div class="lbl">Units sold</div><div class="val">${qty(uds)}</div><div class="sub">items out</div></div>
    <div class="kpi"><div class="lbl">Total sold</div><div class="val">${money(total)}</div><div class="sub">${n?`avg ticket ${money(total/n)}`:"—"}</div></div>
    <div class="kpi"><div class="lbl">Gross margin (FIFO)</div><div class="val">${money(margen)}</div><div class="sub">${total>0?`${nf0.format(margenPct)}% on revenue`:"load sales to see margin"}</div></div>
    ${commKpi}`;
}

function filtrarDocs(tipo){
  const list = docsVisibles(tipo);
  const f = docFiltros[tipo];
  const q=(f.q||"").trim().toLowerCase();
  let out = list.filter(d=>{
    if(q){ const hay=((d.contraparte||"")+" "+(d.numero||"")).toLowerCase(); if(!hay.includes(q)) return false; }
    if(f.desde && (d.fecha||"") < f.desde) return false;
    if(f.hasta && (d.fecha||"") > f.hasta) return false;
    return true;
  });
  // Orden: si no hay columna activa, default = fecha ↓ (más reciente primero)
  const key = f.sortKey || "fecha";
  const dir = f.sortKey ? (f.sortDir==="asc" ? 1 : -1) : -1;
  const valOf = d => {
    switch(key){
      case "numero":      return String(d.numero||"");
      case "contraparte": return String(d.contraparte||"");
      case "items":       return (d.lineas||[]).reduce((a,l)=>a+(l.cantidad||0),0);
      case "total":       return d.total||0;
      case "fecha":
      default:            return String(d.fecha||"");
    }
  };
  out.sort((a,b)=>{
    const va=valOf(a), vb=valOf(b);
    if(typeof va==="number") return dir*(va-vb);
    return dir*va.localeCompare(vb,"es",{numeric:true});
  });
  return out;
}

      <td class="r" style="white-space:nowrap">${(isC&&puedeComprar())?`<button class="btn ghost sm" data-invstatus="${d.id}">${received?'Mark in transit':'Mark received'}</button>`:""}<button class="btn ghost sm" data-vdoc="${tipo}:${d.id}">View</button>${tipo==="venta"?`<button class="btn ghost sm" data-copydoc="${tipo}:${d.id}">Copy</button>`:""}<button class="btn ghost sm" data-editdoc="${tipo}:${d.id}">Edit</button><button class="btn ghost sm" data-deldoc="${tipo}:${d.id}" style="color:var(--alert)">Delete</button></td>
    </tr>`;
  }).join("") || `<tr><td colspan="${cols}" style="text-align:center;color:var(--muted);padding:22px">No document matches the filters.</td></tr>`;
  const cnt=document.getElementById("docCount");

  body.querySelectorAll("[data-vdoc]").forEach(b=> b.onclick=()=>{ const[t,id]=b.dataset.vdoc.split(":"); verDoc(t,id); });
  body.querySelectorAll("[data-invstatus]").forEach(b=> b.onclick=()=> toggleInvoiceStatus(b.dataset.invstatus));

  body.querySelectorAll("[data-editdoc]").forEach(b=> b.onclick=()=>{ const[t,id]=b.dataset.editdoc.split(":"); editDoc(t,id); });
  body.querySelectorAll("[data-deldoc]").forEach(b=> b.onclick=()=>{ const[t,id]=b.dataset.deldoc.split(":"); deleteDoc(t,id); });
}
/* Punto 1: alterna el estado de una compra Y aplica su efecto sobre el stock.
   - in_transit -> received: la mercadería entra al inventario (FIFO + stock).
   - received -> in_transit: se saca del inventario. Si ya se vendió parte, el
     stock quedaría negativo: pedimos confirmación antes de proceder. */
function toggleInvoiceStatus(id){
  const c = db.compras.find(x=>x.id===id); if(!c) return;
  if(c.status===INVOICE_STATUS.RECEIVED){
    const store = c.store||STORE_IDS[0];
    const enRiesgo = c.lineas.filter(l=>{ const p=prodById(l.productoId); return p && stockDe(p,store) < l.cantidad; });
    if(enRiesgo.length){
      const det = enRiesgo.map(l=>`· ${l.nombre}`).join("\n");
      if(!confirm(`Some of this shipment was already sold, so moving it back to “in transit” will push stock negative at ${storeName(store)}:\n\n${det}\n\nContinue anyway?`)) return;
    }
    unreceiveInvoice(c);
    c.status = INVOICE_STATUS.IN_TRANSIT;
    toast("Invoice back in transit — stock removed", "warn");
  } else {
    receiveInvoice(c);
    c.status = INVOICE_STATUS.RECEIVED;
    toast("Received — stock added to inventory", "up");
  }
  save();
  if(document.getElementById("docBody")) renderDocRows("compra");
  else render();
}
function wireDocFiltros(){
  if(!document.getElementById("docBody")) return;
  const tipo = view==="compras" ? "compra" : "venta";
  const f=docFiltros[tipo];
  const upd=(k,el)=>{ f[k]=el.value; renderDocRows(tipo); };
  document.getElementById("dq").oninput=e=>upd("q",e.target);

function filtrarMovs(){
  const f=movFiltros;
  const stores=effectiveStores();
  const q=(f.q||"").trim().toLowerCase();
  const vmin=f.vmin!==""?parseNum(f.vmin):null, vmax=f.vmax!==""?parseNum(f.vmax):null;
  const out = db.movimientos.filter(m=>{
    if(m.store && !stores.includes(m.store)) return false;
    if(f.tipo){
      const isInv = m.tipo==="inv-out" || m.tipo==="inv-return";
      if(f.tipo==="inv"){ if(!isInv) return false; }
      else if(f.tipo==="entrada"){ if(m.tipo!=="entrada" && m.tipo!=="inv-return") return false; }
      else if(f.tipo==="salida"){ if(m.tipo!=="salida" && m.tipo!=="inv-out") return false; }
      else if(m.tipo!==f.tipo) return false;
    }
    if(q){ const hay=((m.nombre||"")+" "+(m.sku||"")+" "+(m.ref||"")).toLowerCase(); if(!hay.includes(q)) return false; }
    if(f.saga && sagaDe({nombre:m.nombre})!==f.saga) return false;
    const fch=(m.fecha||"").slice(0,10);
    if(f.desde && fch < f.desde) return false;
    if(f.hasta && fch > f.hasta) return false;
    const v=m.valorUnit||0;
    if(vmin!==null && v<vmin) return false;
    if(vmax!==null && v>vmax) return false;
    return true;
  });
  const signed = m => (m.delta!=null)?m.delta:(m.tipo==="entrada"?(m.cantidad||0):-(m.cantidad||0));
  const key=f.sortKey||"fecha";
  const dir=f.sortKey ? (f.sortDir==="asc"?1:-1) : -1;
  const valOf = m => {
    switch(key){
      case "tipo":   return String(m.tipo||"");
      case "nombre": return String(m.nombre||"");
      case "cant":   return signed(m);
      case "valor":  return m.valorUnit||0;
      case "ref":    return String(m.ref||"");
      case "fecha":
      default:       return String(m.fecha||"");
    }
  };
  out.sort((a,b)=>{
    const va=valOf(a), vb=valOf(b);
    if(typeof va==="number") return dir*(va-vb);
    return dir*va.localeCompare(vb,"en",{numeric:true});
  });
  return out;
}
function renderMovRows(){
  const body=document.getElementById("movBody"); if(!body) return;
  const all=filtrarMovs();
  const list=all.slice(0,400);
  const showStore = allowedStores().length>1;
  const cols = showStore?8:7;
  body.innerHTML = list.map(m=>{
    const isAdj=m.tipo==="ajuste";
    const isInv=m.tipo==="inv-out"||m.tipo==="inv-return";
    const signed=(m.delta!=null)?m.delta:(m.tipo==="entrada"?m.cantidad:-m.cantidad);
    const up=signed>=0;
    const d=new Date(m.fecha);
    const fecha=d.toLocaleDateString("en-US")+" "+d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false});
    const pill=isInv?`<span class="pill inv">◈ ${m.tipo==="inv-out"?"to vault":"from vault"}</span>`
               :isAdj?`<span class="pill adj">⇄ adjust</span>`
               :`<span class="pill ${up?'in':'out'}">${up?'↑ in':'↓ out'}</span>`;
    const deltaCls=isAdj?"flat":(up?'up':'down');
    const accion=isAdj?`<button class="btn ghost sm" data-delaj="${m.id}" style="color:var(--alert)" title="Delete adjustment">${ICO.trash}</button>`:"";
    return `<tr>
      <td class="num">${fecha}</td>
      <td>${pill}</td>
      ${showStore?`<td>${esc(storeName(m.store))}</td>`:""}
      <td><span class="sku">${esc(m.sku||"—")}</span> ${esc(m.nombre)}</td>
      <td class="r delta ${deltaCls}">${up?'+':'−'}${qty(Math.abs(signed))}</td>
      <td class="r num">${money(m.valorUnit)}</td>
      <td class="num">${esc(m.ref||"—")}</td>
      <td class="r">${accion}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="${cols}" style="text-align:center;color:var(--muted);padding:22px">No movement matches the filters.</td></tr>`;
  const cnt=document.getElementById("movCount");
  const totalF=db.movimientos.filter(m=>!m.store||effectiveStores().includes(m.store)).length;
  if(cnt) cnt.textContent = (all.length===totalF?`${totalF} entries`:`${all.length} of ${totalF}`)+(list.length<all.length?` · showing 400`:"");
  body.querySelectorAll("[data-delaj]").forEach(b=> b.onclick=()=> deleteAjuste(b.dataset.delaj));
}

/* Borrar un ajuste manual: revierte su efecto en el stock y saca el asiento */
function deleteAjuste(id){
  const m=db.movimientos.find(x=>x.id===id && x.tipo==="ajuste"); if(!m) return;
  const p=prodById(m.productoId);
  const d=(m.delta!=null)?m.delta:0;
  const msg = p
    ? `Delete this adjustment?\n\n${p.nombre}\nReverts ${d>=0?'+':'−'}${qty(Math.abs(d))} u → stock ${qty(p.stock)} becomes ${qty(+((p.stock||0)-d).toFixed(4))}.`
    : `Delete this adjustment? (the product no longer exists in the master)`;
  if(!confirm(msg)) return;
  if(p) p.stock = +((p.stock||0) - d).toFixed(4);
  db.movimientos = db.movimientos.filter(x=>x.id!==id);
  save(); toast("Adjustment deleted","warn"); render();
}

function openProd(id){
  const p = id ? prodById(id) : null;
  const neto = p?(p.costoNeto||0):0, hand = p?(p.costoHandling||0):0, fle = p?(p.costoFlete||0):0;
  const total = p?(p.ultimoCosto||0):0;

    {label:"Cancel",cls:"btn",act:closeModal},

  ].filter(Boolean), true);

  // --- Lógica de costo: total = neto+handling+flete cuando se desglosa ---
  const $=x=>document.getElementById(x);
  function syncDesglose(){
    const on = $("p_desglosa").checked;
    ["p_wrapHand","p_wrapFlete"].forEach(w=> $(w).style.display = on?"":"none");
    $("p_wrapNeto").querySelector("label").textContent = on?"Net cost":"Net cost (= total)";
    $("p_cos").disabled = on;                 // si desglosás, el total es calculado
    if(on) recalcTotal(); else { $("p_neto").value = $("p_cos").value; }
  }
  function recalcTotal(){
    if(!$("p_desglosa").checked) return;
    const t = round2(parseNum($("p_neto").value)+parseNum($("p_hand").value)+parseNum($("p_flete").value));
    $("p_cos").value = t; syncMarkup("cos");
  }
  function totalCosto(){ return parseNum($("p_cos").value); }
  function pintarMargen(){
    const pv=parseNum($("p_pv").value), c=totalCosto();
    const mg = pv>0 ? (pv-c)/pv*100 : 0;
    $("p_mgReal").textContent = pv>0 ? `Real margin: ${nf0.format(mg)}% on revenue · ${money(pv-c)} per unit` : "Enter a price to see the real margin.";
  }
  function syncMarkup(from){
    const c=totalCosto();
    if(from==="mk" || from==="cos"){ const mk=parseNum($("p_mk").value); $("p_pv").value = round2(c*(1+mk/100)); }
    else if(from==="pv"){ $("p_mk").value = c>0 ? round2((parseNum($("p_pv").value)/c-1)*100) : 0; }
    pintarMargen();
  }
  $("p_desglosa").onchange=syncDesglose;
  ["p_neto","p_hand","p_flete"].forEach(k=> $(k).oninput=()=>{ recalcTotal(); });
  $("p_cos").oninput=()=>{ if(!$("p_desglosa").checked) $("p_neto").value=$("p_cos").value; syncMarkup("cos"); };
  $("p_mk").oninput=()=>syncMarkup("mk");
  $("p_pv").oninput=()=>syncMarkup("pv");
  $("p_cat").onchange=()=>{ $("p_bpc").value = boxesCaseDefault($("p_cat").value); };
  syncDesglose(); pintarMargen();
  $("p_sku").focus();
}
function saveProd(id){
  const g=x=>document.getElementById(x).value;
  const nom=g("p_nom").trim();
  if(!nom){ toast("Enter a name","warn"); return; }
  const sku=g("p_sku").trim();
  const dup=skuEnUso(sku, id);
  if(dup){ toast(`El SKU "${sku}" ya lo usa "${dup.nombre}"`,"warn"); return; }
  const desglosa = document.getElementById("p_desglosa").checked;
  const neto = parseNum(g("p_neto"));
  const hand = desglosa ? parseNum(g("p_hand")) : 0;
  const flete = desglosa ? parseNum(g("p_flete")) : 0;
  const total = round2(neto + hand + flete);           // = p_cos cuando desglosa; = neto si no
  const estado = document.getElementById("p_estado") ? g("p_estado") : PRODUCT_STATES.SALE;
  const idioma = document.getElementById("p_idioma") ? g("p_idioma") : "";
  const campos = {
    sku, unidad:g("p_uni").trim()||"u", nombre:nom,
    costoNeto:neto, costoHandling:hand, costoFlete:flete, ultimoCosto:total,
    precioVenta:parseNum(g("p_pv")), puntoRepedido:parseNum(g("p_rep")),
    categoria:g("p_cat"), nivel:g("p_niv"), estado, idioma,
    packsPorBox:parseNum(g("p_ppb"))||PACKS_POR_BOX_DEF, boxesPorCase:parseNum(g("p_bpc"))||boxesCaseDefault(g("p_cat"))
  };
  if(id){
    const p = prodById(id);
    Object.assign(p, campos);
    // keep per-store price in sync when admin edits the base price and there's a single store in focus
    if(!p.precioVentaPorTienda) p.precioVentaPorTienda={};
  } else {
    const stk=parseNum(g("p_stk"));
    const initStore = document.getElementById("p_store") ? g("p_store") : (effectiveStores()[0]||STORE_IDS[0]);
    const p=Object.assign(nuevoProductoBase(sku, nom, parseNum(g("p_pv"))), campos);
    STORE_IDS.forEach(s=> p.precioVentaPorTienda[s]=parseNum(g("p_pv")));
    db.productos.push(p);
    if(stk){
      fifoEntrada(p, initStore, stk, p.ultimoCosto, "Opening balance", null);
      moverStock(p, stk, p.ultimoCosto, "ajuste", null, "Opening balance", { store:initStore });
    }
  }
  save(); closeModal(); toast("Product saved"); render();
}
function delProd(id){
  const p=prodById(id);
  if(!confirm(`Delete "${p.nombre}"? Its historical movements are kept.`)) return;
  db.productos = db.productos.filter(x=>x.id!==id);
  save(); closeModal(); toast("Product deleted","warn"); render();
}

let draft = null;  // { tipo, contraparte, fecha, numero, lineas:[{key,productoId,sku,nombre,cantidad,precio}] }

function openDoc(tipo, pre){
  // Punto 3: un vendedor no puede cargar compras.
  if(tipo==="compra" && !puedeComprar()){ toast("Only admins can load purchases","warn"); return; }
  draft = pre || {
    tipo, contraparte:"", fecha:new Date().toISOString().slice(0,10),
    numero: tipo==="venta" ? nextFacturaVenta() : "",
    clienteId:"", envio:{ tipo:"free", monto:0 },
    handling:0, flete:0,
    lineas:[ blankLine() ]
  };
  draft.tipo = tipo;
  if(!draft.envio) draft.envio = { tipo:"free", monto:0 };
  if(draft.handling==null) draft.handling = 0;
  if(draft.flete==null) draft.flete = 0;
  if(tipo==="compra"){
    // La compra elige SOCIEDAD (quién compra). Default: la sociedad en foco, o la primera.
    if(!draft.store || !STORE_IDS.includes(draft.store)){
      draft.store = (activeStore!=="all" && STORE_IDS.includes(activeStore)) ? activeStore : STORE_IDS[0];
    }
  } else {
    // La venta NO elige sociedad (pool unificado). Elige VENDEDOR (para la comisión).
    // Vendedor logueado => fijado a sí mismo. Admin => elige (o "— none —").
    if(isSeller()){
      draft.vendedorId = currentVendedorId() || "";
    } else if(draft.vendedorId===undefined){
      draft.vendedorId = "";   // admin arranca sin vendedor; lo elige en el combo
    }
  }
  renderDocModal();
}
function blankLine(){ return { key:uid(), productoId:"", sku:"", nombre:"", cantidad:1, precio:0, precioVentaSugerido:0, crear:false, margen:0, costoRef:0 }; }

    ],

  );
  renderLines();
  const dst=document.getElementById("d_store"); if(dst) dst.onchange=e=>{ draft.store=e.target.value; };

/* Unidades totales del documento (para prorratear costos adicionales). */
function unidadesDoc(){ return draft.lineas.reduce((a,l)=> a + (parseNum(l.cantidad)||0), 0); }
/* Total del documento: líneas + envío (venta). En compra el handling/flete NO
   suma al total facturado por el proveedor si vino aparte, pero acá lo sumamos
   para reflejar el desembolso total. */
function docTotal(){
  const base = totalLineas(draft.lineas);
  if(draft.tipo==="compra") return round2(base + (draft.handling||0) + (draft.flete||0));
  return round2(base + (draft.envio && draft.envio.tipo==="monto" ? (draft.envio.monto||0) : 0));
}
function pintarProrateo(){
  const h=document.getElementById("d_proHint"); if(!h) return;
  const u=unidadesDoc(), extra=(draft.handling||0)+(draft.flete||0);
  h.textContent = (extra>0 && u>0)
    ? `${money(extra)} split across ${qty(u)} u = ${money(extra/u)} per unit, added to each product cost.`
    : "Enter handling/freight; it prorates per unit on confirm.";
  refreshTotal();
}

      <div class="field"><label>Note (required)</label><input class="inp" id="aj_obs" value="${esc(adjDraft.obs)}" placeholder="e.g. breakage, physical count, supplier shortfall…"></div>
    </div>
    <div id="aj_prev">${previewTxt}</div>
  `;
  buildModal("Inventory adjustment", body, [
    {label:"Cancel", cls:"btn", act:()=>{ adjDraft=null; closeModal(); }},
    {label:"Record adjustment", cls:"btn", act:confirmAjuste}
  ]);
  const sync=()=>{
    adjDraft.productoId=document.getElementById("aj_prod").value;
    const st=document.getElementById("aj_store"); if(st) adjDraft.store=st.value;
    adjDraft.modo=document.getElementById("aj_modo").value;
    adjDraft.cantidad=document.getElementById("aj_cant").value;
    adjDraft.fecha=document.getElementById("aj_fe").value;
    adjDraft.obs=document.getElementById("aj_obs").value;
  };
  document.getElementById("aj_prod").onchange=()=>{ sync(); renderAjuste(); };
  const st=document.getElementById("aj_store"); if(st) st.onchange=()=>{ sync(); renderAjuste(); };
  document.getElementById("aj_modo").onchange=()=>{ sync(); renderAjuste(); };
  document.getElementById("aj_cant").oninput=()=>{ sync(); renderAjuste(); document.getElementById("aj_cant").focus(); };
  document.getElementById("aj_obs").oninput=e=>adjDraft.obs=e.target.value;
  document.getElementById("aj_fe").oninput=e=>adjDraft.fecha=e.target.value;
}
function confirmAjuste(){
  const p = prodById(adjDraft.productoId);
  if(!p){ toast("Pick a product","warn"); return; }
  const store = adjDraft.store || STORE_IDS[0];
  if(adjDraft.cantidad==="" || isNaN(+adjDraft.cantidad)){ toast("Enter a valid quantity","warn"); return; }
  if(!adjDraft.obs.trim()){ toast("The note is required","warn"); return; }
  const cur = stockDe(p, store);
  const nuevo = adjDraft.modo==="recuento" ? +adjDraft.cantidad : cur+(+adjDraft.cantidad);
  const delta = +(nuevo-cur).toFixed(4);
  if(delta===0){ toast("The adjustment doesn't change stock","warn"); return; }
  if(nuevo < 0){ toast("Stock can't go negative","warn"); alert(`The adjustment would leave stock at ${qty(nuevo)}.\nStock can't be negative.`); return; }
  if(!confirm(`Confirm the adjustment?\n\n${p.nombre} · ${storeName(store)}\nStock ${qty(cur)} → ${qty(nuevo)} (${delta>=0?'+':'−'}${qty(Math.abs(delta))})\nReason: ${adjDraft.obs.trim()}`)) return;
  const ref = "Adjustment · " + adjDraft.obs.trim();
  const fechaISO = new Date(adjDraft.fecha+"T12:00:00").toISOString();
  // FIFO: positive adjustment adds a layer at last cost; negative consumes layers
  if(delta>0) fifoEntrada(p, store, delta, p.ultimoCosto||0, ref, null);
  else fifoConsumir(p, store, -delta);
  moverStock(p, delta, p.ultimoCosto||0, "ajuste", null, ref, { tipo:"ajuste", obs:adjDraft.obs.trim(), fecha:fechaISO, store });
  adjDraft=null; save(); closeModal();
  toast(`Adjustment recorded · ${delta>=0?'+':'−'}${qty(Math.abs(delta))} u`, delta>=0?"up":"down");
  render();
}

function prodOptions(sel, soloConStock){
  const lista = soloConStock ? db.productos.filter(p=> (p.stock||0) > 0) : db.productos;
  const opts = lista.map(p=>{
    const disp = soloConStock ? ` (disp: ${qty(p.stock)})` : "";
    return `<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.sku?("["+p.sku+"] "):"")}${esc(p.nombre)}${disp}</option>`;
  }).join("");
  const nuevo = soloConStock ? "" : `<option value="__new">＋ Create new product…</option>`;
  const vacio = soloConStock && !lista.length
    ? `<option value="">— no products with stock —</option>`
    : `<option value="">— choose —</option>`;
  return vacio + opts + nuevo;
}

const round2 = n => Math.round((n||0)*100)/100;
/* Total de un documento = suma de subtotales YA redondeados a 2 decimales.
   Redondear por renglón y después sumar hace que el total guardado coincida
   exactamente con lo que se ve línea por línea (money() muestra 2 decimales),
   y evita el ruido de punto flotante tipo 92.10000000000001 al reconciliar. */
function totalLineas(arr){ return round2((arr||[]).reduce((a,x)=> a + round2((x.cantidad||0)*(x.precio||0)), 0)); }

/* ============================================================
   TASK 1 — Disponible por línea considerando TODO el documento
   Si un producto aparece en varias líneas de la MISMA factura, el
   tope de cada línea es: stock − lo ya comprometido en las otras líneas.
   Así no se puede meter 20 + 20 cuando hay 20.
   ============================================================ */
function stockBaseVenta(prodId){
  const p = prodById(prodId); if(!p) return 0;
  // La venta descuenta del POOL UNIFICADO (todas las sociedades), no de un local
  let s = stockVendibleTotal(p) || 0;
  // si estamos EDITando una venta, el stock "vuelve" antes de re-validar
  if(draft && draft.editingId){
    const old = (draft.tipo==="compra"?db.compras:db.ventas).find(x=>x.id===draft.editingId);
    if(old) old.lineas.forEach(l=>{ if(l.productoId===prodId) s += (draft.tipo==="compra" ? -(l.cantidad||0) : (l.cantidad||0)); });
  }
  return s;
}
function comprometidoOtras(prodId, exceptIdx){
  if(!prodId) return 0;
  return draft.lineas.reduce((a,l,idx)=> a + ((idx!==exceptIdx && l.productoId===prodId) ? (parseNum(l.cantidad)||0) : 0), 0);
}
function dispRestante(prodId, exceptIdx){
  return stockBaseVenta(prodId) - comprometidoOtras(prodId, exceptIdx);
}
/* Refresca los textos "disp / quedan" de todas las líneas de venta sin re-render
   (así no se pierde el foco del input mientras se tipea la cantidad). */
function updateDispInfos(){
  if(!draft || draft.tipo==="compra") return;
  document.querySelectorAll("#lineHost .disp-info").forEach(div=>{
    const i=+div.dataset.di, l=draft.lineas[i]; if(!l) return;
    const p=prodById(l.productoId);
    if(!p){ div.innerHTML=""; return; }
    const rem=dispRestante(l.productoId,i), comprom=comprometidoOtras(l.productoId,i);
    const over=(parseNum(l.cantidad)||0)>rem;
    div.style.color = over?"var(--alert)":"var(--muted)";
    div.innerHTML = `avail: ${qty(stockBaseVenta(l.productoId))}${comprom>0?` · left ${qty(rem)}`:""}${over?" · <b>over stock</b>":""}`;
  });
}

/* ============================================================
   TASK 2 — Combobox de producto con buscador (orden alfabético)
   Reemplaza al <select> nativo: input de búsqueda + lista filtrable.
   El popup se posiciona con position:fixed sobre <body> para NO quedar
   recortado por el overflow del modal.

let _pickerAnchor = null;
function pickerLabel(l){
  if(l.crear) return { txt:"＋ New product", ph:false };
  if(l.productoId){ const p=prodById(l.productoId); return p ? { txt:(p.sku?("["+p.sku+"] "):"")+p.nombre, ph:false } : { txt:"— pick product —", ph:true }; }

}
function pickerItemsHTML(i, q){
  const isC = draft.tipo==="compra";
  const cur = draft.lineas[i].productoId;
  q = (q||"").trim().toLowerCase();
  const vstore = (draft && draft.store) || STORE_IDS[0];   // sólo relevante en COMPRA
  // COMPRA: todos los productos. VENTA: los que tengan stock en el POOL unificado.
  let lista = isC ? db.productos.slice()
                  : db.productos.filter(p=> stockVendibleTotal(p)>0 || p.id===cur);
  // orden alfabético SIEMPRE (task 2), por nombre
  lista.sort((a,b)=> String(a.nombre||"").localeCompare(String(b.nombre||""),"es",{numeric:true}));
  if(q) lista = lista.filter(p=> ((p.nombre||"")+" "+(p.sku||"")).toLowerCase().includes(q));
  let html = lista.map(p=>{
    const sku = p.sku ? `<span class="sku">${esc(p.sku)}</span>` : "";
    let disp = "";
    if(!isC){ disp = `<span class="pi-disp">disp ${qty(dispRestante(p.id,i))}</span>`; }
    const sel = p.id===cur ? " active" : "";
    return `<button type="button" class="ppick-item${sel}" data-pick="${p.id}">${sku}<span class="pi-name">${esc(p.nombre)}</span>${disp}</button>`;
  }).join("");
  if(!lista.length){
    const hayStock = db.productos.some(p=> isC ? true : stockVendibleTotal(p)>0);
    html = `<div class="ppick-empty">${isC ? "No products match." : (hayStock?"No product with stock matches.":"No stock available to sell.")}</div>`;
  }
  if(isC) html += `<button type="button" class="ppick-item new" data-pick="__new">＋ Create new product…</button>`;
  return html;
}
function positionPicker(pop, anchor){
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth||360, h = pop.offsetHeight||300;
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = r.left, top = r.bottom+6;
  if(left+w > vw-8) left = Math.max(8, vw-8-w);
  if(top+h > vh-8){ const above = r.top-6-h; top = above>8 ? above : Math.max(8, vh-8-h); }
  pop.style.left = left+"px"; pop.style.top = top+"px";
}
function repositionPicker(){ const pop=document.querySelector(".ppick-pop"); if(pop && _pickerAnchor) positionPicker(pop,_pickerAnchor); }
function onPickerOutside(e){ const pop=document.querySelector(".ppick-pop"); if(pop && !pop.contains(e.target) && (!_pickerAnchor || !_pickerAnchor.contains(e.target))) closeProductPicker(); }
function onPickerKey(e){ if(e.key==="Escape"){ e.stopPropagation(); e.preventDefault(); closeProductPicker(); } }
function closeProductPicker(){
  document.querySelectorAll(".ppick-pop").forEach(el=>el.remove());
  document.querySelectorAll(".ppick-btn.open").forEach(b=>b.classList.remove("open"));
  window.removeEventListener("scroll", repositionPicker, true);
  window.removeEventListener("resize", closeProductPicker);
  document.removeEventListener("mousedown", onPickerOutside, true);
  document.removeEventListener("keydown", onPickerKey, true);
  _pickerAnchor=null;
}
function openProductPicker(i, anchor){
  closeProductPicker();
  _pickerAnchor = anchor; anchor.classList.add("open");
  const pop = document.createElement("div"); pop.className="ppick-pop";
  pop.innerHTML = `<input class="inp ppick-search" placeholder="Search by name or SKU…" autocomplete="off" spellcheck="false"><div class="ppick-list"></div>`;
  document.body.appendChild(pop);
  const search = pop.querySelector(".ppick-search");
  const listEl = pop.querySelector(".ppick-list");
  const paint = (q)=>{
    listEl.innerHTML = pickerItemsHTML(i, q);
    listEl.querySelectorAll("[data-pick]").forEach(it=> it.onclick=()=>{ const v=it.dataset.pick; closeProductPicker(); applyProdSelection(i, v); });
  };
  paint("");
  search.oninput = ()=> paint(search.value);
  positionPicker(pop, anchor);
  window.addEventListener("scroll", repositionPicker, true);
  window.addEventListener("resize", closeProductPicker);
  setTimeout(()=>{ document.addEventListener("mousedown", onPickerOutside, true); document.addEventListener("keydown", onPickerKey, true); }, 0);
  search.focus();
}
/* Aplica la selección de producto en una línea (usado por el combobox). */
function applyProdSelection(i, value){
  const l = draft.lineas[i]; if(!l) return;
  const isC = draft.tipo==="compra";
  if(value==="__new"){ l.crear=true; l.productoId=""; l.sku=""; l.nombre=""; renderLines(); return; }
  l.crear=false; l.productoId=value;
  const p = prodById(value);
  if(p && isC && !l.precio){ l.precio = (p.costoNeto!=null?p.costoNeto:p.ultimoCosto); }
  if(p && !isC){
    l.costoRef = p.ultimoCosto||0;
    if(p.precioVenta>0){                          // trae el precio de lista y deriva el markup
      l.precio = p.precioVenta;
      l.margen = l.costoRef>0 ? round2((l.precio/l.costoRef-1)*100) : 0;
    } else {
      l.margen = l.margen||0;
      l.precio = round2(l.costoRef*(1+(l.margen||0)/100));
    }
    const rem = dispRestante(p.id, i);           // respetar stock restante al elegir
    if((parseNum(l.cantidad)||0) > rem) l.cantidad = Math.max(0, rem);
  }
  renderLines(); refreshTotal();
}

  save(); toast("Customer saved"); closeModal(); render();
}
function deleteCliente(id){
  const c=clienteById(id); if(!c) return;
  const nv=ventasDeCliente(id).length;
  const msg = nv>0
    ? `Delete "${c.nombre}"?\n\nThis customer has ${nv} sale(s). Those invoices keep their own snapshot and won't change, but the customer will no longer appear in the picker or list.`
    : `Delete "${c.nombre}"?`;
