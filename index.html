<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b2430">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mayor">
<title>Mayor de Stock</title>
<style>
  :root{
    --ink:#1b2430;
    --ink-soft:#28323f;
    --paper:#f4f1ea;
    --surface:#ffffff;
    --surface-2:#faf8f3;
    --line:#e2ddd1;
    --line-strong:#cbc4b2;
    --accent:#2f6f6b;
    --accent-ink:#1f4d4a;
    --up:#2e7d5b;
    --up-bg:#e7f1eb;
    --down:#b5622c;
    --down-bg:#f6ebe2;
    --alert:#b23b3b;
    --alert-bg:#f7e6e6;
    --muted:#6b7280;
    --text:#212a34;
    --radius:10px;
    --mono:ui-monospace,"SF Mono","SFMono-Regular","Menlo","Consolas","Roboto Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --shadow:0 1px 2px rgba(27,36,48,.06),0 8px 24px rgba(27,36,48,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--text);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:14px}
  input:focus-visible,select:focus-visible,button:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  /* ---------- Layout ---------- */
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  .side{
    background:var(--ink);color:#cdd5df;padding:22px 16px;
    display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:baseline;gap:9px;padding:0 8px 20px;border-bottom:1px solid #2c3644;margin-bottom:14px}
  .brand .mark{font-family:var(--mono);font-weight:700;font-size:20px;color:#fff;letter-spacing:-.5px}
  .brand .mark small{color:var(--up);font-size:20px}
  .brand .mark em{color:var(--down);font-style:normal;font-size:20px}
  .brand h1{font-size:13px;font-weight:600;color:#8b97a6;margin:0;letter-spacing:.3px;text-transform:uppercase}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:none;border:0;color:#aeb8c4;padding:10px 12px;border-radius:8px;
    font-size:14.5px;font-weight:500;transition:background .12s,color .12s;
  }
  .nav button .ico{width:18px;text-align:center;font-family:var(--mono);font-size:15px;opacity:.85}
  .nav button:hover{background:#232d3a;color:#e8edf3}
  .nav button.on{background:var(--accent);color:#fff}
  .nav button.on .ico{opacity:1}
  .side .foot{margin-top:auto;padding:0 8px;font-size:11.5px;color:#5c6775;line-height:1.6}

  .main{padding:32px 40px 80px;max-width:1180px;width:100%}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
  .head .title h2{font-size:26px;margin:0 0 3px;letter-spacing:-.4px;font-weight:650}
  .head .title p{margin:0;color:var(--muted);font-size:14px}
  .head .actions{display:flex;gap:9px;flex-wrap:wrap}

  /* ---------- Buttons ---------- */
  .btn{
    border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
    padding:9px 15px;border-radius:8px;font-size:14px;font-weight:550;
    display:inline-flex;align-items:center;gap:7px;transition:border-color .12s,background .12s;
  }
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
  .btn.up{background:var(--up);border-color:var(--up);color:#fff}
  .btn.up:hover{filter:brightness(.94)}
  .btn.down{background:var(--down);border-color:var(--down);color:#fff}
  .btn.down:hover{filter:brightness(.94)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:8px 10px}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.danger{color:var(--alert);border-color:var(--line-strong)}
  .btn.danger:hover{border-color:var(--alert);background:var(--alert-bg)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* ---------- Cards / KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:8px}
  .kpi .val{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.5px;line-height:1.1}
  .kpi .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
  .kpi.warn .val{color:var(--alert)}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel + .panel{margin-top:20px}
  .panel .phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .panel .phead h3{margin:0;font-size:15px;font-weight:620}
  .panel .phead .hint{font-size:12.5px;color:var(--muted)}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);
    position:sticky;top:0;
  }
  td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  td.r,th.r{text-align:right}
  td.c,th.c{text-align:center}
  .sku{font-family:var(--mono);font-size:13px;color:var(--accent-ink);background:var(--surface-2);padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
  .pill.in{background:var(--up-bg);color:var(--up)}
  .pill.out{background:var(--down-bg);color:var(--down)}
  .pill.low{background:var(--alert-bg);color:var(--alert)}
  .delta{font-family:var(--mono);font-weight:600}
  .delta.up{color:var(--up)}
  .delta.down{color:var(--down)}
  .stock-cell{font-family:var(--mono);font-weight:600}
  .stock-cell.low{color:var(--alert)}
  .stock-cell.neg{color:var(--alert)}

  .empty{padding:48px 24px;text-align:center;color:var(--muted)}
  .empty .big{font-family:var(--mono);font-size:34px;color:var(--line-strong);margin-bottom:10px}
  .empty p{margin:4px 0}
  .empty .hint{font-size:13px;max-width:440px;margin:10px auto 0}

  /* ---------- Forms / rows ---------- */
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .inp{border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;background:var(--surface);width:100%}
  .inp:focus{border-color:var(--accent)}
  .inp.num{text-align:right}
  .grid-form{display:grid;gap:14px;padding:18px}

  /* line editor table inputs */
  table .inp{padding:6px 8px;font-size:13.5px;border-radius:6px}
  .line-tbl td{padding:7px 10px}
  .line-tbl select.inp{min-width:150px}

  /* ---------- Modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,26,34,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.28);width:100%;max-width:760px;overflow:hidden}
  .modal.wide{max-width:940px}
  .modal .mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal .mhead h3{margin:0;font-size:18px;font-weight:640}
  .modal .mbody{padding:20px 22px;max-height:66vh;overflow:auto}
  .modal .mfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-top:1px solid var(--line);background:var(--surface-2)}
  .x{background:none;border:0;font-size:22px;color:var(--muted);line-height:1;padding:4px 8px;border-radius:6px}
  .x:hover{background:var(--surface-2);color:var(--text)}

  .drop{
    border:2px dashed var(--line-strong);border-radius:12px;padding:30px 20px;text-align:center;
    background:var(--surface-2);transition:border-color .15s,background .15s;cursor:pointer;
  }
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--up-bg)}
  .drop .di{font-family:var(--mono);font-size:30px;color:var(--accent);margin-bottom:8px}
  .drop p{margin:4px 0;color:var(--muted);font-size:13.5px}
  .drop .fn{color:var(--accent-ink);font-weight:600}

  .rawbox{font-family:var(--mono);font-size:11.5px;line-height:1.55;background:var(--ink);color:#cbd5e1;border-radius:8px;padding:12px;max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  details{margin-top:14px}
  summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}

  .totrow{display:flex;justify-content:flex-end;gap:26px;padding:12px 4px;font-size:15px}
  .totrow .num{font-weight:650;font-size:17px}

  .banner{padding:11px 14px;border-radius:8px;font-size:13.5px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
  .banner.warn{background:var(--alert-bg);color:#8a2b2b;border:1px solid #e6c4c4}
  .banner.ok{background:var(--up-bg);color:var(--accent-ink);border:1px solid #bcd8ca}

  /* ---------- Toast ---------- */
  #toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:9px;z-index:80}
  .toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:9px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:9px;align-items:center;animation:slide .25s ease}
  .toast .b{width:3px;height:100%;border-radius:2px;align-self:stretch}
  .toast.up{border-left:3px solid var(--up)}
  .toast.down{border-left:3px solid var(--down)}
  .toast.warn{border-left:3px solid var(--alert)}
  @keyframes slide{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

  .mobtop{display:none}

  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .side{display:none}
    .mobtop{display:flex;position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;padding:10px 14px;gap:4px;overflow-x:auto}
    .mobtop .brand-m{font-family:var(--mono);font-weight:700;margin-right:8px;white-space:nowrap;align-self:center}
    .mobtop button{background:none;border:0;color:#aeb8c4;padding:8px 12px;border-radius:7px;font-size:13.5px;font-weight:600;white-space:nowrap}
    .mobtop button.on{background:var(--accent);color:#fff}
    .main{padding:20px 16px 90px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .head{flex-direction:column;align-items:flex-start}
    .table-scroll{overflow-x:auto}
    table{min-width:560px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- Login ---------- */
  .login-scrim{
    position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
    background:
      radial-gradient(1100px 600px at 70% -10%, rgba(47,111,107,.25), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(124,58,180,.22), transparent 55%),
      #05060a;
  }
  .login-card{
    width:100%;max-width:360px;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:34px 28px 28px;text-align:center;
    box-shadow:0 24px 70px rgba(0,0,0,.55);backdrop-filter:blur(4px);
  }
  .login-logo{border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.5);margin-bottom:16px}
  .login-card h1{color:#fff;font-size:22px;margin:0 0 6px;letter-spacing:-.3px;font-weight:680}
  .login-sub{color:#9aa6b4;font-size:13.5px;margin:0 0 22px;line-height:1.5}
  .login-card .field{text-align:left;margin-bottom:14px}
  .login-card .field label{color:#8b97a6}
  .login-card .inp{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#fff}
  .login-card .inp:focus{border-color:var(--accent);background:rgba(255,255,255,.09)}
  .login-btn{width:100%;justify-content:center;padding:11px;font-size:15px;margin-top:6px}
  .login-err{color:#ff9a9a;font-size:13px;min-height:18px;margin:2px 0 6px;text-align:left}
</style>
</head>
<body>
<div id="login" class="login-scrim" hidden>
  <div class="login-card">
    <img src="icon-512.png" alt="" class="login-logo" width="88" height="88">
    <h1>Mayor de Stock</h1>
    <p class="login-sub">Entrá con tu usuario y vas a ver tu inventario desde cualquier dispositivo.</p>
    <div class="field"><label>Usuario</label>
      <input class="inp" id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label>Contraseña</label>
      <input class="inp" id="loginPass" type="password" autocomplete="current-password"></div>
    <div id="loginErr" class="login-err"></div>
    <button class="btn primary login-btn" id="loginBtn">Entrar</button>
  </div>
</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mark"><small>+</small>M<em>−</em></div>
      <h1>Mayor de Stock</h1>
    </div>
    <nav class="nav" id="nav">
      <button data-view="dash" class="on"><span class="ico">▤</span>Panel</button>
      <button data-view="prod"><span class="ico">▦</span>Productos</button>
      <button data-view="compras"><span class="ico">+</span>Compras</button>
      <button data-view="ventas"><span class="ico">−</span>Ventas</button>
      <button data-view="mov"><span class="ico">↕</span>Movimientos</button>
      <button data-view="datos"><span class="ico">⤓</span>Datos</button>
    </nav>
    <div class="foot">
      <div data-syncchip style="font-weight:700;font-size:12.5px;margin-bottom:10px">●</div>
      Último costo. Compras suman stock, ventas restan.
    </div>
  </aside>

  <div class="mobtop" id="navMob">
    <span class="brand-m">+M−</span>
    <button data-view="dash" class="on">Panel</button>
    <button data-view="prod">Productos</button>
    <button data-view="compras">Compras</button>
    <button data-view="ventas">Ventas</button>
    <button data-view="mov">Movim.</button>
    <button data-view="datos">Datos</button>
    <span data-syncchip style="margin-left:auto;align-self:center;font-size:11.5px;font-weight:700;white-space:nowrap;padding-left:8px">●</span>
  </div>

  <main class="main" id="main"></main>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ============================================================
   Mayor de Stock — vanilla, localStorage, último costo
   ============================================================ */
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const KEY = "gstock_v1";
const SKEY = "gstock_sync";       // { syncedRev, dirty }
const SESKEY = "gstock_session";  // { user, token, space }

/* URL del servidor (Cloudflare Worker). Si algún día lo redeploya en otra
   cuenta/nombre, cambiar solo esta línea. */
const API_URL = "https://mayor-stock-api.juanbautistacrespialomar.workers.dev";

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- Estado local ---------- */
let db = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.warn("load fail", e); }
  return { config:{ moneda:"$" }, productos:[], compras:[], ventas:[], movimientos:[] };
}
function persistLocal(){ localStorage.setItem(KEY, JSON.stringify(db)); }

/* ---------- Sesión ---------- */
let session = loadSession();
function loadSession(){ try{ const r=localStorage.getItem(SESKEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function saveSession(){ if(session) localStorage.setItem(SESKEY, JSON.stringify(session)); else localStorage.removeItem(SESKEY); }

/* ---------- Sincronización con el servidor ---------- */
let syncMeta = loadSyncMeta();       // { syncedRev, dirty }
let syncState = session ? "idle" : "off";
let pushTimer = null;
let conflictPayload = null;

function loadSyncMeta(){ try{ const r=localStorage.getItem(SKEY); if(r) return JSON.parse(r); }catch(e){} return { syncedRev:0, dirty:false }; }
function saveSyncMeta(){ localStorage.setItem(SKEY, JSON.stringify(syncMeta)); }

function save(){
  persistLocal();
  if(session){ syncMeta.dirty=true; saveSyncMeta(); schedulePush(); }
}

function setSyncState(s){ syncState=s; paintSync(); }
function apiBase(){ return API_URL.replace(/\/+$/,""); }
function authHeaders(){ return { "Authorization":"Bearer "+(session?session.token:""), "Content-Type":"application/json" }; }
function stateUrl(){ return apiBase()+"/state?space="+encodeURIComponent(session?session.space:"main"); }

function schedulePush(){ if(!session) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>pushNow(), 800); }

async function pushNow(force=false){
  if(!session) return;
  setSyncState("saving");
  try{
    const res=await fetch(stateUrl(),{ method:"PUT", headers:authHeaders(), body:JSON.stringify({ data:db, baseRev:syncMeta.syncedRev, force }) });
    if(res.status===401){ setSyncState("offline"); toast("Sesión vencida, volvé a entrar","warn"); logout(); return; }
    if(res.status===409){ conflictPayload=await res.json(); setSyncState("conflict"); toast("Hay una versión más nueva en el servidor","warn"); if(view==="datos") render(); return; }
    if(!res.ok) throw new Error("HTTP "+res.status);
    const j=await res.json();
    syncMeta.syncedRev=j.rev; syncMeta.dirty=false; saveSyncMeta();
    setSyncState("idle");
  }catch(e){ console.warn("push fail", e); setSyncState("offline"); }
}

async function pullNow(){
  if(!session) return;
  setSyncState("saving");
  try{
    const res=await fetch(stateUrl(),{ method:"GET", headers:authHeaders() });
    if(res.status===401){ setSyncState("offline"); toast("Sesión vencida, volvé a entrar","warn"); logout(); return; }
    if(!res.ok) throw new Error("HTTP "+res.status);
    const j=await res.json();
    const serverRev=j.rev||0;
    if(!j.data){ if(hasData(db)) await pushNow(true); else { syncMeta.syncedRev=0; saveSyncMeta(); setSyncState("idle"); } return; }
    if(serverRev===syncMeta.syncedRev && !syncMeta.dirty){ setSyncState("idle"); return; }
    if(serverRev>syncMeta.syncedRev && !syncMeta.dirty){
      db=j.data; syncMeta.syncedRev=serverRev; syncMeta.dirty=false; saveSyncMeta(); persistLocal();
      setSyncState("idle"); render(); toast("Datos actualizados desde el servidor"); return;
    }
    if(syncMeta.dirty && serverRev!==syncMeta.syncedRev){ conflictPayload=j; setSyncState("conflict"); if(view==="datos") render(); return; }
    if(syncMeta.dirty){ await pushNow(); return; }
    setSyncState("idle");
  }catch(e){ console.warn("pull fail", e); setSyncState("offline"); }
}

function hasData(d){ return (d.productos&&d.productos.length)||(d.compras&&d.compras.length)||(d.ventas&&d.ventas.length); }

function resolveConflict(keepLocal){
  if(!conflictPayload) return;
  if(keepLocal){ syncMeta.syncedRev=conflictPayload.rev; saveSyncMeta(); pushNow(true); }
  else{
    db=conflictPayload.data; syncMeta.syncedRev=conflictPayload.rev; syncMeta.dirty=false; saveSyncMeta(); persistLocal();
    render(); toast("Se tomó la versión del servidor");
  }
  conflictPayload=null; setSyncState("idle");
}

function paintSync(){
  const map={
    off:["●","Desconectado","var(--muted)"],
    idle:["●","Sincronizado","var(--up)"],
    saving:["◐","Guardando…","var(--accent)"],
    offline:["●","Sin conexión","var(--down)"],
    conflict:["▲","Conflicto","var(--alert)"]
  };
  const [dot,txt,col]=map[syncState]||map.off;
  document.querySelectorAll("[data-syncchip]").forEach(el=>{ el.style.color=col; el.textContent=dot+" "+txt; });
}

/* ---------- Login / Logout ---------- */
async function doLogin(){
  const user=(document.getElementById("loginUser").value||"").trim();
  const pass=document.getElementById("loginPass").value||"";
  const errEl=document.getElementById("loginErr");
  const btn=document.getElementById("loginBtn");
  errEl.textContent="";
  if(!user||!pass){ errEl.textContent="Completá usuario y contraseña"; return; }
  btn.disabled=true; btn.textContent="Entrando…";
  try{
    const res=await fetch(apiBase()+"/login",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({user,pass}) });
    if(res.status===401){ errEl.textContent="Usuario o contraseña incorrectos"; return; }
    if(!res.ok){
      let msg="Error "+res.status;
      try{ const ej=await res.json(); if(ej.error) msg=ej.error; if(ej.detalle) msg+=" — "+ej.detalle; }catch(_){}
      errEl.textContent=msg;
      return;
    }
    const j=await res.json();
    const switching = !session || session.user!==j.user;
    session={ user:j.user, token:j.token, space:j.space||"main" }; saveSession();
    if(switching){
      db={ config:{ moneda:(db.config&&db.config.moneda)||"$" }, productos:[], compras:[], ventas:[], movimientos:[] };
      persistLocal(); syncMeta={ syncedRev:0, dirty:false }; saveSyncMeta();
    }
    setSyncState("idle");
    hideLogin(); render(); paintSync();
    await pullNow();
  }catch(e){ errEl.textContent="No se pudo conectar con el servidor ("+(e&&e.message||e)+")"; }
  finally{ btn.disabled=false; btn.textContent="Entrar"; }
}
function logout(){
  if(!confirm("Cerrar sesión en este dispositivo. Tus datos siguen en el servidor. ¿Seguir?")) return;
  session=null; saveSession(); setSyncState("off");
  showLogin();
}

/* ---------- Formato ---------- */
const nf0 = new Intl.NumberFormat("es-AR",{maximumFractionDigits:2});
const nf2 = new Intl.NumberFormat("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const money = n => db.config.moneda + " " + nf2.format(n||0);
const qty = n => nf0.format(n||0);

/* Parseo tolerante de números en formato AR (1.234,56) o US (1,234.56) */
function parseNum(s){
  if(typeof s === "number") return s;
  if(!s) return 0;
  let t = String(s).trim().replace(/[^\d.,\-]/g,"");
  if(t==="") return 0;
  const lastComma = t.lastIndexOf(","), lastDot = t.lastIndexOf(".");
  if(lastComma > lastDot){            // coma decimal (AR)
    t = t.replace(/\./g,"").replace(",",".");
  } else {                            // punto decimal (US)
    t = t.replace(/,/g,"");
  }
  const v = parseFloat(t);
  return isNaN(v) ? 0 : v;
}

/* ---------- Toast ---------- */
function toast(msg, kind="up"){
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateY(8px)"; }, 2600);
  setTimeout(()=> el.remove(), 3000);
}

/* ---------- Helpers de stock ---------- */
function prodById(id){ return db.productos.find(p=>p.id===id); }
function findProdBySku(sku){
  if(!sku) return null;
  const s = sku.trim().toLowerCase();
  return db.productos.find(p => (p.sku||"").trim().toLowerCase() === s) || null;
}
function valorizacion(){
  return db.productos.reduce((a,p)=> a + (p.stock||0)*(p.ultimoCosto||0), 0);
}
function unidadesTotales(){ return db.productos.reduce((a,p)=> a + (p.stock||0), 0); }
function bajoStock(p){ return p.puntoRepedido>0 && p.stock <= p.puntoRepedido; }

/* Registrar movimiento */
function moverStock(prod, delta, valorUnit, refTipo, refId, ref){
  prod.stock = +( (prod.stock||0) + delta ).toFixed(4);
  db.movimientos.push({
    id: uid(), fecha:new Date().toISOString(),
    tipo: delta>=0 ? "entrada" : "salida",
    productoId: prod.id, sku:prod.sku, nombre:prod.nombre,
    cantidad: Math.abs(delta), valorUnit, refTipo, refId, ref
  });
}

/* ============================================================
   Eventos de la vista
   ============================================================ */
function wire(){
  const m = document.getElementById("main");
  m.querySelectorAll("[data-open]").forEach(b=> b.onclick=()=> openDoc(b.dataset.open));
  m.querySelectorAll("[data-newp]").forEach(b=> b.onclick=()=> openProd());
  m.querySelectorAll("[data-ficha]").forEach(tr=> tr.onclick=()=> openFicha(tr.dataset.ficha));
  m.querySelectorAll("[data-editp]").forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); openProd(b.dataset.editp); });
  m.querySelectorAll("[data-import]").forEach(b=> b.onclick=()=> openImport());
  m.querySelectorAll("[data-vdoc]").forEach(b=> b.onclick=()=>{
    const [t,id]=b.dataset.vdoc.split(":"); verDoc(t,id);
  });
  const exp=m.querySelector("[data-export]"); if(exp) exp.onclick=exportJSON;
  const imp=m.querySelector("[data-import-json]"); if(imp) imp.onclick=importJSON;
  const rst=m.querySelector("[data-reset]"); if(rst) rst.onclick=resetAll;
  const cfg=m.querySelector("[data-savecfg]"); if(cfg) cfg.onclick=()=>{
    db.config.moneda = (document.getElementById("cfgMon").value||"$").trim()||"$";
    save(); toast("Configuración guardada"); render();
  };

  // --- cuenta / sincronización ---
  const sNow=m.querySelector("[data-syncnow]"); if(sNow) sNow.onclick=()=> pullNow();
  const lo=m.querySelector("[data-logout]"); if(lo) lo.onclick=()=> logout();
  const cl=m.querySelector("[data-conflocal]"); if(cl) cl.onclick=()=>resolveConflict(true);
  const cs=m.querySelector("[data-confserver]"); if(cs) cs.onclick=()=>resolveConflict(false);

  paintSync();
}

function openProd(id){
  const p = id ? prodById(id) : null;
  const modal = buildModal(p?"Editar producto":"Nuevo producto", `
    <div class="grid-form" style="grid-template-columns:1fr 1fr;padding:0">
      <div class="field"><label>SKU / código</label><input class="inp" id="p_sku" value="${p?esc(p.sku):""}"></div>
      <div class="field"><label>Unidad</label><input class="inp" id="p_uni" value="${p?esc(p.unidad):"u"}" placeholder="u, kg, caja..."></div>
      <div class="field" style="grid-column:1/3"><label>Nombre</label><input class="inp" id="p_nom" value="${p?esc(p.nombre):""}"></div>
      <div class="field"><label>Stock inicial</label><input class="inp num" id="p_stk" value="${p?p.stock:0}" ${p?'disabled':''}></div>
      <div class="field"><label>Último costo</label><input class="inp num" id="p_cos" value="${p?p.ultimoCosto:0}"></div>
      <div class="field"><label>Precio de venta</label><input class="inp num" id="p_pv" value="${p?p.precioVenta:0}"></div>
      <div class="field"><label>Punto de repedido</label><input class="inp num" id="p_rep" value="${p?p.puntoRepedido:0}"></div>
    </div>
    ${p?'<p style="font-size:12.5px;color:var(--muted);margin:14px 0 0">El stock se ajusta desde compras y ventas, no acá.</p>':''}
  `, [
    p ? {label:"Eliminar",cls:"btn danger",act:()=>{ delProd(p.id); }} : null,
    {label:"Cancelar",cls:"btn",act:closeModal},
    {label:"Guardar",cls:"btn primary",act:()=>saveProd(id)}
  ].filter(Boolean));
  document.getElementById("p_sku").focus();
}
function saveProd(id){
  const g=x=>document.getElementById(x).value;
  const nom=g("p_nom").trim();
  if(!nom){ toast("Poné un nombre","warn"); return; }
  if(id){
    const p=prodById(id);
    p.sku=g("p_sku").trim(); p.unidad=g("p_uni").trim()||"u"; p.nombre=nom;
    p.ultimoCosto=parseNum(g("p_cos")); p.precioVenta=parseNum(g("p_pv")); p.puntoRepedido=parseNum(g("p_rep"));
  } else {
    const stk=parseNum(g("p_stk"));
    const p={ id:uid(), sku:g("p_sku").trim(), unidad:g("p_uni").trim()||"u", nombre:nom,
      stock:0, ultimoCosto:parseNum(g("p_cos")), precioVenta:parseNum(g("p_pv")), puntoRepedido:parseNum(g("p_rep")) };
    db.productos.push(p);
    if(stk) moverStock(p, stk, p.ultimoCosto, "ajuste", null, "Stock inicial");
  }
  save(); closeModal(); toast("Producto guardado"); render();
}
function delProd(id){
  const p=prodById(id);
  if(!confirm(`¿Eliminar "${p.nombre}"? No se borran sus movimientos históricos.`)) return;
  db.productos = db.productos.filter(x=>x.id!==id);
  save(); closeModal(); toast("Producto eliminado","warn"); render();
}

let draft = null;  // { tipo, contraparte, fecha, numero, lineas:[{key,productoId,sku,nombre,cantidad,precio}] }

function openDoc(tipo, pre){

function blankLine(){ return { key:uid(), productoId:"", sku:"", nombre:"", cantidad:1, precio:0, precioVentaSugerido:0, crear:false }; }

    <button class="btn sm" id="addLine" style="margin-top:10px">+ Agregar línea</button>
    <div id="docWarn"></div>
  `;
  const total = draft.lineas.reduce((a,l)=> a + l.cantidad*l.precio, 0);
  buildModal(
    isC?"Cargar compra":"Nueva venta", body,
    [
      {label:"Cancelar",cls:"btn",act:closeModal},
      {label:isC?"Confirmar compra (+stock)":"Confirmar venta (−stock)",cls:isC?"btn up":"btn down",act:confirmDoc}
    ],
    true,
    `<div class="totrow"><span style="color:var(--muted)">Total documento</span><span class="num">${money(total)}</span></div>`

function prodOptions(sel){

function renderLines(){
  const isC = draft.tipo==="compra";
  const host = document.getElementById("lineHost");
  const rows = draft.lineas.map((l,i)=>{
    const p = prodById(l.productoId);
    const stockInfo = (!isC && p) ? `<div style="font-size:11px;color:${p.stock< l.cantidad?'var(--alert)':'var(--muted)'};margin-top:3px">disp: ${qty(p.stock)}</div>` : "";

      <td style="width:34px"><button class="btn ghost sm" data-del="${i}" title="Quitar">✕</button></td>
    </tr>`;
  }).join("");
  host.innerHTML = `<div class="table-scroll"><table class="line-tbl">
    <thead><tr><th>Producto</th><th class="r">Cant.</th><th class="r">${isC?"Costo unit.":"Precio unit."}</th><th class="r">Subtotal</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;

  host.querySelectorAll("[data-k]").forEach(inp=>{
    const i=+inp.dataset.i, k=inp.dataset.k;
    inp.oninput = ()=>{
      const l=draft.lineas[i];
      if(k==="prod"){
        if(inp.value==="__new"){ l.crear=true; l.productoId=""; renderLines(); return; }
        l.crear=false; l.productoId=inp.value;
        const p=prodById(inp.value);
        if(p && draft.tipo==="compra" && !l.precio) { l.precio=p.ultimoCosto; }
        if(p && draft.tipo==="venta" && !l.precio) { l.precio=p.precioVenta; }
        renderLines(); refreshTotal(); return;
      }
      if(k==="cantidad") l.cantidad=parseNum(inp.value);
      else if(k==="precio") l.precio=parseNum(inp.value);
      else l[k]=inp.value;
      if(k==="cantidad"||k==="precio"){ updateSubtotals(); refreshTotal(); }
    };
  });
  host.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=>{
    draft.lineas.splice(+b.dataset.del,1);

function updateSubtotals(){
  const host=document.getElementById("lineHost");
  host.querySelectorAll("tbody tr").forEach((tr,i)=>{
    const l=draft.lineas[i]; if(!l) return;
    tr.children[3].textContent = money(l.cantidad*l.precio);
  });
}
function refreshTotal(){
  const total = draft.lineas.reduce((a,l)=> a + l.cantidad*l.precio, 0);
  const foot=document.querySelector(".modal .mextra .num");

function confirmDoc(){
  const isC = draft.tipo==="compra";
  // Resolver líneas
  const resolved = [];
  for(const l of draft.lineas){
    if(!l.cantidad || l.cantidad<=0) continue;
    let p=null;
    if(l.crear){
      if(!l.nombre.trim()){ toast("Falta el nombre de un producto nuevo","warn"); return; }
      p = { id:uid(), sku:(l.sku||"").trim(), unidad:"u", nombre:l.nombre.trim(),
            stock:0, ultimoCosto:0, precioVenta: isC?(l.precioVentaSugerido||0):l.precio, puntoRepedido:0 };
      db.productos.push(p);
    } else {
      p = prodById(l.productoId);
      if(!p){ toast("Hay una línea sin producto asignado","warn"); return; }
    }
    resolved.push({ prod:p, cantidad:l.cantidad, precio:l.precio });
  }
  if(!resolved.length){ toast("Cargá al menos una línea válida","warn"); return; }

  // Validación de stock en ventas
  if(!isC){
    const faltantes = resolved.filter(r=> r.prod.stock < r.cantidad);
    if(faltantes.length){
      const det = faltantes.map(f=>`• ${f.prod.nombre}: hay ${qty(f.prod.stock)}, pedís ${qty(f.cantidad)}`).join("\n");
      if(!confirm("Stock insuficiente:\n\n"+det+"\n\n¿Confirmar igual y dejar stock negativo?")) return;
    }
  }

  const doc = {
    id:uid(), tipo:draft.tipo, contraparte:draft.contraparte.trim(),
    fecha:draft.fecha, numero:draft.numero.trim(),
    lineas: resolved.map(r=>({ productoId:r.prod.id, sku:r.prod.sku, nombre:r.prod.nombre, cantidad:r.cantidad, precio:r.precio })),
    total: resolved.reduce((a,r)=>a+r.cantidad*r.precio,0)
  };
  const refTxt = (isC?"Compra":"Venta") + (doc.numero?(" "+doc.numero):"") + (doc.contraparte?(" · "+doc.contraparte):"");

  resolved.forEach(r=>{
    if(isC){
      moverStock(r.prod, +r.cantidad, r.precio, "compra", doc.id, refTxt);
      r.prod.ultimoCosto = r.precio;      // <-- último costo
    } else {
      moverStock(r.prod, -r.cantidad, r.precio, "venta", doc.id, refTxt);
    }
  });

  (isC?db.compras:db.ventas).push(doc);
  save(); closeModal();
  toast(isC?`Compra cargada · +${qty(doc.lineas.reduce((a,l)=>a+l.cantidad,0))} u`
           :`Venta registrada · −${qty(doc.lineas.reduce((a,l)=>a+l.cantidad,0))} u`, isC?"up":"down");
  render();
}

async function handlePdf(file){
  const out=document.getElementById("importOut");
  if(!window.pdfjsLib){ out.innerHTML=`<div class="banner warn">No se pudo cargar el lector de PDF (pdf.js). Revisá tu conexión y reintentá, o cargá la compra a mano.</div>`; return; }
  out.innerHTML=`<p style="color:var(--muted);padding:14px 0">Leyendo ${esc(file.name)}…</p>`;
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let lines=[];
    for(let pn=1; pn<=pdf.numPages; pn++){
      const page=await pdf.getPage(pn);
      const tc=await page.getTextContent();
      lines = lines.concat(reconstructLines(tc.items));
    }
    pdfLines = lines.filter(l=>l.trim().length);
    const parsed = parseInvoice(pdfLines);
    showImportEditor(file.name, parsed);
  }catch(e){
    console.error(e);
    out.innerHTML=`<div class="banner warn">No pude leer ese PDF (${esc(e.message||"error")}). Puede estar escaneado como imagen. Cargá la compra a mano.</div>`;
  }
}

/* Reconstruir líneas por coordenada Y */
function reconstructLines(items){
  const rows=new Map();
  for(const it of items){
    if(!it.str || !it.str.trim()) continue;
    const y=Math.round(it.transform[5]);
    let bucket=null;
    for(const k of rows.keys()){ if(Math.abs(k-y)<=3){ bucket=k; break; } }
    const key = bucket===null ? y : bucket;
    if(!rows.has(key)) rows.set(key,[]);
    rows.get(key).push({x:it.transform[4], s:it.str});
  }
  return [...rows.entries()]
    .sort((a,b)=> b[0]-a[0])
    .map(([,arr])=> arr.sort((a,b)=>a.x-b.x).map(o=>o.s).join(" ").replace(/\s+/g," ").trim());
}

/* ---------- Parser de factura ----------
   1) Intento estructurado: renglones "SKU: descripción ... QTY UOM MSRP NET EXT"
      (formato tipo Coqui Hobby). Costo = NET PRICE, precio venta sugerido = MSRP.
   2) Si no encuentra nada, cae a la heurística genérica línea por línea.        */
function parseInvoice(lines){
  const blob = lines.join("\n");
  const meta = extractMeta(lines, blob);
  let items = parseStructured(blob);
  let mode = "estructurado";
  if(!items.length){
    items = lines.map(parseCandidate).filter(Boolean).map(c=>({
      sku:"", desc:c.desc, cantidad:c.cantidad, costo:c.costo, msrp:0, ext:c.cantidad*c.costo, raw:c.raw
    }));
    mode = "heuristico";
  }
  // detectar flete/handling para avisar (no se agrega como stock)
  const fre = blob.match(/(freight[^\n]*?|flete[^\n]*?)\s([\d.,]+)\s*$/im) || blob.match(/freight[^\d]*([\d.,]+)/i);
  meta.flete = fre ? parseNum(fre[fre.length-1]) : 0;
  return { meta, items, mode };
}

/* SKU: desc ... QTY UOM MSRP NET EXT  (UOM = EACH/EA/CASE/BOX/PACK/UNIT/PCS) */
function parseStructured(blob){
  const re = /(?=[A-Z0-9\-]*\d)([A-Z0-9][A-Z0-9\-]{3,}):\s*([\s\S]+?)\s+(\d+(?:[.,]\d+)?)\s+(EACH|EA|CASE|BOX|PACK|UNIT|PCS?|UN)\s+([\d.,]+)\s+([\d.,]+)\s+([\d.,]+)(?=\s|$)/gi;
  const out=[]; let m;
  while((m=re.exec(blob))){
    const sku = m[1].trim();
    const desc = m[2].replace(/\s+/g," ").trim();
    const cantidad = parseNum(m[3]);
    const msrp = parseNum(m[5]);   // precio sugerido
    const net  = parseNum(m[6]);   // costo real (lo que pagás)
    const ext  = parseNum(m[7]);   // total línea
    if(cantidad<=0) continue;
    out.push({ sku, desc, cantidad, costo:net, msrp, ext, raw:(sku+": "+desc+" | "+m[3]+" "+m[4]+" "+m[5]+" "+m[6]+" "+m[7]) });
  }
  return out;
}

/* Metadata: N° de comprobante, fecha, proveedor */
function extractMeta(lines, blob){
  const meta = { numero:"", fecha:"", proveedor:"", flete:0 };
  const ref = blob.match(/Reference\s*No\.?:?\s*([A-Z0-9\-]+)/i)
           || blob.match(/(?:Invoice|Factura|Comprobante)\s*(?:No\.?|#|N[°º])?:?\s*([A-Z0-9\-]{3,})/i);
  if(ref) meta.numero = ref[1].trim();
  const date = blob.match(/\bDate:?\s*([0-3]?\d[-\/][A-Za-z]{3,}[-\/]\d{2,4})/i)
            || blob.match(/\bFecha:?\s*([0-3]?\d[-\/][0-1]?\d[-\/]\d{2,4})/i);
  if(date) meta.fecha = normDate(date[1]);
  const skip = /^(invoice|factura|reference|date|fecha|customer|currency|salesperson|bill to|ship to|terms|contact|due date|no\.|item)\b/i;
  for(const l of lines){
    const t=l.trim();
    if(t.length>2 && /[A-Za-z]/.test(t) && !skip.test(t)){ meta.proveedor=t.replace(/\s+/g," "); break; }
  }
  return meta;
}
function normDate(s){
  let m=s.match(/(\d{1,2})[-\/]([A-Za-z]{3,})[-\/](\d{2,4})/);
  const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,
                ene:1,abr:4,ago:8,dic:12};
  if(m){
    const mo=months[m[2].slice(0,3).toLowerCase()]; if(!mo) return "";
    const yr=m[3].length===2?"20"+m[3]:m[3];
    return `${yr}-${String(mo).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`;
  }
  m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
  if(m){ const yr=m[3].length===2?"20"+m[3]:m[3]; return `${yr}-${String(+m[2]).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`; }
  return "";
}

/* Heurística: intentar detectar cantidad / costo en una línea */
function parseCandidate(line){
  const nums=[...line.matchAll(/-?\d{1,3}(?:[.,]\d{3})*(?:[.,]\d+)?|-?\d+(?:[.,]\d+)?/g)].map(m=>m[0]);
  if(nums.length<2) return null;                 // necesita al menos cantidad y un importe
  if(line.length<4) return null;
  // descartar líneas que son claramente totales/cabeceras
  if(/^(total|subtotal|iva|neto|importe total|cuit|factura|fecha|p[aá]gina)\b/i.test(line.trim())) return null;
  const desc = line.replace(/-?\d[\d.,]*/g,"").replace(/\s+/g," ").trim();
  if(desc.length<2) return null;
  const parsed = nums.map(parseNum);
  // heurística: cantidad = primer número "chico" entero; costo unit = número intermedio; total = último
  let cantidad = parsed.find(n=> n>0 && n<10000 && Number.isInteger(n)) ?? parsed[0];
  let costo = parsed.length>=2 ? parsed[parsed.length-2] : parsed[0];
  if(cantidad>0 && costo===0 && parsed.length){ costo=parsed[parsed.length-1]; }
  return { desc, cantidad: cantidad||1, costo: costo||0, raw:line };
}

    out.innerHTML=`<div class="banner warn">Extraje el texto pero no encontré renglones con cantidad y precio. Revisá el texto crudo abajo y cargá a mano si hace falta.</div>

    const bySku = c.sku ? findProdBySku(c.sku) : null;

    meta.fecha ? `fecha <b>${esc(meta.fecha)}</b>` : "",
    meta.proveedor ? `prov. <b>${esc(meta.proveedor)}</b>` : ""
  ].filter(Boolean).join(" · ");

  out.innerHTML=`
    <div class="banner ok">
      Detecté <b>${items.length}</b> renglón(es) en <b>${esc(fname)}</b> ${mode==="estructurado"?"(formato reconocido)":"(detección genérica — revisá bien)"}.
      ${metaBits?`<br><span style="font-weight:400">${metaBits}</span>`:""}
    </div>
    ${meta.flete? `<div class="banner">Detecté un cargo de <b>flete/handling</b> por ${money(meta.flete)} que <b>no</b> se agrega como stock. Si querés prorratearlo al costo, avisame y lo sumamos.</div>`:""}
    <p style="font-size:12px;color:var(--muted);margin:0 0 8px">
      <b>Costo</b> = lo que pagás (NET) e impacta el último costo. <b>P. venta</b> = sugerido (MSRP) para productos nuevos.
    </p>
    <div class="table-scroll"><table class="line-tbl">
      <thead><tr><th class="c">✓</th><th class="c">SKU</th><th>Descripción</th><th class="r">Cant.</th><th class="r">Costo</th><th class="r">P. venta</th><th>Producto destino</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <details><summary>Ver texto crudo del PDF</summary><div class="rawbox">${esc(pdfLines.join("\n"))}</div></details>
    <div style="display:flex;justify-content:flex-end;margin-top:16px">
      <button class="btn up" id="toDraft">Pasar a editor de compra →</button>
    </div>`;

  out.querySelectorAll("[data-sel]").forEach(cb=> cb.onchange=()=> items[+cb.dataset.sel].sel=cb.checked);
  out.querySelectorAll("[data-imp]").forEach(inp=>{
    const i=+inp.dataset.i, k=inp.dataset.imp;
    inp.oninput=()=>{
      const c=items[i];
      if(k==="cantidad") c.cantidad=parseNum(inp.value);
      else if(k==="costo") c.costo=parseNum(inp.value);
      else if(k==="msrp") c.msrp=parseNum(inp.value);
      else if(k==="prod"){

    const lineas=chosen.map(c=>({

  };
}

/* ============================================================
   FICHA DE PRODUCTO: kardex individual + evolución

function openFicha(id){
  const p = prodById(id); if(!p) return;
  const movs = db.movimientos.filter(m=>m.productoId===id)
                 .sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));

  let bal=0; const serie=[0];
  const rows = movs.map(m=>{
    const up = m.tipo==="entrada";
    bal += up ? m.cantidad : -m.cantidad;
    serie.push(bal);
    const d=new Date(m.fecha);
    const fecha = d.toLocaleDateString("es-AR") + " " + d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
    const origen = (m.refTipo==="compra"||m.refTipo==="venta") && m.refId
      ? `<button class="btn ghost sm" data-fdoc="${m.refTipo}:${m.refId}">${esc(m.ref||"ver factura")}</button>`
      : `<span style="color:var(--muted)">${esc(m.ref||"—")}</span>`;
    return `<tr>
      <td class="num">${fecha}</td>
      <td><span class="pill ${up?'in':'out'}">${up?'↑ entró':'↓ salió'}</span></td>
      <td class="r delta ${up?'up':'down'}">${up?'+':'−'}${qty(m.cantidad)}</td>
      <td class="r num">${money(m.valorUnit)}</td>
      <td class="r num" style="font-weight:600">${qty(bal)}</td>
      <td>${origen}</td>
    </tr>`;
  }).reverse().join("");

  const totComp = movs.filter(m=>m.refTipo==="compra").reduce((a,m)=>a+m.cantidad,0);
  const totVend = movs.filter(m=>m.refTipo==="venta").reduce((a,m)=>a+m.cantidad,0);
  const margen = (p.precioVenta||0)-(p.ultimoCosto||0);
  const margenPct = p.precioVenta>0 ? (margen/p.precioVenta*100) : 0;
  const val = (p.stock||0)*(p.ultimoCosto||0);

  const body = `
    <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">
      <div class="kpi"><div class="lbl">Stock actual</div><div class="val" style="color:${p.stock<0?'var(--alert)':'inherit'}">${qty(p.stock)}</div><div class="sub">${esc(p.unidad||"u")}</div></div>
      <div class="kpi"><div class="lbl">Últ. costo</div><div class="val">${db.config.moneda}${nf0.format(p.ultimoCosto)}</div><div class="sub">valorizado ${money(val)}</div></div>
      <div class="kpi"><div class="lbl">Precio venta</div><div class="val">${db.config.moneda}${nf0.format(p.precioVenta)}</div><div class="sub">${p.precioVenta>0?`margen ${nf0.format(margenPct)}%`:'sin precio'}</div></div>
      <div class="kpi"><div class="lbl">Comprado / Vendido</div><div class="val" style="font-size:20px"><span class="delta up">${qty(totComp)}</span> / <span class="delta down">${qty(totVend)}</span></div><div class="sub">acumulado histórico</div></div>
    </div>

    ${serie.length>2 ? `<div class="panel" style="box-shadow:none;margin-bottom:16px">
      <div class="phead"><h3>Evolución del stock</h3><span class="hint">${movs.length} movimientos</span></div>
      <div style="padding:12px 14px 6px">${sparkline(serie)}</div>
    </div>` : ""}

    <div class="panel" style="box-shadow:none">
      <div class="phead"><h3>Kardex del producto</h3><span class="hint">cada suba y baja con su factura</span></div>
      ${movs.length ? `<div class="table-scroll"><table>
        <thead><tr><th>Fecha</th><th>Movimiento</th><th class="r">Cant.</th><th class="r">Valor unit.</th><th class="r">Saldo</th><th>Origen</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`
        : `<div class="empty"><p>Este producto todavía no tiene movimientos.</p></div>`}
    </div>`;

  buildModal(`${p.sku?("["+esc(p.sku)+"] "):""}${esc(p.nombre)}`, body, [
    {label:"Editar producto",cls:"btn",act:()=>{ closeModal(); openProd(id); }},
    {label:"Cerrar",cls:"btn primary",act:closeModal}
  ], true);

  document.querySelectorAll("[data-fdoc]").forEach(b=> b.onclick=()=>{
    const [t,i]=b.dataset.fdoc.split(":"); verDoc(t,i);
  });
}

/* Mini-gráfico de evolución (SVG, sin librerías) */
function sparkline(vals){
  if(vals.length<2) return "";
  const w=620,h=76,pad=8;
  const max=Math.max(...vals), min=Math.min(...vals,0);
  const range=(max-min)||1;
  const step=(w-2*pad)/(vals.length-1);
  const pts = vals.map((v,i)=>{
    const x=pad+i*step;
    const y=h-pad-((v-min)/range)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const area = `${pad},${h-pad} ${pts.join(" ")} ${(pad+(vals.length-1)*step).toFixed(1)},${h-pad}`;
  const zeroY = h-pad-((0-min)/range)*(h-2*pad);
  const last = vals[vals.length-1];
  const lastX = pad+(vals.length-1)*step;
  const lastY = h-pad-((last-min)/range)*(h-2*pad);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
    <polygon points="${area}" fill="var(--up-bg)"/>
    <line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${w-pad}" y2="${zeroY.toFixed(1)}" stroke="var(--line-strong)" stroke-dasharray="3 3"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" fill="var(--accent)"/>
  </svg>`;
}

/* ============================================================
   Datos: export / import / reset
   ============================================================ */
function exportJSON(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`mayor-stock-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Backup exportado");
}
function importJSON(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json";
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        if(!data.productos) throw new Error("estructura inválida");
        if(!confirm("Esto reemplaza todos los datos actuales. ¿Seguir?")) return;
        db=Object.assign({config:{moneda:"$"},productos:[],compras:[],ventas:[],movimientos:[]}, data);
        save(); toast("Datos importados"); render();
      }catch(e){ toast("JSON inválido","warn"); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function resetAll(){
  if(!confirm("Se borra TODO (productos, compras, ventas y movimientos). ¿Seguro?")) return;
  db={ config:{moneda:db.config.moneda||"$"}, productos:[], compras:[], ventas:[], movimientos:[] };
  save(); toast("Todo borrado","warn"); render();
}

/* ============================================================
   Modal genérico
   ============================================================ */
function buildModal(title, bodyHTML, buttons=[], wide=false, extraFoot=""){
  const root=document.getElementById("modalRoot");
  root.innerHTML=`
    <div class="scrim" id="scrim">
      <div class="modal ${wide?'wide':''}">
        <div class="mhead"><h3>${esc(title)}</h3><button class="x" id="xClose">×</button></div>
        <div class="mbody">${bodyHTML}</div>
        ${extraFoot?`<div class="mextra" style="padding:0 22px">${extraFoot}</div>`:""}
        <div class="mfoot" id="mfoot"></div>
      </div>
    </div>`;
  const foot=document.getElementById("mfoot");
  // separar botón de eliminar (izquierda) del resto (derecha)
  const left=buttons.filter(b=>b.cls.includes("danger"));
  const right=buttons.filter(b=>!b.cls.includes("danger"));
  const wrapL=document.createElement("div"); wrapL.style.display="flex"; wrapL.style.gap="8px";
  const wrapR=document.createElement("div"); wrapR.style.display="flex"; wrapR.style.gap="8px"; wrapR.style.marginLeft="auto";
  left.forEach(b=> wrapL.appendChild(mkBtn(b)));
  right.forEach(b=> wrapR.appendChild(mkBtn(b)));
  foot.appendChild(wrapL); foot.appendChild(wrapR);
  document.getElementById("xClose").onclick=closeModal;
  document.getElementById("scrim").addEventListener("mousedown",e=>{ if(e.target.id==="scrim") closeModal(); });
  document.addEventListener("keydown", escClose);
  return root;
}
function mkBtn(b){
  const el=document.createElement("button"); el.className=b.cls; el.textContent=b.label; el.onclick=b.act; return el;
}
function escClose(e){ if(e.key==="Escape") closeModal(); }
function closeModal(){
  document.getElementById("modalRoot").innerHTML="";
  document.removeEventListener("keydown", escClose);
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW no registrado:", err));
  });
}
