<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b2430">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestor">
<title>Stock Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var _t=localStorage.getItem("gstock_theme");if(_t==="dark"||(!_t&&window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)){document.documentElement.setAttribute("data-theme","dark");}else if(_t==="light"){document.documentElement.setAttribute("data-theme","light");}}catch(e){}</script>
<style>
  :root{
    --ink:#1a1a1a;
    --ink-soft:#3a362f;
    --paper:#faf9f7;
    --surface:#ffffff;
    --surface-2:#f5f3ef;
    --line:#eae7e1;
    --line-strong:#dad6ce;
    --accent:#2563eb;
    --accent-ink:#2563eb;
    --up:#2563eb;
    --up-bg:#eaf0fc;
    --down:#dc2626;
    --down-bg:#fbecec;
    --alert:#dc2626;
    --alert-bg:#fbecec;
    --muted:#7a756c;
    --text:#1a1a1a;
    --radius:14px;
    --mono:"Spline Sans Mono",ui-monospace,"SF Mono","Menlo","Consolas",monospace;
    --sans:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --shadow:0 1px 2px rgba(26,26,26,.05);
    --side-bg:#f3f1ed;
    --side-hover:#e9e6df;
    --nav-ink:#5a554c;
    --topbar-bg:#ffffff;
    --login-bg:#f0eee9;
  }
  :root[data-theme="dark"]{
    --ink:#0b0e13;
    --paper:#0f141b;
    --surface:#161c25;
    --surface-2:#1d2530;
    --line:#28303c;
    --line-strong:#38424f;
    --accent:#4d82e8;
    --accent-ink:#7aa5f0;
    --up:#4d82e8;
    --up-bg:#17243b;
    --down:#f16a68;
    --down-bg:#3a1e1e;
    --alert:#f16a68;
    --alert-bg:#3a1e1e;
    --muted:#8b93a1;
    --text:#e6e9ee;
    --shadow:0 1px 2px rgba(0,0,0,.45);
    --side-bg:#12171f;
    --side-hover:#1d2530;
    --nav-ink:#c2c9d4;
    --topbar-bg:#12171f;
    --login-bg:#0b0f15;
  }
  :root[data-theme="dark"] .banner.warn{color:#f3b3b3;border-color:#5a2b2b}
  :root[data-theme="dark"] .banner.ok{color:var(--accent-ink);border-color:#264a6e}
  :root[data-theme="dark"] .login-card .inp{background:var(--surface-2)}
  :root[data-theme="dark"] .login-build{color:#5b6472}
  :root[data-theme="dark"] .modal{box-shadow:0 20px 60px rgba(0,0,0,.6)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--text);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
  :root[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.7)}
  input:focus-visible,select:focus-visible,button:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  /* ---------- Layout ---------- */
  :root{ --topbar-h:54px; }
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;padding-top:var(--topbar-h)}
  .side{
    background:var(--side-bg);color:var(--muted);padding:22px 16px;
    display:flex;flex-direction:column;gap:4px;position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));border-right:1px solid var(--line-strong);
  }

  /* ---------- Barra superior transparente (glass), scrollea por detrás ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:44;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 22px 0 18px;
    background:transparent;border-bottom:1px solid transparent;
    -webkit-backdrop-filter:blur(12px) saturate(1.15);backdrop-filter:blur(12px) saturate(1.15);
    transition:background .2s,border-color .2s;
  }
  .topbar.scrolled{ background:color-mix(in srgb, var(--paper) 72%, transparent); border-bottom-color:var(--line) }
  @supports not (background:color-mix(in srgb, red, blue)){ .topbar.scrolled{ background:var(--topbar-bg) } }
  .topbar .tb-brand{display:flex;align-items:center;gap:9px;min-width:0}
  .topbar .tb-mark{width:27px;height:27px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(29,78,216,.28)}
  .topbar .tb-mark svg{width:15px;height:15px}
  .topbar .tb-name{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.4px;white-space:nowrap}
  .topbar .tb-right{display:flex;align-items:center;gap:14px}
  .topbar .tb-sync{font-size:11.5px;font-weight:700;white-space:nowrap}
  @media (max-width:860px){ .topbar{display:none} }
  .brand{display:none}
  .brand-logo{border-radius:7px;flex-shrink:0;box-shadow:0 2px 8px rgba(17,19,23,.14)}
  .brand h1{font-size:15px;font-weight:800;color:var(--text);margin:0;letter-spacing:-.4px}
  .side-actions{display:flex;flex-direction:column;gap:6px;margin-top:14px;align-items:flex-start}
  .side-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;padding:0;border-radius:8px;
    background:none;border:1px solid transparent;color:var(--muted);
    transition:color .12s,background .12s,border-color .12s;
  }
  .side-btn:hover{color:var(--text);background:var(--side-hover);border-color:var(--line)}
  .side-btn.is-logout:hover{color:var(--down);border-color:var(--line-strong)}
  .side-btn svg{width:17px;height:17px;display:block}
  @keyframes side-spin{to{transform:rotate(360deg)}}
  .side-btn.spin svg{animation:side-spin .8s linear infinite;transform-origin:center}

  /* ---------- Switch de tema (deslizable, arriba a la derecha) ---------- */
  .theme-switch{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0}
  .theme-switch .ts-track{position:relative;display:block;width:60px;height:28px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line-strong);box-shadow:var(--shadow);transition:background .2s,border-color .2s}
  .theme-switch .ts-hint{position:absolute;top:0;height:100%;width:28px;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.5}
  .theme-switch .ts-hint svg{width:13px;height:13px}
  .theme-switch .ts-hint-sun{left:2px}
  .theme-switch .ts-hint-moon{right:2px}
  .theme-switch .ts-thumb{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:#e0a11a;transition:transform .22s ease,background .2s,color .2s}
  .theme-switch .ts-thumb svg{width:13px;height:13px}
  :root[data-theme="dark"] .theme-switch .ts-thumb{transform:translateX(32px);background:#e6e9ee;color:#3b4b66}
  .brand-m-logo{border-radius:6px;align-self:center;margin-right:6px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{
    position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:none;border:0;color:var(--nav-ink);padding:10px 12px;border-radius:8px;
    font-size:14px;font-weight:500;
    transition:background .18s ease,color .18s ease,transform .16s cubic-bezier(.34,1.56,.64,1);
    animation:navIn .34s ease both;
  }
  /* barrita de acento a la izquierda: crece al pasar el mouse sobre un ítem inactivo */
  .nav button::before{
    content:"";position:absolute;left:2px;top:50%;height:0;width:3px;border-radius:3px;
    background:var(--accent);transform:translateY(-50%);transition:height .2s cubic-bezier(.34,1.56,.64,1);
  }
  .nav button .ico{width:18px;text-align:center;font-family:var(--mono);font-size:14px;opacity:.7;transition:transform .18s ease,opacity .18s ease}
  .nav button:hover{background:var(--side-hover);color:var(--text)}
  .nav button:hover .ico{transform:scale(1.14)}
  .nav button:not(.on):hover{transform:translateX(3px)}
  .nav button:not(.on):hover::before{height:16px}
  .nav button.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(29,78,216,.24)}
  .nav button.on .ico{opacity:1;animation:navPop .32s cubic-bezier(.34,1.56,.64,1)}
  /* stagger de entrada: cada botón entra un toque después que el anterior */
  .nav button:nth-child(1){animation-delay:.02s}
  .nav button:nth-child(2){animation-delay:.06s}
  .nav button:nth-child(3){animation-delay:.10s}
  .nav button:nth-child(4){animation-delay:.14s}
  .nav button:nth-child(5){animation-delay:.18s}
  .nav button:nth-child(6){animation-delay:.22s}
  .nav button:nth-child(7){animation-delay:.26s}
  @keyframes navIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
  @keyframes navPop{0%{transform:scale(.82)}55%{transform:scale(1.18)}100%{transform:scale(1.05)}}
  /* fundido de entrada del contenido al cambiar de pestaña */
  #main.view-anim{animation:viewIn .26s ease}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .side .foot{margin-top:auto;padding:0 8px;font-size:11.5px;color:var(--muted);line-height:1.6}

  .main{padding:32px 44px 80px;max-width:1560px;width:100%;margin-inline:auto}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
  .head .title h2{font-size:26px;margin:0 0 3px;letter-spacing:-.4px;font-weight:650}
  .head .title p{margin:0;color:var(--muted);font-size:14px}
  .head .actions{display:flex;gap:9px;flex-wrap:wrap}

  /* ---------- Buttons ---------- */
  .btn{
    border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
    padding:9px 15px;border-radius:8px;font-size:14px;font-weight:550;
    display:inline-flex;align-items:center;gap:7px;transition:border-color .12s,background .12s;
  }
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
  .btn.up{background:var(--up);border-color:var(--up);color:#fff}
  .btn.up:hover{filter:brightness(.94)}
  .btn.down{background:var(--down);border-color:var(--down);color:#fff}
  .btn.down:hover{filter:brightness(.94)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:8px 10px}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.danger{color:var(--alert);border-color:var(--line-strong)}
  .btn.danger:hover{border-color:var(--alert);background:var(--alert-bg)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* ---------- Cards / KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:8px}
  .kpi .val{font-family:var(--sans);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.1}
  .kpi .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
  .kpi.warn .val{color:var(--alert)}
  /* Tarjeta de alerta clickeable: se levanta un toque al pasar el mouse */
  .kpi-click{transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
  .kpi-click:hover{transform:translateY(-2px);border-color:var(--alert);box-shadow:0 6px 18px rgba(220,38,38,.16)}
  .kpi-click:active{transform:translateY(0)}
  /* Banner de reposición: pulso suave para que "salte" al entrar al panel */
  .banner.alerta-pedido{cursor:pointer;align-items:center;transition:transform .14s ease,box-shadow .14s ease;animation:alertaPulse 1.8s ease-in-out 2}
  .banner.alerta-pedido:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(220,38,38,.18)}
  .banner.alerta-pedido u{text-underline-offset:2px}
  @keyframes alertaPulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}50%{box-shadow:0 0 0 4px rgba(220,38,38,.14)}}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel + .panel{margin-top:20px}
  .panel .phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .panel .phead h3{margin:0;font-size:15px;font-weight:620}
  .panel .phead .hint{font-size:12.5px;color:var(--muted)}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);
    position:sticky;top:0;
  }
  td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  td.r,th.r{text-align:right}
  td.c,th.c{text-align:center}
  .sku{font-family:var(--mono);font-size:13px;color:var(--accent-ink);background:var(--surface-2);padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
  .pill.in{background:var(--up-bg);color:var(--up)}
  .pill.out{background:var(--down-bg);color:var(--down)}
  .pill.low{background:var(--alert-bg);color:var(--alert)}
  .pill.adj{background:rgba(186,117,23,.14);color:#b26b0f}
  :root[data-theme="dark"] .pill.adj{background:rgba(239,159,39,.16);color:#efb35a}
  .delta.flat{color:var(--muted)}
  .delta{font-family:var(--mono);font-weight:600}
  .delta.up{color:var(--up)}
  .delta.down{color:var(--down)}
  .stock-cell{font-family:var(--mono);font-weight:600}
  .stock-cell.low{color:var(--alert)}
  .stock-cell.neg{color:var(--alert);font-weight:800}
  .stock-cell.zero{color:var(--alert);font-weight:800}

  /* ---------- Headers ordenables (clic en el título ordena) ---------- */
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{color:var(--text)}
  th .sarr{display:inline-block;margin-left:5px;font-size:10px;opacity:.32;transition:opacity .12s,color .12s;vertical-align:middle}
  th.sortable:hover .sarr{opacity:.65}
  th.sort-asc .sarr,th.sort-desc .sarr{opacity:1;color:var(--accent-ink)}

  /* ---------- Combobox de producto (buscador en línea de venta/compra) ---------- */
  .ppick{position:relative}
  .ppick-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;font-size:13.5px;color:var(--text);min-height:34px}
  .ppick-btn:hover{border-color:var(--muted)}
  .ppick-btn.open{border-color:var(--accent)}
  .ppick-btn .ppick-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .ppick-btn.placeholder .ppick-label{color:var(--muted)}
  .ppick-btn .ppick-caret{color:var(--muted);font-size:10px;flex-shrink:0}
  .ppick-pop{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line-strong);
    border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.28);width:360px;max-width:94vw;
    display:flex;flex-direction:column;overflow:hidden}
  .ppick-pop .ppick-search{margin:9px 9px 6px;width:calc(100% - 18px)}
  .ppick-list{max-height:280px;overflow:auto;padding:0 6px 8px}
  .ppick-item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:0;
    border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--text);line-height:1.35}
  .ppick-item:hover,.ppick-item.active{background:var(--surface-2)}
  .ppick-item .pi-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ppick-item .pi-disp{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex-shrink:0}
  .ppick-item.new{color:var(--accent);font-weight:600;border-top:1px solid var(--line);border-radius:0;margin-top:2px}
  .ppick-empty{padding:16px 12px;color:var(--muted);font-size:13px;text-align:center}
  /* Punto 20: segmented toggle USD/Units */
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--surface)}
  .seg-btn{border:0;background:none;color:var(--muted);font-weight:700;font-size:12.5px;padding:7px 14px;cursor:pointer;font-family:var(--sans)}
  .seg-btn.on{background:var(--accent);color:#fff}
  .crow[data-saga]:hover .cl{color:var(--accent)}
  .crow[data-saga]:hover .cf{filter:brightness(1.08)}
  /* Punto 6: que el SKU+nombre largo NO rompa el ancho de la fila (ellipsis) */
  .line-tbl td:first-child{max-width:300px}
  .ppick{min-width:0;max-width:100%}
  .ppick-btn{max-width:100%;min-width:0}
  .imp-desc{font-size:12.5px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ppick-item .sku{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}

  .empty{padding:48px 24px;text-align:center;color:var(--muted)}
  .empty .big{font-family:var(--mono);font-size:34px;color:var(--line-strong);margin-bottom:10px}
  .empty p{margin:4px 0}
  .empty .hint{font-size:13px;max-width:440px;margin:10px auto 0}

  /* ---------- Forms / rows ---------- */
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .inp{border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;background:var(--surface);color:var(--text);width:100%}
  .inp:focus{border-color:var(--accent)}
  .inp.num{text-align:right}
  .grid-form{display:grid;gap:14px;padding:18px}

  /* line editor table inputs */
  table .inp{padding:6px 8px;font-size:13.5px;border-radius:6px}
  .line-tbl td{padding:7px 10px}
  .line-tbl select.inp{min-width:150px}

  /* ---------- Modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,26,34,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.28);width:100%;max-width:760px;overflow:hidden}
  .modal.wide{max-width:940px}
  .modal .mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal .mhead h3{margin:0;font-size:18px;font-weight:640}
  .modal .mbody{padding:20px 22px;max-height:66vh;overflow:auto}
  .modal .mfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-top:1px solid var(--line);background:var(--surface-2)}
  .x{background:none;border:0;font-size:22px;color:var(--muted);line-height:1;padding:4px 8px;border-radius:6px}
  .x:hover{background:var(--surface-2);color:var(--text)}

  .drop{
    border:2px dashed var(--line-strong);border-radius:12px;padding:30px 20px;text-align:center;
    background:var(--surface-2);transition:border-color .15s,background .15s;cursor:pointer;
  }
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--up-bg)}
  .drop .di{font-family:var(--mono);font-size:30px;color:var(--accent);margin-bottom:8px}
  .drop p{margin:4px 0;color:var(--muted);font-size:13.5px}
  .drop .fn{color:var(--accent-ink);font-weight:600}

  .rawbox{font-family:var(--mono);font-size:11.5px;line-height:1.55;background:var(--ink);color:#cbd5e1;border-radius:8px;padding:12px;max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  details{margin-top:14px}
  summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}

  .totrow{display:flex;justify-content:flex-end;gap:26px;padding:12px 4px;font-size:15px}
  .totrow .num{font-weight:650;font-size:17px}

  /* store switcher + power-bi style slicers */
  .storebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
  .storebar .sb-viewas{display:flex;gap:8px;align-items:center;margin-left:auto}
  @media(max-width:640px){ .storebar .sb-viewas{margin-left:0;width:100%} }
  .storebar .sb-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
  .chip-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.12s;white-space:nowrap}
  .chip-btn:hover{border-color:var(--accent)}
  .chip-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .slicers{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px;align-items:flex-end}
  .slicer{display:flex;flex-direction:column;gap:5px}
  .slicer > span{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  /* Punto 16: mismo estilo y MISMA altura para selects e inputs date del filtro */
  .slicer select,.slicer input{height:36px;box-sizing:border-box;border:1px solid var(--line);background:var(--card);
    color:var(--text);border-radius:8px;padding:0 10px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:var(--sans);line-height:34px}
  .slicer input[type="date"]{min-width:150px;cursor:text}
  .slicer input::-webkit-calendar-picker-indicator{opacity:.6;cursor:pointer}
  .slicer select:focus,.slicer input:focus{outline:none;border-color:var(--accent)}
  .slicer-reset{height:36px;font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;font-weight:700;padding:0 6px}
  .pill.blocked{background:#7c4a03;color:#ffd9a0}
  .pill.inv{background:#3a2a6b;color:#d7c9ff}
  .inv-badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .inv-badge.transit{background:var(--up-bg);color:var(--accent-ink);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
  .inv-badge.received{background:#123a2a;color:#7fe0b8;border:1px solid #1c5a41}
  :root:not([data-theme="dark"]) .inv-badge.received{background:#e6f6ee;color:#1c7a52;border-color:#bfe6d2}
  tr.row-transit td{color:var(--muted)}
  tr.row-transit .sku{opacity:.7}
  .stock-cell.transit{color:var(--accent-ink);font-weight:700}
  .banner{padding:11px 14px;border-radius:8px;font-size:13.5px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
  .banner.warn{background:var(--alert-bg);color:#8a2b2b;border:1px solid #e6c4c4}
  .banner.ok{background:var(--up-bg);color:var(--accent-ink);border:1px solid #bcd8ca}

  /* ---------- Toast ---------- */
  #toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:9px;z-index:80}
  .toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:9px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:9px;align-items:center;animation:slide .25s ease}
  .toast .b{width:3px;height:100%;border-radius:2px;align-self:stretch}
  .toast.up{border-left:3px solid var(--up)}
  .toast.down{border-left:3px solid var(--down)}
  .toast.warn{border-left:3px solid var(--alert)}
  @keyframes slide{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

  /* importes y fechas en una sola línea */
  td.num,th.num{white-space:nowrap}
  .pill{white-space:nowrap}
  .filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .filtros .inp{padding:7px 9px;font-size:13px}
  /* filtros compactos (movimientos): entran en el ancho disponible y ENVUELVEN a una
     segunda fila si no caben, en vez de obligar a deslizar al costado. El buscador
     estira; los selects se dimensionan a su contenido (nada de min-widths arbitrarios). */
  .filtros.compact{gap:8px;padding:10px 14px;flex-wrap:wrap}
  .filtros.compact .inp{padding:6px 8px;font-size:12.5px;height:32px}
  .filtros.compact > .inp,.filtros.compact > select,.filtros.compact > .fdate,.filtros.compact > button{flex:0 0 auto}
  .filtros.compact > #mq{flex:1 1 200px;min-width:160px}
  .filtros.compact select{width:auto;min-width:112px;max-width:190px}
  .filtros.compact .fdate{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .filtros.compact .fdate .inp{width:120px}
  .selbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600}
  .selbar .sel-hint{color:var(--muted);font-weight:500}
  .selbar #selactions{display:flex;gap:8px;align-items:center}
  /* iconos dentro de botones (SVG minimalista) */
  .btn svg.i{width:15px;height:15px;flex-shrink:0;display:block}
  .btn.sm svg.i{width:14px;height:14px}

  /* ---------- Análisis / gráficos ---------- */
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}
  .chart-grid .panel.chart{display:flex;flex-direction:column;min-height:240px}
  /* dentro del grid, la regla global .panel + .panel metía un margin-top de 20px
     al panel de la derecha y lo dejaba 20px más abajo que el de la izquierda
     (de ahí el "descentrado"). Acá lo anulamos: el gap del grid ya separa. */
  .chart-grid .panel{margin-top:0}
  @media (max-width:860px){.chart-grid{grid-template-columns:1fr}}
  .chart{padding:16px 18px}
  .chart .ctitle{font-size:13px;font-weight:650;margin:0 0 3px}
  .chart .csub{font-size:12px;color:var(--muted);margin:0 0 14px}
  .crow{display:flex;align-items:center;gap:10px;padding:5px 0}
  .crow .cl{width:44%;font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow .cl .sku{font-size:11px;padding:1px 5px}
  .crow .ct{flex:1;background:var(--surface-2);border-radius:5px;height:18px;overflow:hidden;border:1px solid var(--line)}
  .crow .cf{height:100%;border-radius:5px 0 0 5px;min-width:2px;transition:width .4s ease}
  .crow .cv{width:104px;text-align:right;font-family:var(--mono);font-size:12.5px;font-weight:600;white-space:nowrap}
  .cempty{padding:26px 8px;text-align:center;color:var(--muted);font-size:13px}
  .clegend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:4px}
  .clegend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

  /* ---------- Donut (interactive, no libs) ---------- */
  .donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .donut-svg{flex:0 0 168px;width:168px;height:168px}
  .donut-seg{cursor:pointer;transition:opacity .15s,transform .15s;transform-origin:center;transform-box:fill-box}
  .donut-seg:hover{opacity:.82}
  .donut-svg.has-active .donut-seg{opacity:.32}
  .donut-svg.has-active .donut-seg.on{opacity:1}
  .donut-ctr-val{font-family:var(--mono);font-weight:700;fill:var(--text)}
  .donut-ctr-lbl{fill:var(--muted)}
  .donut-legend{flex:1;min-width:170px;display:flex;flex-direction:column;gap:3px}
  .donut-leg{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:7px;cursor:pointer;transition:background .12s}
  .donut-leg:hover{background:var(--surface-2)}
  .donut-leg.on{background:var(--surface-2)}
  .donut-leg .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  .donut-leg .lg-lbl{flex:1;font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .donut-leg .lg-val{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
  .donut-leg .lg-pct{font-size:11px;color:var(--muted);width:38px;text-align:right;white-space:nowrap}

  .mobtop{display:none}

  @media (max-width:860px){
    .app{grid-template-columns:1fr;padding-top:0}
    .side{display:none}
    .mobtop{display:flex;position:sticky;top:0;z-index:40;background:var(--topbar-bg);color:var(--text);padding:10px 14px;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
    .mobtop .brand-m{font-family:var(--mono);font-weight:700;margin-right:8px;white-space:nowrap;align-self:center}
    .mobtop button{background:none;border:0;color:var(--nav-ink);padding:8px 12px;border-radius:6px;font-size:13.5px;font-weight:600;white-space:nowrap}
    .mobtop button.on{background:var(--accent);color:#fff}
    .main{padding:20px 16px 90px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .head{flex-direction:column;align-items:flex-start}
    .table-scroll{overflow-x:auto}
    table{min-width:560px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- Login ---------- */
  #login[hidden]{display:none}
  .login-scrim{
    position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
    background:var(--login-bg);overflow:hidden;
  }
  /* Aurora de fondo: tres manchas de color que respiran muy suave detrás de la tarjeta */
  .login-aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .login-aurora span{position:absolute;display:block;border-radius:50%;filter:blur(64px);opacity:.5}
  .login-aurora span:nth-child(1){width:420px;height:420px;left:-90px;top:-120px;background:radial-gradient(circle at 30% 30%,var(--accent),transparent 70%);animation:aurora1 17s ease-in-out infinite}
  .login-aurora span:nth-child(2){width:380px;height:380px;right:-100px;top:18%;background:radial-gradient(circle at 60% 40%,#6ea8fe,transparent 70%);animation:aurora2 21s ease-in-out infinite}
  .login-aurora span:nth-child(3){width:340px;height:340px;left:28%;bottom:-150px;background:radial-gradient(circle at 50% 50%,#9db8ff,transparent 70%);animation:aurora3 19s ease-in-out infinite}
  :root[data-theme="dark"] .login-aurora span{opacity:.26}
  @keyframes aurora1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.12)}}
  @keyframes aurora2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,40px) scale(1.08)}}
  @keyframes aurora3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-30px) scale(1.15)}}
  .login-card{
    position:relative;z-index:1;
    width:100%;max-width:372px;background:var(--surface);
    border:1px solid var(--line);border-radius:20px;padding:40px 32px 26px;text-align:center;
    box-shadow:0 1px 2px rgba(17,19,23,.04),0 30px 70px rgba(17,19,23,.14);
    animation:cardIn .5s cubic-bezier(.22,1,.36,1) both;
  }
  :root[data-theme="dark"] .login-card{box-shadow:0 1px 2px rgba(0,0,0,.4),0 30px 70px rgba(0,0,0,.5)}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  .login-logo-wrap{display:inline-flex;margin-bottom:16px;animation:logoFloat 5s ease-in-out infinite}
  @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .login-logo{border-radius:18px;box-shadow:0 10px 30px rgba(29,78,216,.28);display:block}
  .login-card h1{color:var(--text);font-size:23px;margin:0 0 6px;letter-spacing:-.6px;font-weight:900}
  .login-sub{color:var(--muted);font-size:13.5px;margin:0 0 24px;line-height:1.5}
  .login-card .field{text-align:left;margin-bottom:14px}
  .login-card .field label{color:var(--muted);font-size:12.5px;font-weight:600}
  .login-card .inp{background:var(--surface);border-color:var(--line-strong);color:var(--text);padding:11px 12px;border-radius:10px;transition:border-color .15s,box-shadow .15s}
  .login-card .inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
  @supports not (background:color-mix(in srgb,red,blue)){.login-card .inp:focus{box-shadow:0 0 0 3px rgba(29,78,216,.18)}}
  /* contraseña con "ojito" para mostrar/ocultar */
  .pass-wrap{position:relative}
  .pass-wrap .inp{padding-right:42px}
  .pass-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:8px;color:var(--muted);transition:color .15s,background .15s}
  .pass-toggle:hover{color:var(--text);background:var(--side-hover)}
  .pass-toggle svg{width:18px;height:18px}
  .pass-toggle .eye-off{display:none}
  .pass-toggle.show .eye-on{display:none}
  .pass-toggle.show .eye-off{display:block}
  .login-btn{width:100%;justify-content:center;padding:12px;font-size:15px;margin-top:6px;border-radius:10px;transition:transform .12s ease,filter .15s ease,background .15s}
  .login-btn:hover{filter:brightness(1.04)}
  .login-btn:active{transform:scale(.985)}
  .login-err{color:var(--down);font-size:13px;min-height:18px;margin:2px 0 6px;text-align:left}
  .login-build{color:var(--muted);opacity:.6;font-size:11px;margin:16px 0 0;letter-spacing:.4px}

  /* ============================================================
     Custom dropdown (reemplaza el popup nativo del <select>) y
     calendario custom (reemplaza el date-picker nativo). El control
     real (<select> / <input type=date>) sigue vivo y oculto detrás,
     así value/onchange no cambian. Todo pintado con los tokens del tema.
     ============================================================ */
  .csel-pop{
    position:fixed;z-index:120;min-width:150px;max-width:min(320px,92vw);
    background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;
    box-shadow:0 12px 34px rgba(0,0,0,.30),0 2px 6px rgba(0,0,0,.14);
    padding:5px;max-height:280px;overflow:auto;
    animation:cselIn .12s ease;font-family:var(--sans);
    -webkit-overflow-scrolling:touch;
  }
  :root[data-theme="dark"] .csel-pop{box-shadow:0 16px 40px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4)}
  @keyframes cselIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .csel-opt{
    display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;
    font-size:13px;font-weight:600;color:var(--text);cursor:pointer;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;user-select:none;line-height:1.2;
  }
  .csel-opt:hover,.csel-opt.hi{background:var(--surface-2)}
  .csel-opt.sel{color:var(--accent-ink)}
  .csel-opt.sel::after{content:"✓";margin-left:auto;font-weight:800;color:var(--accent)}
  .csel-opt[data-disabled="1"]{opacity:.4;cursor:default;pointer-events:none}
  .csel-sep{height:1px;background:var(--line);margin:4px 6px}
  /* Flechita del select nativo cuando está "enhanceado": mantenemos el caret
     visible pero el popup nativo ya no abre. */
  select[data-csel]{cursor:pointer}

  /* ---------- Calendario custom ---------- */
  .cal-pop{
    position:fixed;z-index:120;width:264px;background:var(--surface);
    border:1px solid var(--line-strong);border-radius:12px;padding:12px;
    box-shadow:0 12px 34px rgba(0,0,0,.30),0 2px 6px rgba(0,0,0,.14);
    animation:cselIn .12s ease;font-family:var(--sans);user-select:none;
  }
  :root[data-theme="dark"] .cal-pop{box-shadow:0 16px 40px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4)}
  .cal-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .cal-title{flex:1;font-size:13.5px;font-weight:700;color:var(--text);text-transform:capitalize;
    padding:5px 8px;border-radius:7px;cursor:pointer;transition:background .12s}
  .cal-title:hover{background:var(--surface-2)}
  .cal-nav{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;
    cursor:pointer;transition:.12s;font-size:15px;line-height:1}
  .cal-nav:hover{border-color:var(--accent);color:var(--accent-ink)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-dow{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;
    padding:4px 0;letter-spacing:.03em}
  .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:600;color:var(--text);border-radius:8px;cursor:pointer;
    transition:background .1s,color .1s;border:1px solid transparent}
  .cal-cell:hover{background:var(--surface-2)}
  .cal-cell.out{color:var(--muted);opacity:.45}
  .cal-cell.today{border-color:var(--accent)}
  .cal-cell.sel{background:var(--accent);color:#fff}
  .cal-cell.sel:hover{background:var(--accent)}
  /* Vista de meses / años al tocar el título */
  .cal-mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .cal-mcell{padding:11px 4px;text-align:center;font-size:12.5px;font-weight:600;color:var(--text);
    border-radius:8px;cursor:pointer;border:1px solid transparent;transition:.1s;text-transform:capitalize}
  .cal-mcell:hover{background:var(--surface-2)}
  .cal-mcell.sel{background:var(--accent);color:#fff}
  .cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
    padding-top:9px;border-top:1px solid var(--line)}
  .cal-foot button{background:none;border:none;font-size:12.5px;font-weight:700;color:var(--accent);
    cursor:pointer;padding:4px 6px;border-radius:6px}
  .cal-foot button:hover{background:var(--surface-2)}
  /* Ícono de calendario del trigger cuando el input date está enhanceado.
     Ocultamos el indicador nativo para que NO abra el picker del sistema. */
  input[data-cdate]::-webkit-calendar-picker-indicator{display:none}
  input[data-cdate]{cursor:pointer;position:relative}
  .cdate-wrap{position:relative;display:inline-flex;align-items:center}
  .cdate-ico{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;
    color:var(--muted);display:flex}
  .cdate-ico svg{width:15px;height:15px}
</style>
</head>
</head>
<body>
<div id="login" class="login-scrim" hidden>
  <div class="login-aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="login-card">
    <div class="login-logo-wrap"><img src="icon-512.png" alt="" class="login-logo" width="84" height="84"></div>
    <h1>Stock Manager</h1>
    <p class="login-sub">Your inventory, synced across all your devices.</p>
    <div class="field"><label for="loginUser">Username</label>
      <input class="inp" id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="your username"></div>
    <div class="field"><label for="loginPass">Password</label>
      <div class="pass-wrap">
        <input class="inp" id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
        <button type="button" class="pass-toggle" id="loginPassToggle" aria-label="Show password" title="Show password" tabindex="-1">
          <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <div id="loginErr" class="login-err"></div>
    <button class="btn primary login-btn" id="loginBtn">Sign in</button>
    <p class="login-build">build v34</p>
  </div>
</div>
<div class="topbar" id="topbar">
  <div class="tb-brand">
    <span class="tb-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>
    </span>
    <span class="tb-name">Stock Manager</span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============================================================
   Gestor de Stock — vanilla, último costo, sincronizado
   ============================================================ */
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const KEY = "gstock_v1";
const SKEY = "gstock_sync";       // { syncedRev, dirty }
const SESKEY = "gstock_session";  // { user, token, space, role, store }

/* ============================================================
   MULTI-STORE / ROLES / LANGUAGE / SPECIAL STATES  (Phase 1)
   ------------------------------------------------------------
   STORES: separate selling entities. Stock, FIFO cost layers and
   sale price live PER STORE, but the product master is SHARED so we
   can compare the same SKU across stores (margin analysis, point 4).
   ROLES: 'admin' (a.k.a. master: sees everything incl. investment
   vault) and 'seller' (only their own store).
   PRODUCT STATE: 'sale' (normal) | 'blocked' (best-offer, visible to
   sellers with a flag, not sellable without approval) | 'investment'
   (executive hold, leaves the sellable inventory, admin-only vault).
   LANGUAGE: per-product tag JP | ESP.
   ============================================================ */
const STORES = [
  { id:"akira",  name:"Akira"  },
  { id:"silver", name:"Silver" }
];
const STORE_IDS = STORES.map(s=>s.id);
/* Investment vault = a hidden pseudo-store. Stock and FIFO cost layers moved
   here LEAVE the sellable inventory (STORE_IDS) but keep full traceability.
   It's deliberately NOT part of STORE_IDS, so it never counts as sellable
   stock, never shows in selling views, and never inflates valuation. */
const INV_STORE = "__inv";
function storeName(id){ if(id===INV_STORE) return "Investment vault"; const s=STORES.find(x=>x.id===id); return s?s.name:(id||"—"); }
function isStore(id){ return STORE_IDS.includes(id); }

const ROLES = { ADMIN:"admin", SELLER:"seller" };
function currentRole(){ return (session && session.role) || ROLES.ADMIN; }  // Local mode (no session) = full access
function isAdmin(){ return currentRole()===ROLES.ADMIN; }
function isSeller(){ return currentRole()===ROLES.SELLER; }
/* Vistas reservadas al admin. Un vendedor NO carga compras, no manda a inversión,
   no ve análisis/comisiones globales ni la exportación de datos. Sólo vende. */
const ADMIN_VIEWS = ["compras","inv","analisis","datos"];
/* Capacidades gateadas por rol (punto 3). El modo Local (sin sesión) = admin. */
function puedeComprar(){ return isAdmin(); }        // cargar compras / recibir facturas
function puedeInvertir(){ return isAdmin(); }       // enviar / traer de la bóveda de inversión
function puedeAjustar(){ return isAdmin(); }        // ajustes de inventario
function puedeEditarProductos(){ return isAdmin(); }// ABM de productos
/* SOCIEDADES: akira/silver (y futuras) son las entidades que COMPRAN. Definen la
   procedencia de cada lote, NO un local de venta. El stock es un pool único: para
   VENDER no se elige sociedad. Todos ven el mismo pool; el desglose por sociedad
   (columnas Akira/Silver) es info de procedencia y se muestra sólo al admin. */
function allowedStores(){ return STORE_IDS.slice(); }
/* Desglose por sociedad (procedencia). Admin, vista consolidada, 2+ sociedades.
   Genérico: una columna por sociedad, así escala a futuras sociedades sin tocar código. */
function showSociedadCols(){ return isAdmin() && activeStore==="all" && STORE_IDS.length>1; }
function sociedadColsHead(){ return showSociedadCols() ? STORE_IDS.map(s=>`<th class="r">${esc(storeName(s))}</th>`).join("") : ""; }
function sociedadColsCells(p, isT){ return showSociedadCols() ? STORE_IDS.map(s=>`<td class="r num">${stockDisplay(p, isT?transitoDe(p,s):stockDe(p,s))}</td>`).join("") : ""; }
/* The store currently in focus. 'all' = consolidated (admin only). */
let activeStore = "all";
function effectiveStores(){
  const allow = allowedStores();
  if(activeStore==="all") return allow;
  return allow.includes(activeStore) ? [activeStore] : allow;
}

const PRODUCT_STATES = { SALE:"sale", BLOCKED:"blocked", INVESTMENT:"investment" };
/* Estado de envío de una factura de COMPRA (tracking, no toca stock). */
const INVOICE_STATUS = { IN_TRANSIT:"in_transit", RECEIVED:"received" };
function invoiceStatusLabel(s){ return s===INVOICE_STATUS.RECEIVED ? "Received" : "In transit"; }
const LANGS = [["JP","JP"],["ESP","SP/ESP"]];
function langLabel(v){ const l=LANGS.find(x=>x[0]===v); return l?l[1]:(v||"—"); }

/* URL del servidor (Cloudflare Worker). Si algún día lo redeploya en otra
   cuenta/nombre, cambiar solo esta línea. */
const API_URL = "https://mayor-stock-api.juanbautistacrespialomar.workers.dev";

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- Estado local ---------- */
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){ console.warn("load fail", e); }
  return migrate({ config:{ moneda:"$" }, productos:[], compras:[], ventas:[], movimientos:[] });
}
/* Migración idempotente: completa campos nuevos sin romper datos viejos.
   - Costos desglosados: el costo total histórico (ultimoCosto) pasa a ser Neto
     (handling/flete arrancan en 0). El total sigue siendo ultimoCosto.
   - Jerarquía TCG (metadata, sin conversión de stock): categoría/nivel/factores.
   - Clientes y numeración US (arranca en 101). */
const PACKS_POR_BOX_DEF = 24;
const BOXES_POR_CASE = { "Pokémon TCG":6, "Magic":6, "One Piece TCG":12, "Yu-Gi-Oh!":12, "Disney Lorcana":4, "Digimon":12, "Dragon Ball":12, "Flesh and Blood":4 };
function boxesCaseDefault(cat){ return BOXES_POR_CASE[cat] || 6; }
function migrate(d){
  d.config = d.config || {};
  if(d.config.moneda==null) d.config.moneda = "$";
  if(d.config.facturaInicio==null) d.config.facturaInicio = 101;   // numeración US
  if(d.config.emisor==null) d.config.emisor = { nombre:"", direccion:"", email:"", tel:"" };
  if(d.config.commissionRate==null) d.config.commissionRate = 0.10;  // comisión del vendedor sobre el MARGEN (0.10 = 10%). Editable en Settings.
  // Vendedores: perfiles a los que se les atribuye la venta (y su comisión). NO son
  // sociedades: son las personas que venden. Default Teo/Tonio; editable en Settings.
  if(!Array.isArray(d.config.vendedores) || !d.config.vendedores.length){
    d.config.vendedores = [ { id:"teo", nombre:"Teo" }, { id:"tonio", nombre:"Tonio" } ];
  }
  d.productos = d.productos || [];
  d.compras = d.compras || [];
  d.ventas = d.ventas || [];
  d.movimientos = d.movimientos || [];
  d.clientes = d.clientes || [];
  d.solicitudes = d.solicitudes || [];   // approval requests for blocked items (point 5, MVP2)
  // Invoices de COMPRA: estado de envío que AHORA gobierna el stock. Las compras
  // que ya existían impactaron el inventario en su momento, así que se migran como
  // "received" (si las pusiéramos en tránsito, vaciaríamos el stock actual). Sólo
  // las compras nuevas nacerán "in_transit" y no suman hasta marcarse recibidas.
  d.compras.forEach(c=>{ if(c.status==null) c.status = INVOICE_STATUS.RECEIVED; });
  // Ventas: snapshot de la tasa de comisión vigente al momento de la venta, para
  // que un cambio futuro de tasa no reescriba comisiones ya devengadas.
  d.ventas.forEach(v=>{
    if(v.commissionRate==null) v.commissionRate = d.config.commissionRate;
    // Vendedor de la venta (para comisión y columna "Sold by"). Las ventas viejas no
    // lo tienen: quedan como null y se muestran como "—" (sin vendedor atribuido).
    if(v.vendedorId===undefined) v.vendedorId = null;
    if(v.vendedor===undefined)   v.vendedor   = null;
    // storeVenta: las ventas viejas nacieron atadas a UNA sociedad (v.store). Lo
    // conservamos SÓLO como fallback para revertir su consumo FIFO si se editan/borran.
    // Las ventas nuevas ya no eligen sociedad (consumo global), así que no lo usan.
    if(v.storeVenta===undefined) v.storeVenta = v.store || null;
  });
  const r2 = n => Math.round((n||0)*100)/100;
  const DEF_STORE = STORE_IDS[0];   // "akira": target for legacy (store-less) stock
  d.productos.forEach(p=>{
    if(p.costoNeto==null){ p.costoNeto = p.ultimoCosto||0; p.costoHandling = 0; p.costoFlete = 0; }
    // total = neto+handling+flete; ultimoCosto stays as the canonical landed TOTAL (last purchase ref)
    if(p.ultimoCosto==null) p.ultimoCosto = r2((p.costoNeto||0)+(p.costoHandling||0)+(p.costoFlete||0));
    if(p.categoria==null) p.categoria = "";
    if(p.nivel==null) p.nivel = "unidad";
    if(p.packsPorBox==null) p.packsPorBox = PACKS_POR_BOX_DEF;
    if(p.boxesPorCase==null) p.boxesPorCase = boxesCaseDefault(p.categoria);

    // --- NEW: special state + language (points 5 & 10) ---
    if(p.estado==null) p.estado = PRODUCT_STATES.SALE;   // sale | blocked | investment
    if(p.idioma==null) p.idioma = "";                    // JP | ESP

    // --- NEW: per-store stock + FIFO cost layers (points 1 & 3) ---
    if(p.stockPorTienda==null){
      p.stockPorTienda = {};
      STORE_IDS.forEach(s=> p.stockPorTienda[s] = 0);
      // legacy single stock -> assign to the default store
      p.stockPorTienda[DEF_STORE] = p.stock||0;
    } else {
      STORE_IDS.forEach(s=>{ if(p.stockPorTienda[s]==null) p.stockPorTienda[s]=0; });
    }
    if(p.lotes==null){
      p.lotes = {};
      STORE_IDS.forEach(s=> p.lotes[s] = []);
      // seed one FIFO layer for pre-existing positive stock, at the known landed cost
      const seed = p.stockPorTienda[DEF_STORE];
      if(seed>0) p.lotes[DEF_STORE].push({ id:uid(), fecha:new Date().toISOString(), cantidad:seed, costoUnit:(p.ultimoCosto||0), ref:"opening balance" });
    } else {
      STORE_IDS.forEach(s=>{ if(!Array.isArray(p.lotes[s])) p.lotes[s]=[]; });
    }
    // --- Investment vault bucket (points 2 & 4) ---
    if(p.stockPorTienda[INV_STORE]==null) p.stockPorTienda[INV_STORE]=0;
    if(!Array.isArray(p.lotes[INV_STORE])) p.lotes[INV_STORE]=[];
    // Legacy migration: products flagged estado==="investment" used to hold their
    // WHOLE stock as an investment. Move every store's units + FIFO layers into the
    // vault bucket (value preserved) and clear the flag. Idempotent: once the flag
    // is gone it won't run again. No kardex is fabricated for these legacy holds.
    if(p.estado===PRODUCT_STATES.INVESTMENT){
      STORE_IDS.forEach(s=>{
        (p.lotes[s]||[]).forEach(L=> p.lotes[INV_STORE].push({ id:uid(), fecha:L.fecha||new Date().toISOString(), cantidad:L.cantidad, costoUnit:L.costoUnit, ref:"legacy hold · "+storeName(s) }));
        p.lotes[s] = [];
        p.stockPorTienda[INV_STORE] = r2((p.stockPorTienda[INV_STORE]||0) + (p.stockPorTienda[s]||0));
        p.stockPorTienda[s] = 0;
      });
      p.estado = PRODUCT_STATES.SALE;
    }
    // per-store sale price (point 4: detect who marks the same product up)
    if(p.precioVentaPorTienda==null){
      p.precioVentaPorTienda = {};
      STORE_IDS.forEach(s=> p.precioVentaPorTienda[s] = p.precioVenta||0);
    } else {
      STORE_IDS.forEach(s=>{ if(p.precioVentaPorTienda[s]==null) p.precioVentaPorTienda[s]=(p.precioVenta||0); });
    }
    // keep p.stock as a DERIVED mirror (sum across stores) for backward-compat views
    p.stock = STORE_IDS.reduce((a,s)=> a + (p.stockPorTienda[s]||0), 0);
  });
  d.clientes.forEach(c=>{ if(c.pais==null) c.pais = ""; });   // country of buyer (point 7 slicer)
  // Punto 11: normalizar fechas viejas mezcladas (ISO vs "01-Jul-2026") a YYYY-MM-DD
  [...(d.compras||[]), ...(d.ventas||[])].forEach(doc=>{ if(doc.fecha) doc.fecha = normISO(doc.fecha) || doc.fecha; });
  return d;
}
/* ---- per-store helpers ---- */
function stockDe(p, store){ return (p.stockPorTienda && p.stockPorTienda[store]) || 0; }
/* Puntos 7/9/15: ¿este producto PERTENECE a este local?
   Sí cuando: tiene stock ahí, tiene capas FIFO ahí, o alguna vez tuvo
   una compra/venta en ese local. Un producto que sólo vive en Silver NO
   debe aparecer (ni en cero, ni como opción de venta) cuando mirás Akira. */
function perteneceAStore(p, store){
  if(stockDe(p, store) !== 0) return true;
  if(p.lotes && Array.isArray(p.lotes[store]) && p.lotes[store].length) return true;
  const docs = (db.compras||[]).concat(db.ventas||[]);
  return docs.some(d => d.store===store && (d.lineas||[]).some(l=>l.productoId===p.id));
}
function stockEnFoco(p){ return effectiveStores().reduce((a,s)=> a + stockDe(p,s), 0); }
/* ¿Este producto está dentro del foco de local actual?
   - En "All (consolidated)" mostramos todo.
   - En un local puntual, sólo los que PERTENECEN a alguno de los locales en foco.
   Misma regla que el maestro (perteneceAStore) para que dashboard y lista coincidan. */
function enFocoActual(p){
  if(activeStore==="all") return true;
  return effectiveStores().some(s=> perteneceAStore(p, s));
}

/* ============================================================
   STOCK EN TRÁNSITO (compras aún no recibidas)
   ------------------------------------------------------------
   Es DERIVADO de db.compras con status "in_transit": no hay campo
   nuevo en el producto, así que nunca se desincroniza. La mercadería
   en tránsito NO está en stockPorTienda ni en las capas FIFO, por eso
   no se puede vender ni cuenta en la valuación vendible. Se recibe
   (marca "received") y recién ahí entra al inventario.
   ============================================================ */
function transitoDe(p, store){
  let u = 0;
  (db.compras||[]).forEach(c=>{
    if(c.status!==INVOICE_STATUS.IN_TRANSIT) return;
    if((c.store||STORE_IDS[0])!==store) return;
    (c.lineas||[]).forEach(l=>{ if(l.productoId===p.id) u += (l.cantidad||0); });
  });
  return u;
}
function transitoValorDe(p, store){
  let v = 0;
  (db.compras||[]).forEach(c=>{
    if(c.status!==INVOICE_STATUS.IN_TRANSIT) return;
    if((c.store||STORE_IDS[0])!==store) return;
    (c.lineas||[]).forEach(l=>{ if(l.productoId===p.id){ const landed=(l.costoTotal!=null)?l.costoTotal:(l.precio||0); v += (l.cantidad||0)*landed; } });
  });
  return round2(v);
}
function transitoEnFoco(p){ return effectiveStores().reduce((a,s)=> a + transitoDe(p,s), 0); }
function transitoValorEnFoco(p){ return round2(effectiveStores().reduce((a,s)=> a + transitoValorDe(p,s), 0)); }
/* Total de unidades en tránsito bajo el foco actual (para el KPI del panel). */
function unidadesEnTransito(){ return productosVendibles().reduce((a,p)=> a + transitoEnFoco(p), 0); }

/* ============================================================
   Punto 2/3: vista de stock en UNIDADES o CASES
   ------------------------------------------------------------
   unitsPerCase(p): cuántas unidades de stock entran en un case de ESE
   producto. Reusamos boxesPorCase (que ya trae defaults por categoría,
   Pokémon=6, etc.) porque la unidad de stock de Juan es el box y el case
   trae N boxes. Es editable por producto en el formulario.
   ============================================================ */
let stockView = "units";   // "units" | "cases"  (toggle global de la barra superior)
function unitsPerCase(p){ const u = (p && (p.boxesPorCase)) || boxesCaseDefault(p&&p.categoria); return u>0 ? u : 1; }
/* Convierte una cantidad de unidades a la vista activa. En cases mostramos
   hasta 2 decimales (un case parcial es 6,5 y no "6"); si da entero, entero. */
function stockDisplay(p, units){
  if(stockView!=="cases") return qty(units);
  const cases = units / unitsPerCase(p);
  return nf0.format(Math.round(cases*100)/100);
}
/* Sufijo textual para encabezados/celdas según la vista. */
function stockUnitWord(){ return stockView==="cases" ? "cases" : "units"; }

/* ============================================================
   Punto 4: comisión del vendedor = MARGEN de la venta × tasa
   ------------------------------------------------------------
   El margen se toma sobre productos (precio − COGS FIFO), sin envío.
   La tasa se congela por venta (doc.commissionRate); si falta, cae a la
   tasa global vigente. TODO el consumo de estos valores va detrás de
   isAdmin() en la UI: un seller no ve la comisión bajo ningún caso.
   ============================================================ */
function saleRevenueProd(d){ return round2((d.lineas||[]).reduce((a,l)=> a + (l.cantidad||0)*(l.precio||0), 0)); }
function saleCogs(d){
  return round2((d.lineas||[]).reduce((a,l)=>{
    if(l.cogs!=null) return a + l.cogs;
    const c = (l.costo!=null) ? l.costo : ((prodById(l.productoId)||{}).ultimoCosto||0);
    return a + (l.cantidad||0)*c;
  }, 0));
}
function saleMargin(d){ return round2(saleRevenueProd(d) - saleCogs(d)); }
function saleCommissionRate(d){ return (d && d.commissionRate!=null) ? d.commissionRate : (db.config.commissionRate||0); }
function saleCommission(d){ return round2(saleMargin(d) * saleCommissionRate(d)); }
/* ---- Vendedores (perfiles a los que se atribuye la venta) ---- */
function vendedores(){ return (db.config && Array.isArray(db.config.vendedores)) ? db.config.vendedores : []; }
function vendedorById(id){ if(!id) return null; return vendedores().find(v=>v.id===id) || null; }
function vendedorNombre(id){ const v=vendedorById(id); return v ? v.nombre : (id||"—"); }
/* Vendedor de la sesión actual (si el que entró es un seller). El admin no está
   atado a un vendedor: elige a nombre de quién carga la venta. */
function currentVendedorId(){ return (session && session.vendedorId) || null; }
/* Nombre a mostrar en "Sold by" para una venta ya guardada. */
function saleVendedorNombre(d){
  if(d && d.vendedorId) return vendedorNombre(d.vendedorId);

  return "—";
}
function stockTotalP(p){ return STORE_IDS.reduce((a,s)=> a + stockDe(p,s), 0); }   // sellable only, excludes __inv
function recalcStockMirror(p){ p.stock = stockTotalP(p); }

/* ---- Investment vault helpers (quantity-based, points 2 & 4) ---- */
function invUnits(p){ return stockDe(p, INV_STORE); }                 // units held in the vault
function invLayers(p){ return fifoLayers(p, INV_STORE); }             // FIFO cost layers in the vault
function invValor(p){ return round2(invLayers(p).reduce((a,L)=> a + L.cantidad*L.costoUnit, 0)); }
/* A product "has an investment position" if it holds units in the vault.
   NOTE: this is now a *quantity* condition, not the old product-level flag —
   a product can be partly sellable and partly held. */
function esInversion(p){ return invUnits(p) > 0; }
/* Fully held: something is in the vault AND has no sellable units left.
   These (and only these) are hidden from selling/reorder views. */
function soloEnVault(p){ return invUnits(p) > 0 && stockTotalP(p) === 0; }
function esBloqueado(p){ return p.estado===PRODUCT_STATES.BLOCKED; }
/* products visible for normal SELLING views: hides only the fully-held items,
   and (for sellers) is later intersected with their store's stock. */
function productosVendibles(){ return db.productos.filter(p=> !soloEnVault(p)); }
let db = load();
function persistLocal(){ localStorage.setItem(KEY, JSON.stringify(db)); }

/* ---------- Sesión ---------- */
let session = loadSession();
function loadSession(){ try{ const r=localStorage.getItem(SESKEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function saveSession(){ if(session) localStorage.setItem(SESKEY, JSON.stringify(session)); else localStorage.removeItem(SESKEY); }

/* ---------- Sincronización con el servidor ---------- */
let syncMeta = loadSyncMeta();       // { syncedRev, dirty }
let syncState = session ? "idle" : "off";
let pushTimer = null;
let conflictPayload = null;

function loadSyncMeta(){ try{ const r=localStorage.getItem(SKEY); if(r) return JSON.parse(r); }catch(e){} return { syncedRev:0, dirty:false }; }
function saveSyncMeta(){ localStorage.setItem(SKEY, JSON.stringify(syncMeta)); }

function save(){
  persistLocal();
  if(session){ syncMeta.dirty=true; saveSyncMeta(); schedulePush(); }
}

function setSyncState(s){ syncState=s; paintSync(); }
function apiBase(){ return API_URL.replace(/\/+$/,""); }
function authHeaders(){ return { "Authorization":"Bearer "+(session?session.token:""), "Content-Type":"application/json" }; }
function stateUrl(){ return apiBase()+"/state?space="+encodeURIComponent(session?session.space:"main"); }

function schedulePush(){ if(!session) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>pushNow(), 800); }

async function pushNow(force=false){
  if(!session) return;
  setSyncState("saving");
  try{
    const res=await fetch(stateUrl(),{ method:"PUT", headers:authHeaders(), body:JSON.stringify({ data:db, baseRev:syncMeta.syncedRev, force }) });
    if(res.status===401){ toast("Session expired, sign in again","warn"); forceLogout(); return; }
    if(res.status===409){ conflictPayload=await res.json(); setSyncState("conflict"); toast("There is a newer version on the server","warn"); if(view==="datos") render(); return; }
    if(!res.ok) throw new Error("HTTP "+res.status);
    const j=await res.json();
    syncMeta.syncedRev=j.rev; syncMeta.dirty=false; saveSyncMeta();
    setSyncState("idle");
  }catch(e){ console.warn("push fail", e); setSyncState("offline"); }
}

async function pullNow(){
  if(!session) return;
  setSyncState("saving");
  try{
    const res=await fetch(stateUrl(),{ method:"GET", headers:authHeaders() });
    if(res.status===401){ toast("Session expired, sign in again","warn"); forceLogout(); return; }
    if(!res.ok) throw new Error("HTTP "+res.status);
    const j=await res.json();
    const serverRev=j.rev||0;
    if(!j.data){ if(hasData(db)) await pushNow(true); else { syncMeta.syncedRev=0; saveSyncMeta(); setSyncState("idle"); } return; }
    if(serverRev===syncMeta.syncedRev && !syncMeta.dirty){ setSyncState("idle"); return; }
    if(serverRev>syncMeta.syncedRev && !syncMeta.dirty){
      db=j.data; syncMeta.syncedRev=serverRev; syncMeta.dirty=false; saveSyncMeta(); persistLocal();
      setSyncState("idle"); render(); toast("Data updated from the server"); return;
    }
    if(syncMeta.dirty && serverRev!==syncMeta.syncedRev){ conflictPayload=j; setSyncState("conflict"); if(view==="datos") render(); return; }
    if(syncMeta.dirty){ await pushNow(); return; }
    setSyncState("idle");
  }catch(e){ console.warn("pull fail", e); setSyncState("offline"); }
}

function hasData(d){ return (d.productos&&d.productos.length)||(d.compras&&d.compras.length)||(d.ventas&&d.ventas.length); }

function resolveConflict(keepLocal){
  if(!conflictPayload) return;
  if(keepLocal){ syncMeta.syncedRev=conflictPayload.rev; saveSyncMeta(); pushNow(true); }
  else{
    db=conflictPayload.data; syncMeta.syncedRev=conflictPayload.rev; syncMeta.dirty=false; saveSyncMeta(); persistLocal();
    render(); toast("Took the server version");
  }
  conflictPayload=null; setSyncState("idle");
}

function paintSync(){
  const map={
    off:["●","Offline","var(--muted)"],
    idle:["●","Synced","var(--up)"],
    saving:["◐","Saving…","var(--accent)"],
    offline:["●","No connection","var(--down)"],
    conflict:["▲","Conflict","var(--alert)"]
  };
  const [dot,txt,col]=map[syncState]||map.off;
  document.querySelectorAll("[data-syncchip]").forEach(el=>{ el.style.color=col; el.textContent=dot+" "+txt; });
  document.querySelectorAll("[data-syncicon]").forEach(el=>{
    el.style.color = (syncState==="idle"||syncState==="off") ? "" : col;
    el.classList.toggle("spin", syncState==="saving");
    el.title = "Sync · "+txt.toLowerCase();
  });
}

async function doLogin(){
  const user=(document.getElementById("loginUser").value||"").trim();
  const pass=document.getElementById("loginPass").value||"";
  const errEl=document.getElementById("loginErr");
  const btn=document.getElementById("loginBtn");
  errEl.textContent="";
  if(!user||!pass){ errEl.textContent="Enter your username and password"; return; }
  btn.disabled=true; btn.textContent="Signing in…";
  try{
    console.log("[login] POST", apiBase()+"/login", "user:", user);
    const res=await fetch(apiBase()+"/login",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({user,pass}) });
    console.log("[login] status", res.status);
    if(res.status===401){ errEl.textContent="Wrong username or password"; return; }
    if(!res.ok){
      let msg="Error "+res.status;
      try{ const ej=await res.json(); if(ej.error) msg=ej.error; if(ej.detalle) msg+=" — "+ej.detalle; }catch(_){}
      errEl.textContent=msg;
      return;
    }
    const j=await res.json();
    console.log("[login] ok, entrando como", j.user, "role:", j.role);
    const switching = !session || session.user!==j.user;
    session={ user:j.user, token:j.token, space:j.space||"main", role:j.role||"admin", vendedorId:j.vendedorId||"", name:j.name||j.user }; saveSession();
    // El stock es UNO SOLO: todos (admin y vendedores) arrancan en la vista
    // consolidada. Las sociedades son sólo procedencia, no locales de venta.
    activeStore = "all";
    if(view==="inv" && !isAdmin()) view="dash";
    // Si un vendedor entra a una vista admin-only (compras/inversión/análisis/datos), lo mandamos al panel.
    if(!isAdmin() && ADMIN_VIEWS.includes(view)) view="dash";
    if(switching){
      db={ config:{ moneda:(db.config&&db.config.moneda)||"$" }, productos:[], compras:[], ventas:[], movimientos:[], clientes:[], solicitudes:[] };
      persistLocal(); syncMeta={ syncedRev:0, dirty:false }; saveSyncMeta();
    }
    setSyncState("idle");
    hideLogin(); render(); paintSync();
    await pullNow();
  }catch(e){ console.error("[login] fallo:", e); errEl.textContent="Couldn't reach the server ("+(e&&e.message||e)+")"; }
  finally{ btn.disabled=false; btn.textContent="Sign in"; }
}

/* ---------- Formato ---------- */
const nf0 = new Intl.NumberFormat("es-AR",{maximumFractionDigits:2});
const nf2 = new Intl.NumberFormat("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const money = n => db.config.moneda + "\u00A0" + nf2.format(n||0);
const qty = n => nf0.format(n||0);
/* money() pero con guión cuando el valor es 0 / nulo. Lo usamos en precios de
   venta opcionales: si no hay precio cargado mostramos "—" en vez de "USD 0,00".
   El \u00A0 (espacio duro) ya deja el símbolo separado del número: "USD 92,10". */
const moneyOpt = (n, dash="—") => ((n||0) > 0 ? money(n) : dash);

/* ---------- Fechas unificadas (puntos 2 y 11) ----------
   normISO: cualquier formato (ISO datetime, dd/mm/yyyy, 01-Jul-2026) -> "YYYY-MM-DD".
            Es lo ÚNICO que acepta <input type="date">, por eso al editar la fc
            aparecía vacía cuando la fecha venía en otro formato.
   fmtDate: muestra SIEMPRE igual en toda la app -> "01-Jul-2026". */
const _MONTHS3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function normISO(s){
  if(!s) return "";
  s = String(s).trim();
  // ya viene ISO (con o sin hora)
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  // 01-Jul-2026 / 01/07/2026 con mes en texto
  m = s.match(/^(\d{1,2})[-\/]([A-Za-z]{3,})[-\/](\d{2,4})$/);
  if(m){
    const map={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,ene:1,abr:4,ago:8,dic:12};
    const mo=map[m[2].slice(0,3).toLowerCase()]; if(!mo) return "";
    const y=m[3].length===2?"20"+m[3]:m[3];
    return `${y}-${String(mo).padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  }
  // dd/mm/yyyy o dd-mm-yyyy numérico
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})$/);
  if(m){ const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return "";
}
/* Formato de display: SIEMPRE americano MM/DD/YYYY en toda la app. */
function fmtDate(s){
  const iso = normISO(s);
  if(!iso) return s || "—";
  const [y,mo,d] = iso.split("-");
  return `${mo}/${d}/${y}`;
}

/* Parseo tolerante de números en formato AR (1.234,56) o US (1,234.56) */
function parseNum(s){
  if(typeof s === "number") return s;
  if(!s) return 0;
  let t = String(s).trim().replace(/[^\d.,\-]/g,"");
  if(t==="") return 0;
  const lastComma = t.lastIndexOf(","), lastDot = t.lastIndexOf(".");
  if(lastComma > lastDot){            // coma decimal (AR)
    t = t.replace(/\./g,"").replace(",",".");
  } else {                            // punto decimal (US)
    t = t.replace(/,/g,"");
  }
  const v = parseFloat(t);
  return isNaN(v) ? 0 : v;
}

   Sums the actual cost layers, not stock×lastcost. Excludes the vault. */
function valorFifoEnFoco(p){

/* ============================================================
   Numeración CORRELATIVA de facturas de VENTA
   Formato: "FC 0001-0000001". Tomamos el mayor secuencial ya usado
   en db.ventas (parseando el patrón) y devolvemos el siguiente, sin
   huecos. Las compras siguen con N° libre (traen el del proveedor).

   OJO: si borrás una venta que NO es la última, queda un hueco en la
   serie (comportamiento correcto: en la práctica se anula con nota de
   crédito, no se borra). Si borrás la última, ese número se reutiliza.

/* Formato estadounidense: entero simple, sin punto de venta. Arranca en
   config.facturaInicio (101 por defecto) y toma el mayor ya usado + 1.
   Es SUGERIDO: el campo es editable en el modal de venta. */
function nextFacturaVenta(){
  const inicio = parseInt(db.config.facturaInicio,10) || 101;

}
