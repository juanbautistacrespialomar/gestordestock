name = "mayor-stock-api"
main = "worker.js"
compatibility_date = "2026-01-01"

# D1: creá la base con  ->  wrangler d1 create mayor-stock
# y pegá el database_id que te devuelve.
[[d1_databases]]
binding = "DB"
database_name = "mayor-stock"
database_id = "PEGAR_DATABASE_ID_ACA"

# El TOKEN NO va acá (es secreto). Se carga con:
#   wrangler secret put TOKEN
